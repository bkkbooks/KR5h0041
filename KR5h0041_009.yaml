front:
  text: 岱史第九卷靈宇紀叙曰靈宇者何神明之所宅也紀首岱廟者何望秩之定制也有司奉制命而嵗祀焉禮也岱廟上中下凡三而惟下廟最巨麗在州城內正北蓋歷代敕建望祀之所朱堞金扉龍楹螭殿罘罳象魏儼然帝居漢柏唐槐虬蟠雲覆御碑古碣林立森森以斯知其從來遠矣玉帝觀青帝觀后土殿則以居天神地祇也巔麓俱有焉謂天地鍾靈於兹神必依之也碧霞靈應宫則以居天仙玉女碧霞元君也袤滿巔麓而巔以敕建獨閎偉謂其神靈感召安民裕國也孔子人中之泰山魯兩先生一方之師表則其祠於此也固宜其他佛老之宫群靈之府倚巖緣谷比比而是大都肇搆於隋唐宋元間今其存者不及十半然亦傾頽甚矣惟嶽巔諸宫觀當世嚴奉不廢乃絶無翼室以居黃冠黃冠固甚貧率散處麓下覓食則神明香火之謂何即居守安所籍也旋葺旋頽職此之由哉余謂嶽巔諸宫觀宜各因其隙地有司以香稅餘錢搆為翼室以居黃冠之有戒行者仍籍名於官責以焚修掃除則宫觀不致旋頽可歲省修葺之費恤民事神庶幾兩得云東嶽廟在州城西北隅風俗通曰岱宗廟在
