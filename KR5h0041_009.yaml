body:
  text: 博縣西北三十里山虞長守之按岱嶽觀至元碑云嶽廟在嶽之南麓岱嶽升元二觀前當為漢址唐武則天篡唐時改今地或云宋改今地其後歷代廢興修葺詳其諸記石廟制堞城高二丈周三里城門有八南闢者五而正中曰嶽廟門東偏曰仰高門西偏曰見大門東闢者一曰東華門西闢者一曰西華門後闢者一曰後宰門凡門各有樓而角樓亦四東南曰巽樓東北曰艮樓西北曰乾樓西南曰坤樓由岱廟門而上重門為配天次為仁安再上為仁安殿露臺高下聯屬者二殿前兩廡之中為鍾鼓樓樓之後各為齊房殿後為寢宫宫左右為配寢其規模宏侈儼如王者居配天門左為三靈祠右為太尉祠祠前東廡别殿曰炳靈西曰延禧碑亭三其一當岱嶽配天二門之間其二對峙於鍾鼓樓側三亭皆為國朝御製碑建殿前古松數十株蟠結偃蓋非他境所有炳靈殿前則漢柏延禧殿前則唐槐皆特異雖良繪莫能狀銀杏大者圍三仞火空其中陰符經曰火生於樹信夫奇石玲瓏者九其上有古題刻知自遠方來奠獻者碑石林立其可為書法者張侍制漴書宣和廟記喬冢宰宇篆御祝文廟前有亭曰遙參亭前為遙參門門之前為御街宋東封警蹕之地而實為廟之第一門也舊榜曰草參門門中有臺臺上有亭亭重簷四面十有六角崚𡾓綺麗昔凡有事於嶽者先拜於亭而後入廟故曰草參今有司遇當祝釐於廟罷則儀從由亭門而出猶古之制也亭今列屏鑒方圓各一高六尺許鑒前雕座置元君像四方來謁頂廟者亦先拜焉故又曰遙參亭云宋學士宇文粹中重修嶽廟記略宣和四年九月有司以泰嶽宫廟完成奏功制詔學士承㫖臣宇文粹中記其嵗月臣粹中再拜稽首而言曰臣聞自昔受命而帝者咸有顯德著在天庭合四海九州之歡心以為天地社稷百神之主故有壇場圭幣以象其物有宫室祠宇以奠其居有牲牢酒體以薦其潔有祝册號嘏以導其誠其漠然而意可求僾然而誠可格殆與人情無以異是以黃帝建萬國而神靈之封七千虞夏商周文質迭救雖所尚不同而事神以保民其歸一揆必以岱宗為首而神靈烜赫光景震耀載在書史接於耳目者奕奕相屬也宋受夫命建都於汴東倚神嶽遠不十驛章聖皇帝肇修封祀蓋嘗躬款祠下欽惟神靈饗答之異念唐開元始封王爵禮加三公一等未足以對揚休應遂偕五嶽咸升帝號自是宫廟加修薦獻加厚四方萬里士民奔凑奠享祈報者蓋日益而歲新也皇帝聰明仁孝光於上下神動天隨德施周溥既己躋斯民於富壽乃申敕中外凡所以禮神祇崇顯祀盡志備物畢用其至歲在辛已迄於壬寅詔命屢降增治宫宇繚墻外周罘罳分翼巋然如青都紫極望之者知其為神靈所宅凡為殿寢堂閣門亭庫館樓觀廊廡合八百一十有三楹財不取於賦調役不假於追呼而屹然崇成若天造地設靈祗燕豫福應如響嗚呼真聖德之事也觀是宫廟土木文采輪奂崇麗則知郡邑之富庶帷帳熒煌兖冕璀璨則知絲枲之盈溢牲牷充庭醪醴日御則知耕牧之登衍簫鼓填衢歌呼滿道則知風俗之和平神之聽之乃祗陳於上帝用降鑒錫兹祉福則社稷之安固曆數之綿遠蓋方興而未艾也哉明李賢廟記略書稱岱宗蓋以東方屬春萬物交代故曰岱為群嶽之長故曰宗然而祭之者何也記曰能出雲為風雨又曰民所取財用也三代以前不過為壇而祭之如周制四坎壇祭山林丘陵於壇是也秦漢以來有神仙封禪之事於是有祠廟之設古者五嶽視三公謂視其饔餼牢醴之多寡以為牲器之數也非以三公之爵封之也後世遂封五嶽之神為王為帝垂旒端冕儼若人鬼矣洪惟我聖祖高皇帝聰明睿智卓冠千古即位之初詔示天下有曰嶽鎮海瀆皆高山廣水自天地開闢以至於今英靈之氣萃而為神豈國家封號之所可加今依古定制去其前代所封名號於東嶽稱曰東嶽泰山之神鳴呼是舉也裁革瀆禮不經之失所謂質諸鬼神而無疑百世以俟聖人而不惑者矣濟南太守陳君銓走書京師告豫曰東嶽泰山神廟傾頽上請得㫖重修巡撫都憲賈公銓與三司官僚合謀經營若按察使王公鉞尤留意焉屬銓綜理其事經始於天順四年八月二十六日落成於五年九月初一日內外煥然一新俾是方之人依而敬之有加於前僉曰不可無紀敢乞為記刻之用示久遠豫惟泰山出雲膚寸而合不崇朝而雨天下功德固廣大矣要之是方之人沾其惠澤尤多况又取其財用者乎雖曰朝廷祀典所載而是方尤所當敬也今巡撫方面風憲重臣同心協慮重役神廟又得郡守克承委任用體朝廷之意以表民之所敬真可謂民之父母矣彼慢神虐民者視此於心不亦恧乎明薛瑄廟記略東嶽泰山之神故有廟在山之陽朝廷有大典禮大政務則遣使告焉廟屋既久多圯漏弗治先是守臣嘗奏請修建而未克底完天順己卯泰安州守以其事達之濟南府因以上請詔允修葺於時都憲年公富方議興役而去左副都御史賈公銓繼來乃洎巡按籓臬協議既擇有幹幕職以董其役復俾濟南府知府陳銓月一往以綜理焉銓始至泰安謂修葺嶽廟固所以祗若朝命致謹大神然尤當以省民財重民力為本財匱民勞事亦非可因詢及守廟者具言數十年所積禮神之物甚當遂遺人持巿木之巨細與其他修屋之不可缺者及既合而匠役皆在官之人而農民不知有役銓既綜理有法不急不徐始事於天順庚辰秋七月辛已夏五月訖工殿宇周廊門觀繚垣悉皆完治咸願刻石以紀其事山西按察使王允濟南人也以書來求文於瑄余惟東嶽泰山之神為諸嶽冠聖朝既正其名秩其祀而廟弗治又俾所司以時修葺而巡撫憲臣洎籓臬得綜理其役如銓者不竭民之財力而克底完新皆可謂祗若朝廷丕顯休命而致謹於人神者矣遂序其事而銘之曰一理宰幹二氣互根清浮無際濁墜斯存柔行剛峙川洪嶽尊惟此泰山造化鍾萃龍蹤太虛磅礴厚地匪魯邦瞻實衆嶽最其蓄罔測其施靡量玄雲寸石甘雨八荒功既載溥厥報宜彰有廟在陽奉命新葺重臣是承守臣是職民不匱勞事底完集殿宇廊觀聳卓縈回高下中度不騫不卑神氣鬱鬱流通在兹昔古山川明祀有體夫何前季封號薦起躋嶽於天紊三公禮逮我聖世道復古隆斥絶僣誕率由大中嶽鎮海瀆悉正其名惟岱宗神神稱允格迄兹有役咸願石刻述理繼辭以示無極李欽修東嶽廟託略嘉靖丁未冬嶽廟灾殿宇廊廡以及賓館齊居門闥樓觀蕩然一空其僅存者後寢三殿與炳靈延禧二宫而已時守臣以狀聞上震異者久之既俾治有司不戒之辜而遂敕以亟修之議然嵗值纍歉未克興事者垂十年餘辛酉秋八月皇上萬壽爰命太常緘祝函帛恭詣嶽神虔修醮典有司布席將事惟時巡撫都御史鎮山朱公承命主祀大懼簡陋罔罄明禋乃謀諸籓臬庶正展力亟圖而特委濟南府同知翟公濤專董其役蓋選能也公乃檄請當道材木瓴甓金石之類以至匠傭役廪皆取給香帛而秋毫不以煩民經始於壬戌春迄癸亥夏廟工告成自殿堂而下毁者以舉傾者以易圮者以完漫漶者以鮮以潔丹艧塗垔輝光掩映巡撫都御史石洲張公祭告祠下樂觀厥成是日也淑氣洋溢靈光下矚泰嶽明神既尊且安自是而往陰祐顯相雨暘時若而豐年應灾病殄而民氣和以永保我國家無疆之慶則神之功當與天地並而君子謂翟公之有功於神也其亦偉矣哉參政許天贈重修岱廟記略泰山之麓故有廟其名曰岱宗廟在嶽之南麓宋改今址其制有堞城為門者八四角有樓前有殿後有寢兩傍有廡儼如王者居我朝因勝國舊天順以來屢奉㫖修葺碑石具在孝廟親為記宸章赫奕萬代瞻仰邇者修葺止取裁兩院以香稅所積自可充修廟費毋用厪明㫖動內帑為也萬曆甲申廟漸圯於是左參政屠公請於兩院得可委濟南府通判張世臣董工作之役泰安州吏目蘇天壽佐之余至督視益勤閲乙酉秋八月告成凡費金九百餘不動民財不勞民力而大工就緒余聞之祀禮也國之大祀必以禮聖人制禮尊五嶽配天其祭以壇不以屋其神設主不以像通諸天下凡司府州縣歲時祭境內山川率由斯道復古制祛民惑也斯廟有先代故事廟及像率無所更易豈天造草昧偶未之及也抑别深意寓其中者耶弘治間至厪玉音若以此為訓然者愚以是知聖人敬神導民至意使人有所敬畏啓為善之心遏從惡之念更相告戒以若於治所謂無害於治者聖人不與民變革也今廟貌巍然神威赫然若有臨之在上然者四方祈福受罪之士女入廟瞻拜肅然起敬罔或不虔則於聖化或可助萬分一哉若佛老家言神若王者操福禍之權握生死之柄為善惡果報則其不經見故儒者缺之勿論李欽重修嶽廟古井記欽垂老林泉自愧無益於世每月一集鄉民老幼百餘於嶽廟宣揚聖諭僣為講解期以化民成俗挽回魯道之舊民有李進盧士卿者再拜告余曰廟有古井水甚清洌祀事之濯溉餴饎咸賴焉曩以日久灘淤盡為泥土泂取廟外之水以奉祀恐涉不潔吾輩出資掘而甃之重加淘汰水復清冽如故請翁識甚歲月於石余曰是可以觀今日鄉約之意矣善者人心之固有非假於外也私欲蔽之則失其初譬之井焉壅於泥土則泉不能達然清冽之源固在也一淘汰之遂復其舊然則吾民之蔽於私欲而喪失其本心者可無以導之乎鄉約之設固所以去吾民之泥土而達其固有之良心也况泰山五嶽之宗此水得山下正脉將享神明其用貴且重矣吾民生於魯域自古為聖賢鄉人人人誠知所以自新一變可至道也若其溺於私欲而自棄其貴且重焉其無靦顏矣乎是用記之以警於有衆東嶽上廟在嶽頂磨崖碑前元至元間提點張志純嘗修焉嘉靖間都御史曾銑重修布政使陳儒記陳儒記曰泰山為五嶽之尊橫亘齊魯跨引江淮矗突雲霄輝映日月巍乎高哉其天下之奇觀而獨秀者乎我明天子御極望於山川遍於群神曰用相我國家維兹嶽乃辛丑北虜犯順乃申敕封疆之臣曰其各壯乃金湯峙乃寨𡹵用扞衛我國家豫一人以寧亦維兹嶽嗟乎嶽之時用大矣哉維時都察院右僉都御史廣陵曾公銑實承簡命保釐東土比至時且告饑公約已裕民發棠秩祀而凡為我民徼福者靡不備至是故疏請于朝得減京儲數萬石減租亦數萬石間乃語諸藩臬庶正曰泰山威靈鼓動海內矧兹兵戎之調度顛連之賑恤以暨百官之匪頒罔弗賴之是其庇我東山者乎聞今廟貌圮壞弗亟圖之其何以祀乃夏五月謀諸監察御史關西楊公本深僉同絲議曰其動乃官需毋倦力毋違時乃底績已乃祗若成命移檄諸司曰若布政使陳儒王鴻漸爾其經理諸難曰若按察使余鋟爾其紏御事乃罔弗既厥心亦罔弗愼厥事曰知府劉璽曰同知王景明爾其鳩工僝工曰知州馬逢伯爾其率作興事乃罔弗奔走惟罔功是懼於是群工畢興始於壬寅夏五月迄於癸卯春三月東嶽殿之修者四楹南向碧霞坊之建者一亦南向泰嶽坊亦一西向東官廳之建者六楹西官廳之建者四楹各南向鍾鼓樓對峙於元君之廟者各東西向如其制工既訖而是嵗雨暘時若東方底寧君子謂泰嶽於是乎有神僉乃請勒石於泰山之顛公以記屬之儒乃拜手稽首揚言曰嗟乎天降時雨山川出雲嗜欲將至有開必先言神異也顧兹東嶽孕秀鍾靈甲於天下則所以奠我民生翊戴我國家者寧有涯哉東嶽中廟在嶽之陽王母池之東昔名岱嶽觀今土名老君堂僅存三清小殿按宋李諤瑶池記云觀肇於軒黃即此地也廢址中有古柏古松十餘株其枝幹如虬如龍曾覽國朝高誨記云漢武帝東封時植蓋即此也而後園洞中壁間一石碣題漢柏二字相傳趙子昂書玩之近是古碑凡三其二刻唐與僞周老氏之徒題記行楷書俱有古法碑雙石並立覆以束蓋土人稱鴛鴦碑真奇製也其一刻元至元年間泰安州禁約今録于後至元碑刻禁約泰安州准東嶽提點監修官牒開稱東嶽有上中下三廟本州城北岱嶽廟係中廟唐時武則天將岱嶽廟改作道觀左側西王母殿宇經毁不存上有巖巖亭乃遇封禪帝王歇體之所下有西王母池次有吕翁洞猶存聖像池上臺石碑云該奉州官台㫖禁約諸人無得於池上下作穢如違决杖八十當職準此合行出榜曉諭禁約至元二十九年九月日榜玉帝觀即太清宫在嶽之絶頂蓋古登封臺昔嘗圮廢成化十九年中使以內帑金資重建隆慶間侍郎萬恭撤觀於巔北出巔石而表之題曰表泰山之巔萬恭自為之記侍郎萬恭表泰山之巔碑隆慶壬申春黃河泛溢輸道梗湮天子憂皇命恭若曰汝其治水踰夏河成灌輸悉盡天子懌豫命恭若曰汝其東禋於時臣恭以八月禋泰山報成績也八乃歷巉巖踰險絶撫秦碑登日觀己乃陟山巔謁天宫忽緇衣蹁躚目瞪足踐招余言曰是泰山巔石也余異之視其上室如錮也視其下砌如砬也而惡知夫泰山之巔而又惡知夫泰山之巔之石余喟然嘆曰夫泰山擅四嶽之尊而兹巔石又擅泰山之尊乃從而屋之又從而夷之又從而踐履之令尊貴不揚發靈異不表見余過也余過也亟命濟倅王之綱撤太清宫徙於後方命之曰第掘地而出巔毋刓方毋毁圓毋劉天成返泰山之真已矣倅乃撤土巔出之巔石博十有一尺厚十四尺有奇聳三尺戴活石焉東博二尺五寸厚一尺三寸西博一尺八寸長八尺有五寸夫約泰山而東之巔己奇甚矣又摩頂而戴之石斯上界之絶顱青帝之玄冠也余倚活石覽觀萬里俯仰八荒遠視則扶桑之日曜其東崑崙之風吹其西近睇則泰碑若正笏叢石如群圭而齊魯諸阜圓者似金直者似木曲者似水鋭者似火方者似土枕青揚之絳闕俯元君之幽宫而六極之大觀備矣彼巔石不表見幾千萬年矣今出之始返泰山之真而全其尊後來覽觀者尚毋刓毋毁毋劉天成務萬世令返其真而全其尊以毋得罪於泰山之神其緇衣蹁躚意乎緇衣余問何許人何所受而告余默而不答噫我知之矣蓋緇衣受之碧霞碧霞受之太君太君受之上清上清受之元始元始受之寥冥之祖玉皇廟在嶽之回馬嶺按察司陳察撰記廟前晦許為崖磴高三丈餘磴盡處為升仙閣陳察廟記略曰察自浙臬之晋道經齊魯抵兹山歷險升高雲巖風壑百折千回行次山腰突見新祠曼碩後有瑞仙巖左十峯嶺右九峰山巉巖奇特祠據厥勝像設鏐沃冠裳儼如鍾鼓有奕其主曰吳天玉皇上帝竊惟山莫名於五嶽而泰尤稱雄蓋自崑崙一脉迢迢馳發至於兹屹然巨鎮固萬山第一生處憶自結髮遊觀兩都暨江浙諸省歸棲遍吳嶺十載再起望九嶷過衡陽觀於牂柯越隽歷蒙段氏墟抵金沙江望銅柱渡河洛驅馳關陜跡遍三蜀閩粵岧嶢崒嵂駭躅不一然未有若兹山屹焉孤高峻極太虛至使天下之人殫力協誠齊肅襁負駿奔對越者踵武無虛日精神會合焄蒿悽愴若或臨之此豈偶然之故哉其必有所以為之者矣是則斯地也而有斯祠也吾不能辨其可否獨念斯人往往數千里趨攀抵兹厥亦勞止而斯祠適在谽谺嶒中有廡有庭有泉有茗勞者少息飢渴者少慰籍沐風雨者得少為避愚夫愚婦踧踖匐伏心懷戰兢欲平躁釋蒙昧以開而禱祈水旱疾疫胥此焉依豈天設此以為福民永命之一助也而可以輕擬議哉瀋王閣記略惟泰山五嶽之長群壑之尊雄峙一方高接天漢鍾靈秀之氣鬱造物之英真天下名山之首古今祀典之崇者也其神主成物之始故宇內群生壽夭休祥福徴祲眚出入攸司罔弗欽戴恭惟我太祖高皇帝用夏變夷章明憲典首重祀禮嶽瀆之禋厥誠罔替纍朝以來率由舊典惟皇建極德茂業熙群辟攸叙風行海內俗化生成嘉靖甲辰秋稔泰安守臣獻嘉禾瑞麥執政率九卿百職表賀淵哀悅俞漢儒有曰和氣致祥斯實由我聖皇法祖憲天克誠明祀之感豈非嶽神效靈用徴厥瑞者耶明年乙巳春有僧明清自斯山募緣於潞以回馬嶺玉皇殿一楹嵗遠將圮乃增建五楹鐵瓦琉璃莊嚴銅像廊廡續具復創門閣三楹時值今撫晋中丞曾石塘先生建牙山左公務適臨命名曰升仙閣僧詣豫請記豫惟兩間之氣造化曰神感而遂通誳信闔闢著乎隱顯山載地靈宜莫重於岱嶽之巖巖與神之穆穆而他莫及焉聖天子功高德厚以明厥報天地之誠擬於嶽者將無往而弗通以享無窮之祀不亦宜乎會真宫在州城東南隅舊名奉高宫宋真宗駐蹕改今額國朝重修玉皇殿有吕洞賓詩二首手書石刻並李太白詩四方碑刻俱古雅可玩任式記略會真宫玉皇殿成當有碑刻以紀其嵗月式齊沐拜手言曰一氣之分而輕清上浮者謂之天主宰乎其間者謂之帝吾儒曰吳天上帝彼道家者流尊其名曰吳天玉皇上帝世之曰宫曰觀皆其奉香火之地也會真宫在泰山之陽其創建不可考觀宋祥符間有頌二聖功德碑在宫之南百步許朝覲碑在宫之南一里許傳者謂真宗封泰山駐蹕於此金大定間徙奉符縣為泰安州故宫居州城之巽隅興替靡常所存者僅玉皇殿三間壖基卑下上遣中使進香帛於方嶽行瞻是祠從衆望並以嶽頂昭真祠上聞欲更新之上可其奏即下命所司時歲在庚子也於是召公輸於魯甸招石匠於郢郊採租徠之松新甫之柏是斷是度是尋是尺辛丑昭真觀既作壬寅玉皇殿告厥成巍巍乎浩浩乎松桷有梃旅楹有間粉飾藻繪妍麗精華金碧耀日月之光丹青奪乾坤之秀像設穆穆赫爾厥靈誠以昭我聖代敬天事神之意無乎不在也若夫泰山徂徠相映前後奇花吐而玉座芬芳白雲飛而瑤壇空靜星冠羽衣舉手以加額者祝聖天子於萬壽也黃童白叟羅拜於左右者祈斯世斯民於平康也嗚呼天不在於高高而在於咫尺帝不在於冥冥而在吾昭灼過之者寧不秉虔恭存敬畏以思無負於對越也耶后土殿在嶽南麓距州治三里許數松差類嶽祠亦奇古可愛青帝觀凡二其一在嶽巔其一在嶽之南麓肇建俱不知何時宋真宗加青帝懿號曰廣生帝君在嶽巔者今巡撫都御史李命官修葺於萬曆丙戌年冬孟訖工在南麓者真宗御制御書贊刻今尚存國朝弘治正德間修拓嘉靖間尚書朱衡復加葺焉帝即漢唐所祀五帝之一按漢書及宋天文志青帝天神也而東嶽屬焉此廟祀之所由起也宋加青帝懿號詔敕中書門下名嶽配天乃衆山之推長盛德在木實萬物之資生惟真宰之斯存蓋靈篇之攸紀青帝真君職司煦育道叶冲虛贊玄化於高明庇群生於溥率真祠夙建方志可徴屬嚴駕以時巡爰祕封之成禮式瞻神館冀沐冥休祗舉典章載揚懿美奉蕭薌而昭薦旌至德於無方用表欽崇永綏福祉宜尊懿號曰青帝廣生帝君觀宇特加修飾故兹詔示懇宜知悉廣生帝君讃御製御書並篆額若夫典治喬嶽表正靈祇司生發於東方佐聰明於上帝宜乎名冠仙籍德被蒸民饗祀典於蕭薌鏤徽稱於金石者也屬以虔修封禮恭答神休薦顯號以致誠述斯文而頌美讃曰節彼岱宗奠兹東土生育之地靈仙之府爰有高真允司明命至神不測虔誠斯應茂實克昭儲祥是繄式奉嘉名用伸精意大中祥符元年十月二十七日御書院摹勒刻石御祝文維大中祥符元年嵗缺戊申十一月戊午朔四日辛酉崇文廣武聖明仁孝皇帝謹遣尚書兵部員外郎邵曄告於青帝廣生帝君伏以峻功丕顯誕彰陰隲之仁神化無方實主發生之宇惟高真之攸館乃喬嶽之靈區屬以祗奉元符躬陳大報仰繄景貺克舉上儀式彰昭代之稱以表欽崇之禮合伸致告用達虔誠謹告三皇廟祀伏羲神農黃帝在嶽南麓距州三里許御祝弘治十六年歲次癸亥十一月初一日皇帝遣內官監太監齊玄謹以清酌庶羞之奠致祭於三皇聖帝曰粵惟三皇建於有極百草聿嘗藥石是資疾痛痾癢用賴以瘳神聖功巧萬世永賴籩俎既精虔誠斯達敬伸祭奠庶其歆格謹告碧霞靈應宫在嶽絶頂西南下三里許舊名昭真觀宋真宗東封時所建國朝增拓其制改署今額纍朝修葺不廢近自世宗朝遣工部郎陳策齎宫施萬金重修益巨麗矣隆慶間撫臺傅希摯按臺吳從憲又加葺焉其神曰天仙玉女碧霞元君四方謁欵祗禳者摩肩接踵而至諸所捐施金帛珠玉馬羖之類有司日監守而管榷之萬曆乙酉按院韓應庚侍御命官鳩工更新往制其宫故南向凡五間則欄其東一間題曰東寶庫欄其西一間題曰西寶庫用以投儲諸所捐施焉宫之後架殿三間題曰便殿宫之右架亭一間題曰憩亭凡此皆創創也宫之前左翼曰子孫殿三間右翼曰眼光殿三間其中為露臺為甬路而甬路之南大門三間東鼓樓西鍾樓而門外綽楔凡三中曰敕建碧霞坊東曰安民坊西曰濟世坊而碧霞坊之前臨火池之上有闕門焉曰金闕凡此皆增飾其舊也繢椽藻櫨霞駮雲蔚儼然神居非人世所有乃其形勝袁拱宫東南則五花崖東北迤西則嶽頂磨崖日觀諸峯蜿蜒峙列三面若屛扆前若雙闕由宫門西下石磴三丈許南俯懸崖下視城郭若畦圃自城郭望之則崖峯森蔽不見宫宇此蓋造化靈區真天奇云御祝文維弘治十六年歲次癸亥正月朔初一日己巳皇帝遣御馬監太監苗逵致祭于碧霞元君曰懿德含弘仁慈廣霈佑蒼生於壽域鼓群品以霑依兹因眇躬偶爽調攝敬祈聖力求佑康寧特以香帛用伸告祭益彰靈應福佑家邦謹告維嘉靖十一年歲次壬辰二月庚辰朔十三日壬辰皇太后遣太子太保玉田伯蔣塋致祭于天仙玉女碧霞元君之神曰皇帝臨御海宇十有二載皇儲未建國本尚虛百神萬民無不仰望兹特遣官敬詣祠下祗陳醮禮潔修禋祀仰祈神貺默運化機俾子孫發育早錫元良實宗社無疆之慶無任懇悃之至謹告高誨玉女考略泰山玉女神顯靈于天下其來尚矣傳為東嶽女蓋謬說也人心崇尚習舛承訛非特愚夫愚婦之不知雖博雅君子亦未聞有能考其實者按州志載嶽頂玉女池馬端臨通考紀池側故有玉女石像泉源壅濁宋真宗東封先營頓置泉忽湧上升山其流自廣清泚可鑑味甚甘美王欽若請浚治之像頗摧折詔易以玉石既成上與近臣臨觀復礱石為龕奉置舊所祭焉唐劉禹錫送東嶽張鍊師詩云久事元君住紫微而李白游泰山詩亦云玉女四五人飄颻下九垓及觀李諤瑶池記謂黃帝建岱嶽觀嘗遣女七人雲冠羽衣修泰香火以迎西崑崙真人由是考之則知玉女必黃帝所遣七女中之修而得仙者後世因之祠于山而宋元間龕像建觀尤有徵逮我朝拓新殿宇發應益著不然則泰山喬嶽之上何緣有此據通考唐詩所載質之諤記益信劉定之記略泰山絶頂舊有祠祀碧霞元君以其最高雲蒸雨降材木易朽飇風剛徑瓦多飄毁祠不能久今副都御史原傑巡撫山東謁祠見其墮墜謀新之銅梁鐵瓦琉璃甎甓之堅固丹艧青堊藻繪漆飾之輝煥高廣深邃規制增舊其費取諸官而民不知自昔登山捐施委諸巫祝妄費不可稽而今紀理之皆有條法云尹龍記略昭真祠在泰山絶頂世傳謂天仙玉女碧霞元君之祠聖天子御極十有五年命太監陳喜來修祀事明年詔修是祠即故址增飾之祠殿為間者五以奉元君左右回廊各三間則護從之神居焉神道有門鍾鼓有樓恐其凌空壁立易為風雨所剝蝕故陶土為甎冶鐵為瓦務為堅確黝堊丹漆金碧交輝視昔有加焉其肖像左石右為銅中以沉香雕龕石座霞帔鳳冠於赫穆清而其所費一皆輸財於神貯之帑藏以克其用而毫芒不取於民自經始以來綱維其事者大參文安刑表僉憲衛輝劉璋下至義士耆宿罔不奔走事事所以重上命敬神明也夫泰山雄鎮東方為五嶽之尊歷代有封禪之典維我列聖每遇登極必遣廷臣以祀方嶽又時命中貴有事於祠或金帛朋貝以將其誡或冠帔旌幢以拂其像蓋神之靈貺感人實有以致之嘗觀州志昔有猛虎為害禱之而去飛蝗為灾禱之而死以至於民之旱潦祈之歷有其驗故遠近衆庶拜瞻之頃靈風颯然知者敦其誠愚者啓其敬忠者堅其志奸者沮其謀善心以之生欲心以之窒吁休矣哉其神之惠乎徐溥記略弘治八年春正月巡撫山東都御史熊公翀言泰山絶頂碧霞靈應宫燬于火宜治事下户部議謂泰嶽有生物功凡祠關祀典者不宜不飭且神以靈故四方奔走士女操金帛為禱祈者歲所積甚夥宜令按察憲臣籍之以為工費詔可乃以屬僉事陳君寬領其籍內帑賜銀百兩以屬副使中司出納焉凡用銀以兩計者七千三百有奇為夫若干千而成熊公乃致書京師請豫記豫聞泰山之勝稔矣顧職在朝署無使命欲一登而不可得嘗觀泰安州志備載其形勢祠宇知有所謂碧霞者故閣老劉文安公之記在焉其為辭固奇偉巉聳與兹山兹景並勝使人讀之真若望扶桑窮日觀飄颻于剛風倒景之外粵自有天地即有山川奇秀所結靈神所聚邦君之所得祀擴而求之宜亦有不可無者矧國家秩祀之所載所以萃人心而延景命於此有資焉是其興廢起弊以貽不墜抑豈非有司者之事哉記成系以詩曰岱宗之巔巋一宫兮金碧絢出高巃嵸兮承乾據坤秀氣鍾兮神名碧霞誰所封兮雲冠霧裳廟貌隆兮月星光彩氷雪容兮人世杳絶嗟難逢兮門集五驂隨兩驄兮小大執事靡弗共兮國家明昌年穀豐兮五嶽效職兹其東兮刻石紀事垂無窮兮崔文奎記略太極判動靜生陰陽山鎮坤維體靜陰也水生天一體動陽也岱嶽摩空峰巒拔起去地數千丈絶頂出泉流注石池清泚可鑑蓋陽根陰之象泉以玉女名必有所稽地志失載記曰中林川谷丘陵能出雲為風雨見怪物皆謂之神岱嶽育神上通乾象降靈下土坤道成女天仙玉女之號意以是與碧霞元君之稱則後世加封之典神廟在兹揖日月之峯擁層巒之秀左則嶽頂之駿極右則天門之開朗歷選名勝之所無踰此境之妙意者神或受皇天后土之命俾權輿造化之機於此不然何威神顯赫如是之大殆不可以易而測也歷代尊奉已久逮我朝崇重之典尤盛有寶香異品之頒有華冠錦袍之錫嵗時遣官致祭以至奔走天下豪傑及士女商賈之類皆齊心戒誓道路間關歲進香帛者恆以億萬計金鏹緡錢川臻雲至溢于公帑資嵗用賑歲饑皆於是乎取給孔子以鬼神能使天下之人齊明盛服以承祭祀其斯之謂與嘉靖甲申都憲王公堯封奉聖天子明命來撫東藩詣神祠展謁顧瞻祠宇敝壞慨然興歎遂下營繕之令經始於嘉靖乙酉十月己未落成于嘉靖丁亥九月丙子規模壯麗丹漆晃耀突出煙霞之上巍乎岱嶽之間斗柄之南一奇觀也而神亦寧矣夫神寧於上人安於下幽明協贊和氣熏蒸雨暘時若是以庶草蕃蕪百穀用成朝廷無東顧之憂未必不自王公一念之誠有以感之哉郭詔銅鼓記略豫寅長右轄熙臺潘先生政暇嘗登斯山感獻遺之物而懼其殄也乃白諸巡撫大中丞南臯王先生鑄銅鼓四竅其心置橐鑰焉以象四時鼓萬物生長妝藏又為之鼎附之瓶以達絪緼之氣其知所謂鼓之舞之以盡神者與猶未也又欲顯諸道德行各識以銘鼓曰元氣鼓萬物春嗟爾岱神乎神氣再鼓麗宋夏品物亨乃神化孰鼓舞秋乃收物之府神之休消而息爾鼓爾物歸根元資始鼎曰大德曰生瓣香維誠人在洪爐左右和平瓶曰不平者情不私者平神馮人哉人馮神哉吁淵乎微矣可以幽贊於神明矣豫故為之記示後世有考焉已矣王之綱玉女傳玉女者天仙神女也黃帝時始見漢明帝時再見焉按玉女考李諤瑶池記云黃帝嘗建岱嶽觀遣女七雲冠羽衣焚修以迓西崑真人玉女蓋七女中之一其修而得道者玉女卷云漢明帝時西牛國孫寧府奉符縣善士石守道妻金氏中元七年甲子四月十八日子時生女名玉葉貌端而性穎三嵗解化倫七嵗輒聞法嘗禮西王母十四嵗忽感母教欲入山得曹仙長指入天空山黃花洞修焉天空蓋泰山洞即石屋處也三年丹就元精發而光顯遂依於泰山焉泰山以此有玉女神山頂故有池名玉女池傍為玉女石像宋真宗東封先營至泉水忽瀑清泚可鑑味甘美王欽若請濬之像偶折詔易以玉復礱石為龕構昭真祠祀焉尹龍謂世傳天仙玉女碧霞元君之祠始此國朝成化間拓建改為宫弘治間更名靈應嘉靖間再更碧霞碧霞宫之名始此纍朝增葺宫制滋闊而神之靈益顯四方之贍禮者益爭奔走焉其於國家多庇護矣內史氏綱曰余聞之太史公學者載籍極博猶考信於六藝詩書雖缺虞夏之文可知也余于玉女將何以徴焉蓋天地一氣而已其在天為星辰地為河嶽明而為人一氣也玉女之化為人人而復為神也何異哉故觀於考與可稽也若謂玉女為東嶽金虹太乙定父所生而化身為觀音之在世豈理也哉至其神靈顯於泰則又其所嘗住修之處而精神往來譬諸雲霧之在太虛有依依而不能去者矧泰山位東土秉木德而玉女坤質為水象池固其所自來耳其依神于此以揚靈異之休而助生成之德于不窮殆若天命之者世乃謂玉女親受帝册為女青真人永鎮泰山以主其祀豈不謬哉豈不謬哉愚固表而出之俾夫昧者有所據而傳也為之傳云巡按御史方遠宜撰泰安州祝文維神懋權化機駕御陰陽助天育人炳靈泄光一釀玄功八埏震揚明德倪天昭回七襄嵩高維嶽閟宫有侐仙馭式歸維此棲宅國有禋祀民有圭帛揚靈拂和四海來格兹惟守臣曰薦厥常俎豆莫莫鏞鼓鏜鏜維神降止鏐鏘琳琅風霆維車雲漢維裳空歌欽欽焱舉肅肅庇貺斯人式登百穀永奠邦基扶輿清穆祀禮弗愆維神率育尚饗巡撫都御史何起嗚宣諭萬曆八年豫觀風東兖泝泉源登泰山之巔憩焉俄聞四方以進香來謁元君者輒號泣如赤子久離父母膝下者然是曷故哉以誠心所感也人能以此心事親則為孝以此心事君則為忠以此心待同胞則為友以此心處朋友則為信以此心教子孫則為慈以此心不奪他人之有則為義以此心不徼非分之獲則為榮存此便得進香善果存此便得朝山福田脫或不然心一背馳將明有人非幽有鬼責曾謂泰山而能私庇爾哉孔子曰獲罪於天無所禱也言遠罪也孟子曰雖有惡人齊戒沐浴則可以事上帝言遷善也可不畏歟遂命州守袁䅮播諭四方香客以正人心云巡撫都御史李輔祈雨告文惟神受職皇穹陰握玄化蒸為雲雨以澤天下蓋祈年而祈靈者日奔走乎宇內作福而降祥者亦時合於諸夏矧兹東土固神奄宅之區而精爽之所常遊又不啻如枌榆之社也乃今四月不雨驕陽杲杲赤地千里野無豐草致天子之憂勞步桑林而露禱輔撫兹東土民將安保日夕惕焉憂心如搗惟省咎於厥躬甘待罪而席藳惟神矜此元元少續旦夕之命而賜之甘霖俾回枯而起稿則神貺之洋洋等皇仁之浩浩矣輔謹率吏民齊心以叩於神惟神鑒而聽之以彰顯道不勝待命之至升元觀在嶽之南麓酆都廟西石刻政和尚書省敕牒尚存元張志純重建改曰朝元觀學士徐世隆記牒勑碑略尚書省牒準泰寧軍奉符縣升元觀又云泰寧軍狀據兖州儀曹婁寅亮狀稱契勘兖州奉符縣泰山之下名曰三宫空洞之天載在圖經牒奉敕宜賜升元觀額牒至准敕故牒徐世隆記略朝元者何兩儀資生萬物居泰群臣之賀正也故道家取象名其觀曰朝元古殿摧仆掌教洞明真人屬天倪子鳩工掄材雖將經凶年亦勉力成之其費皆出會真常位嶽頂香資及掌教所助淨財夫洞天三十六福地七十二泰山其一也其興與廢必有靈祇司之豈不為神物所護持者哉天書觀即乾元觀今榜曰碧霞元君行宫在州城西里許宋大中祥符建史載天書降于泰山西南之麓即其地也長春觀在州城西北隅女道主廢絶久之禪僧寄焉中統碑刻元和子為女冠訾守愼作記丘神仙牒刻成吉思皇帝敕㫖俱存記稱祖師謂丘神仙妙真則守愼之賜號也元和記略教非道不立人非教不修凡以道為宗以神為教者莫不剖瞶抰瞽拯況照昏躋人於長生之域嗚呼世或有聞而未悟者有聞而悟者是旦暮一遇之幸也近代幸我祖師設教七真開天上智下愚咸使知之男修女學悉為證矣夫全真之道杳然難言哉其教也微妙玄通廣大悉備在人賢者識其大不賢者識其小其要絶資去欲返朴還淳屈己從人懋功從德則為遊藩之漸若乃遊心於淡合氣於漠不以是非好惡內傷其生可以採堂粵矣妙真修學無間然矣儻來不為得去不為失不悅生不惡死冲而用之厥心不震雖天地晦冥而朗日自照霰雪交集而陽春自舒此得性之功也動與陽同波靜與陰同德寢無夢覺無憂虛而待也其生乃全聽之於心冲氣為和息之以踵谷神不死此保命之效也龍泉觀又曰斗母宫在嶽之小龍口嘉靖二十一年德府重建濟南陳輈記石風伯雨師廟在州治東按天文志風伯箕星雨師畢星也先是廟廢止遺一石碣成化丙午旱雩不雨或油然雨狀輒為風散知府蔡晟詣其所祭之風頓息大雨如注因復立廟廟圮知州鄭豸易以壇高真院在嶽之南麓曰金山青帝觀後俗曰眼光殿三官廟有三其一在嶽之中道曰快活三其一在治西關其一在治東關酆都廟在嶽之南麓升元觀東弘治十四年建其神為酆都大帝其左為閻王廟嘉靖壬戌年濟南府同知翟濤重修有記李欽重修鄷都廟記岱宗南麓有廟曰酆都其神為北陰酆都大帝配以冥府十王其東為曜靈五閻王而左右十司曹官列焉嘗稽道經所載酆都者陰氣之主九地之樞機栲罰罪鬼死魂之所也十王之中其七曰太山故陸機太山吟有日蒿里亦有亭幽岑集萬鬼蓋蒿里去泰山僅數百武耳白樂天詩亦曰東嶽前後魂北邙新舊骨誠如是則酆都之為廟夫豈嶽麓之所可少者哉雖然俗傳收捕追逮出入死生之說固儒者所不道也然昔者吳道子盡地獄變相於成都民咸懼罪市之屠沾魚肉者不集而况崇之以殿陛列之以余牘肖之以人鬼嚴之以銼燒舂磨之刑使人入則肅然凛然出則悚然將自知去惡以求免刑戌之弗遑也其為神道設教之意顧可漫善於此者哉廟創始於太監李僅時弘治十四年也至今歷歲既久風雨所侵剝棟宇榱桷蓋瓦級磚與夫丹艧藻繪之飾未免傾圮漶漫嘉靖壬戌春濟南二守安陽弘齊翟公濤以兩臺專委來督嶽廟大工既獲底績乃復以檄請為重修酆都之舉兩臺亟為嘉允卜日興事資費取給於香稅而於農民秋毫無所于擾經始於癸亥秋七月訖工於冬十月殿宇周廊門觀繚垣悉加完治鬼神之像皆重為涅塑煥然一新廟西登嶽之路復建岱宗坊三楹自此以至嶽頂地方凡人又皆立坊以表其名而各揭聯以壯其景金碧煌煒映照山河由是泰山之偉觀愈益增矣郡人士咸願刻石以紀其事余惟天以春生萬物止之以秋聖人法天以政養民肅之以刑故曰父母之於子鞠育而遂宇之仁也鞭朴而告戒之亦仁也上之於民也政教以撫綏之仁也刑罰以聳礪之亦仁也岱嶽於方為東於時為春興致雲雨發育萬物而北陰酆都之府所司者秋殺之權也公來本以嶽廟為事而其餘力又有及於斯者無乃所以警勸下愚而啓其遷善敏德之機森羅殿左為閻王廟在嶽南三里蒿里社首二山之間有七十五司及三曹對案之神神各塑像俗傳為地嶽云徐世隆記略蒿里者古挽章之名田橫之客傷橫而作者也漢李延年分為二曲薤露送王公貴人蒿里送士大夫庶人後世以為人死精魂歸於蒿里有神主之張華博物志陸機泰山吟皆云人死其魂拘於蒿里白樂天詩曰東嶽前後魂北邙新舊骨樊殿直廟記亦言人生愛命於蒿里其卒歸於社首蒿里祠距嶽廟西南三里許社首壇之左自唐至宋香火不絶禮之者入則肅然凛然出則悚然豈非世人如見真鬼神而然吳道子畫地獄變相于成都觀者咸懼罪修福而巿屠沽魚肉者不集况入比詞其不寒心而駭目者鮮矣趙相公廟在社首之陽其神見搜神記及宋人元豐記石三靈侯廟在南天門祀周諫官唐宸葛周武又附祠嶽廟按通志三人墓在高苑縣靈𣲖侯廟在州城西南渿河東涘其神舊名曰渿河將軍後曰通泉侯宗真宗東封拓廟封靈派侯元重建教授王真記王真記略泰山有三溪獨西溪雅祕莫測源來自上方為瀑布直注山趾洄洑龍湫而出高深委至郡城之西百峯武居民飲濯之而呼曰渿渿之東滑地形若穹龜然廟其上曰靈𣲖侯者宋真宗有事泰山駐蹕於此始患水泉涸絶俄而涌漲嘉其神異而封建之也泰安監司噉撒縣尹孫公民獻同謁祠下憫殿像摧壓蓄興修志已而廟壖為水奔齧祝之水復折而西二公耳神之靈既熟而又目賭其驗遂更其廟而新之以崇其祀屬僕為記竊聞之山林州澤有利於人者則秩而祀之唯岱為鎮嶽實發生之所膚寸興雲不崇朝而兩其流澤又能滋於民物復及萬乘功用顯白神而祠之宜矣乃作迎送神之詞俾歌以侑詞曰我侯兮何在山之麓兮水唯渿山幽兮水鳴具我侯兮形聲侯之游兮委蛇風為馭兮雲為旗坎坎兮擊鼓水妃兮歌舞侯之樂兮來止徒御雍雍兮赤舄几几我民承事兮既多受祉侯之去兮悠哉忽𢡖兮陰霾或來去兮叵測千萬歲兮愈欽靈德淵濟公廟在嶽頂西南白龍池上有司春秋祀焉嵗旱雩禱自漢唐已然其淵濟神號祠宇則肇於宋元豐壬戌邑人趙合撰白龍殿記元邑人王天挺撰金帥劉瑀填池靈異記州倅李簡謝雨文州守路希尹撰感澤記國朝學正夏靖撰感雨記俱石刻祠中趙合記泰嶽西南隅有靈泉曰白龍池岸古石峻淵然罔窮大頂巍然而作襟首大峪環然而為郛郭峩峩而蔚者懸刀秀於上湍湍而鳴者百丈溢於中秋朝夏暮靄呈波面而為瑞靈草異花羅岸徑以爭香縈流天轉涵漾峯旋乃一方雄勝之地登而蒞之者無不嘉而駭焉自漢唐已來至於我宋每嵗投金龍玉簡御香為之禱矣蓋龍克雲克雨浹洽萬彙豐成元元者哉近者春夏不雨驕陽頗愆賢宰大夫揚鏐躬率縣吏民庶祈雨于白龍之神幸龍之明德不越夕而甘雨降應如影響稼穡以之而興縣境自是而蘇焉邑民霍直等白于大夫曰今衆庶感龍之惠願各持寶貨創龍堂一所以答神休仍選材飭工約而中度麗而不奢經之營之不逾月而歡樂成矣大夫特牒上司敷奏天廷乞賜喜號庶旌龍之效耳王天挺記淵濟公之號始於宋其廟於兵亂間為金東莒公燕寧所毁不數月而寧卒嵗在丙戌元帥萊蕪劉瑀權知泰安州事守天勝以久旱禱雨於龍池之側時有小白蛇出戲於香鼎上劉以為神龍所變再拜祝之曰三日之內有雨則我將為神修廟卜之吉一軍歡呼羅拜經數日無雨劉怒曰神許我雨今既無雨則無神矣命諸隸卒揭西崖之石填其池池將滿雷雨暴至如傾雹大如雞卵衆惶怖驚走既晴視之其池中所填之石悉為湍流衝去皆駭異拜謝服罪即今廟貌劉帥為創始此事土人往往有親見之者權府張侯談之甚詳因併為之記李簡謝雨文庚申年二月己亥朔十九日丁巳泰安州州倅李簡謹以剛鬛請的庶羞之奠再拜稽首祭於淵濟公之神去歲之秋嚴侯不以李簡愚𢣪不才俾倅此州時方苦旱人畜疾疫已愆種麥之期而土脉焦枯耒耜弗能入重九前一日禱雨於此是日雷震雨作如響如答旱既久非霖雨莫能濟是月望日約太守以下諸僚屬以荒唐不恭之辭輒復致禱是夕雨降淋漓三晝夜東原千里所在霑足既晴耕夫播種遍滿郊野不失金嵗來牟之望者神之惠也今春復旱遂於上丁前一日太守弗藥之辰率僚佐致禱於明神所明神閔人之不辜是夕降甘雨二寸許越三日雷雨復大作萬姓欣欣惟神之恩敢不明受其賜謹選吉日躬齊潔奏音聲以獻以樂以謝神其鑒之路希尹感澤記天下太平方千里之內生植齒類監郡太守能存亡休戚之天下兵興方千里之內能保黎庶能攘患難能致感通亦在監郡與太守耳凡監郡太守若無文武才略不清廉肅下不明惠公直則致傷和氣一州生類皆受其害今監郡住童暨太守路希尹來守是邦兵革之餘井邑丘墟生人幾盡詢問其故不覺涕下况歲乙巳值天久旱民有憂色夏五月望日謹齊戒沐浴躬率屬僚禱于嶽麓淵濟公之神屢獲靈應至十八日辛巳大雨飽足既不敢忘又從而歌曰龍之為神變化屈伸能大能小澤及生民或潜或飛或幽或明雲行雨施品物流形夏靖記景泰甲戌春三月徂夏不雨二麥萎悴東作靡興民心將至於流移矣郡守楊公定憫民之憂若己之病遂齊沐備禮延柴道正於四月朔設壇草參祈禱惟謹越五日不雨耆老曰岱麓有淵濟公祠向守兹者遇旱詣禱輒應益秉厥誠偕官僚耆宿拜跣遂塗至祠爇香再拜祝曰惟神血食兹土定與神陰陽表裏懇禱不雨其誰之咎俾之嵗歉衣食不足民何以安粢盛不潔神何以享為神之靈鞭龍致雨夫何難哉詞懇誠切恭禱禮畢至暮復達草參維時玄雲四布雷電交作甘雨如注夜二鼓少止翌日再雨不三日又雨公欣然顧余輩曰此時雨也時者不先不後之謂使得雨也先五日而至麥為之忌後五日而至麥奚以秀不秀焉實此雨所以為時也由是萎者以敷悴者以榮物意舒暢民心悅澤以為有年矣神之澤民如此合報祀焉謹以牲醴大合樂盛報神恩屬余記之余開有道之世五日一風十日一雨年穀順成物無疵癘民不夭扎而太平之象見焉乃者雨不違時二麥復蘇東作可興而有年之望也斯民也遭逄上瑞歡欣鼓舞而不知誰之為之者良由太守公集誠所感以致然也公字在止西江忠節裔由科目擢今職並書以為記云關王廟其一在高老橋其一在城內營裏街其一在東關大石橋其一在州西南下張集者尤靈異每遇大旱郡人輦之來州禱輒雨岱史第四冊神字號目録縣一卷之十靈宇紀孔子至聖殿安神祝文常祀祝文岱巔修建孔廟議魯兩先生祠懷英記吳寬記卷之十一宫室志觀海亭挾仙宫過化亭仰止亭東公署乾坤樓半山亭五松亭誠意門公署巖巖亭建榮記略飛雲閣醴泉亭更衣亭且止亭迎賓堂誠明當御香亭泰山書院泰陰亭吳從憲記環翠亭萃美亭徐琰記略霞液亭高山流水亭萬恭石壁記環詠亭表章韓范歐陽諸名賢遺蹟議白雲軒巡撫都御史李載記卷之十二物産志木果花藥穀貨茶蔌五金鳥獸魚氷卷之十三香稅志委官員額委官期限香稅事例混施事例會計事例卷之十四災祥志漢晉宋東魏後齊隋唐宋元國朝
