body:
  text: 岱史第十一卷宫室志敘曰志宫室者何志其宅岱宗之勝而登臨者藉以盤桓也夫自古名亭佳館崇閣危樓必據山川之勝槩斯擅寰宇之偉觀而勝莫如岱則據勝莫如岱宫室矣天地其籧篨日月其户牖煙霞其几席風雨其灑掃不越乎楹簷櫳榥而超然遠凝邈然周覽曠然出人境惟兹獨也豈不稱上界清都哉其間過化亭則宣聖之芳躅泰山書院則孫石名賢之故墟觀海亭挾仙宫則浴日御風之氣槩仰止亭迎賓堂則奉迓朝命而禮當途之冠裳此又宫室中最稱勝者大抵危崖峻嶺之上材木瓴甓轉運最艱即一磚之費十倍平地乃其役夫巇嶇血汗可憐之狀余嘗目擊焉而雲蒸霧鬱日烈風剛於漶圯又最易以故有崇構見稱於古而今僅存其名者余嘗謂岱巔工役勿務華務堅固勿務新創務時葺舊構勿待其大傾頽然後葺之以致耗財動衆而居守又必有專責焉是亦節愛之一事云觀海亭即日觀亭在嶽頂日觀峰泰鈁樊獻科題石扁曰日觀楊綵立石碑二曰東觀日本西望河源蔡叔廉勒石坡曰天下名山第一挾仙宫在嶽頂觀海亭之西萬恭題扁曰憑虛御風宫後石屏大書曰孔子小天下處嶽頂公署惟此最寬廣達官燕飲恆於斯過化亭在嶽頂稍西孔子崖吳謙勒石崖曰泰山喬嶽仰止亭即西公署也在碧霞宫西前後三間俱有翼室前巡撫都御史今工部尚書何起鳴題扁曰仰止云天柱峯玉女池秦斷碑俱在亭之後凡達官止宿恆於斯東公署在碧霞宫之西其制稍隘於西公署香稅總巡官憩息之所乾坤樓在大龍峪下侍郎洪朝選題今名扁侍郎萬恭又扁前楹曰礪山帶河半山亭在朝陽洞之西南山上誠意門公署在誠意門之西凡三間傍有翼室五松亭前後俱三間前聽有翼室亭前秦始皇封松樹五故名又名御帳以宋真宗曾此駐蹕也今其松存者二焉是亭當嶽之中道達官每飯中火於此或於誠意門公署巖巖亭取義於詩舊在嶽麓王母池東成化間參政張盛移建水簾洞左飛雲閣在嶽南址曰紅門嵗久圮廢今紫石為臺上有楝宇下通梁道猶閣之制也方元煥書扁曰梯雲石刻曰蓬玄洞天邢一鳳篆書曰仰止高山流水亭在晒經石隆慶間都御史萬恭創建自為之記萬恭石壁記余既表泰山之巔掠岱麓而南下則憩晒經之石石廣可數畝遍刻梵經皆八分書大如斗不知何代所為近有好奇者則刻大學聖經於上端以勝之余乃大書曝經石字皆博可六七尺刻深三寸垂不磨以助其勝北聳石巖石若斬截而成澗水漫石而下以懸于空巖若垂萬珠焉余輒大書水簾字深刻之水漸漸浙字上字隱隱匿水中斯泰山之至奇觀也已乃穿澗水而西得石壁高約十五尺廣約四十尺夷出天成下擁石基余東向而立則水簾之泉泠泠出其左而桃柳數十株蔚蔚其右余遂倚石壁為之亭亭悉以石石柱四直入石基其深尺有咫上覆以石板令永久登泰山者得憩息萬𥜥焉余嗜鼓琴輒顧從者曰夫是倚岱麓之壁也斯不亦高山乎夫是臨水簾之泉也斯不亦流水乎為子援琴而絃之邀泰山之神聆廣陵之歌若將巍巍乎志在高山也又洋洋乎志在流水也是謂神品亦謂神解從者悅遂命之曰高山流水之亭更衣亭在嶽之紅門道左凡衣冠之士登嶽至是易便服以行故名且止亭在更衣亭西有石刻亭名三大字迎賓堂在嶽祠東齊之南有司宴王人及大賓客之所誠明堂在嶽廟內之西延禧殿後凡朝廷遣大臣有事于嶽者居之御香亭在誠明堂後凡朝廷遣使賫香於嶽祠先置於亭擇告而後奠神垣周石刻名人詩文泰山書院在嶽南凌漢峰下舊為唐詩人周朴菴後為孫復石介胡瑗講習之地嘉靖間按察僉事盧問之創三楹妥孫石靈位尚賢存古迹也邵賢有詩曰千古清風仰孫石獨遺堂址向岩隈泰陰亭在州城之南宋真宗登封古迹也巡按御史吳從憲建亭有記吳從憲泰陰記略余按山東之明年暮春三月循泰岱將有事於登萊因與同事諸司臨拜嶽祠陟登封臺而往迹之僅存者惟秦之斷碑與唐之磨崖其他皆湮沒磨滅不可復睹及還州治知州事李逄暘請曰城南有陰字碑者乃宋真宗御書封禪紀文距州半里而近此祥符中東封故迹也時偕同事往觀之碑凡五面相合而成矻然如列屛嶂非特其製與他碑迥異而其敬天尊祖謙遜辭讓之意百世之下讀其文字猶令人肅然斂容稽首而莊誦之也然而時移代變昔之金泥玉檢光函萬丈今則蓋藏委翳於荒墟蓁莽之區其不為湮沉磨滅者無幾矣余因是竊有慨焉乃戒有司除地築亭于陰碑之北是秋九月望日從事者均來告成亭凡五間砌以石址臨于濠渭重門深逈畫楝高暉碑眠峙前儼如上帝之臨雉堞擁後恍若海市之觀北瞻泰嶽壁立萬仞則勃然仰止之思南盻徂徠直道偃蹇則惕然尚友之志視嚮日荒墟蓁莽之區今則巖巖翼翼廓然大觀非直為是州奇勝而奎章宸翰輝映今古真亦有光於泰嶽也矣於是命工人篆其碑之南曰泰陰碑揭其亭曰昭事上帝翌其門曰升中古迹州之士民樂其有斯亭也夾道樹以槐柏後渠種以芰荷仍取其地之中作為花塢周以柵欄多植奇花麗草以待四方賓客之觀翼亭之西拓地半畒築室數間以為往來憩息庖羞之所由是至斯亭者莫不徘徊竟日而不能去也嗚呼可謂盛矣環翠亭在蒿里社首二山間登此北眺岱嶽餘三面則鞍牛徂徠諸山蒼翠環峙故名萃美亭在嶽之西址去州治十里金知州姚建榮建元奉高尹王悟重修廉訪使徐琰記亭今廢記石移置文廟徐琰記略天下名山巍然而大岩然而尊者泰山而已泰山勝境窈然而深蔚然而秀者西溪而已溪居岱宗之右麓延袤數十里樹林陰翳蹬道崎嶇清泉奇石瑰瑋萬狀行愈遠而山愈奇境愈勝極溪之所窮顛崖百丈懸流下擲望之如垂練天紳泉也天紳之西有巨壑焉一水自天勝巖落為盤石所散漫瀉於壑之上簷若建瓴然水簾洞也而又芙蓉懸刀飛鴉獅子諸峯削翠其上黑蜧白龍神潭水府潛珍其下雲煙吐吞晦明變滅跳珠濺沫轟雷掣電顧接有所不暇真山水之窟宅大壤之奧區也金大定間泰安太守姚公面水簾而瞰天紳創構一亭樽俎不移而諸景咸會因榜之曰萃美坡詩有云江山雖有餘亭榭著難穩登臨不得要萬象各偃蹇吾不知世間得登臨之要有如此亭者乎靈液亭在嶽頂玉女池北宋建今廢醴泉亭在天書觀宋時所建環詠亭在東嶽廟御香亭西周垣畒許四面石刻古今名人詩詠故以命名也其間有韓琦蔡襄范仲淹歐陽修石曼卿蘇子美林逋諸公題識种放會真宫詩而放刻則堙沒不可見矣惟諸公題識姓名尚在嵗久亭廢諸石刻淪於荒穢中萬曆十四年按臺侍御毛允行後項呈議委濟南府通判桑東陽仍其舊址復構亭字將韓范歐陽諸公姓名手筆拂拭而維新之先賢數百年遺迹蓋重光焉足以昭示將來俾知所仰止云查志隆表章韓范歐陽諸名賢遺迹議照得泰山形勝古今登覽遺迹種種無庸殫述夫藝文尚矣人品急焉惟其人誠賢故其言誠立即片語隻字而姓馥名馨當世想見其丰采後世聞之亦莫不延慕興起向論模仿其文華輒欲刑儀其質行以此磨礪人材維持世道故其遺迹有足多也竊見岱廟西偏御香亭之右自古有環詠亭一座其來久遠不知創自何代何年蓋四面垣墻俱石刻先代名賢題詠聯翩手筆而亭宇介於其中瞻顧諸所題詠若環繞焉故因以命名也其間名賢之最著者若韓魏公若范文正公若歐文忠公若蔡端明蘇子美梅聖俞林和靖石曼卿諸公皆先宋人物其手筆尤不容湮沒者奈何近嵗亭宇久廢尚幸亭之稱名存於舊志中職按舊志而求故址則彼鄉人士絶無知者轉展咨詢延歷時日今幸得其故址幸四面垣墻石刻依然尚在只廢缺一隅更幸韓范歐蔡諸名賢手筆無恙惟是塵埃滿壁未易分披污穢藴崇不堪舉趾職於兹深慨焉俯仰古今其責在後之君子若不及今為之表章則四面垣墻旦夕盡廢不止僅廢一隅而已何忍諸名賢數百年遺迹當盛世而湮沒豈不有愧於斯文哉况舊貫可仍不由新創而一亭工費為值幾何合無仍其舊址復構亭宇仍扁曰環詠而四面垣墻題詠見存者拂拭之其一隅已廢缺者即將國朝名賢題詠補入而繕完之則豈惟更新先宋諸名賢遺迹而益彰國朝人文之盛豈惟增光岱嶽相為終始而於所謂磨礪人材維持世道者未必不藉此興起也職不勝大願萬曆十四年十一月草五日議白雲軒在嶽頂西南稍下鳳凰山之陽有白雲洞焉萬曆十四年巡撫都御史李以禱雨登岱賞識其勝協謀於巡按御史韓建枋以表之又為之亭為之軒巡按御史毛繼代共落其成詳見記文中都御史李載白雲軒記今嵗夏余祗奉上命填撫東土時苦旱魃為災未及受代輒禱于泰山之神為元元乞一旦之命竊私念公羊傳所稱不崇朝而雨天下者泰山之雲也今安得為雲為雨即符所禱哉已而見白雲裊裊布護山谷蓋自白雲洞中出也因往躡之則在鳳凰山之陽石磴陡絶而下洞高丈許廣亦稱是中有石竅廣二尺深僅尺許而洞之下陡峻深谷又不可測所謂百丈崖者是也洞中石竅四時水常溢注其來無形不知所自夏月則其勢愈盛沛然旁達故相傳為龍洞甘霖又曰雲根雨脈云余於此益信雨天下之言不誣也圖所為標其勝宜無如斯言者一日以語鹽臺談惺堂侍御則手筆雨天下三字勒石洞門余檄有司樹之坊坊稍北構亭一楹亭稍北構軒三楹而軒之宅勝最奇背負石壁如屛左右如翼獨開一面甚閎曠憑檻俯視大小龍峪如蒼龍噴水而山麓行人摩肩接踵雜遝如蟻近眺利徂徠山當其左傲來山當其右遠眺則云云亭亭尼丘梁父又環列星羅畢獻奇偉噫斯天下之大觀也已陟斯洞憩斯軒者寧無霖雨天下之思乎哉奚但選勝睎秀云爾有司竭余記之是舉也前按臺韓西玄侍御與其議今按臺毛文源侍御會其成其餘有司執事勒之碑陰萬曆丙戌仲冬吉旦欽差巡撫山東等處地方提督軍務督理營田兼管河道都察院右副都御史廪延李戴書
