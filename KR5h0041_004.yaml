body:
  text: 岱史第四卷山水表敘曰曷表乎山水也表山水之附麗於岱嶽者也夫岱嶽山也而兼以水言者何山下出泉謂夫水之源也故言山必言水也今其山之得名曰峰曰巖曰洞曰嶺曰崖曰臺曰門曰峪曰寨曰園而莫非山也水之得名曰泉曰池曰井曰溪曰河曰灣而莫非水也其他曰橋曰坊曰題勒凡以表勝於山水也總之則皆岱嶽之勝也夫天下佳山水古今人類能言之仁智所樂豈虛語哉維兹山水非可以例言也上應天齊宗長群嶽日月之所避隱雲雨之所官府帝王之所肇祀億兆之所奔走品彙萬有之所蕃滋即一拳之石鍾靈秀而育化機一掬之泉潤濟汶而衍洙泗其為功化豈不弘多弗啻雲巒風壑絶壁重標峻閣千尋峭門萬仞飛湍瀉溜漾碧流虹五色交輝四時俱備令人目不周玩情不給賞帷斯之為勝而已爾余嘗為之評曰岱嶽山水特以雄偉勝匪以奇巧勝故稱絶勝云峰石鳳凰山在嶽頂西南白雲洞之主天柱峰在嶽頂西南仰止亭之後嶽巔石在王帝觀前侍郎萬恭刻石曰表泰山之巔象山在鳳凰山之下日觀峰在嶽頂東五鼓可見海上日出今有觀海亭望海石在日觀峰東北五鼓日初出而可見是見海也石閭山在州南漢武帝禪於此大懸石堆嶽頂西介石山在州南五十里宋真禪於此月觀峰在嶽頂西對日觀而言義取月朏庚方耳此曰越觀小懸石亦頂西與大懸石對仙橋石在捨身崖西懸崖相對相去五尺許三石撑拄如梁亭亭山在州南五十里黃帝禪於此秦觀峰在嶽頂西試心石在仙橋石西三石鈎連懸崖萬仞人登踐之即搖動恐怖愚民云惟心誠則無動梁父山在州南一百里秦始皇禪於此周觀峰舊志云夫所在意者觀周當在嶽頂西今都御史胡纘宗刻石于碧霞坊之左云云山在梁父山之東古稱七十二君多禪於此劔匣石在大峪西有方石如匣相傳匣有寶劍仙人取去傲來山在嶽頂西南竹林寺其石贊岏矗矗至御帳俯視之更奇吳觀峰亦失所在意者觀吳當在嶽頂東試劍石在大峪口相傳仙人取石匣寶劍斷劈此石半仆於地今觀二石文理若中分然丈人峰在嶽頂西南特立如蒼顔丈人青山在嶽東南麓漢明堂東北仙影石在試劔石旁其影有巾有劍伸一足而坐石平如磨崖影處如剝如勒而實非人為相傳取劍劈石者即此仙也黃山在嶽頂西四十里以士名與青山資嶽之翼山也雞龍峰在傲來峰前以賈飛似文名東神霄山在嶽頂東十里懸石峰在嶽頂西南西神霄山在嶽頂西十里回鴈峰在嶽頂西龍文石在嶽陽其文如龍石後山在嶽頂西十里前多巨石故名獨秀峰在嶽陽屹然挺秀古人題刻峰名於石虎阜石亦在嶽陽其狀似虎龍口石兩石相附中噴清泉孤山在嶽頂北十里峥嶸特起獅子峰在嶽陽以形似名牛心石有以形似名玉女山在嶽頂東北十里許有玉女修真石崖在其下羊闌皮石相傳仙人牧地蓮花峰在獨秀峰之東其奇簇如蓮花方正石其形方正故名石馬山在岩頂西北十五里胭脂石在嶽之陰色如塗丹雕窩山在嶽頂西十五里崖多雕巢故名懸刀峰在嶽西南西溪上紅門石石色紅望之如紅朱門五女圈石在嶽西北相傳夜有呼號相力之聲詰朝見石纍成圈蓋五仙女為之襁山在嶽北十里如駝負子狀芙蓉峰亦在西溪上鶴山在嶽頂北十里林木蔥鬱野鶴巢此故名飛鴉峰亦在西溪上老鴉峰在嶽頂北木多鴉巢亭禪山一名高里又名蒿里聯屬社首在嶽南三里龍泉峰在斗母觀東北峯右峭拔可愛三尖山在嶽頂西十里凌漢山在普照寺後君子峰在嶽頂徂徠山在嶽南三十里嶽之案山也上有紫源池有玲瓏山獨秀峯天乎東石屋一在玉女山一在山西二寨其下曰白河灣曰趾相傳玉女修真處景最竹溪唐李白孔巢父韓準奇勝裴政陶沔張叔明隱此號懶張石屋在嶽頂北曰竹溪六逸唐石介因故麓相傳有懶張道人修煉址築室著書學者稱徂徠於此先生石舟一在白龍池一在嶽八寶山在嶽頂東百里東南麓傅家莊宛然如舟屬萊蕪一名黃山蠟燭山在玉女山北其石獨立如燭洞嶺嶂峪白雲洞在鳳凰山下由青嵐嶺在嶽項西小龍峪古名小龍口石峯亥坊南行數武石磴陡南硤為衆水所婦飛泉若龍絶而下洞中時出白雲今回馬嶺石磴漸峻噴然都御史李戴題曰雨天下乘馬至此不能上大龍峪古云大龍口蓋取公羊傳不崇朝而雨黃峴嶺土多黃色桃花峪在嶽頂西南二天下之意御史談耀勒石勢甚陰峻過此一徑十里桃花洞南今多植桃見兮創建枋亭軒最據形平易名曰快活三花勝鴈飛嶺即回鴈峯仙趾峪一名馬蹄峪在水簾洞在高老橋上在嶽頂西南鴻鴈南竹林寺山後里許有仙人迎陽洞一曰雲陽洞可翔多止於此草履迹長尺餘馬屣長五容二十餘人尚書朱衡勒西橫嶺在嶽頂西寸許字千石崖曰朝陽洞削壁橫亘數十丈許石經峪在嶽之陽坦石黃華洞在嶽北玉女修鄉嶺在嶽頂西半畝許古刻金剛經楷書真處俗傳人死魂歸於此有近八分書者大尺許人吕公洞一曰金母洞在而思鄉傳王右軍書嶽之南麓玉女池側十峰嶺在王皇廟石壁峪在嶽之陽竦削遙觀洞在嶽南一穴高右如壁深遊者憩此可覽群山分水嶺在嶽頂東大峪在傲來山竹林寺下鬼仙洞仙蒿里之陰窈漢明堂後楊老園西即中溪之路內有白龍池然幽暗人不敢入升仙嶺在嶽頂東百丈崖天紳泉諸奇景石白鶴洞在嶽西四十里東漢明堂之東北隅上有宋元詩刻可容三十餘人長城嶺在嶽之西酆都峪在嶽之陽俗傳黃伯陽洞在嶽頂西北古長城巨防之化為冥司今峪南有酆都廟十五里戰國時黃伯陽修思谷嶺在谷山寺鬼兒峪在嶽之陽俗傳隱於此南人死魂歸於此本張華博金絲洞在嶽北九十里仙臺嶺在嶽北六物志之説可容百餘人丘長春煉丹十里佛寺峪在嶽東北四十處明月嶂在嶽北群里即谷山寺有石佛桃花洞在嶽頂唐磨碑峯秀列若屏障然椒子峪在嶽之陽昔有石壁下有泉招軍嶺在嶽頂西異人種椒於此故名朗然子洞在嶽半御南傲來山前溪里峪在嶽之陰巖穴帳東里許可容三下深邃上有湧泉四時不竭觀音洞在竹林寺山後婁敬洞在嶽頂西百里漢婁敬隱地旁一洞出硝石崖巖臺孔子崖在嶽頂西南兩峰巖在嶽頂西鳳凰臺在嶽之陽舍身崖其北聯屬日親兩峰對峙下有一穴登仙臺在嶽頂之陽相峯下餘三面崖壁陡削數如室傳吕純陽曾登此百丈中有石凸起丈許愚仙閭巖漢書武帝南拱臺在嶽之陰巉巖民往往舍身投崖徼輸回紀曰嶽頂西巖為仙拱峙上復平坦故以臺名之福尚書何起鳴設坦墻北拱臺亦在嶽之隂示禁因勒石曰愛身臺蛟仙巖在嶽陽相堯觀臺在嶽頂東北十東百丈崖合嶽頂西傳翰林王從之跏趹里玉女山頂有石平坦如南其瀑布下滙為天紳泉化此元好問送張天臺相傅堯封禪登此西百丈崖與東崖相倪詩云蛻仙巖上願讀書臺在普寺西北去三百步其高十倍東崖遲留是也後山過書澗山麓有石而東崖南向西崖則東向古雲巖在回馬嶺方四五丈許宋孫泰山石仙影崖在嶽頂西南傲弄月巖以下四巖徂徠胡安定讀書之所姑來峯其山皆蒼石惟仙影今失所在蘇李果八分書刻石如白紙看月巖瞻魯臺在舍身崖上五花崖在嶽頂南城郭彌高巖仰視嶽頂不能見崖蔽之鎖雲巖也鵓鶬崖在嶽北峭壁巢野鶬馬棚崖在嶽陽以形似言也一曰三字崖以其崖上有墨書三畫風雨不磨世傳吕洞賓書御帳崖在御門園寨一天門有坊在嶽陽岱楊老園在嶽之陽水仙寨在嶽頂西可容宗坊內里許石崖險阻世傳楊老千人紅門在嶽陽扁曰飛雲閣避兵於此仙人寨在嶽頂北亦容又曰梯雲藥園在嶽東南世傳千人二天門有坊在嶽陽一有修真之士種藥於九女寨在嶽頂西三炎名小天門即御帳蓋宋真此山下一峯高處相傳九女宗曾此駐蹕也避兵於此誠意門在御帳上半里凌漢寨在嶽陽可容數許百人三天門石門一曰南天天勝寨在傲來山前可門即十八盤盡處容萬人劉盆子赤負等曾東天門在嶽頂東此聚兵上有招軍領張旗西天門在嶽頂西石崔之類玄武門在嶽北址泉池河碧天泉在嶽頂廣生殿王母池一名瑶池㴎河源出嶽頂西南諸谷東在嶽之南麓池水之滙為西溪由白龍池出大碾駝泉在過人峯下嶽源乃岱嶽山澗之水峪口南流入泮河會汶水頂居人皆取給於此以達於漕水天紳泉在傲來山百又梳洗河源出嶺諸崖下巔崖十丈許懸流下為其池焉昔黃帝建公之水為中溪過王母瀉如垂紳觀岱嶽遺其七人雲白鶴泉在嶽南麓冽而冠羽衣修奉香火以名其水由州東南魯泮河甘美以城中井泉稱較之迎西王母故名大汶水輕重亦異王女池在嶽頂元泮河源出嶽西桃花峪護駕泉在黃峴嶺御帳君祠右甘冽四時不諸水𩌏州治東南二十里之下涸一名聖母小池豫入文聖水泉在回馬嶺章謝廷傑勒石汶河其源有三一出嶽之水簾泉一在西百丈崖白龍池在傲來山東𪋤萊蕪原山一出萊址廣數尋深不可測蕪寨子村皆經徂徠山之滌塵泉在嶽南麓后士池上有龍神祠嵗旱廟內遊人多掬水滌目又禱輒應按察黃鰲刻名眼光石曰霖原飛鸞泉在王母池右水封家池在嶽南麓又西南經紋上縣北以逹甚清冽流注池中封家墅中通白鶴泉漕河醴泉一在天書觀即宋王之下流涓涓匯焉欽若所奏於真宗者今雖不竭無異凡水法苑所稱醴泉今失所在溪澗井灣東溪其源出嶽陽登仙臺香井在嶽南古嶽廟龜兒灣在嶽陽下及青山諸水經漢明堂黑水灣在嶽之西西溪其源出嶽頂以西諸忽雷灣在西溪天將雨水會百丈崖白龍池大峪極香泠異於凡水朱時每聞雷聲迅發於此中溪其源嶽黃峴嶺下會曰藩詩曰廟前香井飲馬灣在西溪諸谷之識投錢蓋謂此也天井灣一在嶽北一在鷹愁澗在十盤下天井在嶽之東井十西南投書澗在凌漢峯下以里許廣數畝匯諸峪虬在灣在王母池上奇胡安定投家書於此故名石可愛吕純陽詩曰無賴舊東魯刻李果八分書澗汶河又名天井灣蛟虬知我字是也名三大字於鑼鼓灣在大峪西溪俗傳七月中元日有聲如鑼鼓題有立碑者有勒崖者橋岱宗坊登嶽自此自殆都御史都正大光明戴璽高老橋在紅門上五里立石許相傳有學黃老者姓高羅鳳翔等同建五嶽之宗戴璽始開此道一天門坊參政龍光立石一碑俱在岱宗住水流橋在水簾洞題通判王之綱建坊下之下孔子登臨處坊聖仙橋在馬屋下豫章狀元羅洪光題尚書天下奇觀員外橋在小龍峪朱衡建楊可大言石于一下步天橋在二天門大階坊御史高應芳建門北潄王橋在石經峪道中高老橋坊知府李伯第一山御史李復勒名于石春等重修前同知翟濤建初立石于天階坊下王母橋在王母池上橋水簾洞坊中流砥柱進士之東則呂公洞橋之西則回馬嶺坊陳甘雨勒字石崖嶽廟舊址此第一勝境也黃峴嶺坊至此始奇檢討渿河橋在渿河上州城二天門坊諸坊修建馬一龍勒字石崖西南河津老橋坊同天大松范宗吳立金銀橋迎天坊崇府修建右小龍峪坊修建同高老橋大龍公坊修建同高至此又奇馬下老橋龍勒字石崖十八盤坊修建同高飛泉瀑布同知老橋翟濤勒字石崖白雲洞坊都御史李至此愈奇馬一戴建龍勒字石崖蓬玄坊修建同高老橋風濤雲壑勒字濟世坊石崖安民坊雄峙兩間立石敕建碧霞坊都三天門外御史李輔御史吳定韓應庚俯窺六合立石等修建同前升中坊山河一覽勒字蓬玄坊下海日奇觀郎中吳同春書在日觀峯東南絶壁岱北奧區前人書在黃華洞石壁
