body:
  text: 委專一督理香稅上下稽查是其責也分理官凡六員於州縣佐二官內行委坐定遙參亭二員一收本省香稅一收外省香稅俱填單給與香客玄武門一員收山後香稅亦給單紅門南天門各一員俱驗單放行頂廟碧霞宫門上一員查放香客出入凡此員額某來久遠不知起自何年近該隆慶五年議革遙參亭官一員並紅門南天門驗單官二員盡行裁革只存分理官三員一在遙參亭一在玄武門一在碧霞官每遇香客衆多之時分理官力不能支議者謂當時栽革太過今宜酌議稍增員額委官期限近例每年分作三季上季自正月至四月下季自九月至十二月其時香客衆多故總巡官與分理官俱全數委用中季自五月至八月其時香客不多故只季分理官不委總巡官又每一季完訖則另行别委故總巡官去住不常而分理官亦嘗有奉委未到者此不惟錢糧重大所宜稽查而億萬衆巇嶇崖壑中安可不為之巡行存恤也議者謂總巡官宜有專設俾之常駐香稅銀例舊例本省香客每名五分四釐外省香客每名九分四釐俱店户同香客赴遙參亭報名納銀領單上嶺近自萬曆八年有外省香客冒充本省報名短少香稅者因改議不分本省外省香客一例香稅銀八分其銀各店户包封署名包上儲遙參亭庫內待夏冬二季起解時店户各認姓名領包傾銷其間有等店户當報名納銀之日將銅鐵抵换銀兩至起解傾銷之日百計抵補不及有脫逃者有自縊死者凡此皆所目擊宜為酌處委官收銀間一開包驗實店户傾錠量行給與耗銀庶其少蘇混施事例凡香客施捨金銀珠寶玉石首飾並金銀娃娃銅錢及幡蓋袍服紗羅段幣等項俱投在碧霞宫內夏冬一季另委府佐一員前往會同原總巡香稅委官登嶺啓門收檢諸所施捨前項物件逐一驗看估計將金銀珠寶玉石首飾並金銀娃娃銅錢等項同前項香稅銀一併解赴布政司儲庫以待轉解支用其幡蓋袍服紗羅段幣等項解赴濟南府儲庫支送三司堂上並首領與運司濟南府各佐二員下折俸會計事例每年香稅並混施銀兩多寡不等照數坐派一曰解部卷查嘉靖三十七年為傳奉事內開泰山頂廟香錢除幡蓋袍服等物照舊該省官員折俸外其餘金銀首飾等項按季數部等因以後節年二季差官起解赴部據近年解部大約春季銀一萬兩有零冬季一萬二三千兩有零一曰存司專供公堂慶賀表箋扛夫車價公差人役六房文册紙劄寫字書手工食及德魯衡三藩府各郡王祿糧等項一曰修城其銀亦儲在布政司以供修理城垣之費一曰修廟其銀亦儲在布政司以供嶽嵿諸廟修理之費每香稅八分內除五釐修廟一曰公費供香稅各委官廪給並跟隨人役工食其銀即於泰安州支給一曰銅錢舊例解禮部近嵗部中久不取解俱貯之藩司正所謂錢纍巨萬而貫朽云
