front:
  text: 岱史第十三卷香稅志叙曰曷云乎香稅也四方祈禳之士女捧瓣香謁疑神明因捐施焉而有司籍其稅以助國也夫槩天下香稅惟岱與楚之太和山也而太和山不以岳名則嶽之有香稅惟岱也方其摩肩涉遠接踵攀危繦至輻凑豈特助國而已輿厮賴以食力市肆賴以牟利僧徒賴以衣鉢即行丐亦賴以須臾無死諸所爲地方利益甚博其究也罄所賫金帛珠玉馬羖等物以奉神則有司日筦榷之嵗兩會其成數是皆神靈所感召也豈假於號召科責乎哉歛而不宰積而能散又非有神輸鬼運而人世自相嬴衍何造化之妙一至此也山東皇畿左輔諸凡賦役獨先頻歲凶荒物力且日困脫令不藉是安所取辦天盖保右國家而陰以此佐六郡百姓之急耶其初惟籍諸藩司以贍地方一切公需代田賦所不給也邇廼轉而入之内帑嵗有定額議者謂方今内帑累巨萬而不可校盍貽此備賑六郡凶荒推廣靈貺惠澤香火之地神意豈不其然此在求民瘼者所宜講也章程種種具列如左委官員額舊例總廵官一員於府佐内行
