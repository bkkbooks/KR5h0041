body:
  text: 岱史第一卷圖考叙曰曷云乎圖考也考泰山之形勝而繪之為圖也夫鴻濛始判為物者萬而惟流峙最大為峙者萬而惟嶽最大為嶽者五均之巍巍峻極而惟岱最大近則橫亘齊魯跨引江淮遠則雄峙九紘霖雨四海豈非華夷之巨觀古今之崇鎮乎顧欲以方寸赫𨂜總攬全勝抑何難也然自古考方辨域必取諸圖不然則周覽不能窮其勝載籍不能紀其詳即有高雅之士興起卧游之想曷從而觀焉是用據古證今圖諸簡端圖泰山握坤軸也而先之以星野繫乾象也圖嶽廟以神所棲也圖碧霞宫以世所崇奉也圖周明堂以帝王致治之蹟也而附之以五嶽真形則以泰山五嶽之宗宜統會其勝也維嶽降神實生孔子萬世宗之如泰山喬嶽圖其廟而崇祀之以表聖蹟重山靈也夫天開圖畫地湧丹青豈人力哉維兹繪事肖厥化工俾世之觀覽者一披卷而對越介丘恍乎明神陟降勿勿乎欲其享之則又非特豁目惠心供勝游之適云爾
