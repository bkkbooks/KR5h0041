body:
  text: 避於松下遂封為五大夫五大夫者秦官名第九爵也唐陸贄作禁中卷松詩云不羡五株封按史記但云封其樹為五大夫不聞有五株松之説而贄云爾者何邪又李啇隱有五松驛詩云獨下長亭念過秦五松不見見輿薪又李白送人遊桃源亭詩云登封泰山風雨暴作雖五松受職草木有知云唯舒王誅柏詩云老幹松先得大夫官乃為切當今只存其二然非秦時故物疑亦後人續植者老幹拳曲臃腫宛如蒼龍勢欲飛騰範宗吳勒石樹其下曰五大夫松御帳坪稍北路傍古松一株緣崖依峪盤結偃蓋若雲覆然其吉詭蓊鬱殆退大夫松遠甚方元煥磨崖書其下曰處士松蓋尚其高隱不羡秦封也有漢柏在泰山之陽登封門之外山南廟左老柏數株相傳漢武帝封禪時所植有唐槐在獄廟內奇古特異雖良工不能繪它若椿梧梓檜揪槲桑柘榕欒榆柳楊楝雖皆有之顧登封之地無喬林豐樾而取材于工師者或寡焉談者謂嶽多石少土難於滋植風剛曰曬易致頽朽是豈山之性哉抑自古日尋斧斤而今莫為之栽培耶果有梨栗棗柿梅杏桃李奈石榴銀杏櫻桃林禽核桃葡萄羊棗文冠果無花果諸品多植于嶽址園林其在嶽者多野生曰山榴獼桃野棠花有牡丹芍藥紫薇凌霄夜合辛夷長春麗春梔子王簪萱葵臘梅薔薇雞冠鶯粟山丹月季蘭蕙茨菰石竹菊百餘種蔓生於樹曰藤花可蔬鹿芴花别名曰黃花菜珍美稱於天下而土人賤之不以供客藥以泰山著圖經者三十有九種曰青芝赤箭景天遠志天門冬千嵗虆徐長卿太乙餘糧石龍芮石鍾乳石硫黃白石脂赤石脂白石英紫石英玄石滋石滑石雲母石絡石草龍骨伏翼蛞蝓松肪柏實茯苓丹參茵陳茵芋女蕤狠毒連翹藜盧澤漆瞿麥香附子玄胡索惟天麻獨異于它産但鮮而難致有名在圖經而不以泰山言者四十有九種曰蒼木黃精黃連黃芩玄參蝦參苦參沙參萬蒲知母益母貫衆山查山藥地黃地榆地丁南星枸杞木蘭防風荆芥芫花花椒百部百合草烏柴胡牽牛桔梗藁本芎藭漏蘆鬼箭麥門冬葳靈仙白蘚皮青木香鬼見愁車前子硝石長石青蒙石金星石銀星石金銀花馬兜鈴王不留行諸品惟沙參獨良石花可已心疾傳金瘡撲患湘之可茶狀如蒙山而氣味亦稍相類此則圖經所未載者穀有黍稷稻麥菽粟芝麻胡麻巨勝黍黃白黑三種稷黃黑二種稻紅白二種麥有牟喬三種菽青黃赤緑黑刀扁諸種粟百餘種曰九里香花裏黃其最佳者貨有絲有木綿紬絹葛可為絺有麻檾蜜蠟茶薄産巖谷間山僧間有之而城巿則無也山人採青桐芽曰女兒茶泉崖陰趾茁如波薐者曰仙人茶皆清香異南茗黃芽時為茶亦佳松苔尤妙䔩蒔於畦圃者弗志其野生曰薺茶黎藿蘧芹枸杞椿楝榕欒芽俱可菹香美並異八麻樹芽和糜粥亦佳曰枸骨芽曰蒡春土人甘之五金出萊蕪之黃山亦以黃白二土石焦二炭土可塈可圬炭石可薪而焦良於冶頗為民利故又曰八寶山是為嶽東支麓其西麓曰桃花峪山人昔嘗採白金礦山海經云其下多金是也又云其上多玉今不可見土人云嶽巔間嘗一炫光彩意者其玉韞之輝與鳥多野鴿巢巖穴及嶽祠榱題多鳩雀有鸒鷹鸇鴉鵲惟嶽祠無鴉異哉有曰巧婦爾雅釋桃蟲是也曰山僧聲如念佛曰紅娘子色如胭脂曰拖紅練拖白練皆以尾色名有雉雞山雞野雞䳓黃鸝鵪鶉翡翠布穀畫眉有翠羽褐衣如畫眉者汶有鴛鷺鸕鷀鶺鴒野鶩獸有徸麅貛兔兔有兩其足者不能走每跳一二丈計曰跳免有黃鼠蒼狐白狼在深山窮谷而登封之地則無也山海經曰有獸焉其狀如豚而有珠名曰狪狪今未之見豈山林古今之變而氣化有不同與魚有斑文四五寸許四五月生嶽北溪澗中過此則無矣氷凝嶽頂北十里許陰壑中名曰天牢天日不過之地四時有之不假伐藏
