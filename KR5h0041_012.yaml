front:
  text: 岱史第十二卷物産志敘曰曷志乎物産也言物産莫尚乎山而泰山尤廣生大生之區也禹貢曰岱畎絲枲鉛松怪石神農經載泰山諸藥石而山海經曰其上多玉其下多金多水王道書福地曰泰山多芝草玉石是皆物産之聞於古昔也談者謂古昔山東富饒甲天下利賴於泰山居多有審然者自今觀之石山鮮茂林剛風罕宿羽寒窟無群獸危巖深澗詎復有良玉仙芝惟是藥草緣崖藥石滿谷如天麻青芝赤石脂紫石英諸靈品絶異他産則永永為世人扶顛起死以弘濟壽域其為寶弗啻金玉而已夫泰山之興寶藏詎分古今哉古昔用之有節故恆見其富饒晚近世費出不經上既橫斂下復侈靡即罄山海之珍難乎其繼山東富饒之不逮古其以是夫余於兹有深慨焉木有秦松在黃現嶺秦始皇登泰山遇風雨
