front:
  text: 岱史第十一卷宫室志叙曰志宫室者何志其宅岱宗之勝而登臨者藉以盤桓也夫自古名亭佳館崇閣危樓必㨿山川之勝槩斯擅寰宇之偉觀而勝莫如岱則據勝莫如岱宫室矣天地其籧篨日月其户牖烟霞其几席風雨其洒掃不越乎楹檐櫳榥而超然遠凝邈然周覽曠然出人境惟兹獨也豈不稱上界清都哉其間過化亭則宣聖之芳躅泰山書院則孫石名賢之故墟觀海亭挾仙宫則浴日御風之氣槩仰止亭迎賓堂則奉迓朝命而禮當途之冠裳此又宫室中最稱勝者大抵危崖峻嶺之上材木瓴甓轉運最艱即一磚之費十倍平地乃其役夫巇嶇血汗可憐之狀余嘗目擊焉而雲蒸霧欝日烈風剛於漶圯又最易以故有崇構見稱於古而今僅存其名者余嘗謂岱巓工役勿務華務堅固勿務新創務時葺舊構勿待其大傾頽然後葺之以致耗財動衆而居守又必有專責焉是亦節愛之一事云觀海亭即日觀亭在嶽頂日觀峰泰鈁樊獻
  hash: sha256:9f5b568059bb32d1ff5826bf61cb52ded815bb080e9ab4ac61b1d5077450fbbe
