body:
  text: 岱史第七卷望典紀叙曰曷云乎望也帝王祀事之稱也紀之者何秩祀以崇禮也夫國之大事惟祀祀之大事惟天地與五嶽而岱惟嶽首帝王狩望必先焉於禮豈弗崇重哉然虞書望祀而曰秩周禮四望而曰秩視三公盖别於天地也無用越禮以爲媚也降及後世餙縟矯誣唐則稱王宋則稱帝獻符奏策瑶牘雲臺輙冀幸饗神而徼之福顧不思夫神聦明正直而一者也以此媚之克享否乎我高皇帝稽古制祀典先正其名號曰東嶽泰山之神而郊壇而遣告而禱賽一切秩之以禮與帝典王章同符列聖承之昭然成憲可爲萬世法若夫公卿百執事有事於祀者凡以爲國爲民也例得附録焉唐虞歲二月東巡守至于岱宗柴望秩于山川見舜典周大宗伯以血祭祭五嶽山宗伯四望五嶽五嶽視三公見周禮周公封于曲阜伯禽爲魯侯遂得主泰山之祀見魯世紀魯僖公三十一年夏四月四卜郊不從乃免牲猶三望見春秋公羊傳曰三望者何望祭也祭泰山河海也魯宣公三年春王正月郊牛之口傷改卜牛牛死乃不郊猶三望同上季氏旅於泰山子謂冉有曰汝弗能救與對曰不能子曰嗚呼曾謂泰山不如林放乎秦始皇即帝位三年東遊海上祠名山大川及八神八神之次二曰地主祠泰山梁父八神之祀莫知所起盖周之先已有之始皇因之及舉封禪亦祠泰山漢高祖至武帝時泰山屬濟北王境内自奉祠元狩元年王以天子且封禪上書獻泰山然後天子官領祠元封五年帝至奉高修封祠泰山其後五年一修封凡五祠焉宣帝神爵元年詔太常制五嶽常祀禮皆使者持節唯泰山與河歲五祠餘皆三祠光武申元元年定北郊祀五嶽建武三十年三月帝却封禪之議幸魯退祭泰山三十二年二月帝舉封禪祭天於泰山下南方又以一特牲於常祠泰山䖏告祠泰山章帝元和二年二月幸祀泰山風俗通曰岱宗廟十月日合凍臘月日涸凍正月日觧凍皆太守侍祠魏文帝黄初三年祀五嶽晋成帝咸和八年立北郊五嶽從祀梁令郡國有五嶽者置宰祀三人以孟春仲冬祠之後魏景穆帝立五嶽廟於桑乾之陰每嵗遣祠官詣諸嶽鎮禱焉孝文帝祭岱嶽文曰造化氤氲是生二儀玄黄既闢山川以離四流含靈五嶽苞祗並兼方象出納望羲岱宗穹崇梁甫盤崛青丘碕嶬春趾鬱嵂肇生庶類啓光品物上敷神工下融靈秩載恊化文四氣以溢百王鐫成莫不兹室唐武德貞觀制以五郊迎氣之日祭五嶽又祭東嶽於兖州玄宗開元初五郊迎氣之祭如舊制祝文見後開元十三年封泰山神爲天齊王禮秩加三公一等是時天台道士司馬承禎言今五嶽神祠是山林之神也五嶽皆有洞府有上清眞人降任其職山川風雨陰陽氣序是所理焉冠冕章服佐從神仙皆有名數請别立齋祠玄宗奇其說勅五嶽各置眞君祠故今道書稱東嶽太靈蒼元司命眞君云開元初定常祭儀祝曰嗣天子某謹遣某官某敢昭告于東嶽岱宗惟神賛養萬品作鎮一方式因春始謹以玉幣犧齋栥盛庶品朝薦于東岳岱宗尚饗天寳元年七年八年皆以歲豐遣官祭五嶽德宗貞元二年詔太常卿裴郁等十人各就方鎮祭嶽瀆宋初祭東嶽泰山於兖州眞宗大中祥符元年封禪禮畢詔加號泰山天齊王爲天齊仁聖王五年加上曰天齊仁聖帝命學士晁迥撰天齊仁聖帝碑銘今存嶽廟晁逈碑銘臣聞結萃爲山麗無疆之厚載升名曰嶽表奠服之崇丘至若根一氣以混成媲四時而首出作鎮東夏寔惟岱宗辨乎五方設位冠配天之大畫爲八卦建標當出震之區邃深連空洞之宫翕習號神靈之府夫其魁甲艮象握制坤軸嶾嶙碕礒穹崇岧嶢天門路界於欝蒼日觀勢臨於杲曜列仙遯迹存棲眞之石閭永命儲休閟與齡之金篋滋殖百卉函育庶類畜泄雷雨吐納風雲封之所以合元符登之所以小天下近綴梁社遠矚秦吴控壓海沂襟帶洙泗鄒人所仰魯邦是詹肇生物之化榷蓋頤貞之壽域也古先哲后誕膺駿命披皇圖稽帝文告成功申大報昭姓考瑞刻石紀號自無懷氏迄唐明皇登封展采布在方册者罔不于兹矣開元十三年始封神曰天齊王禮秩加三公一等綿歷五代寂寥無聞爰暨皇朝勃興嘉運叶百姓與能之望應眞人革命之秋太祖皇帝總擥英雄鞭撻宇宙勤勞四征削平多疊方混一於寰中太宗皇帝纂隆洪緒懋建皇極斟酌道德統和天人乃綏懷於海外然而艱難創業緼畜貽謀勒崇奮炎將底績而未暇開先遺大知弈世而有歸粤惟崇文廣武感天尊道應眞佑德欽明上聖仁孝皇帝陛下承鼎定之基格盂安之世顯仁以育物廣孝以奉先宣洽重熙財成庶政弭息戎旅撫柔要荒乘國步之密清宅天哀於醰粹因之以豐懋加之以阜康席慶宗廟之重游心帝王之術長轡遠御大道坦夷天衢於是乎嘉享德教於是乎漸被戴日戴斗聿遵朝聘之期太平太蒙盡入車書之域垂衣在上擊壤在下得以疇咨俊茂慱訪幽隱講求典禮包舉藝文接千歲之統可炳儀於封祀當萬物之盛宜昭告於神明然猶務謙尊而益光體健行而不息冲晦藏用淵默思道俄而天休震動上帝顧懷眞籙洊臻靈心有懌總集峻命覺悟丞黎踰金簡玉字之文等河圖洛書之寳承是秘檢發爲蕃釐霈澤開榮普天受賜新建元之號易通邑之名茂昭降祥聳動群聽是時東土耆老凑闕廷以上書南司宰輔率官師以抗表願循考古之道焕發升中之儀弗獲固辭乃徇勤請且以增覆載之高厚揚祖宗之純懿也儲峙供億悉出於縣官經啓營繕不煩於民力大中祥符元年冬十月具儀制嚴仗衛陳屬御隮介丘齋心服形奉符行事群司奔走百禮修明集巉巖之巔浚顥英之氣壇壝清肅牲器純備玉幣式叙樽彝在列奠獻克謹皦繹用張晏娭交三神之歡陟配崇二聖之位舉權火升高烟示瑶牘以環觀建雲臺而特起社首之禮抑又次焉咸秩無文奉行故事朝會赦宥涵濡盪滌采輿誦求民瘼旌前列衍徽章叄用王制著明皇績大猷克集神實幽賛故自始及末見象日昭史氏之筆殆不停綴則有非烟紛郁太陽晏温仙芝無根菌蠢以含秀醴泉無源涌而善利靈輝休氣嘉穀奇木鱗介之宗長翔游之品類表異駢出曠代絶倫豈非受職修貢發祥介福之徵乎人謂是山崇冠群嶽功侔造化斯不誣矣國家稽虞書四廵之首原漢氏五祠之重述宣邦典申嚴祭法奉正直聦明之德罄精虔嘉栗之誠爲民祈福與國圴慶封巒之後復增懿號曰仁聖天齊王蓋以形容靈造舉褒崇之禮也名稱之義大矣哉化工生物之謂仁至神妙用之謂聖登隆顯赫亦云至矣復思嚴飭廟貌彰灼威靈責大匠之職議惟新之制於是命使屬役恊辰僝功庀卒徒給材用興雲鍤運風斤程土物以致期分國工而騁藝規畫盡妙樂勸忘勞踰年而成不愆于素棟宇加宏麗之狀像設貴端莊之容几所對越肅恭逾至四年春舉汾陰后土之祀成天地合答之禮憲章明備上下交感純嘏既錫大賫施及圓首方足式歌且舞猗歟間歲順動焜煌景鑠而皆擬聖明之述作從英茂以飛騰灼叙慶靈奉揚殊貺紀諸盛節悉以命篇布日星之華配雲雨之潤並刊鳳澡散跱龜趺播洋益之頌聲垂極蟠之能事而志求象罔順拜崆峒闢衆妙之門廣列眞之宇非止卜永年於郟鄏是將納雅俗於華胥者也又以太一五佐本乎天大寧五鎮本乎地其位參兩鴻名可齊特尊列嶽咸加帝號由是奉升泰山之神曰天齊仁聖帝乃命案馳道之東偏直宸居之巽位辟地經始别建五嶽帝宫以申崇尚之禮焉御製奉神述詔中書召侍從之臣諭以制作之本意觀夫聖文之梗槩以爲岱鎮之大輔于柔祗動植之所蕃息原源之所滋液至靈允宅陰隲攸司鍾戬穀而有徵繄黎元之是賴舊中具載前王式瞻著册封之典嚴祀祠之禮增奉邑之數申樵蘇之禁皆以仰不測之明威顯無方之妙迹也方今兵革偃戢華夷會同歲獲順成物無疪癘率由丕應冥助永圖固當稽彼前聞進其尊稱謂乎唐虞曰帝商周曰王夫啇周之王爵人臣而有素唐虞之帝奉神道而何疑况其容衛等威冠裳制度極徽數以宿備宜明艷以相符因而成之禮無違者願延景祐普及含生至乎聲動睿辭無私廣大坦然明白之理沛然利澤之德曲成司牧俾臻富壽有以見聖人之情矣遂誌勒石徧立於五嶽廟庭從近臣之議也是嵗冬並命使介分詣諸嶽定吉日飭有司皇帝被法服御朝元殿禮行樂作而臨遣之持節受册兖冕相繼次叙而出觀者如堵且嘆文物聲名之盛未嘗有也使者奉詔訖事率叶素期於穆宏觀超千古矣越明年詔五臣撰辭各建碑於嶽廟而臣浸漬皇澤涵泳清徽偶集鳧鴈之行遂塵龍鳳之署預承綸㫖强叩蕪音曷勝眷奬上以慶幸宣明盛禮叨奉册於秦城潤色貞珉玷彌文於魯嶽荷輝榮之稠疊愧才學之空虚燥吻濡毫謹爲銘曰節彼泰山蟠亘大東一氣凝神五嶽推雄勢並鳧繹秀出龜蒙崛起海表目爲天中高摩霄極俯瞰暘谷神策斯秘昌圖可卜物性鍾仁民居獲福魯邦是常盛德在木百靈淵府三宫洞天稷丘眞隱芝童列仙白鹿方駕飛龍命篇宅其勝境幾乎大年嶽長曰宗嵗交曰岱仰止巉岩奠兹持載壽域既優神聦有賫禱祀誕隆寅威如在千載興運八紘開基武功盪定文教緝熙封禪縟典祖宗制宜逮夫聖嗣方畢宏規惟帝奉符惟神佑德茂績其凝皇猷允塞嘉應沓臻鴻禎靡測芃芃豐衍元元滋息於赫靈廟控帶名區有詔改作俾受全模恊心董役豐資庀徒技嬋勿倍雷動星敷大厦咸新群改黎觀𥦖窱靚深峥嶸輪奂肅穆威容潔清几案飲脩允宜肸蠁攸賛功懋天作澤從雲游式諧民望昭報神休殊號斯薦前古匪儔庶安億兆豈止懷柔天帝之孫復升以帝出乎震宫臨乎日際事固莫京理亦潜契樹此翠碑騰芳百世金每嵗御署祝板命守臣侍祠元至元二十八年加上泰山天齊大生仁聖帝嵗一遣官祭嶽祠皇明洪武三年六月二十日皇帝制曰磅礡東海之西中國之東參穹靈秀生同天地形勢巍然古昔帝王登之觀蒼海察地利以安民主祝曰泰山於敬則致於禮則宜自唐始加神之封號歷代相因至今曩者元君失馭海内鼎沸生民塗炭予起布衣承上天后土之命百神陰佑削平暴亂正位稱職當奉天地享鬼神以依時統一人民法當式古今寰宇既清持脩祀儀因神有歷代之封號予起寒微詳之再三畏不敢效蓋神與穹同始靈鎮一方其來不知歲月幾何神之所以靈人莫能測其職受命於上天后土爲人君者何敢預焉懼不敢加號特以東嶽之神名其山依時祭神惟神鑒之嵗春秋二仲月泰安州記禮先丁祭一日御製岱山高文曰岱山高兮不知其幾千萬仞根盤齊魯兮亦不知其幾千百里影照東海兮巍然而柱天益於民庶兮興雲吐霧神龍出乎其間降祥則甘露垂於松栢佳歲則滂沱遍於厚坤冬則寒風時出巖壑雜然而有聲百川林藪森然而如雷坤之所載世之山首岱山北至如暘谷之東方或登峯頂時聞天聲萬籟岱山之高也哉柱天之勢其可云乎俄而風生萬壑雲起諸巒隱隱雷動百川倏忽電掣萬里長虹此岱山之神至也至則威靈百備神之造化如此少時風靜雲收電歛雷息又百川之清泰其岱山尤其高哉其蒼松也始天地而生倚丹崖而長松之所以長尋不比丹崖所以高萬仞向量盖由太古之嵗月以至于今蒼松掃丹崖而莓苔不秀册崖映蒼松而五色交輝猿啼雲𣗳之杪鶴並日觀之東鵰鶻盤旋乎深谷雖扶摇不可得而昇峯於戲登泰山而小天下越大海而眇江湖信哉洪武十年歲次丁巳八月丁未朔皇帝謹遣曹國公李文忠道士吴永輿鄧子方致祭于東嶽泰山之神曰朕荷上天后土之眷命蒙神之效靈以致平群雄息禍亂君主黔黎於華夏統控蠻夷於今十年中國康寧然於神之祀若以上古之君言之則君爲民而禱歲有春祈秋報之禮於斯之際有望於神而祭者有巡狩於所在而燎瘞者今予自建國以來十年于兹國爲新造民爲初安是不得親臨所在而祀神也特遣開國忠臣李文忠道士吴永輿鄧子方以代予行奉犠牲祝帛於祠下以報效靈自今以後歲以仲秋詣祠致祭惟神鑒之尚饗洪武十一年遣道士吴永輿官行甫告曰惟神靈峙方嶽鍾秀后祗主司生民厥功允大時維仲秋禮當報祀特命使者奉犠牲祝帛詣致祭伏惟鑒之尚饗洪武二十八年遣神樂觀道士樂本然國子監生王濟祭曰昔者元運將終英雄並起民患兵殃時予亦與群雄並驅輯兵保民上帝默相山川受命效靈所在必克轉戰五年餘方乃兵偃民息衆樂生生之計天下太平二十八年矣今洪武乙亥四月間廣西布政司報蠻夷酋長龍州趙宗壽奉議州黄世鐵不循治化負國殃民兵興之事本重既行不敢不告所以告者兵行十萬各離父母妻子途間饑飽勞逸山嵐瘴氣患者有之此兵行之難兵入其境良民受害且大軍所過荆棘不生民驚且疑未有不傷者也此其所以告也但欲瘴癘之方化煙嵐爲清涼之氣俾殄渠魁良民安業軍士速回各得完聚以養父母是其禱也然予未敢輕告上帝惟神鑒之爲予轉達謹告洪武三十年遣神樂觀道士朱鐸如監生高翥祭曰昔元末兵爭傷生者衆予荷皇天眷命嶽鎮海瀆山川效靈諸將用命偃兵息民今三十年矣兵燹之餘民方安定通來西南戍守諸將不能昭布仁威但知肥己虐人致令諸夷苗民困窘而奮怒攻屯戍致傷戍守善民者予非敢用兵由是不得已指揮諸將帥兵進討然山川險遠彼方草木茂盛煙嵐雲霧蓊鬱之氣吞吐呼吸則人多疾疫此行人衆各辭祖父母父母妻子涉險遠以靖邊夷以安中夏萬冀神靈轉達上帝賜清涼之氣以消煙嵐早定諸夷速歸營壘得奉祖父母父母眷屬團圓是其禱也今年九月二十六日兵行特遣人專香帛牲醴先詣神所謹告尚饗永樂五年遣道士復生監生張禮祭曰比者安南逆賊黎季釐及子孫黎蒼逞兇肆暴屢壞邊疆侵奪思明府禄州等處地方予加寬貸不肯興師問罪但遣使諭使還地黎賊巧詞支吾所還地多非其舊還地之後復據西平州又侵寧遠州逼脅命吏占管人民劫掠資財殺虜男女邊境之民受其殘酷安南之人並被其害誅求百端老幼不寧占城之地累年遭其劫掠予數遣人告諭冀其改過而賊稔惡日甚罔有悛心予爲天下主視民塗炭安忍不救乃命將出師聲罪致討志在弔民豈敢用兵實出於不得已賴皇天后土眷二嶽鎮海瀆效靈將士奮志賈勇悉掃蕩其孳黨撫安其良善尚念將士暴露于外離其父母妻子山川險阻道里迢遞今天氣炎熱恐嵐瘴欝蒸起居失調易於感疾予夙夜念此寢食不寧萬冀神靈鑒予誠悃聞於上帝賜以鴻庥潜消瘴癘俾降清涼使將士安寧百疾不作物遣人致香帛牲醴先詣神所祭告尚饗宣德十年嵗次乙卯五月壬申朔十五日丙戌皇帝謹遣泰安州知州胡宗敏祭告于東嶽泰山之神曰予嗣祖宗大位統理下民夙夜惓惓養民爲務上祈神靈陰隆助相俾雨暘時順灾沴不生百穀用成民用康濟國家清泰永賴神庥謹以香帛達予至誠惟神鑒袼尚饗正統元年歲次丙辰五月丁卯朔十五日辛巳皇帝謹遣吏科給事中車遜致祭于東嶽泰山之神曰越此東土泰嶽惟崇民物典安厥功允茂予嗣承大統謹用祭告惟神歆格永祐家邦尚饗正統三年遣泰安州知州胡宗敏告曰朕祗御下民永懷保恤百穀長育兹惟厥時顓冀明靈特隆敷祐無灾無沴時雨時暘作歲豐穰以穀黎庶尚饗正統九年遣翰林院侍續習嘉言告曰子奉天育民愧涼于德致兹久旱灾及群生夙夜省躬中心惓切神司方嶽憂憫諒同雨農以時冥任其責特兹致禱尚冀感通弘布甘霖用臻豐稔匪予之惠時乃神庥尚饗景泰三年遣太子太保兼都察院都御史王文奉香帛太牢祭曰兹者河流泛溢自濟寧州以南至于淮北民居農畆皆被墊溺所在救死不贍朕實傷切于懷夫朕敷政以惠民神岀泉以澤物皆上帝所命今泉流溢於淮泗灾害及於公私伊誰之責固朕不德所致神亦豈能獨辭必使泉出得宜民以爲利而不以爲患然後各得其職仰無所負而俯無所愧專戾感通以慰懸切謹告景泰六年遣刑部尚書薛希璉奉香帛牲醴告曰恭承天命重付眇躬民社所依灾祥攸繫志恒内省㺵每外乖或寒燠愆期或雨暘踰度田疇失利穀麥不登憂切民心妨及國計究推所目良由在兹然因咎致灾固朕躬罔避而轉殃爲福實神職當專天有咎無功過將惟一轉殃爲福功孰與均特致懇祈幸副懸望謹告成化六年遺掌太常寺事禮部尚書李希安告曰邇者山東地方爰自去秋訖于今夏天時久旱泉流乾涸夏麥無成秋田未種運河淺澁船運艱難中心皇皇深切朕念惟神奠鎮一方人所恃賴覩兹旱暵寧不惻然兹特遣官齎香帛以告于神冀體上帝好生之德默運化機弘施雨澤使田野霑足河道通行用紓朕慮大慰民望庶幾神之休聞永永無窮神其鑒之尚饗成化十三年遣山東布政使司左布政使陳儼告曰國家敬奉神眀聿嚴祠祀所期默運化機庇佑民庶乃近歲以來或天時不順地道欠寧或雷電失常雨暘爽候或妖孽間作疫癘交行遠近人民頻遭饑饉流離困苦痛何可言惻然於衷罔知攸措惟神奠鎮一方民所恃賴睹此灾沴能不究心是用特具香帛遣官祭未尚冀體上帝好生之德鑒子憂憫元元之意幹旋造化弘闡威靈捍患禦灾變禍爲福庶幾民生獲遂享報無窮惟神鑒之尚饗成化二十一年遣巡撫山東都察院左副都御史盛顒告曰惟神自開闢來作鎮東王興致雨雲歲育萬物靈明克昭蒸民攸賴是以歷代報祀之典有隆無替乃今嵗二三月間震動數次意者人事不脩不齊瀆神弗安弗寧守臣䟽達朕心憂惶祗備香帛命官徃祭望喬嶽以虔祈冀鑒臨而奠位助司元化誕福斯人夫古今瞻仰者在兹國家欽崇者在兹謹告弘治四年遣通政司左通政元守直祭曰伏自去嵗一冬無雪今春天時亢旱雨澤愆期田苗枯稿黎庶憂惶予甚競惕用是側身脩省虔致禱祈維神矜憫下民幹旋大造早霈甘澤潤滋禾稼弘濟民艱庶民有豐稔之休則神亦享無窮之報謹告弘治六年遺巡撫山東地方都察院左僉都御史王霽祭曰伏自去冬無雪今春少雨田禾未能播種黎庶實切憂惶子甚兢惕用是側身脩省虔致禱祈惟神矜憫下民幹旋大造早霈甘澤以滋禾稼以濟民艱庶民有豐稔之休則神亦享無窮之報謹告弘治七年遣内官監太監李興太子太保平江伯陳銳右副都御史劉大夏右僉都御史熊翀以香帛告曰比者黄河不循故道怏于張秋東注于海既壞民田又妨運道特遣内外文武大臣循行潰决之處督工脩築神其默相用成厥功使農不夾業國計不虧不勝惓惓願望之至謹告弘治己未年御製重脩東嶽廟碑朕聞自古天子報祀鬼神之禮載在典册自郊祀天地而下復有所謂名山大川之祭盖名山大川兩間物形之最鉅者形鉅則氣之所鍾亦鉅而神必依之於是有雨澤之潤有財貨之生有年穀水旱之祈禱焉以利生人此報祝之所由起也惟泰山在古兖州於方爲東故稱東嶽於時爲春春主生萬物之始群嶽之長又稱岱宗古者天子巡狩秩祭之所先而東方諸侯在其封内亦得以祭然其禮視三公盖以别於天地也降及後世乃崇以美號至於帝王則與天地無别矣我聖祖高皇帝有天下之初詔定祀典始復其號曰東嶽泰山之神禮嚴報祀著令至今大聖人超卓之見盖出尋常萬萬豈特朕所當恪守雖萬世子孫莫之能易也東嶽之廟今徧於天下其在泰山者爲專祀歷代所重故廟之規制甲於他方香火特盛我祖宗列聖自國初以來報祀惟謹廟宇亦屢加脩葺然歷歲既久風侵雨剥棟宇榱桷盖瓦級磚與夫丹雘藻繪之飾未免傾圮漫漶弘治己未冬朕承祖宗禮神之意遣御馬監太監苗逵徃脩祀事具以爲言即發内帑銀八千餘兩並在廟積貯香錢命逵會山東鎮廵等官葺之未幾西陲告警逵有督軍之行工不時就壬戌冬再以祀事徃乃與廵撫右副都御史徐源等議委右布政使俞俊專董其役而分廵副使王宗錫徃來恊同吏勤工善越明年夏乃就訖白三而殿下若廊廡若門垣等凡傾者以易圯者以完漫漶者以鮮以潔金碧輝映廟貌深嚴泰嶽明靈既尊且安自是而徃陰佑顯相我國家之㣧祚一方之生靈益有賴於無窮矣逵暨鎮廵等官咸奏是舉之盛宜有述以示後爰識巔末並繫之詩曰鴻蒙未判一氣渾然清升濁降始肇乾坤賦形之大惟山與川氣隨形鍾神乃在焉巍巍泰山高入雲烟群岳宗之靡或與肩自古天子秩祭孔虔禮視三公祀典攸傳降及唐宋縟禮相沿殊名美號益謹益專於惟我祖志復古先秩祀有詔功邁前編朕承先烈精誠彌堅祀事載脩廟貌增妍神心鑒悅降福綿延壽我胤祚光我化甄蕩蕩平平億萬斯年正德五年遣户部左侍郎喬宇告曰比者暵厲踰時雨澤少降水泉枯涸運道良艱意者政有乖違上干叶氣予心警惕内自省循爰飭有司各脩乃事粤惟齊魯之地泉源是鍾名山大川神所居守敬將香帛特遣廷臣仰冀明靈幹旋大化沛施甘澤濬發河流庶使國餉踈通田禾暢茂民生有賴邦本無疆謹告正德六年遣山東等處承宣布政使司右叅議徐永告曰去歲以來寧夏作孽命官致討逆黨就擒内變肅清中外底定非承洪佑曷克臻兹因循至今未申告謝屬者四方多事水旱相仍餓莩載塗人民困苦盗賊嘯聚剿捕未平循省咎由實深競惕伏望神慈昭鑒幽賛化機灾沴潜消休祥叶應佑我國家永庇生民謹告嘉靖十一年遣泰安州知州李旼祭曰惟神鍾靈孕秀鎮奠一方陰翊國家其來尚矣朕以寡昧恭承天命十有一年于兹敬事神祇罔敢少懈顧儲宫未立恒切于懷兹者特具牲帛醴齊遣官虔禱伏望茂著神功錫予元嗣則我國家綿慶禩于無窮而神亦享福于有永矣伏惟尚饗嘉靖十七年遣泰安州知州丁方祭曰比嵗嘗命官禱嗣于神昨丙申孟冬之吉仰荷天賜元儲亦神所賛佑者兹用致謝神其鑒歆而永惟默佑焉尚饗嘉靖二十二年歲次癸丑閏三月丁未朔越三十八日甲戌皇帝遣廵撫山東地方都察院右副都御史沈應龍致祭于東嶽泰山之神曰朕祗奉天命主宰萬民夙夜兢惕靡敢怠遑兹者淮徐守臣奏稱去夏以來黄河漲溢水患異常堤岸衝决民舍渰没運道淤塞百姓阻饑不能聊生朕聞之惻然惟神雄鎮一方永饗秩祀兹宜體上帝好生之德捍患禦灾俾濬築工成水循故道民安常業漕運踈通惟神之顯庥幣帛將誠神其鑒之謹告嘉靖三十三年歲次甲寅二月壬申朔十八日己丑皇帝遣巡撫山東地方都察院右副都御史沈應龍致祭于東嶽泰山之神曰比因河水漲溢糧道梗阻已經遣官祭告兹者明神顯應脩濬工成河通運達國計有禆特兹致謝惟神歆鑒謹告嘉靖三十三年歲次甲寅四月辛未朔十二日壬午皇帝遣廵撫山東地方都察院右副都御史沈應龍祭告于東嶽泰山之神曰朕奉天命子育萬民所冀歲稔時和灾害不作爾者各處地方水旱兵荒人民遭阨危亡載路灾變異常朕心憂惕惟神上奉帝命奠濟一方諒垂矜憫爰命潔士齎捧香帛特遣撫臣備儀竭虔詣祠致祭所冀明神大彰靈應潜幹化機俾氣序順調雨暘時若弭解灾刦溥資豐泰庶同朕奉天子民之意而神亦享惠于無窮矣謹告隆慶三年皇帝遣巡撫山東都察院右副都御史姜廷頤告嶽文曰邇者水灾異常殃及黎庶良軫朕懷兹特遣官祭告惟神鑒祐永福邦民謹告萬曆元年皇帝遣祭于東嶽泰山之神曰惟神毓秀鍾靈永表東土奠安民物萬世允賴兹予嗣承大統謹用祭告神其歆鑒佑我國家尚饗歷代群臣祀祝魏高允祭岱嶽文正址坤元作鎮東夏齊二儀以永固崇至德以配天故能資元氣以造物恊陰陽而變化若其嵓嶺峭峙川谷幽深神怪譎詭焂忽百靈吐納風雲育成萬品攝生之所歸焉禎祥之所萃焉是以歷代帝王之崇封禪銘功以告其成七十二君咸在兹焉自非功侔造化應同自然孰能若此者哉自我國家肅恭禋祀懷柔百神邦域之内罔不咸秩徃以天路未夷雖望祭有在今大化既同奄有準岱謹薦于嶽宗之靈民饗皇興二年宋歐陽脩祭東嶽文脩比者獲解郡章許還里閈方中車而即路屬暑雨之時行輙以愚誠仰干大造蒙神之惠賜以不違吹清颷而散陰泰秋陽以涸轍遂無道路之阻得返草茅之居荷德之深不知爲報一觴之潔謹用薦哀濟南守曾鞏告岱嶽文云嵗之旱有請于神蒙昇嘉澤田則大稔今春河役發民二萬更迭齎送衆又倍之蓋此齊人出者幾半迨其反室維夏之初勞費既深又違穡事夫民數歲乃遇一稔敝之如此今二麥方苞而亢陽爲雪吏任其咎所不敢迯惟民何辜賴神終惠能致雲雨則實在神尚其念之敢告惟神含德體仁鎮兹東夏興雲致雨澤施八紘今此齊邦近在山趾方夏久旱麥苗將萎吏思其繇奔走群望而人微言賤不能上動頻陰復散忽已兼旬念此疲民弊於征歛方嵗之富食常不足一遇灾害必捐溝壑惟神戚烈覆被群生顧此此州宜先蒙賜豈伊靈眷獨忍遺之是用飭遣士民布誠福下情窮詞急冀獲哀矜使一雨霈然則倒懸可觧尚其降鑒無作神羞維泰山歷古至今有天下者巡狩封禪勒成告代莫不之焉或企足動容卒莫能至實卓偉殊尤神明之地故天下宗焉二典所記其光靈威烈焯示萬世夫豈他山可得而視維齊魯獲仰而事粒食縷衣莫匪陰施今邦不雨自四月以迄于兹積水之澤塵起冥冥粟將稿死蝗亦滋生雖政或不良足以致此而百姓何罪宜蒙哀矜彼撮土之山勺水之川尚能與民爲福錫之有年豈如泰山朝出一雲暮澤天下其勢之易易於轉圜而比近記麗顧不能憐殆莫之或告告或不虔夫民之生蓋亦艱矣無儲與藏重歛煩使嵗一不登多濱於死姦强無知或起乘時聚爲盜攘以取誅夷循理安業田間之民亦與俱亡奚可不傷鞏受命天子守藩于東敢齊以嚴告于靈宫惟神閔人之病助歲之功霈然下雨變沴爲豐尚俾斯民以牛羊黍稷得承事于無窮右三首俱祈雨臣愚行爲時之所背言爲時之所輕寡儔少和𦕈𦕈煢煢奇於人而如此敢望信於冥冥屬東轅而進謁託斯文而薦誠眷齊魯之舊邦依大鎮之峥嶸若旱魃之方驕憂歲事之不登民且佅於溝壑或椎埋而死兵冀聰明之饗答霈膏雨之霄零言丁寧以上訴心撇恍而潜驚顧不能以諧世將何以動夫威靈乃不知夫神與道而爲徒雖窅默而難明其虚心也物有來而必應其公聽也無憎愛之常情彼大雖自大小雖謂小吾與善而已矣常一視而持平故微衷得以上徹利澤爲之旁行或噫爲風或震爲雨隱然雷出靄然雲蒸灑甘霔以兼夕滅灾氣於無形蓋西極于甸服東屬乎滄溟人盈其望物遂其生黍芃芃而擢秀粟薿薿而敷榮使時沴遂熄年功可成人食豐乎鍾鬴神祀衍乎粢盛民相安於田里吏無用於威刑信大恩之莫報而至德之難名愚所以意激而感深者方涉世之零丁荷降鑒之不昧知忠信之可憑敢因辭以進謝愧抽思之匪精右謝雨國朝都御史陳鳳梧告嶽文海内名山惟五嶽爲尊而神奠位東方生長萬物於五嶽之中又特尊焉自唐以至于聖朝歷代崇祀威靈烜赫蓋以一方之安危休戚神有以主之也辛巳之秋鳳梧備員東藩嘗謁告祠下預祈有年既而叨蒙聖恩簡任廵撫夙夜弗遑惟綏懷是事壬午之春以徂于秋雨暘時若感神之惠於是乎有孚矣是秋先且冬礦寇突起于龜蒙之間荼毒赤子追捕出境餘醜渡河而南益肆跳梁頃者賴神之佑會兵剿平中原之地獲寧謐焉惟是齊魯之域深谷茂林姦慝潜伏其患靡常伏仗神威鋤兇化暴使濟河海岱寇盗不興水旱不作熙熙然物阜民康斯鳳梧之責可少逭焉而崇報之典其曷敢有忘謹以牲醴特伸祭告惟神其鑒之謹告嘉靖二年泰安守許應元告嶽文元聞之含澤布氣膚寸而合不崇朝而雨天下惟泰山之神爲然元以迂菲出守兹土始入境問民之所欲曰嵗荐旱甿莩而逋且半誠得雨殆其有蘇惟時元神志不一衣裳不潔不敢以徼於明神屏息而待命者旬再矣嘉穀未播麥苗且稿而沛澤靳於先施是神之雪罰兹土者無已也罷憊之民不任敬毒即守土者無狀宜降厥殃咎彼蠢蠢者誠可哀憐敢率僚吏竭誠以禱於明神惟明神卒降之惠俾無稿於道路報神之德曷其有極尚饗嘉靖十二年左布政使楊維聰告嶽文夫天下之山莫尊於嶽然五嶽之中獨岱以宗稱其名最著滃然出雲膚寸而合不崇朝而雨天下其功最大居於東方實維生物之府其德最盛寰海之内無有遠近衝僻罔不鄉徃其神最靈是故自古聖帝明王必加敬焉而况爲有司者乎維聰受天子命長兹東土典領方嶽蒞任之初得以職事過于祠下牲醴之薦敢有弗虔重念維聰之不德受兹重任凡政之未平民之未乂風雨之未時蝗厲之或作皆有司之罪也維聰不敢辭其罪然於神有深望焉默而相之神之惠也民之福也非維聰之所敢私也謹告嘉靖十五年分廵濟南道僉事盧問之祭嶽文夫惟神有奠鎮區域之功惟問之有撫治地方之責事存分際理通感孚頃以按部之餘遂興憫農之念意以晘旱之灾吾褻天慢民者之過也用是省躬布戒率守吏大小虔告重荷洪庥遄賜昭格而山上之雲觸石而起膚寸而合不崇朝而雨待哺之民有望而催租之吏不憂矣其功之速之大實顯佑于東土問之臨風興懷殊切瞻望謹命有司崇脩樽豆仰答神功尚饗嘉靖十六年都御史端廷赦告嶽文茫茫后土五嶽盤薄神爲之宗威靈鑠鑠上扶乾綱風雨時若下握坤軸是耕是穫恢我皇度靈長有託庇我蒸人湛淵寥廓凡此神功振古如昨廷赦奉命撫兹禮當謁神謁神之初敢于神政匪誕匪私爲民請命夏澇爲灾冬旱復甚陽侵陰伏寔行春令二麥若稿斯民之病惟神依民惟民依食胡忍視民以至此極將神之怒撫臣之失罪在撫臣民則何慝伏望陰翊化工昭錫靈貺興雲降雪慰兹渴望如有佚罰撫臣甘之毋使御民横適維之式號以呼神其聽之尚饗嘉靖二十三年二月謝嶽文廷赦撫按無狀獲戾神明致兹冬旱用是皇皇靡寧匍匐祠下爲民請命蒙神降鑒旋收杲日大布重雲霰雪先集霹霂繼益霑足優渥其應如響吏民罔知咸歸於廷赦自分罪愆顧有何德可以動神何誠可以感神寔神正直仁慈不忍以廷赦之故累及元元顯貺休烈禮當報謝廷赦既荷神宥自今伊始益當磨光刮垢力詢民瘼以求不爲神羞惟神佑之鑒之尚饗嘉靖二十三年十二月廵按山東監察御史鄭芸告嶽文惟神苹造化之靈秀顯仁威以配天峻德獨宗於諸岳巍功茂對於八𤥻崇古今之封秩爲齊魯之具瞻五徵時應六府奠安芸欽承上命攬轡兹方風裁是秉惟神之綱春生秩殺慝激淑揚爰及藩臬降鑒有光精神默契敢不肅將祇陳牢醴維脩典常明禋載獻維神是匡利奏功憲度孔昌下土永賴赫奕用章尚饗嘉靖二十三年巡撫都御史王忬告嶽文蓋聞懿垂編録休翊明時以雄長乎五嶽者神之大造也觸石而出寸而合不崇朝而雨天下者神之能事也王於奔走天下積致賄施以利賴此一省者又神之顓惠也則夫雨暘時若固神之當先及而亦一方之所私望者矣乃不雨自春迨將中夏達乎四境且害三時麥已罔秋禾豈望歲夜倬雲漢晝苦風霾下民其咨上天有憾神之所以急此一方者不其爽歟且忬受命撫兹圖惟保釐彈厥心力而已雲行雨施寔仰明神焉勢分固爾也抑忬及庶司或陰蓄辠有乖感假則神宜罰及厥身顧斯民何辜代服政者罹此荼毒耶謹齋明思省遣教授胡大慶告此雩事神其欻崇朝之靈渥千里之利則豈惟忬與一方之人慰答其望雖神之取信天下輝英今古或亦攸係矣惟神其聽之哉尚饗嘉靖三十一年五月廵撫都御史沈應龍告嶽文夫嶽之靈豈直以崖奔嶺蹙谷抱谿廻崛起重險爲一方鎮哉蓋將賴以橐籥玄機皷盪元精禦灾捍患流福生民保衛邦家也矧夫岱靈甲群峯而特峙尸攝生之神工肟蠁芬芳獨盛千古奔走萬方爲天下諸嶽之長者歟乃者春則恒陽二麥罔秋夏則恒雨民鮮粒食所謂國泰呈瑞時訛反珍者胡罔時錫豈天灾流行雖聖世有所不免耶應龍承乏撫綏保釐東土山川之神寔叨主之乃歷巉巖排蒙葺升青丘陟春阯以脩祀事以祝景貺以佑斯民以祈不負於聖天子懷柔百神肅恭明禋之典匪以好古饕奇俯瞰虚廓仰眺寥泬爲遊觀樂也維嶽配天尚弼予志遹彰休佑大康是邦奠聖祚于苞桑鞏皇圖于永固則庶乎岱宗之標奇於齊魯者爲益信而崇祀於列聖者斯不誣也惟神其念之哉嘉清三十一年十月再祈雨文天地生萬物所以奉而行之者神之職也聖天子養萬民所以奉而行之者應龍等之職也今山東諸郡旱已大甚麥苗就稿萬姓皇皇饑莩之形漸多潢池之警曰報此應龍等白夜憂惶計不知其所出也應龍等寡昧保釐失職貽民荼毒罪固難辭惟神聰明正直能興雲雨亦可失職而甘受天地之罰乎應龍欽承上命敬共明祀特申祗告敢爲萬民乞命伏願鑒此精誠幹旋造化甘霖沛澍四墅沾足枯稿復蘇三農慰望尚期消患於將萌轉禍而爲福應龍等仰荷明神無窮之錫而神亦有無窮之休神其聽之尚饗嘉靖三十二年閏三月廵按山東監察御史馮薦告嶽文東土鹻塉地方遠不逮古賦役繁重即有年民亦流移徃遭水害窮困不能自存老稚在途强壯嘯聚疾苦之狀不忍聞見聖天子痛憫時艱簡重臣出廪賑饑而垂絶之生意復蘇然猶望今歲有秋也爾麥亢旱農事盡廢公私既竭將曷以支惟神震方名嶽能興雲雨以生萬物古今祀典攸崇也夫民有疾苦官兹土者分宜罷斥竊恐神兹土者心亦弗能自安神宜仰體聖君之仁俯從薦等之願誕敷靈液以紓吾民之疾苦神之德惠將流被無窮矣謹告嘉靖三十二年閏三月廵按山東監察御史雍焯告嶽文謹以牲醴敢昭告于東嶽泰山之神曰於赫岱宗秩祀有恒神功丕施毓物效靈奠此震極翊此坤寧歷代禋薦酬德報成迄我皇朝典祀維明焯等叨事兹土肅將明馨仰藉神既昭格用徵鞏我鴻圖永躋豐昇尚饗嘉靖三十三年十月三十日廵按山東監察御史段顧言行偕布政司左叅議徐文通按察司副使王世貞李嵩僉事玉遴張師价暨都司署都指揮僉事李春華告嶽文竊聞天地之大德曰生而生生不息之元氣盛德鍾焉凝焉是曰泰山夫泰太和也謂天地太和之氣盡比焉在也衍之而時則惟春而神寔尸之布之而方則惟東而神寔專之大哉乾元至哉坤元胥兹乎生成而終始之是所謂天地好生之府而特爲四嶽之宗乃若壁峙之峻極盤薄之閎遠又非所論也以故粤自有虞氏以迄昭代咸秩祀而崇報之也固宜予小子言按部齊魯責在肅清而激慝鋤凶若與大神之生道相似者然我心我精我儀我誠神將吐之乎嗟乎吾知其必弗爾矣吾聞春生秋殺玄化之流也福善禍淫明神之靈也遏惡著良大君憲天之政也矧以生道殺之而生生者斯無窮以福機禍之而福福者斯無窮乎繄乃知大君顯憲幽賛以成化而予小子觀風攬轡又將以奉君之命而致之元元者也果終異乎於戲神不享非禮之祀君子不冥祀于不享之神大神其以予之言爲不戾耶尚祈鑒我精誠我假我歆而毋予譴也謹告嘉靖戊午夏五月二十七日廵撫都御史張鑑祭嶽文曰粤稽山東之地青兖肇域齊魯舊疆聖賢王霸之化禮義富强之方逮皇明之御宇爲畿腋之左壤東表溟海西略河防赫赫明神實主震方鑑奉明命來撫是邦則巡撫之與威靈乃均夫秉幽明之章念言東土憂心倀倀薦臻饑饉官方不良煩苛盜疾昏墊流亡户籍耗减阡陌蕪荒以今日之所目擊較之古昔之盛惄焉其如傷履任以來夙夜惕惶仰承神祐時雨時暘百穀用登盈畆穰穰匪直彼不歛穧而此遺穗實貧有餘而富露藏是神錫吾民之福即所以貺有位之康彼存者既享有年之樂而去者豈無故土之望桑梓在念逋負難償思者不來來者不臧招撫墾開孰敢怠遑因則户而平其稅分地而清其糧上則請命於天子天子即賜俞允下則責成於有司有司有欺心玩法削民自殖者典刑有赫實足自戕苟非明神屢錫以豐年煦育以和氣則民將迫於貧困疾疫何能永樂利於故鄉經綸潤澤既明且詳陰隲默祐惟神煌煌鑑盖求上不負聖天子牧養小民之意下不負生平奉公憂國之志候閭閻郊野盡復古昔之盛亦爲東方明神之光用是敬陳牲品侑以玄黄既齋既潔肅恭對颺爲已徃有年之謝致將來時若之禳報懇之忱非言所將福善祐正惟神之祥鑒微衷之懇懇知來格之洋洋尚饗嘉靖四十年廵撫都御史傅希摯祭嶽文曰兹者漕河横溢運道阻艱特命大臣總司開濬惟神雄鎮一方捍除百患凢川流之壑注或山下之出源式用遣官備申祭告顓望鑒兹重計舒予至懷急靖洪瀾佑成羣役俾運儲以通濟永康阜于無疆謹告隆慶六年廵撫都御史陸𣗳德告嶽文曰惟神宗統羣岳體元發生普天率土孰不景承况此幅員之内即所敷氣而布精一作一息是怙是憑廼者恒暘不雨嗷嗷群情撫臣憂之亟禱於庭亦嘗檄下諸司共敦祈請雨遲遲而不至天杳杳而難明豈政之多舛抑禱之鮮誠方擬遣官敷告祠下草既就而雲合使未發而雨零惟神惠民如響應聲撫臣何幸竊有餘榮謹潔牲醴遣官陳詞仰荅寵靈尤冀德施不匱湛澤時行自河之壖迄於東溟靡取弗遍靡霑弗盈用俾苞者畢達亢者胥耕消其咨於不作調戚事於豐登尚饗萬曆十一年巡撫都御史李輔告嶽文曰維神作鎮東方覆冒下土凢國賦之登耗實紀綱其司生靈之休戚實宰制其柄威靈焜燿古今福澤奠安境宇久矣山東頃嵗以來陰陽舛繆灾歉頻仍乃者冬不雪寒春鮮雨澤時既入夏竟日長風致令麥方苞而就枯穀及時而不播農民倉皇於四野吏士驚怖於庶司雖祈禱連旬而密雲不雨切念山東之民困於涸轍矣而嵗再不稔將何聊生山東之賦繁於秋荼矣而室如懸罄將何輸納即職守官之無狀嗟此下民其何辜仰惟尊神靈爽咫尺鑒察絲毫若罪有所歸則職受幽冥之譴如適遭時厄敢祈矜憫之恩尚縱陰而閉陽隨興雲而布雨庶生我百穀汙畲穰穰滿車惠此群黎婦女嘻嘻卒嵗不然感而不應則神何以稱威靈求而不獲則民何以誦福澤哉職不任謁誠祈懇之至謹告萬曆十三年知府李伯春代告告畢而雨至廵撫都御史李輔祭嶽文曰今嵗自春徂夏四月不雨内自皇畿達于淮甸焦枯奚啻千里兹東土寔惟左輔民生益否前雖霑此霡霂曾入土之無幾乃今苗不秀而秀不實旋復稿矣下民汹汹哀籲上帝無間遠邇天子憂勞减膳徹樂下詔罪己馳道不除朝步自宫迄于郊畤桑林露禱爲民請命罔恤勞只輔兹東土奉職無狀臯何容諉念此無知顛隮溝壑寔愴惻而不能已矧主憂臣辱即匍匐席藁曷敢一息而自寧止惟神奠位維泰職司生物胡忍坐視斯人之日就填委輔謹率屬吏布其欵悃以告于神願神明罰予吏之無民而無遺禍於嵗出其膚寸不崇朝而雨天下以畀我稷黍而慰我天子夙夜憂勞之意則此孑遺猶能供粢盛而備肥腯以奉神之祀於不匱惟神鑒予之丹誠而示予以肸蠁輔不勝悚息聽命之至尚饗萬曆乙酉年四月二十五日廵撫都御史李輔告嶽文曰自春徂夏長風爲虐旱氣如焚夏麥垂枯秋禾未播輔受明命撫輯東方俯念民艱憂心孔疚先曾齋心備物赴訴於神伏蒙明神鑒其悃誠惠以靈澤致禱者再獲雨者三枯麥半收新谷漸達念念應如桴鼓益瞻靈爽之不違點點潤若膏酥共載慈恩之無量但雨澤應時雖慰三農之望而霑足未徧尚懸再旱之憂且内自京畿外達諸省猶聞歷三時不霑點雨數千里並無粒食以致主上焦勞群工警惕上關宗社下係生靈奚獨鄙念之所悚惶抑亦神哀之所憫惻是用不厭煩瀆再行頂禮賽隆施於既徃徼明貺於將來伏望大展神功溥垂陰隲甘霖不限於疆域在在滂沱洪仁普被於寰區人人歡洽蕩除旱魃之薰灼挽面樂歲之謳歌輔不勝感激祈懇叩心待命之至尚饗萬曆丙戌年同知趙承芳代告告畢而雨至廵撫都御史李戴告嶽文曰惟神海内名山五嶽稱雄五嶽之尊獨歸岱宗正趾坤元奠位維東顯配天之靈應茂長育之洪功矧兹齊魯宜荷帡幪戴欽承上命來撫東方初入其境旱魃爲傷目兹憔悴心甚憂惶躬詣神祠爲民祈祥幸賜昭鑒示我洋洋告詞甫畢靈雨即零翼日旋車雨降雲蒸大霈甘霖弘闡神靈三農慰望萬物遂生神功莫報峻德難名遣官代祀敬潔犠牲修兹報賽用展微誠伏願風雨時若灾沴不形永祜民庶慶歌豐亨戴不勝忻躍懇祈之至謹告萬曆十四年五月五日廵撫都御史李戴告嶽文曰惟神化馳九域位冠百靈裕民足國有赫帝庭矧兹東土香火維馨家尸户祝是依是屏胡天不吊降此大戾三春不雨麥乃盡悴九夏不雨禾且無穗國用民生于焉胥匱聖主求瘼有位忘飱道路流離黎庶彫殘英爽有知而寧忍看慈悲普濟具仰彤壇戴救荒無奇懷憂如禱夙夜齋沐爲民祈禱神之聽之庶幾懷保蚤霈甘霖回此枯槁謹告萬曆十四年六月二十日山東運司同知查志隆撰岱史告文曰志隆蚤歲家塾誦法孔孟則聞登泰山而小天下云盖未嘗不奮心翹首冀幸一踐跡之爲快也徃在壬申假道登覽時忤權貴圖且謁歸謂與山靈永别已矣安得如程伯子請註鄠簿撰録名勝哉不自意間隔一紀復出而典職則在山靈咫尺之地會部使者嶺南譚侍史觀風陟嶽詢訪圖經屬志隆以筆劄之役所幸時清吏隱竟日一無事事得以遊思於林豈山靈有意乎假此閒曠俾償始願耶竊謂藉手於此少效涓矣即叨升斗倘逭尸素是用屈首編摩罔間寒暑曉窗夜燭集古覈今殆四閱月業已屬草爲考者三曰圖考曰星野考曰形勝考爲表者二曰山水表曰疆域表爲紀者四曰狩典紀曰望典紀曰遺蹟紀曰靈宇紀爲志者五曰宫室志曰物産志曰香稅志曰灾祥志曰登覽志而捴揭之以名曰岱史謂夫岱宗之稱昉自黄帝今宜從其古初而譔著之法獨擅史家兹稍襲其義例也第念管窺蠡測則心思未融徑逖崖幽則涉歷未遍碑殘簡脫則目力未周於兹有深懼焉吉蠲祠下敬藉所草質諸神明行且涉阻躋巔遍觀周覽豈敢妄希先賢之勝事開衡嶺之烟雲尚冀神明降鑒而默佑之雲披日霽畢露奇觀對景揮毫恍然天啓庶幾幽不負山靈明不負付托而於己亦不負據梧横卷之辛勤則惟神眀陰相是賴也敢告萬曆十四年十月十四日告畢登覽岱巔晴霽凡三日遂得以遍歷諸形勝果符所祝云岱史第三冊鬼字號目録八三卷之八遺蹟紀五侯遺蹟玉簡石閭登封臺周明堂漢明堂章俊卿明堂論無字碑秦篆碑歐陽修集古録劉跋秦篆譜序磨崖碑長城鉅防鳳凰臺望仙臺舞鶴臺張說序頌社首壇封祀壇朝覲壇陰字碑御帳坪博城嬴城謝過城龜陰田汶陽田菟裘紅城白騾墓聖賢遺蹟孔子顔淵曾子孟子伯牙延陵季子柳下惠墓羊祜城孫復胡瑗許衡列仙遺蹟漢泰山老父稷丘君安期生崔文子晋張忠唐吕嵓張仙元丘長春張志純徐世隆成興公王從之海印卷之九靈宇紀東嶽廟宋宇文粹中重脩記明李賢重修記薛瑄重修記李欽重修記許天贈重修記李欽脩古井記東嶽上廟陳儒記東嶽中廟元至元榜文玉帝觀萬恭表岱巔碑玉皇廟陳察記瀋王記會眞宫任式記后土殿青帝觀宋加號讃御讃御祝文明弘治御祝文碧霞宫明弘治御祝文高誨玉女考略嘉靖御祝文尹龍記略劉定之記略徐溥記略崔文奎記略郭記銅皷記略方遠宜祝文王之綱玉女傳何起鳴宣諭李輔祈雨告文天僊行宫升元觀宋勅碑徐世隆記天書觀長春觀元和記畧龍泉觀風伯雨師廟高眞院三官廟酆都廟李欽記森羅殿徐世隆記畧趙相公廟三靈侯廟靈派侯廟王眞記畧關王廟淵濟公廟趙合記王天挺記李簡謝雨文路希尹感澤記夏靖記
