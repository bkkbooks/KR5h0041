front:
  text: 岱史第三卷形勝考叙曰曷考乎形勝也考古今之誦說乎泰山者也夫自有天地以來形勝無如泰山故自有書契以來誦說形勝者亦無如泰山乃其始經見則虞典岱宗兩言有夫虞典凡嶽皆以方位言惟泰山不言方位而言岱不言嶽而言宗固謂夫出震配乾萬物始代儲坤蟠亘五嶽推宗其形勝甲於普天之下無兩也嗣是而詩稱魯詹禮稱兖鎮爾雅稱東嶽則槩其一方所推重而極言耳他若子史百家佛經道録奕奕相屬炫句玄詞所謂天孫神房洞天福地與夫金床玉几之說最不可窮詰然古人於搜神紀異稗官野史亦所不廢也世即有善言形勝者或未能越此故舉凢見聞所及併編録之以備叅考廼其寒暑之候逈異於下方里至之遥艱難於躋陟俱世所欲聞者宜不厭於鎻贅云舜典曰岱宗按五經通義云岱宗言王者
