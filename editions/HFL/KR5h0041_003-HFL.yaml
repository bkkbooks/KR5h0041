body:
  text: 易姓受命報功告成必於岱宗也東方萬物始交代之處宗長也言爲群嶽之長禹貢曰海岱維青州又曰海岱及淮惟徐州按書註云青州之域東北至海西南距岱又云岱之陽濟東爲徐岱之北濟東爲青魯頌曰泰山巖巖魯邦所詹按說苑云山者宣也言宣氣生萬物也泰言高大之至也爾雅云右陵泰丘或云泰者太也謂天地太和之氣發舒於東方也周禮職方曰河東曰兌州其鎮曰岱山按鎮言其重也爾雅曰河東岱又曰泰山爲東嶽又曰中有岱嶽與其五谷魚鹽生焉按詩註云嶽言山之尊也東方主天地生氣以方位别五嶽是爲天之東柱公羊傳曰觸石而出膚寸而合不崇朝而雨天下者惟泰山耳漢官儀曰盤道屈曲而上凢五十餘盤經小天門大天門仰視天門如從穴中視天窗矣自下至古封禪處凢四十里山頂西巖爲仙人石問東巖爲介丘東南巖名日觀日觀者雞一鳴時見日始欲出長三丈所又東南名秦觀秦觀者望見長安吴觀者望見會稽周觀者望見齊黄河去泰山二百餘里於祠所瞻黄河如帶若在山阯山南有廟悉種栢千株大者十五六圍相傳云漢武所種小天門有秦時五大夫松見在後漢書曰光武封泰山雲氣成宫闕道藏書曰泰山周廻一百六十里畸五十步方面各四十里郭璞書曰泰山在奉高縣西北從山下至頂四十八里一百步山海經曰泰山環水出焉東流注於海法苑珠林曰泰山之東有醴泉焉其形如井本體皆石欲取飲者皆洗心跪而挹之則泉出如流若或污慢則泉縮焉盖有神明以宰之也曾鞏二堂記曰泰山之北水與齊之東南諸水西北滙於黑水之灣又西北滙於栢崖蘇東坡送楊傑詩序曰無爲子嘗奉使登泰山絶頂雞一鳴見日出魏莊渠書曰泰山之上有日觀峰者夜半可以眺而見浴日彌望如鋪金者海也緑色微茫中有若掣電者海島溪山相間也金色漸淡日輸浮動水中如大玉盤適海濱望而見海日是矣登天台之巔曰華頂者乃知此特小海耳諸山環列外乃爲大海泰山有日觀者觀日於未出也有月觀者觀月於已没也長安觀者西望秦間諸山也越觀也者南望會稽諸山也衡山有七十二峰亦有日觀月觀不及泰山者當卯位也岱宗記曰梁父長白二山爲泰山輔嶽通志曰濟南諸山其非麓也兖州諸山其南麓也青齊海上諸山其左翼也河東諸山其右翼也斯其爲泰山矣乎廼若山南則有漢武遺栢天門則有五大夫松絶頂則有秦無字碑懸崖則有唐開元銘斯則泰山古蹟之最優者茅君傳曰仙家凡三十六洞天泰山周廻三十餘里名三宫空洞之天愽聞録曰泰山名蓬玄太空洞天嶽帝所居其高四千丈環一千里五嶽記曰東嶽泰山嶽神天齊王領仙官仙女九萬人山周廻二千里在兖州奉符縣福地記曰泰山洞天周廻三千里鬼神之府列仙傳曰岱宗石室中上下懸絶其中金床玉几尸子曰泰山之中有神房阿閣愽物志曰泰山一曰天孫言爲天帝之孫也主召人魂魄東方萬物始成知人生命之長短道經曰五嶽之神分掌世界人物各有攸屬岱泰山乃天帝之孫群靈之府主世界人民官職生死貴賤等事堪輿家曰泰山之麓水交流孔林獨茂盖指泮渿梳洗汶漸而言吾夫子之生也豈偶然哉是故其終也曳杖之歌泰山自任公姓振振世禄罔替則嶽靈之篤於孔氏者其有窮乎勝覽曰嘗臘月衝雪登嶽至御帳雲烟糢糊至十八盤天宇開霽俯矚山腰猶有雲靄及下山大雪如故冬春之交諸崖谷出烟霧寒甚初尚可指數頃則靉靆蒙覆盡失山形少霽溪壑林木及樓閣簷牙凝結氷花珠聯粉綴如畫嘗於春時晨觀山半雲布平密絢爛一色宛然倒看天宇四月以後山多蒸濕不可居五六月亦寒衣必綿卧必炕早暮如深秋遇夏時暴雨山半風激雲湧雷聲電光皆出其下隱約見麓地白波沆漭如海頃忽雲升嶽顛則上下皆雨人飲諸崖水多瀉惟瑶池白鶴水簾玉花玉女數泉甘美元君祠東崖一竅泉滴如珠晝夜出一斛許其味尤佳
