body:
  text: 泰山郡漢初屬濟奉高緜西漢兖州部北國武帝元狩元年濟北武帝元封元年至奉王奏獻高奉高縣東漢兖州部泰山郡光武二十二年至奉高章帝元和二年幸奉高𣈆兖州部泰山郡奉高緜南宋兖州部泰山郡奉高縣北魏兖州部泰山郡奉高縣魯郡岱山縣隋兖州部大業初改屬魯郡開皇六年改奉高曰岱山兖州魯郡乾封緜唐河南道武德貞觀制發東岳於兖高宗改岱山緜爲乾州封縣玄宗封泰山神爲天齊王兖州襲慶府奉符縣宋京東西路初祭東岳於兖州眞宗加眞宗祥符元年改乾號泰山大齊仁聖王又上封縣爲奉符縣號仁聖帝泰安州奉符縣金山東西路大定一一十三年陞泰安軍爲州泰安州奉符縣元山東東西路加上泰山天齊大生仁聖帝皇明山東布政濟南府泰安州使司洪武制和加泰山封號正省奉符縣並入州名稱東嶽之神岱史第二冊諸字號目録卷之六狩典紀附封禪唐虞夏后氏周秦始皇封禪刻石文李斯篆漢武帝封禪詔司馬遷封禪書略班固白虎通略光武却封禪詔封禪刻石文章帝安帝魏明帝隋文帝却封禪詔略唐太宗却封禪議高宗封禪玉牒文駱賓王爲齊州父老請陪封禪文玄宗封禪玉牒文御製序銘宋太宗不允封禪略眞宗封禪玉牒文孫奭諫䟽御製序銘皇明永樂却封禪略王直題却封禪頌附歷代儒臣封禪論漢司馬虎梁許懋宋胡致堂章俊卿馬端臨眀丘濬卷之七望典紀唐虞周附魯秦漢高祖武帝宣帝光武章帝魏文帝晋成帝梁後魏祭岱文唐武德貞觀開元加嶽王號並祭祝天寳貞元宋眞宗加泰山帝號碑銘晁逈撰金元皇明洪武告文嶽號制御製泰山文永樂告文宣德告文正統告文景泰告文成化告文弘治告文正德告文嘉靖告文隆慶告文萬曆告文附歷代諸臣祀祝魏高允宋歐陽脩曾鞏皇明臣陳鳳梧許應元楊維聰盧問之端廷赦鄭芸王忬沈應龍朱衡馮薦雍焯等叚顧言等張鑑傳希摯陸樹德李輔李戴查志隆以上序世次而不序爵皆書姓名仍前志垂欠遠也
  hash: sha256:e40965a45c417d90d0fe13a4bd8f1b5ccb44ddbe1cd81a28643855dcfa0492a0
