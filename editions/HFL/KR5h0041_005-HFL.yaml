front:
  text: 岱史第五卷疆域表叙曰表疆域者何表岱宗所隸疆域也隸於州邑而郡而部也夫岱宗秀挺一合靈應八埏涵育萬形儲峙千古豈一疆一域所得而囿乎然自古錫土姓以立國制地域以撫封必恃名山大川爲之界焉是故禹貢九州之域海岱維青周禮山鎮之崇兖州曰岱此疆域所由始矣秦漢而降建牧分州割裂土境廢置凢幾漢之奉高唐之乾封宋之奉符皆以邑名於岱阯者也皇明定鼎燕冀惟岱宗較諸嶽獨邇雄據東夏屏障皇畿若拱辰然而漕源國計亦維兹攸賴所謂奠安磐石之宗其在斯與岱阯不以邑而以州俾奉嵗祀而州以泰安名有以也夫兹備録古今沿革並其年數而爲之表如左方朝代部郡州縣唐虞青禹貢曰海岱惟夏啇青州周兖周禮兖州其鎖曰岱魯魯頌曰泰山巖巖戰國齊愽邑秦齊郡愽邑
  hash: sha256:7ef9d6f55e18489a525ac762e96fa25c123c9aa62678225bfb93d3ec847bbe65
