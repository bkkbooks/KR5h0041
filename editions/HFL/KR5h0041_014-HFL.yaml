front:
  text: 岱史第十四卷災祥志叙曰曷志乎災祥也謂泰山氣化攸先其災祥關係天下國家尤大也徃昔灾祥見於泰山者如大石立起而漢宣踐祚祥雲成闕而光武中興其祥之最著者乎𪃘鳥焚巢而飛燕滅漢雄雉犯蹕而武氏曷唐其災之最著者乎若論夫灾祥之實孰有如宋嘉祐間泰山上瑞麥圖五本我朝嘉靖間泰山瑞麥一本五穗則其祥可以養生他如御帳流洪死於溺者三百餘户碧霞宫啓閉死於踐蹋者頃刻六七十人則其災至於戕生是又不啻機授朕兆所號爲灾祥而已夫災祥示人豈不昭昭然祥以符德或以導侈災以告譴或以玉成天意詎有常哉惟履祥而益勉故享有佳禎遇災而知脩故妖不勝德斯義也豈特聖君賢相所宜講求即膺命擔一爵者罔不有挽回氣化之責毋以災祥爲漫然無足省云漢昭帝元鳳三年春正月泰山大石起立高
