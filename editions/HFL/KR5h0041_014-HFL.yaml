body:
  text: 丈五尺有白鳥數千集其旁僵柳復起生蟲食柳葉成紋曰公孫病已立符節令眭弘以爲石陰類下民象當有庶人爲天子者坐妖言伏誅其後宣帝起民間成帝河平元年泰山桑谷有𪃘焚其巢郡人孫通等聞山中群鳥𪃘鵲聲徃視見巢難盡墮地中有三𪃘鷇燒死𣗳大四圍巢去地五丈五尺易曰鳥焚其巢旅人先咲後號咷京房易傳曰人主暴虐鳥焚其巢其後趙飛燕姊妹專寵後宫有子者殺之並殺其母帝崩后坐誅此焚巢殺子後號咷之應也一曰王莽貪虐而任社稷之重卒成易姓之禍云光武皇帝建武元年泰山雲氣成宫闕章帝元和二年二月辛未幸泰山黄鵠三十經祠壇上東北過于齋宫翶翔升降𣈆武帝泰始四年七月泰山崩墜三里京房易傳曰自上下者爲崩泰山之石巔而下厥應聖人受命人君虜是後懷愍二帝俱辱虜庭淪胥於北元帝中興於南此其應也元帝太康二年六月泰山大水蕩析三百餘家溺死六千餘人時平吴後王濬爲元功而詆勑妄加荀賈爲無謀而並蒙重賞妝吴姬五千納之後宫此其應也成帝咸康八年趙石虎建武八年有石燃于泰山八日而滅宋孝武帝大明元年七月白雀見泰山東魏宣武帝景明三年八月辛巳泰山崩湧水十七處武定六年四月泰山甘露降後齊天統初泰山封禪壇玉璧自出夫岱山王者易姓告代之所玉璧所用之幣而自出將有異姓王者用幣之象其後齊亡地入于周及高祖受周禪天下一統焚柴泰山告祠之應也隋文帝開皇十四年將祀泰山令使者致神像于祠未至數里野火欻起燒像時帝信讒猜忌滕王瓉失志而死功臣多被夷滅其後太子勇被戮唐高宗永徽二年七月泰山大水十三年十月戊子雄雉馴飛泰山齋宫内夫封禪所以告成功祀事無重於此者而野鳥馴飛不忌禁衛不祥宋眞宗大中祥符元年五月泰山醴泉出丁丑王母池水變紅紫色按史乾封縣民王用田中有童兒掊土得青錢數十爭取之錢墜石罅因發石湧泉二十四眼味極甘美又枯石河有湧泉二十五眼一眼出層阜之上經宿勢浸盛引數派雙魚躍其中有果實流出似李差小味甚甘制置使王欽若貯水以獻六月庚戌賜百官詔建亭賜額曰靈液六月王欽若至乾封上言泰山醴泉出天書見有靈芝三萬八千二百五十本夫醴泉芝草固理之所有乃若天書之降吾誰欺欺天乎十二月泰山玉女白龍王母池醴泉出丁酉賜輔臣新醴泉六年十月泰山興工有鳥狀烏嘴趾皆赤役夫稍憩即飛鳴作起之聲衆工見其來畚鍤爭進將晡而去日以爲常目爲催工鳥仁宗嘉祐三年七月泰山上瑞麥圖凢五本元世宗至元九年九月泰山淫雨河水溢圮田廬害稼成宗元貞元年六月泰山大水武宗至大元年九月泰山大水仁宗延祐元年三月泰山霜雪三日文宗天曆元年泰山大水順帝元統元年泰山淫雨河水溢大饑至正六年春二月泰山奉符縣大饑地震七日他縣亦然皇明成化二十一年春二月三月泰山屢震遣官祭之正德十六年春三月岱廟東廊火嘉靖八年泰山蝗九年十年如之十六年六月泰山水漂溺數百人十一月州城火延燒數十家二十一年泰山蝗不爲灾二十二年泰山夏再稔麥粟有一本三穗至五穗者知州馬逄伯獻于朝二十九年十二月岱廟火天殿門廊俱焚古𣗳碑刻亦多毁者三十年六月泰山大水御帳衝壤人多溺死三十二年泰山大饑民相刧奪行旅不通三十三年春泰山大饑餓莩枕籍貧民多取其肉食之萬曆十四年十月十八日泰山碧霞宫四方來焚禱者互相踐蹋死六十一人今廵撫都御史李委濟南府通判桑東陽徃經理收葬
