front:
  text: 岱史第十卷靈宇紀
  hash: sha256:1d3dc4ba6f47f52505bcb97b450a76bed920c750b1a8e7bdba0221bf0afb775d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0041_HFL_010-001a, image: hfl/1094/1094-010.png}
body:
  text: 此卷特録吾夫子殿宇盖别於神佛寺觀也而魯兩先生祠附焉以存道脉云孔子至聖殿在嶽巓玉皇頂西稍下可半里許其地相傳爲越觀峰其下爲孔子崖意者韓詩外傳所云孔子登泰山望見吴閶門白馬以示顔子此豈即其地耶嘉靖間尚書朱衡謀拓基於此搆建祠宇以奉孔子迄遷任弗果萬曆十有一二年間先任濟南府郝推官大猷創議建正殿三間前爲門一間四圍垣墻俱全專爲崇奉孔子設也又以遷任未及安神奉祀以竟其事今鹽臺侍御譚檄脩岱史稽考勝蹟有司議請重修前項殿宇奉孔子神主配以顏曾思孟悉如學宫之制春秋行釋萊禮仍於殿之兩偏構道房居黄冠以供掃除云其時撫臺中丞李按臺侍御毛悉可其議行藩司覆覈脩舉由是孔子與群賢登臨遺蹟招揭於泰山相爲終始瞻仰者快焉廵按御史毛在委官安神祝文維年月日致祭於至聖先師孔子曰猗維聖師天縱其生貞元萃其氣光嶽儲其精然嶽莫崇於岱故其儲精也不偶而聖莫崇於聖師故其取精也獨宏麟紱尼山近接介丘而應瑞龍吟洙泗淵源泮水以蜚英嘗聞登泰山而小天下迄今貽芳躅而永鴻名令人想見其丰采罔不願聆其英聲恍若群諸弟子凌陟千仞之上手提魁斗揭日月而開群盲又若鼓丘陵之歌盪激天籟鍠鍠然與松風笙鶴而齊鳴又若裁帝王之六籍卷舒雲錦不崇朝而雨化乎八紘蓋岱宗雖峻極得聖師而益嶸峯聖師之神道雖無乎不在而於生平勝覽詎不益朗其神情是用跡夫登臨之地崇祠而奉主時舉釋菜之禮俎豆而粢盛豈惟高山仰止之思興起千百世如一日行見齊魯一變之化不越衽席而漸摩乎斯土斯氓則今兹所爲嚴事尤不勝其悃誠也敬奉復聖顏子宗聖曾子述聖子思子亞聖孟子配享左右共妥神明亦謂夫四子之於聖師猶頵嶽之於泰岱而當年之步武屬屬幸靈光之相倚晶晶尚饗廵按御史毛在訂定常祀祝文維年月日致祭於先師至聖孔子曰維聖天縱惟嶽降神乾坤叅賛帝王經綸岱宗仰止振衣登臨一時過化萬古流聲肅瞻廟貌吾道常新涓兹春秋仲敬薦明禋以復聖顏子宗聖曾子述聖子思子亞聖孟子配尚饗查志隆岱巓脩建孔廟議竊照泰嶽靈區在寰宇最勝而古初遺蹟惟聖哲尊崇然聖哲中之有孔子猶山阜中之有泰嶽也豈惟誕育降自嶽神廼其里居尤爲密邇遐想轍環之日師弟子相從登高覽勝者屢矣故孟子則云孔子登泰山而小天下禮記檀兮則云孔子過泰山側問婦人之哭而嘆苛政猛於虎列子則云孔子遊於泰山問榮啓期之三樂而善其能自寬韓詩外傳則云顏子從孔子上泰山望吴閶門之繫白馬而顏子對以有如繫練孝實録則云曾子耕泰山下思其父母而作梁山歌凡此故實鑿鑿可據若孟子生時則其母夢神人乘雲自泰山來覆於其居而宋儒稱之曰泰山巖巖氣象其言豈無稽哉由斯以觀則泰山勝蹟孔子稱首而顔曾孟三賢皆踵其芳躅者也夫何時世變遷踪跡泯滅惟孔子崖銅像僅存殘毁者半而顔曾孟杳然無可考見夫老佛之宫廣袤山谷燦爛丹青固無庸置論即如宋時孫明復石守道兩先生猶然俎豆泰嶽之麓而聖如孔子賢如顏如曾如孟生平固其涉歷之地没後獨無棲神之所臨風吊古寧不感悽查得嶽頂玉帝觀之西有空殿三間墻垣俱全其中絶無神佛塑像盖在二三年前先任濟南府推官郝大猷創議營構原爲崇奉孔子設也續縁本宫遷任未竟始謀迄今廟宇空虚漸至頽壞然因其舊貫加以繕脩費既不多工可刻日相應命官經費慮材鳩傭待其脩理完日於殿内設立孔子神座神主正中南向而東西配以顔曾孟併入子思各神座神主東西相向一如學宫之制春秋丁祭每嵗嘗香稅官備辦祭品照州縣釋菜果肴各神座前一卓其特牲則捴供猪一口羊一口本官如期致奠仍於殿傍構道房三間責令本山道士二名常住看守報名在官以便稽查及孔子崖銅像亭宇一併脩整仍於舊址供奉則聖賢遺蹟永與泰岱爲始終而廟貌崇嚴足慰萬世之瞻仰非特斯文之幸實重山靈之光以此紀載簡編不亦輝奕典墳哉萬曆拾肆年拾月拾日議魯兩先生祠一名泰山書院在州城東南隅祀宋孫明復石守道其廢興具金學士承㫖党懷英及國朝大學士吴寬撰祠記懷英記魯兩先生曰孫明復石守道氏宋祥符天聖間以仁義忠孝之道發於文章爲諸儒倡當世大儒如文忠歐陽公文正王公皆尊禮之故其没也歐陽公爲誌其墓蓋比之孟軻韓愈之流其羽翼聖道立朝行已治行終始偉如也初兩先生築室泰山下以爲學館屬大闢嶽祠壖基甫迫乃北徙山麓而以舊館爲栢林地嵗分施錢爲養士之費學者至今賴之而鄕人指以爲上書院者則其所徙地也大定間嶽祠火越明年有詔營建乃命更新廟學已而諸生相與言曰昔兩先生宦學汶上汶學祀之不忘吾儕居其鄕食其德乃可遂已乎於是兩先生諸孫聞其言更出所有作爲祠堂於大門之左以成學者之意石先生之孫震使其姪翊走京師屬其門婿党懷英書其本末將刻諸石懷英曰兩先生之道垂於後世炳如日星奚患無傳雖然有一言焉方孫先生以春秋之學教於魯石先生盖師事之時給事孔公道輔聞其名自兖來謁孫先生既出應客而石先生執杖屨侍其左右升降拜伏皆扶之其徃謝也亦然繇是魯人始識師弟子之禮士風爲之一變近世士尚剽竊以從師親友爲耻忠厚之道不著久矣國家尊經養士將使人人爲鄒魯固當師承鴻碩因文以入道德之奥而後游兩先生祠下而食其餘庇可以無愧矣吴寬記魯兩先生者爲宋泰山先生孫公明復徂徠先生石公守道也祠始建於今泰安州治之西而鄰於嶽廟金元時遂爲廟併元改建於嶽麓已而傷爲浮屠氏據入國朝乃附祠於州學而規制狹隘祀事簡率無以慰魯人之思至是州守前進士德清胡君瑄言於巡撫山東左副都御史無錫盛公謂其事繫風化甚重請於朝事下禮部議從之仍俾有司每歲春仲祀羊一豕一秩爲常典於是胡君復請於藩臬諸公擇地得於州治之東南以成化二十三年八月建祀焉工未畢盛公以請老去而眉山吴公來代益重其事趣成之胡君乃以書來請記於石予惟大賢君子所以能使人久而追崇者非區區末學所知顧請之之意堅不可已也惟兩先生在宋盛時泰山來自平陽而寓於魯其學長於春秋著尊王發微簡易公平多得經之本義一時名公賢士高其學行至妻以女或就見之後范文正公富鄭公交薦其賢始授官官止殿中丞徂徠則生於魯者當孫公居泰山之時實師事之其爲人好善嫉惡嘗著怪說中國論及唐鑑以爲世戒而慶曆聖德詩尤爲人所傳誦常以經術教授於鄕後在太學益以師道自居太學自此而興初舉進士甲科官止太子中允盖兩先生平生見於歐陽文忠公墓誌而國史取以爲傳者其大畧如此按其言論其世信其爲大賢君子卓然出乎流俗而裒然爲一方之望者也故在當時並爲人所尊仰至即其所居山稱之以配其德可謂至矣泰山雖嘗被薦而人亦嫉之不得盡其用若徂徠之剛直既没而禍患作幾不能保其遺骸而庇其妻子盖小人之不相容亦勢之所必至者今去之六百年雖天下知有兩先生而魯爲所寓所産之地道德之風藹然猶存宜人尤尊仰之祠象煥焉而不至卒廢人心之公不能自已如此又歐陽公所謂發先生之光者今則愈久而愈光矣兩先生葬處守臣又推朝廷尊賢之意既加封護惟謹且二氏幸皆有後而石差繁復選其人入學充弟子員魯人之思庶幾慰之因併載其事俾刻之祠下云
