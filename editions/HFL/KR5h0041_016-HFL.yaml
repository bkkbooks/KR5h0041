千依徵倘有吴閶在欲向秋風問羽翰李嵩副使歸德人叨從登岱使者東登太乙壇雲從靄靄漢衣冠九霄風動豺狐遠六月霜飛草樹寒日觀俯看人世隘天門北望帝廷寬省方獨有匡時畧准擬皇圖與泰安王遴尚書北平人玉皇頂每嘆苦塵喧無由脫塵網絶頂遂攀躋始知天地廣日觀峰盪漾湧金烏岧嶢破幽壤願將五夜觀天下同瞻仰漢封臺岱宗自古今武帝空赫赫鸞輿西入關苔蘚臺中碧玉女池生托黄帝室道匹昊天妹靈泉瀉方池恍忽鳴玉珮秦斷碣霸業如流水雄圖似去雲誰知煨燼後淪落復斯文仙人橋絶澗架危橋不見仙人度海上幾時廻空使昔人慕捨身崖開闢始天地人生孰不死所惜不在身崖下多豺螘白雲洞造化鍾靈竅兹洞深幾許不見青鸞回但見白雲去十八盤少負青雲想今上青雲梯一入天門裏回首青雲低五大夫松帝子去不還大夫空自立日暮北風吹時向沙丘泣李攀龍按察使歷城人懷泰山域内名山有岱宗側身東望一相從河流曉挂天門樹海色秋高日觀峰金篋何人探漢策白雲千載護秦封向來信宿藤蘿外秋底西風萬壑鍾贈殷太史正甫登太山明堂天子昔登壇御道風流擁漢官海色逈臨三觀動春陰不散五松寒白雲忽向封中出玉牒誰從篋裏看此日滿朝來禪草相如早晩入長安上宫春色自何年阿閣神房幾洞天囊裏定携三秀草懷中曾擬四愁篇射牛漢蹟今猶在繫馬吴門似杳然七十二家論祀典還朝可奏聖人前和魏使君扶侍游太山中天訣蕩敞天門上帝樓臺拱帝孫五馬並臨吴觀重諸峯獨讓丈人尊秦松忽借蒼顔駐海日遥銜紫氣屯可道黄河看似帶須知西北是崑崙李先芳少卿濮州人岱宗十八盤高擁帝都徂徠梁甫衆爭扶神女來遊明月嶂仙人對慱泰山隅天雞唤日浮三島海鶴巢松遍五株欲草相如封禪䟽漢家壇觀久荒蕪岱宗絶頂玉皇祠雲起天門杖屨遲漢時秦封行處是石閭瑶草至今疑日銜三觀金銀闕天瀉眀河玉女池曉向虚空探海嶼扶桑眞見水中移王紹元御史金溪人登岱岳蕊宫珠闕鬱嵯峨門倚青天掛碧蘿鎻斷半山環日月望窮千里帶江河秦壇王氣崇幽渺漢緯金書射太和昭代聖王皆舜禹喜無封事入山阿孫應奎左布政餘姚人修岱廟視工拾級登登上泰岑萬峯羅地白雲深調琴澗落天河水積翠臺分月樹陰薄海縱觀同物興中台成位兩間心更賓日馭開長夜獨倚高明望孔林魏良貴按察使新建人告岱即事杖策高尋玉女峯披雲始見碧霞宫山含雨意嵐光動日射天門紫氣重絶壁虚疑存漢蹟斷碑何處覓秦封憑高舉手運六合宣父遺踪在眼中楊宗氣按察使陜西人登泰嶽巍巍泰嶽鎮齊東此日登臨天地空西盡函關雲嶺直東來海渤曉霞紅秦碑虚無凌霄上魯殿參差在眼中時有幽人騎白鹿乘風便欲駕青驄裴紳提學副使蒲州人登泰嶽三十六盤何嶮巇曉來登眺自忘疲眼看山頂疑無路身在雲端不自知嬴氏五松寧故物唐人千仞有磨碑古今興廢只常事金簡上函亦太奇王教副使華亭人登泰山泰山之高何奇哉三十六盤路縈廻金烏半夜海底浴碧桃千樹池邊栽秦松漢栢供御帳金簡玉笈餘經臺瓣香春仲肅拜禮和風晴日天門開牟朝宗副使賓州人登泰山岱宗奇峭倚天東册府封題禮數崇齊魯地偏形獨勝古今時異仰皆同荒臺人指泰皇碣幽壑松蟠宋帝宫幾欲尋源渾未識凭高萬里御長風查秉鉞評事海寧人謁岱泰嶽嚴巖夙有名獨看今日祐神京流漕濟時聯艪領袖云亭近作帡霖雨崇朝覃帝澤扶桑曉日溥天明誰將兩腋成雙翅飛上峯頭入太清愈憲叅議無錫人泰山頂上作逈絶使人懼古今稱岱宗溝塗分汶水丘俯群峯晴蓋時沾雨風雲屢盪胷乾坤歸壯麗臺殿入舂容指顧青齊小廻看鄒魯重荒碑秦代蹟廢畤漢人蹤仰止詶初服登臨逼晚鍾幸逄恭己日無復議東封趙勳僉事番禺人登日觀月明道士靈巖來夜半重登封禪臺銀漢中天看斗北金波浮影報暘回火山年見焚東海曦馭俄驚耀上台萬里未光呈瑞氣赤霞紅漲望中開曹金侍郎祥符人登岱雨後朝暉靜嶽壇百年臨眺屬春殘初經帝帳方壼曉漸入天門宇宙寬雙引管簫通玉闕徧尋封禪倚雲磐瑶臺古寺清尊晩看竹吟風興未闌霜節凌煙坐翠微備然與世相違數聲清磬飄何處幾片閑雲照客衣玉女池連春草動僊人鶴傍彩霞飛叠巒惟許山僧住一任鶯花對落暉頃守禮知府奉化人登嶽簾洞更衣入紫霄風吹御帳起松濤羊腸鴉背盤盤曲龍口天門節節高過化樓前懷徃哲登封臺上慨先朝何當抛却塵寰慮乘興重來不憚勞朱應奎知府丹徒人登泰山我昔曾過泰岳前未暇登眺即言還豈獨山靈笑我俗勝事泪孤亦悵然今日重來須縱目攬衣直上山之巔不妨舉手近天日但教穩步渡雲烟天仙地逈碧霞繞日觀臺高紫氣聯隱隱尤可辨風嶺茫茫何處覔桑田身跡恍如塵世外光景疑爲混沌先更欲憑虚何所徃人生即此是登仙陳中知府沔陽人遊泰山宿碧霞宫公館遊覽乘閒過岱宗躋攀曲蹬幾千重未從絶頂躭清興已聽群山度晩鍾寒夜暫將丹竈訪洞門詎許白雲封悠然借宿石床月肯數華暘第二峰劉璽按察使唐縣人岱嶽登望嘗聞東嶽峻今上最高峰吴楚蒼茫外燕齊指顧中罡風時振袂灝氣忽横空不道塵寰逈翻疑僊界通王貴運同知清江人登泰山繩牽布裹筆輿輕險絶能消半日程漢栢秦松空徃跡孔登孟語此經行沿厓忍見逃亡屋躡蹬慚聞怨懟聲惟有七十二泉在顧言常潤汲王明吕顒登州知府陜西寧州人遥叅亭舊名草叅老親叅政分守時改云叅亭人共挹易草以遥名豈爲投香紀還肅謁禮誠碧簷春日麗金楝曉雲輕瞻拜縁分牧臨風重感情祖殿暫憩趨庭憶徃日登覽廿年前宿雨青岩媚光風白鳥翩橋危雲共度壁逈日相聯羽蓋聊爲問赤城列廣仙曹大同署丞通州人登岱嶽宗嶽磴盤高造天翻從下界見雲煙登封漢蹕餘風景表記秦碑空嵗年絳節香飄龍虎馭玄壇寒切斗牛纏微茫八表浮元氣較似身遊太古前周怡司業宛陵人登泰山絶頂山頭上下界殊分大地瓊瑶雲浪文崖壁蒼苔古蝌蚪松蘿紫氣日氤氲九州星埜盡雙日萬里封疆只片雲到此方知天地大超然身在列仙群桑紹良經魁濮州人登泰岱岳曾聞天與齊振衣今始遂攀躋白雲護洞龍初蟄黄葉圍山鳥正啼玄女宫深連别嶼玉皇祠迥接層梯正慚落魄淹塵𡏖石室清幽欲暫栖乘風直上絶高巔回首層霄四望懸密樹霜中凋欲盡群山天際斷仍連半生勝覽元非偶萬仞平臨儼若僊舉目虚驚紅日近長安猶在暮雲邊蘇本前府經歷濮州人登泰岱岳嶙峋插太空摳衣柱杖入雲中正松樹老龍鱗古三觀峰高鳥道通勢逼星垣傾宇宙青分齊魯夫龜蒙只縁捧日丹霄上早望扶桑碧海東桑正衍舉人濮州人登泰攀雲上石盤澗壑聳可觀漢字經沉水秦松帝拜官海光籠曉日嵐色護層巒隨意凭虚眺乾坤眇一凡蘇濂鞏昌府近判濮州人登泰山二首嶙峋岱嶽邇蘧廬紫翠芙蓉削太虚秦漢侈心餘時壘青徐平野到階除勺水扶桑明子夜五雲絶頂見宸居探囊但有遊觀賦吮筆曾無封禪書山梯斜日俯高舂石澗春泉響碧淙廵狩翠華松自拱明禋遺跡玉常封掃雲客坐前峯月冒雨僧歸下界鍾遊子澿期今稍適飛仙環珮倘相逢殷盤中秘濟南人日觀峯東望扶桑國茫茫海水沄波濤摇紫氣島嶼亂紅雲河漢星猶燦乾坤晝已分大觀天書處碣石獨爲群徐琳運同華亭人登岱崎嶇登岱岳長嘯思悠悠帶與河流細杯同海色浮爐烟秦𣗳裊石檢漢臺秋那得塵縁盡常隨曰鹿遊朱明時華亭人登岱岱嶽登臨第一峯山靈秀出紫芙容古碑猶有秦皇跡御輦曾來漢帝蹤屈曲天門晴霧靄崔嵬日觀端烟濃自祈得相如技敢謂才堪草禪封
