front:
  text: 岱史第十六卷登覽志皇明自國初至嘉靖甲寅以前諸名公及文人題咏舊志俱用原題官銜今㨿所及
  hash: sha256:0d614b10374b2701194be36c306ffd425397b4e711dcef92950c3bd7cf9c159c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0041_HFL_016-001a, image: hfl/1094/1094-114.png}
body:
  text: 知者稍正之宋濂學士金華人登岱岧嶤泰嶽柱蒼竅萬壑千巖一徑通象緯平臨青帝觀靈光長繞碧霞宫凌晨雲幔天涯白子夜晴揺海日紅玉露金莖應咫尺舉頭霄漢思偏雄方孝孺學士浙江人夏月登岱振衣千仞思悠悠泰岱于今愜勝遊秦漢舊封懸碧落乾坤勝槩點浮漚海明日觀三更曉風動天門九夏秋更上雲端頻極目紫微光電閃吴鈎曾棨狀元江西人莊平早行望岳我欲登泰山憑高望八極浪跡十二年蹉跎竟難得今晨馬上忽見之屹立東南半空碧想當洪濛時二氣相鬱蟠大塊戲黄土莫能識其端圓靈降崖崿坤后孕峯巒一朝天地劃開闢但見千丈萬丈高巑岏乃知造化神置此奠坤軸巨靈枕其巔六鰲載其足愚公不能移長房不能縮天工經營鬼斧鑿削出千數百峰青立玉自從上古來南風吹不平日月出華彩星宿揚光晶寒崖積氷雪陰壑馳風霆雲霞炫明晦草木發精英上浮金銀氣下潜魑魅形巖巖魯所瞻作鎭朝百靈崑崙以爲父四嶽以爲兄匡廬峩眉乃其子此外培塿皆雲仍齊魯青未了此語何足憑其上萬里天亦借兹山青秦皇漢武廵遊遍玉檢金函重封禪風雨莓苔徃日碑烟雲松栢當時殿由來五嶽秩三公况爾巨鎭山之宗鍾靈毓秀杳莫測磅礴下土專其雄我皇御天生有聖德廣彰仁化誕布恩澤一舉平安南再舉清漠北車駕時廵過泰山望祭築壇陳玉帛小臣幸北奉宸遊一見兹山愛山色雖無涓塵補河嶽頗有詞氣塡胸臆他年載筆頌神功刻盡泰山山上石汪廣洋丞相高郵人廻泰山偶賦七十二神州淋漓紫氣浮天低衆山小星拱一峯秋雲翳成龍虎嵐光薄斗牛岱宗與恒嶽引領目東頭李時勉祭酒巖巖亭送陳叅政歸山東岱宗磅礴不可擬翠色横秋幾千里峭石巉巖倚天外孤亭屹立當山趾亭前芳草没路岐古砌荒涼苔解滋幽花拂檻無人採獨鳥時鳴聽者稀晨露浴日十峰紫一杯遥見滄溟水升兀觀裏曉鐘聞岱嶽祠前白雲起聖賢大道誰不由乾坤闔闢同周流泰山氣象難爲喻誰遣名亭獨此留君去薇垣有閑日隨處登臨訪遺跡想得凭闌一望餘懷古清吟興何極王㒜登嶽齊魯名山仰岱宗崚𡾓萬仞玉芙蓉月明海曠連三島雲凈天空插數峯白石謾留名士篆蒼松何用大夫封我來不盡登臨興更上丹崖第一重吴節祭酒安成人泰山雜詠金科玉檢瘞重泉鳳輦霓旌散紫烟七十二君何處去空餘特表鎭山巔右石表海内詩書已盡焚只將貞石勒功勳青門黄犬知何處尚有雕虫學篆文右李斯篆碑十丈高崖剷碧蒼前鐫功德後詞章浯溪亦有中興頌不及東遊紀盛唐右磨崖碑絶頂方池若鏡空浮雲於此閟靈蹤幾迴膚寸成霖去要與蒼生作嵗豐右雲水池曾與秦皇托舊恩昂霄聳壑露盤根可憐二世空塵土不及寒松有子孫右大夫松幾度天書降紫清宋皇曾此駐龍旌野花啼鳥年年換猶有人傳御帳坪右御帳坪徐有貞武功伯登泰山豈厭丹崖步步迎眼前靈景變陰晴馬從萬丈松邊駐人在九重天上行朝見白雲山半起夜看紅日海東生還知戀闕心無遠直北分明是帝京年富尚書鳳陽人禱雪名尊五嶽鎭山東至聖惟司化育功一炷信香期感召願垂三白兆年豐李裕按察司登泰山歷遍群山夕照催恍疑身到紫霄回漢秦封禪俱無迹唐宋碑銘半是苔紫氣當時凝御帳嵐光徹夜暎仙臺英靈豈獨爲霖雨又與天朝産異材周豪僉事登泰山重巒疊嶂上摩空下瞰諸山覓不同泰華峯頭青菡萏仙人掌上玉芙蓉一凌絶頂知天近五夜滄溟見日紅赫赫霞君人敬仰無端牲帛徃來通張盛叅政初登泰山岱宗仰望鬱嵳峩萬壑于巖氣象多雨過春光横翠黛烟迷曉色露青螺秦王封禪碑還在漢武祈靈事不磨今日我來登眺處蒼天咫尺手堪摩張文郎中大夫松風雨巖前駐六龍青松嬴得大夫封扶蘇謾有安秦策不及當時半日功徐源主事登岱宗岱嶽登觀絶頂來汶流雙曲抱徂徠人隨箭括天門度馬别肩輿峴嶺回封禪臺高簪白石磨崕字古蝕蒼苔金輿玉輦誰重過惟見秦王一土坯喬縉主事登泰山東嶽巍巍步亦難籃輿載我上雲端峰排日觀三千丈路繞天門十八盤高礙斗牛登處近青分齊魯望中寬瓣香將敬元君廟願祝皇圖萬億年司馬垔御史登泰山兹遊自負亦奇哉壑霧林霏指顧開萬丈翠屏天上立一輪紅日望中來尼丘故隴鍾靈氣秦漢豐碑没古苔却憶君親在西北五雲深䖏首重回畢瑜副使貴溪人明堂懷古黍離詩自咏東周翠輦無因此地遊朝聘不聞來束帛會盟惟識有諸侯聖賢述作光千古王霸興亡付一丘莫向高臺尋舊跡斷碑殘礫不勝愁舍身崖東岳含靈本好生此崖元不是秦坑痴兒獨昧謀身討日負人間不孝名無字碑屹立峯巓類獨夫祖龍爲此欲何圖東南王氣依然在誰道亡秦不是胡趙英御史蘭州人登泰山次司馬韻絶頂登臨眼欲昏聲高只恐上方聞東瞻滄海襟千里北望瑶京載五雲秦漢禮儀成故事石孫聲價重斯文吾皇曾不論封禪萬載令人頌放勳夏寅副使華亭人泰山東方爲岱衆山宗萬域人心仰止同七十二君封禪後數千年事渺茫中鯤遊北海雲長黑鷄驗中霄日已紅弱水蓬萊在何處群仙初别大明宫潘禎提學登泰山大翼垂雲須九萬天游今日殆忘還千年誰更觀滄海老脚吾方到泰山雨過春巖龍自戲松生太古鶴常閑題詩不盡孤高意起立中峯看世寰神仙鶴背也超然泰岳朝騎凌紫烟山壓東溟盤大地路横北斗到青天手中日月誰同弄象外風光我得先一笑人間空萬古太清聊倚興無邊弼員外郎登泰山下蟠滄海上青天太古誰先探此巔萬嶺蒙羞雲霧裡九州分界户庭前道高孔子登時見功陋秦皇禪後鐫獨羡當年李太白坐臨紅觀雲煙邵莊主事登泰山好風吹我上層霄四望茫洋景致饒玉牒有文存故事古碑無字認前朝海東日出中宵見山半雲生下界遥從此信知天下小擬追宣聖思飄飄黄景尚書祠岱宗不果登覽有作幾代英君幾度封穿雲也只恁般峯荒唐紀載聞經史典禮公明仰祖宗天若有門人可到仙那無蹟客難逄乾坤自是歸眞主料得山靈笑祖龍王經僉事登泰山開闢乾坤峙此山有生何幸得躋攀登高漸覺星辰近到此方驚宇宙寬突出孤峰擎日月亘綿萬里發林巒追思五載東廵日三代君臣共克艱張岫叅政登泰山鷄鳴海曙射神宫石徑縈紆上碧空回馬嶺前琪樹古水簾洞口野花紅松擎御帳溶溶月鴈避天門獵獵風盡日攀蘿登絶頂此身疑在五雲中潘楷御史承陽人登岳天門天外迥仁覽萬山微峭壁從空落烟霞繞座飛路通仙島近心與世塵違賸有徜徉興酣歌馬上歸劉丙御史登泰山凌空何事獨徘徊欲賦慚非宋玉才歸路宛從天上下吟眸爭向霧中開磨崕字古人難讀御帳臺空水自哀嘯我風霜長跋涉山靈可許再重來王守仁尚書餘姚人登岳曉登泰山道行行入烟霏陽光散巖壑秋容淡相輝雲梯掛青壁仰見蛛絲微長風吹海色飄颻送天衣峯頂動笙樂青童兩相依振衣將徃從凌雲忽高飛揮手若相待丹霞閃餘暉凢軀無健羽悵望不能歸天門何崔嵬下有青雲浮泱漭絶人世迥豁高天秋暝色從地起夜宿天上樓天鷄鳴半夜日出東海頭隱約蓬壺樹縹緲扶桑洲浩歌落青冥遺響入滄流唐虞變楚漢滅没如風漚藐矣鶴山仙秦皇豈堪求金砂費日月頽顔竟難留吾意在龐古泠然馭涼颼相期廣成子太虚共遨遊枯稿向巖谷黄綺不足儔穹崖不可極飛步凌烟虹危泉瀉石道空影垂雲松千峯互攅簇掩映青芙蓉高臺倚巉削傾側臨崆峒失足隨烟霧碎骨顛崖中下愚竟難曉摧折紛相從吾方坐日觀披雲咲天風赤水問軒后蒼梧呌重瞳隱隱落天語閶闔開玲瓏去去勿復道濁世將焉窮塵網苦羈縻富貴直露草不如騎白鹿東遊入蓬島朝登泰山望洪濤隔縹緲陽輝岀海雲來作天門曉遥見碧霞君翩翻起員嶠玉女紫鸞笙雙吹入晴昊舉首望不及下拜風浩浩擲我玉虚篇讀之殊未了傍有長眉翁一一能指道從此煉金砂人間跡如掃泰山高歐生誠楚人但識廬山高廬山之高猶可計尋丈若夫泰山仰視恍惚吾不知其尚在青天之下其色直出青天上我欲彷擬試作泰山高但恐丘垤之見未能測識高大筆底難具狀扶輿磅礴元氣鍾突兀半遮天地東南衡北恒西有華俯視傴僂誰雌雄人寰茫昧乍隱見雷雨初解開鴻濛繡壁丹梯烟霏靄䨴海日初湧照耀蒼翠平麓遠抱滄海灣日觀正與扶桑對聽濤聲之下瀉知百川之東會天門石扇豁然中開幽崖邃谷聚積隱埋中有遯世之流龜潜雌伏飱霞吸秀於其間徃徃怪譎多仙才上有百丈之飛湍懸空絡石穿雲而直下其源疑自青天來巖頭膚寸出烟霧湏臾滂沱遍九垓古來登封七十二主後來相效紛紛如雨玉檢金函無不爲只今埋没知何許但見白雲猶復起封中斷碑無字天外日日磨剛風飛塵過眼倏超忽飄蕩豈復留其踪天空翠華遠落日辭千峰魯郊獲麟岐陽會鳳明堂既毁閟宫興頌宣尼曳杖逍遥一去不復來幽泉鳴咽而含悲群巒拱揖如相送俯仰宇宙千載相望墮山喬岳尚被其光峻極配天無敢頡頑嗟予瞻眺門墻外何能仿彿窺室堂也來攀附躡遺跡三千之下不知亦許再拜占末行吁嗟乎泰山之高其高不可極忽然回首比身不覺已在東斗傍張璿都御史晋州人五松岱岳中途笑祖龍帝無三世納降從些湏恩澤還顛倒不在兒孫却在松盧瓊御史浮梁人秦松大夫樹下無遺澤嗚咽泉頭常怨聲尺土不封乖父子翻將恩典及無名嗚咽泉在歸德州秦扶蘇死所陳琳侍郎莆田人同余侍御再登泰山次韻萬仞崗頭御帳開秦松漢栢亦奇哉酷憐古蹟陪僊侣可是山靈許再來絶頂風高六月寒危松怪石似龍盤天門幾度來驄馬御帳當年駕翠鑾碧蘚封中尋漢禪五雲深處諦秦觀東山莫漫濡毫興霖雨蒼生望謝安查煥山東布政司叅政浙江海寧人季秋望後一日同藩臬僚友登岱泰岱高臨萬里看三齊秋色更漫漫振衣龍峪青雲濕倚劔天門白日寒東帶黄河連海岸北來紫氣繞長安自憐突兀平生志恍惚乘風跨紫鸞秦金尚書錫山人登泰山石磴縈紆十八盤眼中風景渺無端東瞻日觀蓬瀛近南指天門宇宙寬長嘯頓醒塵世夢壯懷聊洗腐儒酸金書玉檢俱陳迹秦漢遺碑莫謾看柴奇通政司崑山人登岳朝出登封門起拂衣上塵肩輿歷㠝岏清霜及兹晨極曰日觀東海水浩無垠秦事今已遠壇社空荆榛撫景增嘆息群山自嶙峋邊貢尚書歷城人登岳岱宗山秀百靈屯壁立烟霄萬古存幽府化機盤地軸上清眞氣接天門霞標日觀青松麗春透龍池碧水温薄暮振衣峯頂石蓬萊東眺海雲昏北上天門日未斜剛風吹我度谽谺仙人洞古留丹鼎玉女祠高護碧霞深澗千年猶凍雪陰崖四月始桃花秦封漢禪俱牢落細讀穹碑感嵗華玉皇祠畔一凭闌絶頂風高夏亦寒北去塵沙通瀚海西來天地是長安青雲迥隔三千界白日平臨十八盤似有飛仙度幽壑鳳笙聲裊珮珊珊巖嶂崔嵬雲霧升泰山靈秀古今稱百千萬地豈重有三十八年纔一登貝殿深春來供客松崖落日下樵僧中天夕磬泠泠發知在烟巒第幾層御帳坪白日天門近青山御帳空亭虛從眺覽𣗳古自登封過鳥層空上鳴泉萬壑中翠葉春不返惆悵昔人踪回馬嶺回馬嶺前春日西澗花巖草鬱萋萋上方鍾落不知處惟見白雲巖畔棲喬宇尚書太原人登岳五岳誰爭長東皇萬物先晦明分日月呼吸變雲烟厚脉中盤地神功上配天雲亭問封禪千古竟茫然百靈朝拱處空籟聽琅璈地据中原勝天臨下界高雲山雙老眼江海一秋毫欲訪蓬瀛去從誰借六鰲許逵尚書登岱一上青霄路幾重峻巖險壑亂如從靖安齊魯眞雄鎭高壓蓬瀛有丈峯