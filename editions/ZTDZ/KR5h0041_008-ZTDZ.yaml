body:
  text: 岱史第八卷遺蹟紀叙曰紀遺蹟者何志徃古之勝蹟昭垂迄今猶未泯者也夫代與時更物隨世變居今考右匪蹟曷因維兹泰山帝王制作之隆聖哲人文之盛種種勝蹟何可縷指其大者如明堂則思虞周之盛治躡登封臺則慨世主之侈心讀秦篆碑磨崖碑則睹大手筆之書法攀孔子登臨處則挹小天下之氣象陟謝過城履汶陽田則欽文事武備之聖謨稽顔淵之望繫練曾子之歌梁山則遡聖門英賢之濟濟考孫眀復之講學石守道之捧杖履則憶當時師弟子之雅操諸皆遺址依然文獻具在流風餘韻與泰岱爲終始所謂曠千百載而相感者其在斯與若仙家者流遊方之外亦洞天福地所時有也故併及之帝王遣蹟玉簡風俗通曰岱宗上有金篋玉策能知人年壽脩短漢武帝探策得十八因倒讀曰八十其後果壽八十國朝洪武初居民於山中得玉匣内有玉簡十六有司獻於朝驗其刻乃宋眞宗祀泰山后土文又成化壬寅秋日觀峰下雨水衝出玉簡會中使有事東籓復馳以獻乃命仍瘞舊所今建日照觀石閭漢書曰武帝封泰山禪石閭應劭曰石閭在泰山下南方士言仙人閭泰山記曰山頂西岩爲仙人石閭今莫詳故址登封臺有二其一在嶽頂相傳爲古帝王登封所築今爲玉帝觀臺下小碣題曰古封禪壇其一在日觀峰相傳爲宋築石函方丈許亦題刻曰古封禪壇盖古封禪而並以禪言誤矣俗曰寳藏庫以所瘞金書玉簡云管子曰無懷氏封泰山刻石紀功國儉角賦曰黄帝會群臣於泰山作青角之音史記曰古者封泰山禪梁父者七十二家而夷吾所記者十有二焉昔無懷氏在伏羲之前封泰山禪梁父李奇曰無懷氏爲封禪之始淮南子曰上古之王封泰山禪梁父七十餘聖古刻泰山圖詩曰三千餘里鬼神府七十二君封禪壇宋景文公筆記曰仲尼登泰山見七十二家字各不同由諸家之說則封禪肇自古帝王非始於秦也而文中子乃云封禪非古諸儒皆韙之則彼諸家之說豈當時附會以中世主之侈心乎今並存之以表古蹟周明堂在嶽之東北山谷聯屬四十里遺址今尚存旁有谷山寺其形勝具党學士寺記漢眀堂在嶽趾東南去州治十里武帝元封間用齊人公玉帶所獻圖創焉其上有元人題刻明堂故基四字其地舒衍突起一石岡巔平而高四丈許週三晦許後枕嶽麓支山如扆障而左右如衛從然澗水縈廻南會于汶遥望徂徠諸山如列屏案當時朝會規模宛然在目章俊卿眀堂論明堂乃黄帝之舊漢武帝時濟南人公玉帶所上楊氏祭禮明堂篇以其不經見而削之然其所言茅蓋通水與大戴禮所記畧同又考工記所言夏后世室殷人重屋周人明堂其制大槩由質而趨於文由狹而趨於廣也由是推之黄帝時無明堂則已苟有之則一殿無壁蓋之以茅正太古儉朴之制又按武帝欲求仙延年方士之謬誕者多假設黄帝之事以售其說如所謂修五城十二樓封名山棲萬靈于明廷采首山銅鑄鼎之類皆矯誣過甚張大其詞以迎合時主之侈心獨公玉帶所上明堂之制乃簡朴如此雖不經見然亦可以稽千門萬户之失固未可以其言之並出於封禪求仙之時而例黜之也長城鉅防在泰山西縁河千餘里至琅邪臺入海蘇代說燕曰齊有長城鉅防韓非子曰長城鉅防足以爲基齊記云齊宣王乘山嶺之上築長城東至海西至濟州千餘里以備楚括地志云長城西北起濟州平陰縣緑河歷泰山北岡上經濟州淄川即西南兖州博城縣北東至密州琅邪臺入海竹書紀年云梁惠王二十年齊閔王築防以爲長城今泰山西北有嶺鋪俱名長城遺址尚存無字碑在嶽頂登封臺下秦始皇立或曰石表或曰神主石或言其下有金書玉簡當是石函古今人莫測其意甚矣秦人之譎也石黄白色頗光瑩無苔蘚非嶽之所有自他山至是不知用民力幾何甚矣秦人之虐用其民也史記漢武帝置五車石於嶽今莫知所在故樸菴詩云已迷漢武五車石却咲秦王無字碑秦政不足言惜夫漢武之效尤也秦篆碑在玉女池上西公署後李斯書始皇二世頌德文宋劉跋序泰山秦篆譜時尚有二百二十有二字今湮泐僅存二十九字夫秦雖無道然其所立有絶人者其文字書法世皆莫及亦不可廢申𣄚題石曰秦斷碑歐陽脩集古録余友江隣幾謫官奉符嘗至泰山頂上視秦所刻石處云石頑不可鐫鑒不知當時何以刻之也然四面皆無草木野火不及故能若此之久而風雨所剥其存者纔此數十宇而己劉跋秦篆譜序史記載秦始皇帝及二世皆行幸郡縣立石刻辭今世傳泰山篆宇可讀者唯二世詔五十許字而始皇刻辭皆謂已亡莫可復見宋丞相莒公鎮東平曰遺工就泰山模得墨本以慶曆戊子嵗别刻新石親作後序止有四十八字歐陽文忠公集古録亦言友人江鄰幾守官奉高親到碑下纔有此數十字而已余以大觀二年春從二三鄉人登泰山宿絶頂首訪秦篆徘徊碑下其石埋植土中高不過四五尺形制似方而非方四面廣狹皆不等因其自然不加磨礱所謂五十許字者在南面稍平處人吊所焉榻故士大夫多得見之其三面尢殘缺蔽闇人不措意余審觀之隱若有宇痕刮摩垢蝕試令模以紙墨漸若可辨自此益使加工模之然終心其未也政和三年秋復宿嶽上親以氊椎從事校之他本始焉完善蓋四面周圍悉有刻宇總二十二行行十二字宇從西南起以北東南爲次西面六行北面三行東面六行南面七行其末有制曰可三宇復轉在西南稜上每行宇數同而每面行數乃不同如此廣狹不等居然可見其十二行是始主辭其十行是二世詞以史記證之文意皆具計甘缺處宇數適同於是泰山之篆遂成完篇宋歐江二公初未嘗到惟憑工匠所說無足怪人多以二公焉信故亦不復詳閱余旣得墨本並得碑之形象制度以歸親舊聞之多來訪問倦於屢報乃爲此譜大凡篆宇二百二十有二其可讀者百四十有六今亦作篆字書之其毁缺及漫滅不可見者七十有六以史記文足之注甘下譜成揭壁間义幽沉晦之迹今遂歷然奏至無義不足諭然李斯小篆古今所師經千三百有餘嵗而復彰兹可尚也如親𨊩遠黎史作親廵遠方黎氏金石刻石著作休嗣作世聽作聖陲作垂體作禮昆作後則又史家差誤皆當以碑爲正其曰御史太夫者大夫也莊子曰且而屬之大夫衛宏曰古文一宇雨名因就注之史記於瑯琊臺刻石備列從臣名氏余家所收瑯琊殘宇亦有五夫宇然則夫從一大因不復重出歟磨崖碑有二在嶽頂東嶽祠後一爲唐玄宗八分書紀泰山銘宇五寸許遒勁可愛一在崖右刻唐蘇撰東封朝覲頌字徑寸餘書法類晋近閩人林焞以忠孝廉節四大字覆刻其上鑱毁殆盡鳳凰臺在登封門外漢宣帝時鳳凰集泰山故名望仙臺在州治東北三十里漢武帝築舞鶴臺唐高宗築按唐書高宗築封祀壇於泰山南四里如圓丘又詔立登封降禪朝覲之碑名封祀壇曰舞鶴臺登封壇曰萬嵗臺降禪壇曰景雲臺今皆頽莽而碑亦堙没張說序頌皇唐六葉開元神武皇帝再受命致太平乃封岱宗禪社首金石紀號天文煥發儒臣志美立碣祠壇曰厥初生人俶有君臣其道茫昧其風朴畧因時而歘起興運而紛落泯泯汶没無聞焉爾後代聖人取法象立名位衣裳以等之甲兵以垣之於是禮樂出而書記存矣反其源致敬乎天地報其本致美乎鬼神則封禪者帝王受天命告成功之爲也閱曩聖之奥訓考列辟之通術疇若天而不成曷背道而靡失由此推之封禪之義有三帝王之畧有七七者何傳不云道德仁義禮智信乎順之稱聖哲逆之號狂悖三者一位當五行圖籙之序二時會四海昇平之運三德具欽明文思之美是謂與天合符名不死矣有一不足而云封禪人且未許其如天何言舊史者君莫道於陶唐虞舜臣莫德於臯陶稷咼三臣降德皆有天下仲尼叙帝王之書繫周秦之誓明魯祀周公用王禮秦承伯益接周統孔聖微㫖不其効歟然秦定天下之功高享天禄之日淺天而未忘庭堅之德也故大命復集于皇家天之賛唐不惟舊哉其興之也玄靈啓迪黄祗顧懷應歸運以義舉撫來蘇以利見湯也無放夏之慙武也無代殷之戰高祖創業四宗重光德有格天漏泉蒸雲濡露菌蠧滋育氤氲涵煦若天地之覆載日月之照臨溥有形而歸景罄無外而宅心百有八年于兹矣皇帝攘内難而啓新命戴睿宗而纘舊服宇宙更闢朝庭始位盖羲軒氏之造皇圖也九族敦序百姓昭明萬邦咸和黎人於變立土圭以步曆革銅渾以正天盖唐虞氏之張帝道也天地四時六官著禮井田三壤五圻成賦廣九廟以尊祖定六律以和神蓋三代之設王制也武緯之文經之聖謨之神化之然猶戰戰兢兢日愼一日納規誨以進德遂忠良以代工講習乎無爲之書討論乎集賢之殿寵男爵貴經明翼乎鵷鸞之列在庭毅乎貔豹之師居鄙人和旁感神寳沓至乾符坤珍千品萬類超圖溢牒未始聞記我后以人瑞爲心不以物瑞爲意王公卿士儼然進曰休哉陛下孝至于天政合乎道前年祈后土人獲天穰間歲祀圓丘日不掩朔感祥以祈聖四事以觀天天人交合其則不遠意者喬丘掃路望翠華之來上帝儲恩俟蒼壁之禮久矣焉可專讓而廢舊勛群臣固言勤帝知罪至于再至于三帝乃挹之曰欽崇天道俯率嘉話恐德不類敢憚于勤其撰廵狩之儀求封禪之故既而禮官不戒而備軍政不謀而輯天姥練日雨師灑道六甲按隊八陳警蹕孟冬仲旬乘輿乃出千旗雲引萬戟林行雐濩燦爛飛焰揚精原野爲之震動草木爲之風生歷郡縣省謡俗問百年舉百祀興墜典葺闕政攸徂之人室家相慶萬方縱覲千里如堵城邑連歡丘陵聚舞其中垂白之老樂過以泣不圖蒿里之魂復見乾封之事堯雲徃舜日還神華靈鬱爛熳乎穹壤之間是月來至于岱祗祓齋宫滌濯靜室凝神玄覽將款太一議夫泰山者聖帝受天官之宫天孫摠人靈之府自昔立國莫知萬數克升中而建號惟七十而有五我高宗六之而今七矣非夫尊位盛時明德曠代遼闊難並之甚哉先時將臻夫大封也累封疆於高岡築泰壇於陽趾夫其天壇三襲辰陛十二咸秩衆靈列坐有次崇牙𣗳羽管磬鏞鼓宫懸於重之内千嵗鈠殳釣戟戣戳周位於四門之外代國重器傳代絶瑞旅之於中庭玉輦金轂翠昌黄屋夾之於端路庶官百辟羌夷蠻貊褒成之後讓王之客序立於禮神之場髦頭弩牙鐵馬金鏃介胄如雪旗幟如火遠匝於清禁之野於是乎以天正上元法駕徐進屯千乘於平路留群臣於谷口皇帝御六龍陟萬仞獨與一二元老執事之人出天門臨日觀次沆瀣宿巉巖赤霄可接白雲在下庚寅祀高祖於上封以配上帝命衆官於下位以享衆神皇帝冕裘登壇奠獻俯僂叶金奏佾羽舞撞黄鍾歌大吕開閶闔與天語清將信公奉斗布度懋建皇極勤恤蒼生昭嘏乎未兆禳灾乎未萌上下傳節而禮成樂遍福壽同歸而帝賜神策乃構玉牒於中頂揚柴燎於高天庶忠誠之上達若憑焰而駕煙日轡方旋神心餘眷五色雲起拂馬以隨人萬嵗山呼從天而至地越翌日尊睿宗侑地祇而禮社首遂張大樂覲東后國風惟舊無黜幽削爵之誅王澤惟新有眚灾大賫之慶不浹日至化洽於人心不崇朝景福遍於天下然後藏金匱於祏室迴玉鸞於上都煌煌乎眞聖朝之能事而高代之盛節者也于斯之時華戎殊俗異音同歎曰兵合多兩山峻多雲豈有大舉百萬之師剋期千里之外及行事之日則天無點翳地無纖塵嚴冬變爲韶景寒風鬱爲和氣非至德其孰能動天如此其順者乎昔人云自西自東自南自北無思不服今信知聖人作而萬物覩其心服之之謂矣或曰祭泰祈主先后非禮歟曰是禮也非宜也王者父事天母事地侑神崇孝無嫌可也且天柴瘞外事帝王主之蒸嘗内事后妃助之是開元正人倫革弊禮起百王之法也故令千載睹末光聆絶韻咀甘實漱芳潤爍玄妙之至精流不已之淑聲臣說作頌告于神明四皇墳而六帝典雖吉甫亦莫能名徒採彼輿人之詩曰大矣哉維天爲大惟皇則之率我萬國受天之祺子孫百代人神共保綏之云爾而已矣社首壇在嶽南二里許曰社首山聯屬蒿里前代多禪此宋眞宗命王欽若撰壇頌碑石封祀壇宋眞宗築在嶽南五里許朝覲壇在州南宋眞宗東封群臣覲地州之風雲雷雨壇因其故址陳堯叟撰碑頌今在壇下與天貺殿碑及天齊仁聖帝碑皆待詔尹熙古書書法類聖教序陰字碑在州之乾封門外迤東三百餘武是爲宋眞宗答謝天書述二聖功德序銘曰陰字以字鐫北面從俗稱也或曰金字謂當時以金塗飾也或曰禋祀以精意享祀言也皆聲相近而義亦通嘗聞眞宗東封駐蹕會眞宫故碑作屏製鐫北面當宫南百餘武俗稱陰字爲是宫今在城内而碑限于外故人罕知其鐫意云萬曆癸酉按臺吴從憲築泰陰亭於碑北御帳坪在嶽之中道即秦封五松之地宋眞宗東封駐蹕于此故名金石上柱窠帳殿之遺蹟也菟裘在岳之陰左傳隱公十一年公語公子翬營菟裘終老即此紅亭在泰安州境春秋昭公八年大蒐於紅即此白騾塜在封禪壇北一里唐玄宗登封泰山益州進白騾甚偉異上親乘之便於登降禮畢方下山坳休息有司言騾無疾而殪上歎異之謚曰白騾將軍命有司具槥櫝壘石爲塜愽城在岳東趾距州治三十里漢之奉高隋之汶陽唐之乾封同此今名曰舊縣嬴城在岳東趾距州治東南五十里漢置縣屬泰山郡唐屬東泰州後省入愽城謝過城在岳東南趾漢明堂側齊魯會夾谷後歸謝之地故名岳東南地曰谷里古夾谷也龜陰田即齊人歸魯以謝過者汶陽田在嶽南汶河之上魯成公二年春秋書取汶陽田八年書晋侯使韓穿來言汶陽之田歸之于齊聖賢遺蹟孔子過泰山側有婦人哭於墓者而哀夫子式而聽之使子路問之曰子哭之也一似重有憂者曰然昔者吾舅死于虎吾夫又死焉今吾子又死焉夫子曰何爲不去也曰無苛政夫子曰小子識之苛政猛於虎見禮記檀弓孔子遊於泰山見榮啓期行乎郕之野鹿裘帶索皷琴而歌孔子問曰先生所樂何也對曰吾樂甚多天生萬物惟人爲貴吾得爲人一樂也男女之别男尊女卑故以男爲貴吾得爲男矣是二樂也人生有不見日月不免襁褓者吾既已行年九十矣是三樂也貧者士之常也死者人之終也處常得終當何憂哉孔子曰善乎能自寬者也見列子顔淵從孔子上泰山孔子望吴閶門外有繫白馬引顏淵以指之曰若見吴閶門乎顔淵曰見之有若繫練之狀孔子撫其目而止之因與俱下淵髮白齒落遂以病死見錦綉萬花谷韓詩外傳畧同今州城西南有高坡曰顔子坡曾子敝衣力耕泰山下天雨雪凍甚旬月不得歸思其父母作梁山歌見曾子孝實孟子生時母夢神人乘雲自泰山來將止于嶧母凝視久之忽片雲墜而寤時閭巷皆見五色雲覆孟氏之居焉見通志後人稱孟子有泰山巖巖氣象適符雲兆信矣伯牙遊於泰山之陰卒逢暴雨止於巖下心悲乃授琴而鼓之初爲霖雨之操更造崩山之音曲每奏鍾子輒窮其趣伯牙乃舍琴而歎曰善哉善哉子之聽夫志想象猶吾心也吾於子何逃聲哉見列子延陵季子適齊於其反也其長子死葬於嬴博之間孔子曰延陵季子吴之習於禮者也徃而觀其葬焉其坎深不至於泉其歛以時服既葬而封廣輪揜坎其高可隱也既封左袒右還其封且號者三曰骨肉復歸于土命也若魂氣則無不之也遂行孔子曰延陵季子之於禮也其合矣乎見禮託嬴愽俱屬泰安岱岳東阯孟子葬於齊反於嬴即其地也柳下惠墓在州治東南百里至今村人尚多展姓者名曰柳里村羊祜城即晋羊祜所封之地距州治東南九十里宋孫復字明復𣈆州平陽人少舉進士不第退居泰山南麓學春秋著尊王發微魯多學者其尤賢而有道者石介自介而下皆師事之年踰四十家貧不娶李丞相迪將以其弟之女妻之復疑焉介與群弟子進曰公卿不下士久矣今丞相不以先生貧賤而欲託以子是高先生之德義也先生宜因以成丞相之賢名於是乃許孔給事道輔爲人剛直嚴重不妄與人聞復之風就見之介執杖履侍左右復坐則立升降拜起則扶之及其徃謝也亦然魯人既素高此兩人由是始識師弟子之禮莫不嘆嗟之而迪與道輔亦以此見稱於士大夫其後介爲學官語于朝曰孫先生非隱者也欲仕而未得其方耳慶曆二年樞密副使范仲淹資政學士富弼言其道德經術宜在朝廷召拜校書郎國子監直講嘗召見邇英閣將爲侍講而嫉之者言其講說多異先儒遂止七年徐州人孔直温以狂謀捕治索其家得詩有復姓名坐貶監虔州啇稅徙泗州又徙知長水縣簽署應天府判官公事通判陵州翰林學士趙槩等十餘人上言孫復行爲世法經爲人師不宜棄之遠方乃復爲國子監直講嘉祐二年七月卒于家年六十有六官至殿中丞其在太學時爲大理評事天子臨幸賜緋衣銀魚及聞其卒惻然予其家錢十萬而公卿大夫太學諸生相與吊哭賻治其喪其治春秋不惑傳註不爲曲說以亂經其言簡易明於諸侯大夫功罪以考時之盛衰而推見主道之治亂得於經之本義爲多方其病時樞密使韓琦言之天子選書吏給紙筆命其門人祖無擇就其家得其書十有五篇録之藏于秘閣見歐文忠撰墓志脩胡瑗字翼之泰州海陵人與孫明復石守道講學泰山攻苦食淡終夜不寢十年不歸得家問見有平安二字即投之澗中不復展讀今人名其投書處爲投書澗云許衡字仲平河内人金季兵亂避地徂徠泰山間扁其壘曰魯壘初從姚樞竇默遊獲聞程朱之學遂爲名儒元世祖召爲京兆提學累官集賢大學士兼國子祭酒領太史院事累遷中書左丞贈司徒謚文正列仙遺蹟漢泰山老父不知姓氏漢武帝東封見老父於山下道傍頭上白光高數尺怪而問之老父曰臣年八十五時衰老垂死遇有道者教臣絶穀但服术飲井水枕神枕枕中有三十二物以二十四當二十四氣以八當八風臣行之轉老爲少日行三百里臣今年百八十矣帝受其方賜以玉帛老父後入山去每十年五年還鄕里僅三百年不復還矣見類林雜志並葛洪神仙傳稷丘君泰山下道士也髪白再黑齒落更生漢武帝時以道術受嘉賞後罷去帝東封稷丘君擁琴迎拜止帝勿上上必傷足帝上及數里左足指折諱之還爲稷丘君立祠傳讃曰稷丘洞徹脩道靈山鍊形濯質變白還年漢武行幸携琴來延戒以升陟逆賭未然見列仙傳及集事淵海安期生在泰山遇李少君入山採藥病困安期生與神樓散一七而愈崔文子者泰山人也世好黄老居潜山下後作黄散赤丸賣藥都市自言三百日後民有大疫長吏之文所請救文擁朱旛繫黄散以徇人門飲散者即愈所活者萬計後去在蜀賣黄散故世寳崔文赤丸黄散云傳讃曰崔子得道術兼祕奥癘氣降喪仁心攸悼朱旛電麾神藥捷到一時獲全永世作効見列仙傳及集事淵海𣈆張忠字巨和中山人永嘉之亂隱于泰山清虚服氣飡芝餌石符堅聞其賢徴至長安以野服見堅曰先生獨善之美有餘濟世之功未足故遠屈先生將任以齊尚父忠曰昔因喪亂避地泰山與鳥獸爲侣尚父非敢擬願還餘齒歸岱宗堅以安車送之過華山歎曰我東嶽道士没於西嶽命也已而化去謚曰安道先生唐吕嵓字洞賓宋天聖戊寅三月二十一日書五言絶句于王母池署其後曰回翁題政和丙申六月十八日復書七言絶句署其後曰回公再書前後書法皆類顔魯公再書二字類遲賢亭刻人莫能識好事者摹其眞蹟于會眞宫觀其詩則知純陽子三至泰山矣詩見登覽志張僊不知何許人開元中與李某同至泰山學道久之李以宗室辭歸仕至大理丞屬安禄山亂携家襄陽尋奉使揚州途覯張子邀李同宿門庭壯麗儐從璀璨李視女妓中有持筝者酷似其妻及罷張呼持筝者以林擒繫裙帶上各散去明日李復至門館荒穢無行人跡詢鄰人曰此劉道玄宅已十餘年無居者尋還襄陽索其妻裙帶果得林檎問其故云一夕夢見五六人追云張𠎣喚搊筝臨别以林檎繫裙上於是知張已得僊矣元丘長春不知何許人嘗居泰山南阯長春觀以全眞爲教元賜號神仙無爲演道太宗師别號長春子後去之嶧山有仙化遺跡張志純號天倪子泰安埠上保人六嵗能誦五經十二歲入玄門居會眞宫數載道行超群輩初名志偉元主改今名賜號崇眞保德大師授紫服重建岱岳升元二觀及上岳廟元初王奕斐稿有贈詩云赤松宗世遠岳地作神仙註云其人百二十嵗三見帝學士徐世隆題其小影曰形雖嬴于道則肥性雖介于物則齊具儒墨之體用見天地之端倪杜仁傑曰其學也老莊其志也軒岐郡人王天挺曰氷霜外潔日星内炳又曰山澤之懼道德之腴徐徐于于此世之所謂天倪子者乎化日自頌曰脫下娘生皮袋此際樂然輕快百尺竿頭進步蓬玄洞府去來去來前世宿德醫僧今非道門小才徐世隆别號復齋不知何許人元翰林學士夙與泰山天倪子游元季喪亂變姓名上下泰山常居岳祠或城隍廟三穉子從學一教習泗水超距一授漢書其一曰王圭授舉子業久之别去言三子貴賤短修其後授漢書者目盲賴說書爲衣食習泅者遇濟南灌城之厄以泅解圍以超距脫死致爵賞圭登科膺爵齒三人所至悉如其言圭年八十許時世隆復來見天順間又至泰山惟升元觀一老道士識之其容貌如兒時所見後不知所終近閱文文山集書世隆尚書東平人詩哭文山蓋宋季之人也歷胡元終始而我國朝人猶及見之異哉成興公眞人不知何許人仙道成于泰山見五岳眞形圖說王從之不知何許人初官翰林後隱泰山跏趺而化人稱其地曰蛻仙巖海印泰安州人居鄒縣大明禪院幼悟道常夢異僧指示一旦呼弟子謂曰吾幻身非久住世親書偈畢端坐而化三日慈容如生其院上紫霧光明貫於天際邑令見之稱爲眞佛
