body:
  text: 岱史第六卷狆典紀附封禪叙曰曷紀乎狩典也紀帝王時廵之大典也而並及夫封禪者何紀其變也亦紀夫當時君之侈臣之諛以示儆也夫五載一狩昉於虞書十二年一廵見諸周制時維仲春則生長之月岳維泰岱則生長之方於時坐明當朝群后考覈其政令凢以爲民也豈似後世人主琢石銘山以夸大其業泥金檢玉以徼福於神盤樂戕民千乘萬騎而猥云七十二君之故事秦漢以來即所稱英君亦不免焉卓哉我成祖文皇帝灼見而却絶之以垂憲昭代豈非超越千古者哉余兹附録前代封禪文一二而終之以先賢記論俾觀者得以考鑒焉唐虞歲二月東廵守至於岱宗柴望秩於山川肆覲東后恊時月正日同律度量衡修五禮如五器五載一廵守群石四朝見舜典夏后氏因之周十二年一廵狩嵗二月東廵狩至於岱宗覲諸侯於明堂見周禮明堂說見遺蹟紀秦始皇二十八年東行郡縣上鄒嶧山立石與魯諸儒生議刻石頌秦德議封禪望祭山川之事乃遂上泰山立石封祠祀下風雨暴至休於樹下因封其𣗳爲五大夫禪梁甫刻所立石見史記王仲淹謂封禪非古啓於秦漢故志封禪以秦爲首李斯篆刻石文今存二十九字詳見遺蹟紀事天以禮立身以義事父以孝成人以仁四海之内莫不郡縣四夷人蠻咸來貢職人庶蕃息天禄永得今皇帝臨位作制明法臣下修飭二十有六年初並天下罔一賓服親巡遠方黎民登兹泰山周覽東極從臣思迹本原事業祗誦功德治道運行諸産得宣皆有法式大義休明垂於後世順承勿革皇帝躬聖既平天下不懈於治夙興夜寐建設長利專降教誨訓經宣達遠近畢理咸承聖志貴賤分明男女禮順愼遵職事昭格内外靡不清凈施於後嗣化及無窮遵奉遺詔永承重戒漢武帝元封元年東巡海上夏四月登封泰山降坐明堂詔曰朕以𦕈身承至尊兢兢焉惟德菲薄不明於禮樂故用事八禮遭天地況施著見景象屑然如有聞震於怪物欲止不敢遂登封泰山至於梁父然後升䄠肅然自新嘉與士大夫更始其以十月爲元封元年行所巡至博奉高蛇丘歷城梁父民田租逋賦貸已除加年七十以上孤寡帛人二匹四縣無出今年筭賜天下民爵一級女子百户牛酒又下詔曰古者天子五載一廵狩用事太山諸侯有朝宿地其令諸侯各治邸太山下二年秋作明堂於泰山太初元年冬十月行幸泰山太始四年春三月行幸泰山壬午祀高祁於明堂以配上帝因受計癸未祀孝景皇帝於明堂甲申修封丙戌禪石閭征和四年春三目上耕於鉅定還幸泰山司馬遷封禪書畧自古受命帝王曷嘗不封禪盖有無其應而用事者矣未有睹符瑞見而不臻乎泰山者也齊桓公既霸會諸侯於葵丘而欲封禪管仲曰古者封泰山禪梁父者七十二家而夷吾所記者十有二焉昔無懷氏封泰山禪云云伏羲封泰山禪云云神農封泰山禪云云炎帝封泰山禪云云黄帝封泰山禪亭亭顓頊封泰山禪云云帝嚳封泰山禪云云堯封泰山禪云云舜封泰山禪云云禹封泰山禪會稽湯封泰山禪云云周成王封泰山禪社首皆受命然後得封禪桓公曰寡人北伐山戎過孤竹西伐大夏涉流沙束馬懸車上卑耳之山南伐至召陵登熊耳山以望江漢兵車之會二而乘車之會六九合諸侯一匡天下諸侯莫違我昔三代受命亦何以異乎於是管仲睹桓公不可窮以辭因設之以事曰古之封禪鄗上之黍北里之禾所以爲盛江淮之間一茅三脊所以爲藉也東海致比目之魚西海致比翼之鳥然後物有不召而自至十有五焉今鳳凰麒麟不來壽穀不生而蓬蒿藜莠茂鴟梟數至而欲封禪毋乃不可乎於是桓公乃止其後百有餘年而孔子論述六藝傳畧言易姓而王封泰山禪乎梁父者七十餘王矣其俎豆之禮不章蓋難言之秦始皇即帝位三年東廵郡縣祠鄒嶧山頌秦功業於是徵從齊魯之儒生博士七十人至於泰山下諸儒生或議曰古者封禪爲蒲車惡傷山之土石草木掃地而祭席用稭言其易遵也始皇聞此議各乖異難施用由此絀儒生而遂除車道上自泰山陽至巔立石頌秦始皇帝德明其得封也從陰道下禪於梁父其禮頗采太祝之祀雍上帝所用而封藏皆秘之世不得而記也始皇之上泰山中阪遇暴風雨休於大𣗳下諸儒生既不得與用於封事之禮聞始皇遇風雨則譏之始皇封禪之後十二嵗秦亡諸儒生疾秦焚詩書誅僇文學百姓怨其法天下叛之皆僞曰始皇上泰山爲暴風雨所擊不得封禪此豈所謂無其德而用事者邪今上自得寳鼎與公卿諸侯議封禪封禪用希曠絶莫知其儀禮而群儒采封禪尚書周官王制之望祀射牛事齊人丁公年九十餘曰封禪者古不死之名也上於是乃令諸儒習射牛草封禪儀數年至且行天子既聞公孫卿及方士之言黄帝以上封禪皆致恠物與神通欲放黄帝以上接神仙蓬萊高世比德於九皇而頗采儒術以文之群儒既不能辯明封禪事又牽拘於詩書古文而不能騁上爲封禪祠器示群儒盡罷諸儒不用三月東上泰山泰山之草木葉未生乃令人上石立之泰山巔上念諸儒及方士言封禪人人殊不經難施天子至梁父禮祠地主乙卯令侍中儒者皮弁薦紳射牛行事封泰山下東方如郊祀太乙之禮封廣丈二尺高九尺其下則有玉牒書書秘禮畢天子獨與侍中奉車子侯上泰山亦有封其事皆禁明日下陰道丙辰禪泰山下趾東北肅然祭后土封禪祠其夜若有光晝有句雲起封中天子從禪還坐明堂群臣更上壽明年夏旱公孫卿曰黄帝時封則天旱乾封三年上乃下詔曰天旱意乾封乎修五年之禮如前而加以禪祠石閭石閭者在泰山址南方方士多言此仙閭也故上親禪焉太史公曰余從巡祭天地諸神名山川而封禪焉入壽宫侍祠神語究觀方士祠官之意於是退而論次自古以來用事於鬼神者具見其表裹後有君子得以覽焉若俎豆珪幣之詳獻酬之禮則有司存班固白虎通畧王者易姓受命而起必升封泰山何教告之義也始受命之時改制應天天下太平功成封禪以告太平也所以必於泰山何萬物所交代之處必於其上何因高告高順其類也故升封者增高也下禪梁甫之山基廣厚也刻石紀號者著己之功績以自效也天以高爲尊地以厚爲德故增泰山之高以報天附梁甫之址以報地明天地之所命功成事遂有益於天地若高者加高厚者加厚矣或曰封者金泥銀繩或曰石泥金繩封以印璽故孔子曰升泰山觀易姓之王可得而數者七十有餘封者廣也言禪者明以成功相傳也於梁甫何以三皇禪繹繹之山明已成功而告有德者居之繹繹者無窮之意也五帝禪於亭亭者量度審諟德著明也三王禪於梁甫之山者梁信也甫輔也輔天地之道而行之也太平乃封告於天必也於岱宗何明告易姓刻石紀號告自紀于百王也燎祭天報之義也詩云於皇時周陟其高山言周太平封泰山也光武皇帝建武二十年十月東巡狩至於岱宗三十年群臣上書請封禪詔曰即位三十年百姓怨氣滿腹吾誰欺欺天乎曾謂泰山不如林放何事汙七十二代之編録桓公欲封禪管仲非之若郡縣遠遣吏上壽盛稱虚美必髠兼令屯田從此群臣不敢復言三十二年帝夜讀河圖會昌符曰赤劉之九會命岱宗感此父乃詔梁松按索圖讖文言九世封事梁等列奏乃許焉求元封故事議封禪所施用有司奏當用方石累壇玉牒玉檢金泥及石檢度數帝以用石功難又欲及二月封禪故詔梁松因故封石空更加封而已松䟽爭不可正月至奉高遣侍御史與蘭臺令將工先上山刻石辛卯封泰山甲午禪於梁父四月己卯肆赦以建武三十二年爲建武中元元年光武刻石文畧維建武三十有二年二月皇帝東巡狩至於岱宗柴望秩於山川徧於群神遂覲東后從臣太尉𢝫行司徒事特進高密侯禹等漢賓二王之後在位孔子之後褒成侯序在東后蕃王十二咸來助祭河圖赤岱符曰劉秀發兵捕不道四夷雲集龍闘野四七之際火爲主河圖會昌符曰赤帝九世廵省得中帝劉之九會命岱宗誠善用之姦僞不萌赤漢德興九世會昌廵岱皆當天地扶九崇經之常漢大興之道在九世之王封於泰山刻石著紀禪于梁父退省考五河圖合古篇雒書甄曜度孝經鉤命經讖所傳昔在帝堯聰眀密微讓與舜庶後裔握璣王莽以舅后之家三司鼎足冢宰之權勢依託周公霍光輔幼歸政之羕逐以簒叛僣號自立宗廟隳壞社稷喪亡不得血食十有八年揚徐青三州首亂兵革横行延及荆州豪傑並兼百里屯聚徃徃僣號北夷作寇千里無煙無鷄鳴犬吠之聲皇天睠顧皇帝以匹庶受命中興年二十八載興兵起是以中次誅討十有餘年罪人斯得黎庶得居爾田安爾宅書同文車同軌人同倫舟輿所通人迹所至靡不貢職建眀堂立群雍起靈臺設庠序同律度量衡修五禮五玉三帛二牲一死贄吏各修職復于舊典在位三十有三年六十有一乾乾日昃不敢荒寧涉危歷險親巡黎元恭肅神祇惠恤耆老理庶遵古聰允明恕皇帝唯愼河圖雒書正文是月辛卯柴登泰山甲午禪于梁陰以承靈瑞以爲兆民永兹一宇垂于後昆百僚從臣郡守師尹咸蒙祉祐永永無極章帝元和二年正月東巡狩柴告岱宗幸奉高祀五帝于汶上明堂安帝延光三年二月丙子東巡狩辛卯柴告岱宗魏眀帝東巡狩凢三至岱宗所過存問高年恤疾苦或賜穀帛隋文帝開皇九年朝野皆請封禪詔畧曰以薄德而封名山用虚言而干上帝非朕所聞今後言封禪宜即禁絶十四年百官抗表固請封禪帝令牛弘等創儀注既成帝視之曰兹事體大朕何德以堪之但當東廵因祭奉山耳唐太宗貞觀初群臣並請封禪唯魏徵以爲不可六年文武官以初平突厥盛德被於海内又年穀屢登表封泰山太宗謂侍臣曰朕每見衆議以封禪爲盛事頗奏勸朕行之如朕本心但使天下太平家給人足雖闕封禪之禮亦可比德於堯舜若百姓不足夷狄内侵縱修封禪之儀亦何異桀紂昔秦始皇爲暴虐之主漢文爲有德之君以此而言無假封禪且禮云掃地而祭以表至誠何必遠登高山封三尺土也太宗雖納徵言而藩臣猶抗表勸請十五年東幸至洛陽而彗星見乃止高宗麟德二年幸東嶽乾封元年正月封泰山禪于社首以皇后武氏爲亞獻越國太妃燕氏爲終獻其帷帟錦繡群臣瞻望多竊笑之玉牒祝文有唐嗣天子臣某敢昭告于昊天上帝有隋運屬顛危數窮否塞生靈塗炭鼎祚淪亡高祖扶黄鉞而赦黎元賜玄圭而拯沈溺太宗功宏鍊石定區宇於再麾業壯斷鼇飲滄海而一息臣忝奉餘緒恭承積慶遂得崑山寢燎炎海澄波雖乃業茂宗祧斯實降靈穹昊今謹告成東岳歸功上玄大寳克隆鴻基永固凝薰萬姓陶化八紘駱賓王爲齊州父老請陪封禪文圓天列象紫官通北極之尊大帝凝圖玄猷暢東廵之禮是知道隆光澤既輯玉于雲臺業紹禋宗必塗金于日觀伏惟皇上乘乾握紀纂三統之重光御極登樞應千靈之累聖故得河浮五老啓赤文于帝期海薦四神奉丹書于王會瑞開三脊祥洽五雲既而緝總章之舊文紹辟雍之故事非煙翼戟移玉輦于梁陰若月承輪祕金繩于岱巘臣等質均芻狗陰謝桑榆幸屬堯鏡多輝昭餘光于連石軒圖廣運追盛禮于摐金然而鄒魯舊邦臨淄遺俗俱沐二周之化咸稱一變之封境接青疇俯瞰獲麟之野山開翠屺斜連辨馬之峯豈可使稷下遺甿頃隔陪封之禮淹中故老獨奏告成之儀是用就日披丹仰璧輪而三舍望雲紆素叫天閽于九重倘允微誠許陪大禮則夢璦餘息翫仙閭以相驩就木殘魂遊岱宗而載躍玄宗開元十二年群臣多言封禪中書令張說又固請乃下制以十三年有事於泰山御製御書紀泰山銘玉牒祝文有唐嗣天子臣某敢昭告于昊天上帝天啓李氏運興土德高宗太宗受命立極高宗升中六合殷盛中宗紹復繼體不定上帝眷祐錫臣忠武底綏内艱推戴聖父恭承大寳十有三年敬若天意四海晏然封祀岱岳謝成于天子孫百禄蒼生受福玄宗紀泰山序銘勒石嶽嵿磨崖碑詳見遺蹟紀朕宅帝位十有四載顧惟不德懵於至道任夫難任安夫難安兹朕未知獲戾於上下心之浩蕩若涉於大川賴上帝垂休先后儲慶宰衡庶尹交修皇極四海會同五典敷暢歲云再熟人用大和百辟僉謀倡予封禪謂孝莫大於嚴父謂禮莫尊於告天天符既至人望其積固請不已固辭不獲予與夫二三臣稽虞典繹漢制張皇六師震疊九宇旌旅有列士馬無譁肅肅邕邕翼翼溶溶以至于岱宗頂也爾雅云泰山爲東嶽周官曰兖州之鎮山實惟天帝之孫群靈之府其方處萬物之始故稱岱焉其位居五岳之伯故稱宗焉曰昔者受命易姓於是乎啓天地薦成功序圖録紀氏號朕承先王兹率厥典實欲報玄天之眷命爲蒼生之祈福豈敢高視萬古自比九皇哉故設壇場於山下受群方之助祭躬封燎於山上冀一獻之通神斯亦因高崇天就廣增地之義也乃仲冬庚寅有事東嶽類于昊天上帝配我高祖在天之神罔不畢降粤翌日禪於社首侑我聖者祀於皇祇在地之神罔不咸舉暨壬辰覲群后上公進曰天子膺天符納介福群臣拜手稽首稱千萬嵗慶苔歡同陳誡以德大渾叶度彝倫攸叙三事百揆時乃之功萬物由庚兆人允殖列牧衆宰時乃之功一二兄弟篤以孝友錫類萬國時惟休哉我儒制禮我史作樂天地擾順時惟休哉蠻夷戎狄重譯來貢累聖之化朕何慕焉五靈百寳日來月集會昌之運朕何感焉凡今而後儆乃在位一王度齊衆法搉舊章補缺政存簡易去煩苛思立人極乃見天則於戲天生蒸人惟后時乂能以美利利天下事天明矣坤厚載物惟后時相能以厚生生萬人事地察矣天地明察鬼神著矣惟我藝祖文考精爽在天其曰懿予幼孫克享上帝時若馨香其丕乃曰會我之文武曾孫其誕錫新命纘我舊業永保王禄子孫其承之予小子敢對揚上帝之休命則亦與百執事尚綏兆人將多于前功而毖彼後患一夫不獲萬方其罪予一心有終上天其知我朕惟寳行三德曰慈儉謙慈者履無彊之吉儉者崇將來之訓自滿者人損自謙者天益苟如是則軌迹易循基搆易守磨石壁刻金記後之人聽詞而見心觀末而知本銘曰惟天生人立君以理惟君受命奉爲天子代去不留人來無已德涼者滅道高斯起赫赫高祖明明太宗爰革隋政奄有萬邦罄天張宇盡地開封武稱有截文表時邕高宗稽古德施周溥茫茫九夷削平一皷禮備封禪功齊舜禹巖巖岱宗衍我玄神中宗紹運舊邦維新睿宗繼明天下歸仁恭己南面絪緼化醇告成之禮留諸後人緬予小子重基五聖匪功伐高匪德矜盛欽若祀典丕承永命至誠動天福我萬姓古封泰山七十二君或禪社首或禪云云其迹不見其名可聞祗遹文祖光昭舊勳方士虚誕儒書齪齪佚后求仙誣神檢玉秦灾風雨漢汙編録德未合天或承之辱道在觀政名非從欲銘心絶巖播告群岳宋太宗皇帝太平興國八年泰山父老千餘人詣闕請東封上謙讓不允中外群臣獻歌頌稱功德請封禪者不可勝計雍熙元年群臣三上表陳請詔以今年十一月有事于泰山尋以乾元文明二殿灾詔罷封禪眞宗大中祥符元年兖州父老吕良等千二百七十八人詣闕請封禪上曰此大事不可輕議知州邵曄又率屬官及兖州進士孔謂等伏闕陳請宰相王旦率文武百官諸軍將校州縣官吏蕃夷僧道耆壽二萬四千七十人詣東上閤門請封泰山詔不允又四表懇請乃詔以今年十月有事於泰山先是殿中侍御史趙湘請封禪上拱揖不答王旦等曰封禪之禮曠廢已久若非聖世承平豈能振舉初王欽若既以城下之盟毁寇準上自是常𢗲𢗲他日問欽若曰今將奈何欽若度上厭兵即謬曰陛下以兵取幽薊乃可刷此耻也上令思其次欽若因請封禪以鎮服四海誇示夷狄上曰王旦得無不可欽若以上意諭旦旦黽勉而從十月辛卯發京師丁未次奉高庚戌步輦登山辛亥祀昊天上帝于圖臺中書侍郎讀玉牒文即日還奉高宫日輪五色雲見先朝以來四方所獻珍禽産獸悉縱於山下癸丑御朝覲壇大赦天下改乾封縣曰奉符改泰山頂曰太平頂玉牒祝文有宋嗣天子臣諱敢昭告于昊天上帝運啓大同惟宋受命太祖開階功成治定太宗膺圖重熙累盛奥惟中人丕承列聖一紀于兹四隩來暨玄貺殊尤六府章示時和年豐群生咸遂僉議大封聿申昭事躬陟喬岳對越上玄祈福逮下侑神奉先天禄無靈休允迪萬乘其昌求保純錫眞宗御製序銘朕聞一區宇而恢德教安品物而致昇平此邦家之大業也考茂典而薦至誠登喬嶽而答純錫此王者之昭事也結繩已徃茫茫而莫知方册所存章章而可辦罔不開先流福累洽儲休長發其祥求錫爾類故能禋祀上帝肆覲群后追八九之遐躅徇億兆之歡心是以武上勦獨夫集大統而成王以之東巡高帝平三啓天禄而武帝以之上封曩以五代陵夷四方分裂嗷嗷九域顧影而求存顒顒萬民籲天而仰訴不有神武多難何以戡不有文明至治何以復恭惟太祖啓運立極英武聖文神德玄功大孝皇帝積善自始受命無疆歷試于艱難終陟于元后威靈震疊玄澤汪翔無徃不賓有來斯應濟民於塗炭登物於春臺俾乂萬邦成湯之甚盛咸宣九德文王之有聲啓運于前垂裕於後太宗至仁應道神功聖德文武大明廣孝皇帝洪基載紹景貺誕膺如日之升燭于率土如天之廣覆于群生人文化成神道設教尊賢尚德下武後刑金石之音明靈是格玉帛之禮蠻䫉來同書軌畢臻典儀無闕上玄降鑒虞舜之温恭庶民不知唐堯之於變重熙之盛冠絶于古先增高之文已頒乎成命逡廵其事謙莫大焉肆予冲人獲守丕搆其德不類其志不明弗克嗣興罔識攸濟屬以陽春届節靈文錫慶由是濟河耆老鄒魯諸生啓予以神休邀予以封祀不遠千里來至闕庭朕惕然而莫當彼磪乎而莫止俄而王公藩牧卿士列校獻封者五上伏閤者萬餘以爲景命維新珍符紛委不可辭者天意不可拒者群心天意苟違何以謂之順道群心苟欝何以謂之從人是宜登介丘成大禮敦諭雖至勤請彌固切念乾坤垂祐宗祐儲祉導場嘉氣僅洽小康俾夫疆場以寧干戈以息風雨以順稼穡以登無震無驚既庶既富皆天之賜也豈朕之功歟雖則告成功紀徽號非涼德之克堪也然而序圖録答殊禎非𦕈躬之敢讓也天孫日觀梁甫仙閭五嶽之宗萬物之始升中燔燎舊章斯在繼繩先志懿範遵已定之規祗事園壇嚴配肅因心之孝於是詔輔臣以經置命群儒而講習給祠祀者罔有不至供朕身者無必求豐故玉幣犠牲朕之所勤也羽儀服御朕之所簡也精意篤志夙興夕惕誠明洞達顯應遝彰自天垂恩正眞親臨於雲馭奉符行事子育敢怠於政經奥以暮秋之初恭享清廟告以陟配孟冬之吉虔登岱宗伸乎對越奉寳籙於座左升祖宗以並侑禮之正也孝之始也乃禪社首厥制咸若于時天神畢降地祇畢登肸蠁可期奠獻如睹其薦也雖慙乎明德其感也實在乎至誠亦復酌酆宫之前聞遵甘泉之受計百辟委珮五等奉璋肆青仁舉善勸治稽考制度採摭風謡文物聲明所以揚二聖之洪烈歡娱慶賜所以慰百姓之來思盖又兩儀之純嘏七廟之餘慶邦家之盛美蒸黎之介福豈予寡昧所可致焉唯當寤寐寅威夙夜惕厲不自滿假不自逸豫寵綏庶國茂育群倫以答穹昊之眷命焉勒銘山阿用垂永世銘曰節彼岱嶽巋然東方庶物伊始玄感其章自音受命反始穹蒼燔柴於此七十六王顧惟寡薄恭嗣洪猷乾乾慄慄雖休勿休元符昭錫餘慶遐流群情所迫盛則妥修前王丕顯是月告成伊予冲𦕈無德而名永懷眷佑祗荅景靈聿崇嚴祀用達精誠殊祥疊委㝢縣奔馳禮無違者神實格思藏封石累刻字山嵋蒸民永泰繁祉常垂孫奭諫䟽陛下才畢東封又議西幸非先王卜征五年重謹之意今國家土木之功累年不息水旱作沴饑饉居多乃欲勞民事祀神其享之乎又曰今之奸臣以先帝嘗封禪故賛陛下以繼承先志先帝欲北平幽朔西取繼遷則未嘗獻公謀畫一策乃卑辭厚弊求和於契丹蹙國縻爵姑息於保吉謂主辱臣死爲空言以誣下罔上爲己任是陛下以祖宗艱難之業爲奸臣僥倖之資此臣所以長嘆痛惜也徽宗政和四年兖鄆濮開德興仁潁昌府鄭州廣濟永興軍等上言父老欲詣闕請皇帝登封詔却之時蔡京當國將講封禪以文太平預具金繩玉檢及凡儀物甚備造舟四千艘雖雨具亦以十萬計他皆稱是然不果行皇明永樂間太常官獻頌請封泰山成祖文皇帝却絶之王直題郤封禪頌藳右郤封禪頌藁前翰林學士贈禮部尚書文穆公胡廣謚作也昔太宗文皇帝在位時太常臣有言曰古者聖人治天下功德盛隆則必興封禪之禮以告于神明垂美於萬世今陛下繼統天清地寧民物咸遂聖德神功古無與讓而乃封禪那講何以繼前代帝王之盛請命禮部行之上曰封禪非古也帝王之有聞於後者在德不在封禪不許公聞之曰此盛德事也而大臣有與之比者陰助之公慮爲所惑乃本封禪非古之說與後世賢君良臣所以闢而不行之美作此詩以獻皇上聖性高明眞知灼見足以破千古之謬爲百王之明監覽之喜曰是朕心也於是言者沮而封禪卒不行君子之尊君務引其君以當道若公是也彼秦皇漢武肆其侈心以瀆擾上下天地厭之顧乃以是爲說此爲邦者所以遠佞人而公之所深慮也歷代儒臣封禪論漢司馬虎曰自上皇以來封泰山者至周七十二代易姓則改封者著一代之始明不相襲也繼世之王巡狩則有修封以祭而已自秦始皇孝武帝封泰山本因好仙信方士之言及造石檢即封之事也天道質誠約而不費故牲用犢器用陶匏殆將無事於檢封之間而樂難攻之石也夏少康周宣王由廢復興不聞改封光武欲因孝武故封而梁松固爭以爲必改乃當天意既封之後未有能福而松卒被誅死雖罪由身作盖亦誣神之咎也且帝王所以能大著于後者實在其德加於人不聞其在封矣崔靈恩曰自周以前封者皆封土爲壇至秦皇漢武始用石檢袁宏曰夫揖讓受終必有至德於天下征伐受命必有大功於萬物是故王者初基則有封禪之事盖以其成功告于神明者也夫東方者萬物之所始山嶽者靈氣之所宅故求之物本必於其始取其所通必於所宅崇其壇場則謂之封明其代興則謂之禪然則封禪者王者開務之大禮也德不周洽不得輙議斯事功不弘濟不得彷彿斯禮曠代一有其道至高自黄帝堯舜至于三代各一得封禪未有中修其禮者也雖繼體之君時有功德此盖率復舊業增修其前政不得仰齊造國同符改物者也夫神道眞一其用不煩天地易簡其禮尚質故籍用白茅貴其誠素器用陶匏取其易從然則封禪之禮簡易可也若夫石函玉牒非天地之性也梁許懋曰舜柴岱宗是爲廵狩而鄭玄引孝經鉤命决云封于泰山考績燔燎禪于梁甫刻石紀號此緯書之曲說七十二君燧人之前世質民淳安得泥金檢玉結繩而治安得鐫文告成妄亦甚矣若聖主不湏封禪若凡主不應封禪秦始皇嘗封泰山孫皓嘗封國山皆由主好名於上而臣阿㫖於下非盛德之事不可爲法也宋胡致堂曰緯書本原於五經而失之者也而尤紊於鬼神之理幽明之故夫鬼神無灾吉曜臨軒錫五福以曰福曰稽首皈依至眞妙道德光常曜天尊法衆等志心皈命靈濟宫九天金闕明道達德大仙顯靈普濟清微洞玄冲虚妙感慈惠護國庇民崇福洪恩眞君九天玉闕宣化扶教上仙昭靈慱濟高明弘靜冲湛妙應仁惠輔國佑民隆福洪恩眞君宫中神仙諸靈官謹燃璣衡七政神燈上布日曜太陽之象恭聞道在太極之始莫見乎隱莫顯乎微日者衆陽所宗無願不成無幽不察莫測其妙所存者神赫赫厥靈人可畏之如趙盾明明在上民皆仰之若周公輝光其德盛矣乎潔白其節皎如也烏輪肅備朝覲欝儀之宫羲駕莊嚴燕享洞陽之殿放在毫光萬丈普照世界三千入吾門也無蔀屋之疑遵吾道也滅索塗之病伏念一切衆生塵埃汨没徒窮逐影之勞雹露虚華惟有過隲之歎自今反照與道常明伏願中爲市者獲行啇坐賈之財出而作之安耕田鑿井之業藝之巧者以圭測影工之勤者繼晷焚膏爲儒者賦誇五色文章入仕者武遠矣使其舉措每如此則金甌之業何缺壞之有章俊卿曰以封禪爲非古者王仲淹也以封禪爲不經者李泰伯也以封禪爲不足信者蘇子由也夫六經無封禪之文帝王無封禪之事著是文者管仲䟽其源史遷浚其流季仲推其波張說助其瀾侈是事者祖龍嘘其煙孝元封其燼隋帝熾其膏玄宗烈其焰是封禪之典惟以肆情示誇也證之以六經之明文質之以帝王之實迹則後世之惑滋甚且云云一山也或以爲在東山或以爲在蒙陰亭亭一名也或以爲在牟陰或以爲在鉅平社首一地也或以爲在鉅平或以爲在博縣則服虔晋灼應劭之論不同既曰伏羲神農禪云云又曰三皇禪繹繹既曰帝嚳堯舜禪云云又曰五帝禪亭亭既曰禹禪會稽湯禪云云又曰三王禪梁有則管仲孔穎達之說爲不一紛紛異議迄無訂證唐虞三代果有是乎七十二君果足信乎設有是事六經遺文豈應不載吁安得仲淹泰伯子由與之議封禪之非哉馬端臨曰按文中子曰封禪非古也其秦漢之侈心乎而太史公作封禪書則以爲古受命帝王未嘗不封禪且引管仲荅齊桓公之語以爲古封禪七十二家自無懷氏至三代俱有之盖出於齊魯陋儒之說詩書所不載非事買也當以文中子之言爲正野翁詩話唐竇庠冬夜寓懷寄王翰林詩云滿地霜蕪葉下枝幾回吟斷四愁詩漢家若欲論封禪須及相如未病時按史記天子曰相如病甚可徃悉取其書使所忠徃相如已死妻曰長卿未死時爲書一卷曰有使來求奏之言封禪事所忠以奏天子異之夫封禪秦漢侈心既非古禮而相如至死不忘獻諛夫豈忠臣而庠以自比或以比人此唐儒之陋也韓退之亦上表勸封禪又數自謂希相如退之儒宗猶爾如庠何議焉明丘濬曰封禪之說說書禮典畧不經見審有是事乃天下國家之盛舉堯舜禹湯文武成康皆身致太平安得闕而弗講所謂七十二君者果何代何人哉先儒有言養生至於長生不死爲國至於祈天永命皆有是理然人未有能爲之者縱爲之然亦不出乎身心日用之間非必由乎服食藥物徼求鬼神而後致之也是故明君永年莫若寡欲延國祚莫若愛民寡欲而至於全其天愛民而至於過其曆誠有是理亦誠有是事嗚呼世主所以甘心於不貲之費而行封禪之禮者以有秘祝之求也誠知此理反之於心知其必無驗之於古知其無效則自不爲矣
