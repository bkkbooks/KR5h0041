front:
  text: 岱史第十八卷登覽志縣肆唐丁春澤日觀峰賦日之升也浴海而麗天
  hash: sha256:3b9950b190efc7530dcf656ddfc4c715c72f78307cba86eaed6f0a8a7e14b6e1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0041_SJB_018-350798a, image: sjb/35/350798a.png}
body:
  text: 嶽之峻也切漢而臨邊登高者以致九霄之上愛景者欲在萬人之先其所惟一其仞惟千伊風靈之有載彼日觀之存焉夫其夜刻未終曙色猶昧彼窮高之極遠此有進而無退未辨昏明斯分覆載屢聞鳴鴈猶陰沉而不睹忽聽晨雞即瞳曨而可愛於是漸出暘谷將離地維巖巒既秀草樹生枝姿氣則赫人皆仰之其望也如燭其照也無私昔者帝王御字立極垂統封禪及此成功廵狩應其春仲莫不登兹絶頂燭遐大明思照煦之義窮造化之精以爲日象一人之德嶽是三公之名信王侯之設險俾夷狄之來平方今一德無爲三光有象動植昭泰神祇肸蠁千嵓瑞色思効祉以疑升萬壑春雲欲入封而空上客有才乏羽儀心思騫翥每精聚螢之志難窮望日之處引領終夕含情連曙如照燭之有期故躊躇而不去亂曰日有觀兮絶代獨立登之望兮無遠不及何大陽之至精莫不專於出入又賦泰嶽東南峰開一室旁接天路低臨曉日陰霾玉兔動宵漢之微明曉報天雞越氛埃之逈出初其瞑色葱籠懸崖倚空獨出清虛之外遥分蒼莽之中隱霧猶白經天漸紅披草樹以燈亂耀波濤而血融及夫林嶺寒消煙雲色變星河寥落以初没峯巒邐迤而徐見火動山頂輪移水面穿晴隟以飛鏡歷幽窗而走電至若門宇蕭條霜空泬寥涼開曙景暖入殘宵楊晶彩以赩赩散芒角而飄飄露灑交疑風牽影摇望極在涯生從地表夫弱木之歷歷出陰之杳杳萬壑收瞑千巖送曉消古砌之晴雪動寒庭之宿鳥遥空泠滑傷寸晷之難碧嶂岧嶢望輪光而漸小凌霄色麗騰空影斜氣亂山燒光分水花石壁孤色覺靈槎之津狹炎輝咫尺信長安之路賒既而皆焜燿以徐來泛圓靈之不礙蒙水氣以珠暗露松陰而壁碎霞色收錦天風劔黛披雲際之斜吴豁天門而俯對依簷乍吐咸生齊魯之間過嶺逓明照及草芽之内由是遠挂寥落高辭絶瞑萬象焜煌而畢照六龍夭矯以無寧安得足踏聲峭手扶青冥陳白晝之若短願陽鳥之暫停宋洪邁容齋隨筆應劭漢官儀載建武封禪事每稱天子爲國家其叙山勢峭險登陟勞困之狀極工予喜誦之其畧云是朝上山騎行徃徃道峻峭下騎步牽馬乍步乍騎且相半至中觀留焉仰望天關如從谷底仰觀抗峰其爲高也如視浮雲其峻也石壁窅窱如無道徑遥望其人端如行朽兀或爲白石或如雪久之白者過𣗳乃知是人也殊不可上四布僵卧石上亦賴齎酒脯處處有泉水復勉强相將行到天關自謂已至也問道中人言尚十餘里其道旁山脅仰視巖石松樹鬱鬱蒼蒼若在雲中俛視谿谷碌碌不可見丈尺直上七里賴其羊腸逶迤名曰環道徃徃絙索可得而登也兩從者扶掖前人相牽後人見前人履底前人見後人頂如畫重累人初上此道行十餘步一休稍疲咽脣焦五六步一休牒牒遽頓地不避燥濕前有燥地目視而兩脚不通又云封畢詔百官以次下國家隨後明日太醫令問起居國家云昨上下山欲行迫前人欲休則後人所蹈道峻危險國家不勞又云東山名曰日觀雞一鳴時見日欲出三丈所秦觀者望見長安吴觀者望見會稽周觀者望見嵩山凢記文之工悉如此而未嘗見稱於昔賢秦吴周三觀亦無曾用之者今應劭書脫畧惟劉昭補注東漢志僅有之亦非全篇也邵伯温聞見録客云昔罷兖曹與一二友祠岱岳因登絶頂行四十里宿野人之廬前有藥竈地多鬼箭天麻玄參之類將五鼓初各仗策而東僅一二里至太平頂叢木中有眞宗東封壇遺址擁褐而坐以伺日出久之星斗漸稀東望如平地天際已明其下則暗又久之明䖏有山數峰如卧牛車盖之狀星斗盡不見其下尚暗初意曰當自明處出又久之自大暗中日輪湧出正紅色騰起數十丈半至明處却半有光全至明處却全有光其下亦尚暗日漸高漸變色度五鼓三四點也經眞廟帳宿之地石上方柱窠甚多又經龍口泉大石有罅如龍哆其口水自中出又經天門十八盤峰尤秀聳北眺青齊諸山可指數信天下偉觀也襲慶守錢伯言遊覽記宣和己亥九月二十四日面奉玉音至奉符催視岳祠後一月伯言至自兖明日具香燭以告上㫖已而罷醮于會眞宫獨登瑞雲亭早飯于行館遂同令寇庠丞吕光問祠官曹欽承萊蕪令韓僖道士蘇彦弼謁岱岳觀留連池上復自金母洞過青帝觀觀文僖丞相遺刻遂遊白龍潭奠御苑玉芽於水中愛其泉石之勝廼相與策杖散步還過雞籠峰始復肩輿躬走社首山視禪壇訪遺迹晩入乾元觀小飯翠陰亭而歸元杜仁傑撰東平張宣慰登泰山記畧皇帝中統元載擢用宿儒宣撫十道公首與其選公治河東有異政考爲天下最宇上親召勞以巵酒至以字呼朝野榮之越四年上復命公爲東平宣慰使嘗曰曲阜寔夫子之庭泰山爲中原神岳皆在境下所當親祀以至元重九前三日瓣嚴以行由沂州門出時天宇晦冥翌日至林廟拜三聖墓雨氣猶未艾信宿抵岳祠明旦登西華門雲則載陰載暘雨則間作間止咫尺三觀在墨潑染間刹那千百其變公謂所親曰登頂之約蓋不敢定苟晴矣乃行否則恐勞而人既而五皷將作陰爲之觧馭三唱未終星爲之芒錯于是州刺史張汝霖奉符令張佺司户王天挺及從者三百指具肩輿輦公而上已而過黄峴飰於護駕泉次御帳少憩去天門猶不趐十五里路漸隘林𣗳四合就其罅望乏天光凝碧如紺珠薄暮至絶頂由東以望見山影黕黑偃卧無際頃觀李斯碑僅得數字其餘漫不可識下自登封壇皆歷代磨崖亦復剥裂惟唐明皇御製紀泰山銘其字大如椀深幾寸泥金錯落猶有存者日没少頃寒氣已逼人如仲冬時從者燎薪圍坐以待旦參甫中公起步自玉女池登日觀峰六合蹇開肅然無纖滓待蒸黍時東方曨乍離乍合移晷日露其半恍然如入無量金色界中凡在行者莫不嘆詫及廻又得西影直抵昧谷若與崑崙爭雄長公輒奮髯驚叫曰吾此行凢三見岱宗面目吾願足矣噫予自壬辰北渡三十餘年凡九來未嘗覩此奇事雖欲勿紀得乎古者有天人之辯謂人無所不至惟天不容僞眞知哉公純誠人也盖無徃而不恊無動而不言無禱而不應是行之異乃一節耳雖然天下之事固有邂逅相合者多矣昔衛旱伐邢師興而雨或者謂適與雨會則非也此特純歸之天烏在所謂由人乎哉至於揮劍成河變晝爲夜或有此理如韓吏部開衡山之雲蘇端明借海藏之春皆我輩之餘事安用詫爲因公此來書諸石以示來者奉高王禎書刻延禧殿前皇明李裕登泰山記成化乙酉春同年御史李景賢來按山東是歲三月朔同自濟南徃謁闕里回抵泰州公館夜酌景賢曰喜兹和煦明當同登泰山一覽奇勝可乎余諾之明晨起與景賢聯騎出州城北望輕煙薄靄横帶山腰適叅政葉拱宸副使莊尚源邂逅而至遂與偕徃北行二里過白鶴泉泉出石罅湁潗鼎沸久旱則滲漉距西百餘步曰梳洗樓不知創於何時惟存故址從西折北二里有王母池泉甘而冽瀵沸潾㵾不竭不溢鄉人取水禜雨頗驗又北五十餘步曰吕巖有吕仙石像宋時建樓閣堙圮獨荒基破礎存今圍以石垣其中深林茂草森布蒙密曄曄猗猗頗有佳致至山麓時日出扶桑雲霞絢綵日前羣峰錯立遠近異態景物之奇似快心意自山麓抵廻馬嶺十餘里羣峰對峙嶻薜崢嶸勢相噬齒中夾溪流轉騰潎冽觸崖石激堆琦其聲澎湃瀥瀥浤浤榮迂數里入汶又有巨石大者如輪小者如罋硉矹磈礧偃卧路徑難以數計策馬單行崎嶇至嶺下是嶺岌嶪陟絶車騎不可前馳余四人神思覺疲僕從亦有倦色少憩石上飲茗易肩輿穿深林踰大石行可四里陟崖劖削中夾石徑𨸭陀險阨有石磴可躋復行二里許即宋眞宗東封帳宿處曰御幛其地夷衍嘉木榬榬繁陰布地前即深澗黛蓄膏渟水光映天巉石錯雜如斷齶有小魚色青黑浮遊水面臨溪觀之時羅道士獻茶餅余試以餅餌之翕然聚已而尚源投以小石悉潜去復三里餘至黄現山秦時有松五株始皇登山封五大夫枯没後人續植者百有餘年老幹拳曲擁腫宛若蒼龍勢欲飛騰余四人休憩其下嗟嘗奇態又行二百餘步曰百丈崖崖石如屋可容十餘人臨瞰道傍紫蔓青蘿摇綴蒙絡傍有石洞𧮿谺而黑莫測深廣人亦慴愳不敢窺又經石壁峪至十八盤兩峰對插峭峭如壁其間累石爲徑盤繞至南天門幾五里遠望如梯懸倚山畔此最險絶易小橋盤道而上入天門東行數里詣昭眞觀易冠服薦祀紫霞元君問道士云不知創始每嵗春月四方謁者踵至心弗虔立致奇報余聞而驗之數矣已即祠後觀磨崖碑是碑唐玄宗紀泰山銘字大如手嵗久風雨多剥蝕其字距東十數步觀始皇封泰山制李斯所篆其石埋植土中高五尺形制似方非方四面廣狹不等余刮磨垢蝕而細觀之總二十二行行各十二字多不可識又西行數步上太平頂此泰山最高處上有盤石方丈廉隅尚整黧色光潤可愛余四人坐石上少頃拱宸尚源足疲怯還昭眞觀余與景賢褰裳徑徃頂上俛瞰羣峯攢簇伏地若培塿獨神霄兩峰嶾嶙特起佳花異草舍丹吐白者駢羅列布於岩谷靈禽怪獸啾鳴嘯號之聲雜沓盈耳最爲泰山奇勝又百三峯曰日觀吴觀周觀余與景賢因縱目四顧渺然無極而崧華恒霍諸山以及江漢河濟諸水皆可指數誠天下諸山莫踰其高時曰正午風清氣爽徘徊既久頓覺神思飄灑迥隔塵寰而不知身踞青霄上也復從頂東下數十步有玉女泉水清甘美道士時汲瀹茗又東行二十步曰龍口泉大石有罅如龍哆其口水自中出其流㵿㵿有聲潨然復從險徑南行四十步懸崖淚峍下臨絶壑古木蒙蔽余俯身覘之毛髮堅聳有怪石形如大匱虚倚崖畔風至摇撼問道士云此謂捨身崖人修道從玆捨身入僊境余與景賢深惻道士惑世者戕人之生遂命州官塞路徑絶徃來崖之西有五峰嶙剛巉簇其狀若蓮名蓮花峯自西山小山折旋而東層嶂疊出泉湧石上奔瀉數十丈縷縷如簾名水簾泉其鷄籠諸峯桃花諸峪多有靈跡奇勝獨嶺嶠巃從岩壑嵲荆蓁交迷路徑不可到時日過未余與景賢徃觀會二公同飲各賦詩二首書于觀之東壁從天門盤舊道而下至半嶺正夕陽西照回視山色玲瓏水光蕩漾樵翁牧子隱隱𣗳林間恍若盡圖中人物欲乘餘興徃徂徠尋竹溪六逸堂故基石守道隱居日已暮矣嗟夫余少時嘗讀孟氏書孔子登泰山而小天下公羊傳泰山之雲不崇朝而雨徧天下觀子美望岳詩造化鍾神秀陰陽割昏曉盪胷生層雲决眥入歸鳥之句想像泰山之高峻巒峯之雄秀草木之奇妍仙蹤靈跡之怪異古今賢人達士登覽之題咏何能得登兹山窮探廣索親覽奇勝徒榮諸夢想者十餘年矣昔程明道幼聞泰華奇秀在鄠縣未得遊覽及登第請爲是縣主簿以償其素願又自記其始末今余無庸於時幸明總憲是邦且喜聖德廣被地方居民咸蒙覆露之庇更喜諸公皆同朝舊寮乘兹休暇得覽奇勝以償夙昔之願何其幸歟是亦張弛之道豈其荒躭而忘返者足比哉此記與喬字記録目何鏜古今名山記最隹喬宇尚書游泰山記正德五年燕齊大旱運河滯阻天子爰舉祈方之典命户部侍郎臣宇於五月十四日徃東方祭告嶽鎮暨于東海予夙願泰山一登又懼此行以昭假明神周救百姓而徃苟祀而無雨則又不可登矣因齋心而前過德州即沛然下雨過平原禹城泰安州濟南之境雨皆達旦農夫歡踴予亦展顔謂可以償其願矣二十九日沐浴更明衣省牲寅禮于季夏朔鷄鳴後致祭于東嶽廟畢祭時雷電合作予又懼曰秦漢以前登封泰山者七十二家實爲靈墟箸于簡册雖始皇以虎狼之威千騎萬乘以從上中阪遇暴風雨不得上封今且雷電矣登而雨作疲夫羸馬不得登矣但頗自謂秉誠肅恭嶽豈無鑒耶竟與胡張二君同登時陰霾蔽空行五里余至紅門以入則雲漸開郎遂由石陂西北行二十里過嶺二曰回馬黄現又五里至御帳觀始皇所休樹五大夫松神根古幹高皆二丈許自御帳而上皆石磴飯訖上小大龍口又盤曲十五里至南天門又三里至絶頂凡五十盤而上晴晦開闔氣候萬態不可云狀謁禱于碧霞元君稍上是爲東嶽廟磨崖碑在焉碑高二丈廣一丈五尺其文乃唐玄宗御製泰山銘其書隸其立之年爲天寳遂題名于上又上爲極高處有玉皇殿殿南爲始皇封禪碑即除道至士顛覽秦頌功德碑碑高二丈許其文秘石套内殿中有宋眞宗石匣内藏玉檢十六成化間曾入御覽驗爲祀泰山后土文也再東爲日觀峯有小碑亦刻名焉數步許爲望海石是爲越觀可望會稽石在頂巋然蹲跱愛而登之爲題望海石三大字又轉登仙人橋五花嶺是時天日光麗碧漢萬里豁然四望胷恢意廣見濟南城東北華不汪山如小屋建于水上俯觀白雲英英緲緲自山腰而出冐于下方北望京師南瞰淮徐西顧燕趙東眺海上以至于空峒丹穴太平太蒙之際誠天下之奇觀也飯于道院又題名篆詩于小石碑徘徊至晩方回遇崖石可愛者輙留書下山至州城則已報更矣羅洪先狀元吉水人題孔子登臨處孟子曰孔子登東山而小魯登泰山而小天下故觀於海者難爲水遊於聖人之門者難爲言觀水有術必觀其瀾日月有明容光必照焉流水之爲物也不盈科不行君子之志於道也不成章不達此言聖人之所以爲大學聖人者必貴有常不可作輟孔子雖至聖必自十五志學始十年而立又十年而不惑斯達矣故曰君子之道辟如登高必自卑未有不道中庸而能極高明者也他日述有若之言曰生民有孔子泰山之於丘垤也而願學乃在乎必有事常必有事其患弗至成章乎大中丞鎮山朱君保釐東土庶務未遑首標聖躅索題千里因探千古學脉廣所欲言並勒表側質之來者李學詩翰林編脩平度州人登岱宗記畧嗟乎山一也未登仰之彌高既登則高者復下既下則下者復高峰巒殊而烟霞異非山之變登者自變之耳山固自若也世之馳騁於浮雲富貴之途者而性天遂變曾不能知泰山之視浮雲顧以浮雲爲泰山之變其與未登初見泰山者一也子之惺然頓悟不爲浮雲所眩而眞得大觀於泰山者非今日既登之力乎尚絅叅議遊泰山記畧成化丙午春藩臬將廵行郡邑余與少叅蠡吾王君世用憲僉淇水劉君廷珪天台潘君應昌約日偕行乃以正月丁卯發濟南余與世用向夕宿靈巖寺戊辰抵泰安州己已廷珪應昌皆來庚午黎明詣草叅亭拜東岳祠遂肩輿出城北行五里及泰山之麓由紅門路過高老橋傍有水簾洞洞左爲巖巖亭少憩經馬棚崖面馬嶺路漸陡峻再行至黄峴嶺東下徑路平坦俗謂之快活三延轉而上及御帳盖宋眞宗駐蹕之所蜿蜒而上歷十八盤至南天門東北行二里及昭眞宫謁碧霞元君由宫後稍北有東岳神祠祠陰刻唐開元磨崖碑遂上登封臺有玉帝殿前建石表高丈餘或云秦之無字碑復轉東南至日觀峯舍身崖在峯之下西望則有月觀秦觀諸峯北望則有獅鴉鵓鴿二崖若西南之丈人峯東南之徂徠山尤其秀拔其青嵐鴈飛二嶺馬蹄桃花二峪與東西二神霄山大小二懸石蛻仙巖明月嶂龜陰埠楊老園皆在指顧間而下瞰汶泮二河如拖練耳人云秋氣晴肅可以見海余與世用廷珪應昌酌於昭眞宫之别室再酌於巖巖亭酒力微醺夕陽欲墜神思飛爽飄然跨滄溟凌宇宙之氣槩也山下有吕巖洞王母池白鶴泉則以薄晩不能及其他峯崖林壑幽邃之地佳景尚多不能悉記辛未出城之西門禮玉女殿即宋天書觀遂至蒿里山探鬼仙洞令道士執燭以徃陰氣侵人不可深入時廷珪有事於東兖余有事於青萊應昌將校士於他郡獨世用分治泰安乃布席張樂爲予三人者餞别歡飲竟夕而罷夫登覽古今樂事也泰山天下奇觀也四人同遊藩臬和德也不可不記勝地不常盛筵難再繼此而復來遊者亦將以興慨慕追嵗月云耳是碑在巖巖亭嘉靖九年棠陵子題其旁曰万豪由泰山絶頂迴觀尚少叅遊記山川如故英烈何存快哉傷哉後十五年方子之友見之則又如方子之非悲尚子也葉份按察司提學僉事題石刻觀海二字昔顔柳以善書鳴唐至今稱之必曰顔筋柳骨然魯公以忠烈顯公權以止諫著炳琅宇宙豈徒以其書邪心齋張公曩爲御史守關武皇北狩抗䟽回鑾風采凝然匹休徃哲平生究心字學尤善大畫當其濡毫伸紙氣定神閒得心應手端嚴遒勁蓋有出于顔桞筋骨之外者然世方以茂節高勳曰公大受而游情褚墨公固以爲藝成而下矣頃者公書觀海二大字鎸諸泰山之崖其字畫之妙如吾前所云噫字心畫也公宏中肆外惟變所適充所至焉海岱爭崇深可也然亦有巖巖氣象而難於爲水者邪右稱心齋人品氣節固宜但過許書法優於顔柳則謬矣賞鑑家當自知之姚奎通判遊石屋記泰山東數里許有石屋世傳碧霞元君煉眞之所予公暇欲徃觀焉從者曰徑隘不可輿廼易服帽貂以韋帶結腰短策芒鞋命道士劉教弘爲前導行二四里無復蹊徑披蒙茸攀巉巖傴僂而上愈進愈險下暇巔崖驚汗浹背又三里盤旋轉一岡而石屋在望矣有羽士四人癯然而迓予青松絶壑間前牽後擁廼獲濟焉瞠目縱眺上有削鐵奇峰千朵前有夷地可半畆入其中窈然而深朗然而虚明石竇涓涓凝結玉柱大十圍高丈餘晶瑩可鑒崖有元君手印玉指宛然後有石床則元君偃息處左偏一竅透絶頂頂有石樓可坐三四人氷滑不能升躋攀數磴而下力疲卧石床毛骨洒洒旁有聖水池清列而甘不盈不涸下有石曰牛心甚奇恠又下有洗鶴灣深不可測一鶴鳴于上以與人聲相應和寔眞仙境界與塵寰逈絶人之遊泰山者每以道左日窮爲畫於斯罕到孰知石屋之多奇廼爾哉石屋於予惜乎遇之晩也嗟夫世之豪傑士固有終身未之遇者遇矣而晚奚病焉道左日窮以下全用梳之石屋志文李鎔泰安州學正姚别駕總廵泰山記泰山絶頂有神祠曰天仙玉女碧霞元君岱岳毓神上通乾象英靈丕應理或然也遠近持瓣香徼福於神者肩摩轂擊歲常數十萬人至則羅拜歡呼競以財獻動以數萬計臺憲藩臬俸禀餼幣凡百經用或於兹焉取給而征歛不及於民凋瘵之餘賴以蘇息益國裕民關繫於此詎可主之非人耶嘉靖乙酉撫按藩司精選州縣廉能官分掌厥務時東昌别駕雪漁姚先生膺總廵之選先生曰利權俗吏事也吾人視之當如鶴每豈容毫縷自污乃集百執事籲神誓戒俾竭乃心綜理微密覬覦者不得逞其奸寸鏹縷絲罔或遺漏始于是冬孟月踰年季春之十日計收金銀錢幣畜産約三萬緡珠玉袍旛弗與也視徃嵗加增三之一籍上藩司以備嵗用先生廉恕立法嚴而不苛御下峻而尚簡待士恭而能愛總廵餘半載餼一取於家東昌俸金數驛取之以贍貧士其官給廪錢則易芻豆俾飼官馬損己利物常情所不堪先生不以爲難也泰山之巔層巒百餘丈俗號舍身崖有爲匹婦之諒者輒大於神自投以殞流俗以爲壯烈先生嚴禁諭遺之快活三路平而隘下有深崖險甚夜行失足而傷亡者屢矣先生捐俸植木欄自是全活者衆臺臬諸司委以訟牒斷决如流附城爲客邸者數百家前此嘗科歛之先生曰蝸涎自潤顧欲漁獵之耶吾不忍也鄉老鄒瑀輩將鐫石以振勵後人屬僕以記先生海虞人名奎學愽辭昌曾未數月著泰山紀行累數千言泰安名士李文瀚馬載道高民悅諸賢相與倡和顧僕謭陋曷彰厥羨擊泰缶以寫韶英有遺音者矣勉書以貽之嘉靖五年高誨通判遊泰山記泰山在州治北高四萬餘尺延袤幾二百里名峯七十有二其㠝岏列巘森然而供秀者弗可勝紀古爲東鎮天下之山莫高焉予徃歲計偕上春官取道登謁時甚寒倉卒以未獲盡觀奇勝爲恨嘉靖壬午冬予由青城轉東萊司馬臺檄督岱宗事癸未春三月六日肩輿出自北城門踰小橋二里道左右亂石棊布近麓有廟祀池館俱壯麗左有老栢數株相傳漢武帝東封時所植也又二里至紅門跨道爲飛雲閣道傍爲更衣亭楔扁曰宗岳循溪産天麻黄精諸藥土人負筐采之又五里至高老橋有漢壽亭侯祠祠前桃李始華稍前爲水簾洞泉自天紳巖出飛流垂練聽之泠泠然下有小石橋通泉于溪左爲巖巖亭登之畢見景物又四里至馬棚崖稍前爲回馬嶺山石漸峻且奇林木亦幽邃溪崖有椒有梅杏櫻桃山居者資以爲利又五里至黄岘嶺西行折東北上而復下又西行折東北則下而復上雖屈曲下上率坦易凡三以里計亦三遊人疲于峻陟至是舒快名曰快活三云其西巖有竹繁茂又五里至御帳宋眞宗駐蹕之所五松高數丈秦皇避雨其下封大夫云竹林僧獻松花餅啖之香美復進甌茶問之曰東巖所産味亦清苦又五里至大小龍口兩山懸削水從石峽噴瀉上有古松偃仰若蟠虬然又五里至十八盤崖間楸槲野棠山榴彌桃或花或實石磴齒齒倚空仰視似有不可至者乃傴僂攀援以上盤盡至峽口高處石門題曰南天門有三靈廟又東北二里爲元君祠左側石方池曰玉女泉一夕聖水甘寒清冽汲以烹茗味可比浮龍泉又東北至岳神銘祠後有唐磨崖碑二一爲開元記泰山之一爲乾封朝覲頌側多古人題詠蘚蝕不可讀又北土至絶頂有玉帝祠祠前石長丈餘一名秦王無字碑又東南行至日觀峰人云鷄鳴時見日山有石函方丈許人云成化間雨水衝决得王檢以獻命中使瘞舊所即此峰之西巍然而突出者秦觀峰也稍南而獨見者越觀峰也峯之下壁立萬仞者舍身崖也崖之右則試心石仙人橋也延竚四望滄溟東拆河流天傾而汶水湯湯秪環一綫西南萬山伏地殆如米撮惟徂徠尼父僅露春可指耳近顧諸峰若丈人若回鴈若蓮化若明月若東西神霄雲烟相盪勢若爭雄其不能以一峰名而附之以見者如拱如揖凛然有夔夔聽命之狀眞奇觀也予始至瘦石嶙峋剛風怒嚎溪竹崖松宜雪宜月其尤足聽聞者樵斧之聲與崆峒應答既而爲鳴花麗萬谷皆春泉香可啜蔬美可饌山容于是乎忻忻然而人亦得以樂之至於溪雲出没而陰晴變化于立談之頃此又造物者之翕張而莫知其所以然也夫山之景象奇于冬麗于春而遊人或拘于時止于暫予以公事久于斯而之順于下上則夫山之情狀景之變態古人遊豫登眺之迹靡不襲其芳而踵之兹遊也可不謂獨勝乎書以紀嵗月是作最勝黄鰲僉事九日登岱記嘉靖乙巳夏予以防秋董戌德州九月朔聞侍御南渠黄公東廵既遍由沂而北歷兖濟以至泰安子迎而侍之適未至而重陽且届期焉刺史仲言永曰九日登高舊事也請追之予然而告之曰九日天之勝也爲一兵一阜皆足以記時令泰山地之勝也自古封而禪之凡得以躡其巔者皆足以齒壯遊予閩産也乃逢是日而獲登之顧不勝與於是改制登山之輿詰且爰登而刺吏從焉窮其所至山中古今所傳前人之述備矣惟是日也天朗氣清金風載爽坐玉皇之頂撫没字之碑則見聯絳岳鎮翼我上皇圖黄河控秦吴之盛崙薦夷夏之觀廓如也既而日忽忽其將暮景翳翳以偕入百靈萬籟之號作焉吾馮而夷猶之心矌神怡景物偕融灝氣同流若有以揖太乙而叅之焉者不敢以荒也退而就館舍旦復躡日觀峰則見心房之野昧爽朏明黑雲驅而上浮黄雲擁而下升朦朧掩靄之間忽有點若朱丹若火蹈破重霧而耀紅光奇觀也湏臾而半出雲間則天明景藏弓直歸矣歸而下歷水簾洞聞其東有石經爲王右軍所筆但山峻峪深不可以行耳乃息肩輿攀縁而上杖屨而下則見盤石若礪大書蒼拙體莊而神思飛逸歷千萬載爛然與天文上下日相昭回鬼神呵護之功哉間有爲巔石落而破壞者有爲水浸溜而就平者豈造化亦有所忌也與世傳眞草小書與此大相逈别或疑其未必出諸右軍云既而西訪竹林禪刹無以觀也惟有所由之峪則恍若山陰蘭亭之狀泉落百丈之崖若拖練而下篤齋湯子題曰瀑布淵深白龍之池雩則取水迎而禱之子題曰霖原細流屈曲而出可以浮觴夾流獨石可以盤坐溪山掩映嵐光洸瀁可以題詠又出而磐石横亘粹若白璧方之經石爲小聞有前人之作求之弗得則天又且暮而歸惘惘然有未盡之懷也吾徒春元劉一柱者知其處旦携匠搨之以獻乃元初天曆間辟世之士之所作也噫予南人獲遊上國最晚信宿盡得天地古今之勝豈非遇與刺史君曰九日登泰山閱諸編帙未之前睹也可以無紀乎遂記之又爲之詞曰泰山兮崔嵬九日兮凄清登絶頂兮巃蓯乘天風兮震驚雜芳珮兮陸離飲菊酒兮酩酊追遺踪兮不可見問太空兮冥冥洪朝選侍郎同安人乾樞坤維說或問於予曰何以題泰山爲乾之樞坤之維也予曰有說矣史記封禪書云謂之齊以天齊也言齊居天地之中如人身有臍然其胷腹肢體高下長短一於是取則焉漢書言天下之安猶泰山而四維之也解之者曰維猶繫也獨言泰山者泰山至安者也加之以維則愈安矣予謂今世之言泰山居東爲東鎮自瀛海之内言之爾若以四海九州中夏夷狄瀛海内外視之則中也今泰山在濟南封内固云齊境矣取義於乾樞非耶名之坤維安也或曰以樞維名泰山指山言耳推之人心有可說者乎予曰人之心之中猶泰山之中也人之心之安猶泰山之安也世顧不之察耳今夫仁者天地生物之心而人受中以生之理也而戕賊之者至於虐人害物禮義廉耻者人之四維也而喪失之者至於不顧惟利之趨此予之所甚憫也予觀登兹山者肩摩踵接其來也爲避禍而求福耳盍亦求之吾心之泰山乎一或反而求之則所以存其仁守其禮義廉耻者將不出户而得泰山矣何安如之耶予既答或者因鐫其說於石以示來登山者云世貞侍郎太倉人游太山記余自戊午己未間有事於太山者三而其稍可紀者第二游也其初游爲正月晦自清源謁臺返與海道宋丈太武偕夜浴於使院三鼓起啓堂之北扉而望若曳匹練者自山趾上至絶頂又似聚螢數面斛囊中光熠燿不定問之乃以兹時士女禮元君燈魚貫而上者也其頌祝亦隱隱可聽云以黎明入山即陰晦浮雲出没眥際十步外不辨物第覺輿人之前趾高而余前僂而已即絶頂亦無所睹見且寒甚宋文迫欲返還憇酆都宫趣觴舉者數而後膚不栗也甚悔之至六月朔偕御吏段君按部太安段君約以三日登而諸道從者衆度不任輿馬余乃與叅議徐君文通請以二日先段君許之至夕而大雨其次日雨止出泰安可二里所即入山時禾麥甫熟黄緑間錯如繡拂拂作餅餌香𣗳杪濃陰暈之意甚適而至無掌故可詢者自是皆詰曲逶迤而上峰勢嶻嶭若相噬而傍多溪澗泉流碨礧間作悲鳴與笳吹相應久之至廻馬嶺乃却肩輿改從腰筍又四里抵御障巖一曰御仗宋永定陵東封止仗衛處其前爲巨澗澗底白石砥平如玉色而巖陟上廟其巔頗寬嘉樹蔭之好鳥喈喈可愛又行可三里抵黄現黄現者不知其所名有松二即所謂五大夫者也以厄於石不能茂而稍具虬虺狀當是二三百餘年物亡何爲百丈崕崕凹深如屋傍有石𣵣槎口而下黑其究叵測已度石壁峪爲十八盤應劭所謂兩從者扶掖前人相牽後人見前人履底前人見後人頂如畫重累者非此地也耶而今道益飭治且有舁者所謂五六步一休喋喋遽頓地不避燥濕前有燥地曰視而兩脚不通且幸免矣自是爲十八盤者三而穿中竇曰天門既上罡風蓬蓬然吹帽欲墮道士衣羽奉樂而迎出没雲氣中亦一奇觀也行可里許爲元君祠元君者不知其所由始或曰即華山玉女也天下之祝釐祈福者趣焉祠宇頗瑰偉而嵗所入香緡以萬計用供縣官匪頒其右爲御史所棲後一石三尺許刻李斯篆二行一石池縱廣及深俱二尺許亦曰王女洗頭盆也自是左折而上里許曰嶽帝祠陋不能勝杳火其峭壁造天左爲開元帝紀泰山銘唐隸徑可二寸而嬴勢若飛動惜其下三尺許爲搨碑者冬月搆火蝕之遂不全右爲蘇頲東封頌字形頗秀媚尚可辨而損於閩人林㷆忠孝廉節四大字又有顔魯公題名損於方元焕詩固不若苔土埋翳之尚可洗而有也自是益北上數百武爲絶頂曰玉皇祠祠之前有石柱方而色黄理亦細可丈許所謂秦皇無字碑也其石非山所有或曰中有碑石冐之按李太宰裕記云石埋植土中似方非方四面廣狹不等細觀之總不二行行各十二字多不可識今殊不然然李公以爲在開元銘東十數步則非此在明矣恨曩時不於其地一訪搨使先跡泯泯也復折而東稍下百步復上百步石室冠之高如玉皇祠中有釐色石盖方丈瑩潤可鑑云漢武帝所藏金泥玉檢地也傳云白雲起封中者是已其前地稍闢即所稱曰觀秦觀越觀諸峰者蓋五鼓而起觀日出則爲日觀西望而見秦則爲秦觀南望而見越則爲越觀耳其後人所指某峰某峰皆妄也時霧氣重不可久憩又亡所覩見如春時怏怏而下適徐君至呼酒談詩甚樂三鼓而寢約以五鼓起觀日出然其寢皆以丼甚醒則高舂矣意恍恍不自得强與徐君扶杖而尋昨所游時天初霽日益弄色其東南盡目力微白而晃漾者以爲海耶直北而西隱隱一抹蒼碧若長城之堞者則意以爲太行恒崧之類耳至稍遠而淄渑濟泗千流疊帶近而諸山皆若培塿獨徂徠稍尊居然一衡几瞪眺久之因與徐君語傳所稱吴門白馬固未敢信即小天下豈欺我哉俄而諸山各出白雲一縷若冢中起稍上大如席凡數百道則徃馳而遇輙合其起無盡其狂馳而遇亦如之頃刻遂徧成白玉地而仰視則空青瑩然上下異色呼酒與徐君酌自以爲生平之創目所謂野馬絪緼信也俄而報段君至從行者叅政張丈希舉副使李君嵩僉事王君遴張君師价因置酒於其署移席玉皇祠南栢𣗳下記云漢武所種千株大者十五六圍今不能十之一而小疑即其孫枝也酒小間散步至舍身崕其缺處可三尺而下臨杳靄數千仞張丈足縮不敢前而王君席間慷慨談兵事乃亦縮弗前張丈顧而曰君扼腕而談兵毋敢抗者乃亦弗前耶余笑曰此自兵法諸君弗察耳夫無進生而有退生此王君所以弗前也王君亦大笑乃别段君約以次日縁尋山諸勝乃下五鼓復大雨雨連日夕不休余始與徐君同舍而張丈王君舍圮漏乃移就余而舍中水亦將二尺因布長几置枕簟其上小吏裸而行酒炙所劇談六合内外張丈又時時以雅謔雜之凡四日雨始小息夜卧倦甚王君苦吟若寒蟬又時時提余耳告以所得句余不勝嫐强起顧視天碧凈如浣而大星百餘巨於杯歷歷簷角始可仰而摘也質明復大雨州供業已盡乃行辭段君與諸君偕發時寒甚衣絹素至五重不解亦有乞道士木綿裘者下天門雨止日出每十八盤竟輒去一衣至御障巖衣去且盡時巖傍飛瀑爭下凡二十餘丈濤飜雪濆若闘龍吐蟄玉鱗四飛珠沫群唾余興發不可遏跣立磐石流泉中呼酒數大白輙釂長歌振林樾諸君皆壯之有和者有就取飲者移時而報段君至相與之酆都宫爲小宴别其眀年之四月朔以行部道出萊蕪會家大人有邊事事甫定乃乞靈於太嶽以間登焉將五皷杖策日觀峰頃之東方色微辨而顧余及從者衣洞赤已覩石室及諸碑碣盡赤乃見一線赤從東黯對中起顧山之背則猶昏然鷄蓋三喔也又頃之日輪徐上雲君電師金支翠旂彷彿扈從於是諸峰城郭盡現而山之觀與世同矣余三登而始畢其勝然目境耳其峰之爲回鴈爲鷄籠爲蓮花爲明月爲丈人爲獨秀爲東西神霄崕之爲百丈爲馬棚爲鵓鴿峪之爲石經爲桃花爲馬蹄石之爲牛心爲龍口爲試劔爲龍紋虎阜峒之爲吕公爲白雲爲遥觀泉之爲白鶴爲水簾爲白龍諸用怪偉偁者固未一二探也夫以封禪告成之主凡七十二而結繩者半之天地之人文鬱而後世之愽識者不能舉其略辭之不可以已也如此哉去余兹役十有七年矣而所經睹若夙夕會至自太和有所撰述因併記之其後二游各有詩詩爲七言律凡十首王世懋太常少卿太倉人東游記萬曆丁丑秋閏八月王子朝於京師歸竝故道返於閭井中間忽念生平之游缺焉於懷者三而兹行可一舉盡也泰岱爲五嶽宗客嵗登太華巔顧獨於岱宗一屐齒是恡將爲青帝所誚釋褐且二十年不識闕里暨林作何狀其若在二之義何又故人李于鱗物化八載鷄酒之酹弗躬喬玄當令阿腹痛失今不假傳一行病夫業且歸卧轅不北矣恐遂爲終身悔乃自奮曰即病必徃而會同事中亦有先我行者傳車至德州問道於州之守耿君耿君曰從兹入平原竝禹城齊河而南之長清此走泰山道也是稍東當故道不能迂百里余曰以行李累東諸侯奈何曰等費耳且以蘇孔道便浙之叅政者曰舒嶺之參議者曰陳兩公者先公一日行矣余喜而從之于鱗家歷下而齊河去歷四十里而近業欲拜于鱗墓不可令兩臺使者知乃計爲羸服間行而先一力聞之于鱗子駒駒報曰先人墓在長清道中毋煩間行也余益喜過望遂發齊河稍折而東幾迷失道會候者至云墓近矣請小憩民家以待駒駒至即與偕行墓所僅一尺土丘中耳無周垣封𣗳非得駒不能識也問之云將卜遷别葬耳伫立凄然具酒殽設拜焚所爲文及詩雨泣而别日暍抵長清聞舒陳兩公尚留靈巖寺亟以一力先約之共游亡何陳公以刺來迎乃趣復前侵夜抵崓山餔宿夜大風寒晨起躡霜而趨舒公刺迎者亦來知兩君子能爲我留甚幸入山可三里許始爲馳道陟壑中斷石梁跨之甚雄遥望諸山圍列鱗次天設屏障梵宇浮圍涌出翠微間眞天下奥區也入門禮大士畢即徃舒陳二公所口占一詩謝其見遲二公已設素食相留矣飯畢具軟輿二僧導而前凡山所名勝處卒一至焉靈巖下垂一石人立而向者朗公石也石沼渟泓亭而覆之涓涓岀於佛足復匯爲外沼而漫流山麓間已忽伏而不見者泉也别院曰達摩旁湧起一鐵金塗之高可四尺闊殺其一背僂面拗天爲紋縷作水田狀者鐵袈裟也已稍間歷而上里一亭而止度其上不可登仰視絶頂下有平壤草木蔭映縫宇出焉有廬其傍者一僧一行居之時上下取水如是者五寒暑矣意其人脩頭陀行者恨不一見瞻眺久之而下時舒公小劇頓泉亭相待予與陳公迤邐下從之返舍視僧房竹蒼翠數百竿山以東所無也小憇復出講堂前模宋碑數通讀之步入香積厨見復沼一泉盎而不溢其旁㶁㶁細流環之問之僧云又一脉也厨之後復有來鶴二泉盎如厨泉而細大都兹山以泉勝其泉或盎或流或伏或見或交或斷僧亦不能盡名也寺當天下四名刹像構宏麗閣三重峙其前浮屠七級標其右余與陳公據閣巔而望焉浮圖不盡四級而止其山四圍故不能遠眺也下浮圖而南爲魯般洞洞上縁傾崖周甃以石而成二石門内犍不可入似爲開山僧埋骨地云於是山之勝幾盡獨所謂通明覈者未之見僧云出山二里外傍去不數武可望而窺也余兄元美嘗爲余言靈巖是泰山背最幽絶處游泰山不靈巖不成游也問山僧余兄所題處得碑二碑皆手書詩皆十二韻凡經再游而得者去今二十年矣是夜飯畢各就寢余因得排律一首韻如家兄數晨起書石付山僧而去次日與舒陳二公魚貫而行午餔後抵泰安州州守迎問登山期余輩以晨發告而東嶽神廟乃在城中得以其隟徃謁焉廟制宏敞城其四周前爲門者三中爲饗殿後爲寢宫儼然帝居也穹碑古栢森嚴布列前除怪石碁置視其題刻皆宋元間人浮海來獻者予與兩公拜畢循覽四顧而下則州守已張具别館矣雖饌皆素品而設樂爲禮甚都力强之陪乃坐余甚愧其厚爲坐久之起更衣見頂山如在檐桷間可俯而窺也凡山以夜色視則畢皆兩公所未試者聞余言以爲奇漏下二鼓而散次早戒行舒公以服藥請後從予與陳公兩肩輿先發至更衣亭始屏騶從易軟輿而上是曰氣朗風恬游意甚愜見兩山腋抱骨削流泉下注陟壑時爲㶁㶁聲仰視中峯雲爭瀰漫其上始覺泰岱爲高顧輿夫力疲下就一壤憇焉望汶水如帶諸山培塿獨徂徠當其前如大賓無少降意予與陳公歡賞其雄已復就輿歷高老橋而上左一右墳起細泉漫流其上而出逶迤墮右澗則所謂水簾也石卑而泉涸不能奇已又折而前見所謂馬棚崖者屏立道右稍當奇觀歷磴久之地忽平衍可三里許土人名之曰快活三余昔游華山備歷艱阻亡論此山平處即大崎嶇不能當華十之三因戲題一絶云曾爲太華峯頭客是處堪名快活三非謾語也又前爲迴馬嶺盖自此始不可騎云行久之抵玉皇閣石關當其前兹山一隘也從閣折而西盤紆直上二天門出焉其下兩崖削立𣗳木蒙茸泉如建領下巨石怒撑瀉作潺潺聲穿隙而墮坐石弄泉仰視御帳崖眞爲勝絶䖏御帳崖者宋眞宗駐蹕地也今爲憇客亭傍植二松鑱石其下謂秦所封五大夫云松故丘隴間常木耳爲之失笑飯畢更上見三天門縹緲雲霧間雙闕天峙兩峽束之十八盤鱗鱗萬梯舁夫喘汗數易仰視峽口忽遠忽近殆神仙徑也具輿且步至天門則蕩然平壤矣爲市而廬者可三十家盡廬則碧霞元君宫焉前爲焚楮地廣畒許火日夜不息金舖朱户楔棹儼立天關福地似非偶然予與陳公小憇公署即具吉服瞻拜焚施而退考道書元君即華山玉女也不知金支翠旗中能識舊游玉井客否相與迓舒公久之不至乃拉陳公縱游諸峰巔巖障羅立鐫題百出至不暇酬接其最穪鉅麗者爲磨崖碑唐玄宗八分書東封頌也崖之半爲蘇許公書隱隱尚可辨已爲俗子書四大字盖之矣稍上而北絶頂峙焉石湧起爲小阜屋其陰而垣之前跨高標秦皇帝無字碑也碑形廣厚四匀上爲幢蓋余斷謂非蓋既封而標識其巔耳獨其石膩白而堅非山所産不解何力致之乃知驅石事故當不𧨀覽竟復步而南眺所謂日月吴秦諸觀捨身石梁諸崖與古封禪臺宋東封玉簡流出處皆廵歷指點所至徘徊盡興南望汶水遠從萊蕪至徂徠障之北來諸流併入蠖屋蛇騰西流無際羣峰蹲伏拱列青烟數點時爲聚落目力所至乃過徂徠南境兹山僅當門户一巒非復向時相賓態矣西顧日色黯黯雲霾時翳遠水燦落映日如星細視久之始别爲水最後望極天處一圓光耿耿欲墮非先所見幻態衆譁視之星也盖辰星先日而下居恒不辨見之耳上下稍劇余與陳公據石而坐見山陰萬壑隈㘭中𨺗起一山梵宫翠色隱隱旁抱周廬意其奥壤可游也問之羽人曰泥僧所托故無他奇遂已於時纖飈不起燠若春和竟迓舒公不至遂就峰之别館憇焉則日已崦嵫亟呼陳公憑垣而望熒熒半規漸没虞淵亡異尋常見也獨已没再吐若瑪瑙盤縫紗蒙之眞從水底見其浮沉故是人間一大奇觀耳時舒公正禮元君畢余二人望肩輿冉冉而至至則陳公爲主將入坐陰風四起手足忽在層氷間亟起易衣呼酒敵之已乃向舒公詫諸勝游舒笑曰即讓二君顧兹山第一奇不佞先之矣叩之則李斯斷碣舒公署中物也爲之撫掌酒罷散去約以鷄鳴登日觀峰望日初出未晨余先二公則屏障酒果俱從頃之二公至了不辨色雖居室中剛風從背入厲甚亟蔽以屏陳公擁毯而坐猶戰慄不能當乃呼大白連浮之身稍得住已而霞光漸起才可辨色見一大赤丸半露雲海間亡異没時再見者已復不見良久始復出則已爲陰雲所翳無他奇矣余回署中書紀游姓名紙上將勒之石袖腕僵不能出湏火乃成書高寒異下界乃爾書罷徃舒公所觀李斯小篆右石函巖壁間尚餘數行可讀天護神物也其旁爲玉女池碑紀之亦一勝云舒公將續昨游予二人復從之徧歷諸勝處乃復就别館張具余爲主人猶素食以二公有事科醮也飯罷二公徃焚香余無事謂可亟下先之曲阜也天忽作霧撲面如絮下至御帳崖則舒公兩以傔人力挽盖舒爲石經峪主人也余不得已停石經峪待之峪去道傍不半里石可坐數百人上勒八分書皆佛經俗傳王右軍書非也書不能唐定宋人筆耳石之上崕高三四尺許泉奔瀉直下侍郎萬公大書水簾二字鐫深寸許泉嵌入字中殊有勝態萬公又爲石亭臨泉旁亭之左磨崖高二丈公鎸記其上頗當下方絶勝處余坐亭中臨流獨酌久之二公乃至張樂小室中天已向暮坐盡一鼓而下燈火夾道迤邐入城漏下二刻矣頗患以供億累州民一切謝遣之擬以明晨間道走曲阜陳公欲徃寧陽有所會約余二人停曲阜以待次早遂行並徂徠而南未百里曲阜之候騎悉集侵暮渡洙泗令尹來迎孔氏世官也入城覩閭井蕭條甚而供億不廢余甚愧之晨起與舒公且吉服伏謁闕里廟制巨麗甲於天下瞻仰遺像讃述功德婆娑杏壇追存聖澤下撫庭柯皆合抱千雲材也獨所謂手植檜者大不能抱枯幹無枝縷紋左向色理甚古讀其碑始知再榮異代生里猶存爲之吐舌予不語恠胡此變相無舛二氏耶漢碑皆列植儀門外都不甚剥蝕形製奇古行天下所見太學石鼓文及是耳覽竟磬折而去可百武至顔廟制視闕里而事事减殺肅拜而出門之右甃一大井爲亭焉俾名其里曰陋巷此當有據然不可考矣過衍聖公門公尚卧未起乃復與舒公出北城謁孔林林距城五里而近馳道如弦檜栢夾道周甚偉林東西設兩觀門甫入門聞笳吹聲驛報陳公至矣余與舒公迓之門即與俱入墓所候陳公更衣共拜亭及饗殿徂蕪壞不治余謂此衍聖公責也何必待官家循殿後行子貢所植楷在焉大倍他植枯而不蝕直古木也稍北而西曰子思墓又北曰伯魚墓稍折而西北庭除漸廣則夫子墓也旁扁一廬云子貢築室䖏夫子墓特高廣拜畢余登其上草木蒙茸多不可識已復出拜二墓循覽墻内果無荆棘斯之謂異矣其地平衍無大原隰山皆纍纍遠綴嶧山南列翠屏似爲之案余不能名其鍾秀也出林望東南一隰殿設碧瓦周文公祀焉復徃瞻拜聞其地爲魯靈光殿址云故知今城不能當魯半也出周廟遂從東城入憇公署頃之衍聖公來自言病狀予與兩公答拜且少贄公爲且款焉告以將之鄒别去是夜抵鄒眀過嶧山旁意忽之且倦游矣猶不能忘懷至臨城范大澈鴻臚偶會余告以勝游范曰曾登嶧山乎余曰未也范憮然謂余君奈何釋此奇觀其石皆嵌空𤫩瓏第稍難陟耳今爲恨恨不能已抵家久之將握管紀勝會故膠倅吕君相過道泰山事曰恨公不能游山北隈㘭間石大奇勝非山陽比問其地正余所指尼寺也因歎兹游得假傳車乘簡書之隙扶病登拜頗愜生平願然猶有遺憾若此因併識之以告後之游者劉宗岱副使歷城人處士松跋余自嘉靖巳酉夏始來登泰山見秦始皇所封五大夫松者聳而立又里許見一松偃蹇如蓋曰處士松乃近日方兩江氏題以其不與秦封云嗚呼距秦迄今幾千百歲人但知有大夫松不知有䖏士松豈物之顯晦有時歟暨隆慶戊辰春余再來登泰山嵗月曾幾何向所見五大夫松者已亡其三獨處士松尚依然無恙豈物之榮枯有數歟抑養素者終吉怙寵者多敗固物之自取然歟今安陽翟公又改處士松爲獨立大夫疑若曾受秦封者嗚呼五大夫松之存亡不足惜余獨惜夫處士松何不幸而多斯名也噫吴同春郎中固始人登泰山記余嘗兩過東省未及登岱嶽萬曆癸未十月有晋陽之命二親在里欲過而覲省計程東出縮西出四百里以余里居豫東南邇于東省以越月二日發京師八日至德州計程東出長西出二百里泰山當東出余咲曰余里人率自京西出今以長者二百减縮者二百猶縮二百里也奈何弗登岱嶽同年吴子得時按東省舊寅李友卿適守濟南此自京各抵以書至德州子得使來至平原友卿使亦來余階沈生東北沈生者慈谿人館于余以十日宿灣堆灣堆至泰安七十里至頂又四十里自山前徃土人曰自此至桃花峪四十里至頂四十里自山後徃山後多佳山前徃亦山前返故遊人罕至余曰即微縮山前吾且從山後矣十一日晨興二十里至店臺東南趨桃花上下山坂者十數至桃花則泰安賈守所督諸役至飯已四力役以山輿來輿肖輦而無輪息則人坐于地自是兩旁皆山人行峪中復從東北行數里至姜倪寨綘山導吾左傲山翼吾右雲臺石棚如拱如揖招余而前唯中軍坪與吾輿相背而馳路傍峪曲折逶迤如蚓如螺初猶記一二久則不復置胸臆又數里由摩耳石坐鐵佛寺酒數行至海眼沈生投石水中聲殷不絶五里至思鄉嶺又十餘里至桂師庵萬松連云奥踞岩半且行且飲下觀虎穴題岱西佳處于岩由之風嶺經雲臺庵路益峻絶輿不能上從以步又十里達頂盖路四十里而余嘗步者半頂前爲元君祠右爲公署賈守逆余署前守嘗爲余屬者天瞑且雪不及謁元君署後觀玉女池與賈守共摹秦篆碑讀焉碑嵌岩中止存三十字宋劉跋嘗謂搨得二百念二字今且缺石之半細矚右旁彷彿猶見字形劉謂周圍悉有刻字又謂四旁廣狹不等信然酒竟出立岩端上下四維混茫一色白雲如絮徃徃攪人鬚眉墮衣袖中而四方挾香楮至者呼籲鍧轟震動岩谷山上下諸館舍懸燈張市送逆徃來繁若元夕辭賈守就寢以五鼓觀日賈守戒執事者四鼓謁元君四鼓賈守陳牲醴以四諸生來余爲文謁元君已同沈生由祠西折北上至日觀峰賈守與四諸生從至則雲溶溶作障余曰將不得觀日出乎賈守曰姑俟之已東方色白手他方雲亦漸薄余凝神東矚而光在東南則日欲出巽也頃之雲若席捲而上横拖一帶如長城其下光芒閃爍精熒熒遠射間雜薄靄如隔踈簾天南北光彩萬丈若虹峰端忽戴紺流紫人冠服色相如坐夕照則日已出海矣問道士海所在指日下晶光一縷余視之僅若一電旋即没矣日初出若金漸旦漸白始大如輪漸高漸縮初遠見海水近不辨几席既而諸峯盡露而海上瞑色漸起反不知幾千萬里曩吾于先生觀日摹寫盡妙余嘗爲圖展玩今其境微異于先生值天朗氣清而此則多浮雲爲崇耳賈守曰此而不飲如果海何共踞望海石大觴醉謂賈守曰海上三神山或不出吾所觀外安得有神人者挾泰山而超之使我坐臨日窟瞰其出入不令無端浮雲横我眉睫耶已下探試心石回觀宋封臺石函丈許或曰寳藏庫以瘞書玉簡云南下至舍生岩岩危石萬仞余俯而下視貫守使數人拉余衣且恐之余咲曰無庸吾固不欲舍此也又東南折石矯起負岩作海日奇觀大書鐫之又其下則東天門矣右折登仙人橋橋二石互立懸撑絶壁西上至平頂峰賈守設筵以歌兒侑觴余欲亟觀諸峯賈守且欲竟傳奇一酌三起始辭賈守而余自徃諸峯賈守復令歌兒從由秦觀峰登玉皇祠蓋岱宗絶頂矣前爲秦無字碑碑高數丈色黄白間雜紅紫或曰秦之石表踞頂南視間道垂垂下至山麓汶水繞郡南梁父蒙嶧雲亭尼丘咸作培塿唯徂徠鞍牛爲山趾所掩不露頂顧東則大陵蜿蜒由長城故趾達海西則靈岩鰲山至于太行若華不注長白諸嶺横拖歷城左右環拱于北眞所謂蓬玄奥區天空絶境也頂傍爲秦封臺曩以玉皇祠覆嶽頂南昌萬公移置頂北故頂石森露余即石傍題元嶽穹巔四字由頂西里許登丈人峰又里許登石馬山據馬三躍輙恨不前道士曰此下東北則堯觀臺下有玉女洞即昔玉女修眞所也遠不至由頂左折觀廣生殿元君寢宫又西南折登孔子崖即孔子小天下處一銅像置斗室泰山祠宇輝耀而孔子廟爾爾輙爲嘆息施經東嶽祠觀唐磨崖碑碑爲玄宗八分書字五寸筆法遒勁可愛其下小洞名桃花泉甘澹異諸泉出祠東上崖間多古書鐫毁過半殊可惜以四鼓祠元君未及覽復至祠環視金碧璀璨足稱靈府五華崖自右環拱即所謂同觀峰也辭神南下西折數百步至白雲洞洞臨縣岩洞北爲鳳凰山又西北折二里登越觀峰旁拱嶽頂左瞰白雲其下爲西天門山以西諸峰歷歷可數酒數舉歌聲合作聲徹雲中由一天門南下環道三十六所謂上下十八盤也路陡絶復從以步但以兩人掖五里至大龍口又五里至小龍口奇石環列松篁交翠坐少頃過御帳坪又下爲朝陽洞賈守使人將子得意持搕至𩛡半山亭三里爲二天門觀大夫松松二踞道左一合抱不能一不及合抱謂秦封五大夫即此然耶否耶又其下俗呼快活三解者曰呼山之誤改鐫快活山于岩余謂此平處三里其下又復嶔崎俗呼爲是由黄現嶺十里至回馬嶺北爲玉帝觀前爲昇仙閣又五里爲歇馬棚崖削數仞上有墨書三畫風雨不磨人以爲仙又五里爲水簾洞水自懸巖倒射望之若簾去水簾五十步東折五里爲石經峪雪甚余習聞經峪之勝衝雪徃平石半畒上鐫金剛經字徑尺許掃雪漫讀點畫皆玉流水高山爭奇兢秀别爲一境又十里由高老橋至紅門所謂一天門始出山峪漏下數刻矣自一天門至是巍閣邃宇古篆大書初猶記一二久亦不復置胸臆道路磥砢崎嶇莫能名狀直下四十里而余步行者亦半也已火光人喧漸逼車下則賈守命巨燎逆山下復右折至岱嶽觀尋漢武所植栢僅存數株龍鱗剥落殆盡東至王母池兩崖峙起水聲淙淙度木橋觀吕公洞由登封門入禮嶽祠祠壯麗宏偉直擬帝居諸古今碑刻燃燎婆娑僅經目耳三鼓至館舍就寢明日出城南觀陰字碑與賈守别三嶽子曰余登泰嶽諸觀未嘗不感嘆移時吴昔余宦遊所越余宦游時所嘗徃秦則前歲所周歷嘗登太華絶頂周亦去嵗過汝坐嵩巔而望長河故䖏也余三十餘年足跡幾半天下而三嵗登三嶽率在仲冬則遇亦奇矣登太華同子原登嵩高同鄭公允升今子願在吴鄭公在周余于二觀尤三致意云鍾宇淳松江人叅議泰山紀遊不佞生東南菰廬中長而蒯劍上國慕子長氏壯遊欲償向子平五岳之願顧磬折風塵未能也癸未出春明買舟抵清源决策游自岱宗始云取間道直𢪔山麓時桃柳芳妍雉麥朝鴝殊媚行色行百里許諸山蜿蜒横亘英英懸馬頭所謂齊魯青未了者空翠欲滴已而遠眉横黛出霄漢問之知爲岱岳也遊興益脉脉動廼道旁多童堅嫠婦采柔萌滿筐云貧無食者取和麥麵啖之爲之憮然民力竭矣且旱久愁無麥祈㴻濡甚急私念大山雲出不膚寸不崇朝霖雨天下山靈何靳此一片雲也近州數里有山如覆盂爲古仙洞深黑叵測適二童子秉炬至從傴僂行數武稍寬衍可俯仰廼折而境益逼仄虵行無足䖏腥風逆鼻不可近亟從故道出至州治午餉出北城門踰小橋二里許道左右俱亂石齒齒馬足枳不前近麓有廟池館甚飭古栢陰陰相傳漢武帝東封植也有野致又二里至紅門跨道爲飛雲閣從傍至更衣亭易一筍輿逶迤五里至高老橋有祠祠漢壽亭侯時桃著花穠艷若綺疑爲武陵桃源不知洞口流出胡麻幾許前爲水簾洞云泉源自天紳巖來當雨後泉流飛射噴激如萬斛明珠狀時久旱泉脉甚微不得睹爲一快有小石橋通泉於溪左爲巖巖有亭宜眺又四里至馬棚崖稍前爲廻馬嶺至此山益峻且奇馬却行矣五里至黄峴嶺東西下上者再廻旋而行爲里者三然地頗夷人名爲快活三余咲謂當名折㯀谷矣又五里至御幛一名御仗眞宗駐驛䖏有松二秦時封五大夫此即其二糺虬偃蹇鱗鬛風雨欲飛去然可百嵗物或後人所植抑其孫枝邪移視久之賦五松秦封不觧是恩私御幢空傳駐蹕時輦道蒼茫人去遠年年風雨自孫枝又折而前曰百丈崖崖空嵌如石屋可容數十胡床吹洞簫薛蘿家絡如挂老衲旁有石洞谽深廣如古仙洞亦一奇也又五里至大小兩龍峪石罅如龍哆其口水自中出有古松亭亭如葆車名處士松或好事者若爲避秦然余謂此君蒼顔素髮剥落傲睨氷雪崖石間無論不辱秦即䖏士于君何有哉上朝陽洞度十八盤應劭所謂後人見前人踵前人見後人頂者至三天門又十八盤達碧霞元君宫已熒熒燈火北斗平臨矣乃假宿公署時罡風震撼巖谷夜就寢若大海翻濤天河倒瀉疑從張騫乘槎問津牛女又泠然如列子御風行也鷄三喔起披衣就日觀觀日出值雲霧罩隔大海漫漫不能如昌黎開雲衡岳從黯對中睹飛霞百丈湧大金輪浴浸扶桑矣厥明見石題東觀日出西見河源爲之神王已復折而下禮碧霞君時乞靈者以千百計有州倅受香緡嵗以數萬供縣官匪頒携榼小酌而别宫右側有玉女泉爲亭冠之相傳即玉女洗頭盆泉清冽沁人脾骨口占鴻濛一窮何泠泠吐飲灝氣通仙靈金莖僊掌渺何許我來頓使塵盧屏又右石三尺許爲李斯斷碑自是秦以前物折而東北至嶽神祠祠後有磨崖碑爲開元帝紀泰山銘甚奇峻唐隸徑可如掌雖剥皴不完而雄勢飛動可念石爲蘇頲東封頌庶幾伯仲聖教序又顔魯公題名惜皆爲近代俗子剥毁云北上數百武尋古登封壇壝所謂白雲起封中者又上則玉皇宫在焉此泰山絶頂青蓮云呼吸通帝座非此不足以當之眞翩翩便欲令人排帝閽捧日月矣宫前石如圭者秦無字碑者或曰中有碑石函之良然折而東下百步石方丈云成化間曾於此得玉檢以獻御覽後復命中使瘞舊所因思柒十二君千騎萬乘雜遝空際皆淪於荒煙野草不可辨如太虚過鳥古今何者不朽因爲題無字碑遺碑自千尺漠漠秦雲白雄風三十六二世俱塵跡那如峰頭一片石欷歔久之西則秦觀峯巍然獨峙又有周觀吴觀越觀皆以其見境得名一曰月觀取月朏庚方義近是則向吴觀望疋練吾鄉者徒野馬絪緼耳吴門之馬然乎哉宫後一峰名丈人峰落落有壁立萬仞意下挾仙宫尼父石像在焉肅拜瞻禮崖石劖孔子小天下䖏上摩皇蒼下瞰無際不覺爽然自失也誦子美陰陽割昏曉蕩胸層雲决皆飛鳥句更奇絶矣因占插天秀出青芙蓉側身尼父一相從星使槎迴銀漢逼詞頭題徧白雲封已欲取道玉女修眞䖏忽數兜子穿雲中來迫視之錢孝廉德卿蔡山人幼君馮孝廉咸甫目逆而咲復至玉皇宫浮大白無筭三君各詫其逰之奇已出其奚囊所得詩凡若干首咸甫賦泰山絶頂逢余詩更以長篇索和若旗鼓對壘余者余爲放歌和之大都如項王戰章邯鉅鹿時也已欲更賦太山高余曰此自吾曹坐井觀耳安知不有凌空倒影之飛僊芥六合而蟻垤太山者手其不爲海若咲者幾希相與抵掌而止又東北望黄華洞即王女修眞䖏俗以環洞多黄花故曲逕窅渺彷彿見石室不類人間誠棲眞境也咸甫幼君從曳欲振衣游以鳥道迂廻不宜輿德卿腹便非濟勝具不果已折而至拾身崖余側足臨崖觀之二羽衣急引裾以恐有天風吹墮人德卿大驚詫叫號余咲曰韓子登華頂泣不能下此何人哉顧見石題曰愛身巖先是有蚩蚩氓誕惑捨身以自戕者故爲憐而諭之余曰捨本無捨何况愛縁非捨非愛作如是觀二羽衣不能荅導至誠心石僊諦視良久仙人橋遠出括蒼南明石梁下復至夜宿䖏小酌罷三君前行至石經峪崌石以待余至捫蘿行見古梅數株踈影横斜酷似西湖林和靖先生放鶴䖏穿梅而度石寬廣可容數百人類乕丘生公徑可三倍之舊名曝經石不知何時刻八分書金剛經字大如斗後好事者復刻聖經以獻其勝大是奇觀石盡䖏有亭亭其上亭之旁有石曰聽泉枕又左則泉聲㶁㶁自巖腹直瀉而下如濆玉拖練下分爲池池渟瑩可鑑眉髮亭後有山題高山流水下爲記萬兩溪筆讀之殊伉爽三君復浮白無筭三君顧安所得琴欲一鼓之令衆山皆響邀山之神與七十二君聽釣天之樂余歌山水有清音何必絲與竹三君囅然咲咸甫賦曝經臺余因賦石經峪我來恣奇觀流水瀉石上濯纓見古字隱隱衆星朗篆跡半從鳥跡分具葉時聞落葉響石火不作祖龍劫龍藏中開探象岡枕石聽泉足娱悅高山流水忽獨徃雕鏤無廼亦華想點頭悟石意戃恍余謂兹逰日觀諸峯奇絶人人能道乃石經峪無心得之而三君不期之會又大奇也造物忌多取游可已夫時三君㳺興猶劇欲就榻旁一室甚敝且細雨濕苔痕矣欲從徂徠尋竹溪六逸故趾石守道讀書堂南望云云亭北游靈巖已夕陽在山矣或欲留浹旬窮七十二峯之勝或以逰從此始耳清泉白石冉盟他日天游子曰高山仰止心竊嚮徃之矣余走昌平有白馬山其高可二十里白雲堪把徃徃自掌中飛出白榆歷歷可捫甌栝無與伯仲山人自以孰與漢大余登太山高四十里盖兩白馬云然仙靈窟宅福地洞天何可勝道而獨岱爲之宗何以故豈以帝出于震而爲萬物受生之始耶滔至徂徠諸山近若憑几遠而太行華不注崆峒諸山若隱若見衆山培塿如拱如揖兒孫蹲伏如群龍趨入紫薇者不可名狀總領諸峰以朝上眞且黄河一抹汶泗衣帶而𣶺渤在肘腋間與灝靈相吞吐斯亦奇矣至於爲峰爲洞爲泉之奇天麻黄精椒桂桃杏梅栢巖松崖竹宜雪宜月其昏曉烟霏霧靄變幻萬千又細渺不足道矣夫也者載營魄如一漚起滅大海中譬之蟬方抱葉吟而其中已蛻矣時而非㳺所見無非山無非非山者其斯爲採眞之遊如必戀戀於一丘一壑即凌弱水日坐崑崙巔吾其爲山㳺乎惡睹所謂小天下者哉時萬曆嵗尚章恊洽清龢月哉生明王衡太倉人重九後二日登泰山記蓋余僻在丘壑而生東吴菰蘆中苦無所得山山之大者莫如岳海内稱岳者凡五而其肆皆隅布近者亦不下數千里非書生所暇逰廼泰山差不遠於河濟庶幾以便省父母得一瞻眺乎而非所敢必也今年丙戌九月之八日且北上舟次濟寧余祖母將有事於泰山余奉以行而後喜可知也周生如春亦從行行之日宿建寧竟夜風彭彭吹雨擊席門明旦而雨脚閣如故尋髮鬖及之意謂未已也日入已而雲欲流午且日出矣諸山嵐翠各獻狀而黄沙籍是不及馬鞍信子美所謂沾濕好者耶憑輿人指點泰山者數而皆不似正東天半壁若更有青於天者疑其然也以語同㳺同㳺皆咲之已而雲凈出峽角則果泰山也始相駭以爲奇余買一驢跨之左右視惟恐失山而山亦以日暮更娟潔若答予賞者又一宿而後抵州易腰荀行十里而抵山足之紅門自紅門至小天門以上左皆澗道道深廣大小石磊磊奔而承泉側若聽者頫若潄者若揭者若與爭道者多異態而五色𣗳雜綴之𣗳則桃杏楓梨松栗之屬草則薜蘿赤箭天麻黄精之屬不選而美泰山盖骨山布肉而施繪者獨賴此耳又數里爲高老橋平橋際崖澗間頗勝又過短橋者一而得水簾洞左崖聳立數十仞而兩大石腹相加如垂簾以下水會水正涸滴涓涓然因作春水時想縱不敢望匡盧定足當其支子耳自洞而轉數里爲馬棚崖言崖深嵌可覆馬眷也又數里而爲回馬嶺則從行者且去馬而徒矣尋至黄現嶺嶺凡數四轉益峻而外望廓然傲來向北泰山肩及此遂俯首爲之興彌高之嘆自是而下下上上者凡三以里計者亦三曰快活三由回馬至黄峴輿者前距高而余僂就之余頂踵與輿人頂踵相擊吟踔甚至此稍寬坦而𣗳與壑更奇吾始得納手於袖掉頭吟嘯而有之蓋眞一快事耳稍前而憩於玉皇閣是爲山半余修茶而獻老親老親亦色喜牽予上下視者久之决眥而得南天門隱隱如紅星沫耳尋破蒼翠而岀至御帳宋末定陵所駐䖏傍有松即秦封五大夫之二其三已失之雖稍夭矯然以爲數千年物吾不敢知過御帳則盡走斗崖削壁中矣無何而上小天門群削截嶭畢相附高相摩四周無所不際而左壑磈𥗬受水蕩𤽤作雲母緑玉色山面缺泱漭當其前余兩人大叫絶倒而會有以酒餉者急行之風蓬蓬來搏杯𢆻覆余即覆酒酧之而行更上爲小龍峪大龍峪以至十八盤磴齒齒倚空絶峽夾之西峽口咯有松數十株翠相掩里人名爲對松固一奇又怪自峪以上所有盡松無他𣗳青青者松栢獨耳果然盤盡而天門見山一削鐵耳中劈而爲徑穿而爲門雖曰人力然亦似天闢之以待㳺者自門逶迤數里爲元君祠祠甚壯與老親作禮畢更衣於公署公署後爲玉女洗頭池澄碧泓然斷石碑存李斯篆二行自是左折而上曰嶽帝祠祠後石壁刻開元帝銘甚遒美其旁亦多雅刻且易主矣得數字於殘剥之餘剔磨而欷嘘者久之又上爲玉女寢宫愚民至貌像裏服卧撲被中其可咲至此更循而上則絶頂矣虚其頂宜無所不見而乃構玉皇祠祠前石表長丈餘云即秦皇無字碑盖亦莫知其如何走而四顧泰安城當襟僅衣結耳諸山揖拱無慮數千或如攢戟者如覆敦者要皆能爲之趾而不能爲腓獨徂徠在前若可憑其他間指一二聳特者問道士道士不能識悵悵而下東至日觀峰峰後爲望海樓所謂秦觀周觀吴觀皆在焉視余所由逕天絲掛杳藹間而澗中樹石繡相錯若裒寳粟其灣環而動者汶水耶黄河耶顧放目而之東南竟不得海影道士謂霧氣霾之此或然耳又轉而至舍身崖一巨石髐然出余足能垂石外二分而目不敢營視偶從旁睨視崖底無不俯據地者稍西下而爲仙人橋兩壁中斷石梁度之盖所得波嶺澄複之奇最多道士指所謂獨秀君子蓮花諸峯余但唯唯而望東天門更陡絶道士詫余以爲絶勝南天門而無楷梯僅爲鼪鼯雉兔之窟巢良可惜也橋西一道人懸鶉衲載棕櫚㡌客至不起安知其非可與言者以難諸客施之金錢而免之由是而歸則月且纖纖白矣子與周生拉道士造東嶽祠而止焉月華星芒不知其帶霧與否但覺其近而親人滿空界浮藍蕩白神外淫不自持且寒甚膚粟則歸視老親寢已而就道士宿焉道士貧茅屋廣不踰丈井竈半之無已則縮足卧山空多聞又午夜爲士女上山唄誦淫淫然睫不交而漏絶矣急蹴周生披衣視天井星匿不見意甚惡業且起矣同杖策至日觀峯石時嚙足齒泠相嗑而會州使者以酒炭遲我余喜而三舉觴良久暗中作微紅見上下雲盡黑而中不接者徑寸則甚幸之俄而紺又俄而赤而紫吐欿漸及半天施雲作霞爛熳且覆人面諸山頭稍辨如撮米化爲丹砂極天際有金花浮起者三道士曰此日抱海躍也將出矣俄遂出色如鎔金大如鉦日之下覺有一抹漾漾白者眞似海正跳咲而日已入雲隊中金支翠旗欿然收矣不滿志而歸復迂道登玉皇閣異盡所未見而道士鄙朴每每對面失之從閣後望山之北林篠葱蒨䖏曰石屋意必有奇而老親以途遠且不可輿遂奉以歸僅繞而西視所謂丈人峰者平平耳遂下觀白雲洞洞巉岩多竅道士言每陰天雲從竅出如線頃而蓊滿山四馳而縷結爲一即雨媒也甚以不得見爲恨余因謂周生余與若晨好晴而至此且好雨矣人心之無厭如此出别道士而下十八盤盤磴直輿余者又四人莫可縱横則倒懸而下之手足心盡汗出目瞪瞪視人股顧周生御兩人蛇行如履平甚樂之請至山半而易焉仰視則已失天門矣甚懊恨於是以目注之山自山半至快活三失天門者屢而復得者亦屢每見即呼周生共揮手作别意依依然下至水簾洞穿流泉𣗳樾而東上觀石經峪峪爲石壇方十餘畆石膚瑩然鑱八分書金剛經字徑尺甚偉雖强半爲水所蝕然與其如前二碑損于傖父之手無若受水舂也泉自上流來㶁㶁鳴萬侍郎就崖間題曰水簾又鏟石壁而書其所作高山流水記頗恰似又下數里而山之巔窮凌漢寨聳額以捧山如弗勝而徂徠蒿里諸巒岫若列矣自是歸而無眠與食不言泰山也輿數程輙下返而顧泰山者數數也以爲盡泰山矣於寧陽泰山志急披讀之始知昨所㳺者僅僅里中兒女子祝釐故事纔及堂皇已耳山之曲房深榭盖十未得一而吾所見金色日亦穀以後光景其得鷄鳴時者絶不然余于是而又爽然失也雖然亦可以雄生平觀矣藉使假我半月陰翳且屏盡而山之上差有饘粥寢處以安老親則亦不草草至此又使我袖置泰山志而吾友諸壯少年投杖超距不避墟莽按圖而搜之其所見當多而今皆失之意吾其不良於游耶抑山靈秘其巧不輕示人也吾少好游所游者爲姑蘇武林洞庭宜興諸山諸山之奇遞相代而亦遞釋其舊向者兩洞庭猶芥蔕吾胷中而今又釋之矣不知竟吾之生可以代泰山者安在吾姑詳識而淺述之以風後之繼予㳺者于愼行禮部侍郭東阿人登泰山記盖予家於岱山之下嘗再從子充游乃其時率在暮秋若三四月五方士女登祠元君以數十萬夜望山上篝燈如聚螢萬斛左右上下蟻旋魚貫叫謼殷賑鼎沸雷鳴彌山振谷謹得容足之地以上而其時水泉多枯木葉或脫故山之奇麗珍瑰未露其十一二露又爲人衆所掩意五六月之間水木方盛必有瀤異之觀而徃徃以憚暑不能出即出又無與偕徒側身東望思焉粤嵗辛巳六月予卧病穀城山中朱廷尉可大倚舟廣川過而訪予相與盤桓雲翠東流之間望泰山雲氣如在衣神於是决筴同徃以其月十有九日發東流泉上行山水之間二日而至泰山下主人肅入館舍明旦昧爽衣冠謁岳祠祠在郡城坎方負岳而宫埓鈞天之居出登封門三里許至於岳麓有雙觀焉謂之一天門下車乘藍輿以上磴道鱗鱗谽谺逶迤仰見峰勢嵬嶷嶤𡵉如垂天之雲峻不容屐以爲决不可至行數里至回馬嶺玉帝之觀在焉其峯曰瑞仙巖觀之前爲昇仙閣憑閣望群峰反在足下而峰首則又有峻者磴道益斗絶詰曲偪側而上𣗳四人以爲竿而中貫一輿前人之趾履後人之顛後人之阯在予眥上其後二人如之應邵所謂如畫重累人矣自此以上汗流喘息目不暇他顧而其兩旁丹壁翠崖彦萼崷崒雲霞萬色陰晴異態岩傍飛瀑爭下濤翻雪噴流聲淙淙乍大乍細若懸綆鳴環下而迎客而水簾洞之泉從山上瀰漫下流注於絶壑以入碨𥗬忽然而没有時復出石梁木扛互相撑柱間以其耳目與之接唯恐失之而不敢縱觀然後知此山之奇向者未其一二也又數里遇黄峴嶺西行折東北上而復下又西行折東北則下而復上又前數里御帳坪者秦人所從蔽風雨也當岳半道負中峯而處左右諸峯兩面環拱石泓數畆泉流其上釃而下注厥聲砰礚宋眞宗駐蹕遺阯有亭亭前松𣗳二秦所封五大夫也生石隙中不甚高大而幹皮龍鱗類數百年物其决不爲秦時松可曉而地則中阪無疑意好事者即其地𣗳之從者曰松有五雷雨瀤其三非也五大夫者秦之爵級松何必五假而封七大夫松又將七耶從者不對又上則峯崖益險璧立插天其石皆磊珂相承或圓或方或墮或長巉巖崒嵂不可名狀而其垠堮之間色相種種望之迷瞀其丹而紺者爲殿爲屋兩岩之間一隙碧而如帶者爲天光翠而如髮者爲松蒼白如繪者爲苔萬仞懸而如鳥巢者爲羽人之居而俯視則谿谷碌碌不可見丈尺又數里爲大小龍口龍口者石硤飛泉如龍吐也小龍口之旁爲斗母觀自此以上凡嵌嵓之間爲仙靈神鬼之居者羅而列於左右盖所謂神房洞天百靈之府也又數里爲十八盤古謂之環道望天門如一隻矢括在其端上盤如緑壁矣因謝輿拾級而上距躍三百渾汗如雨出天門之上左折而至碧霞宫者所以祠泰山元君也負玉皇頂而立抱五花峰於前日觀在其左丈人在其右規制挨於岳宫而金碧煜㷍觀闕暉麗顧反過之其西爲使館玉女之池在焉池膏渟黛蓄肅有靈氣其旁岩上有李斯篆僅十餘字予與可大就館更衣謁元君於壇羽人賛祝出而臨五花岡巒紏紛含谿懷谷雲𣗳宫宇俯在日底下視郡城葐蒀菴靄汶洸如線環之數周川原廻合縈青繚白提封百萬不盈一矚由宫左折而上爲青帝宫其後峭壁數十仞唐玄宗泰山銘鐫焉又北上數百武爲玉皇宫宫在泰山絶頂古之封壇秦皇帝在焉碑石青白高二丈而無文盖歲久夷滅或曰秦所以表泰山其下有石函玉書於理不誣繞玉皇宫之後倚闌而顧俯見四面群山蜲蛇蜿蟺如盤龍走蛇遶七十二峰之下其支脉首尾歷歷可指數以至於海而桃花明月石屋諸洞在岳之背列仙所紀金床玉几之勝若將睹焉記曰天孫岱岳周回三千里以今觀之䃢碒乎三州之半矣又折而東可一里許漢之封壇在焉石方丈許碧而瑩膩屋覆其上白雲曣嗢處也又東爲日觀以且觀日不徃而南登舍身臺舍身臺者一峰斗出甚平處可數尺而下臨千丈以三石撑抵慱尺有咫謂之仙橋過橋而席於臺日光西沉霞色在壁風吹冠衣聲如裂石於是相對大觴望見西南有千家之聚横以大堤黕黑無際諦視之雲也蓋雲如烟火下慱上銳平地視雲見其端此見其杪頃之月出羽人吹笙和以歌音極醉而返山氣懔懔枕席皆濕不可以寐出立壇上月光熒熒星斗可拂俯視萬壑烟雲一氣茫茫正白銀海玉波不可辨識道家所謂三宫空洞之天也徃聞人言山以夜半觀日出訪之羽人五六月間平明乃出五更可徃也於是坐而至五更秉燭披裘以登顧見山中雲氣從澗壑吐出如一縷烟稍上而大東西聚散車馳馬奔倏然徃來頃刻滅没於是可大大呼以爲平生未有從者盡讙東方作矣回而東望有山數峰如卧牛車盖之狀而又漸没赤霞半天光色媚麗間以碧緑熠燿五色直射衣袂頃之平地湧出赤盤狀如蓮花蕩漾波面而燁煒不可名狀以爲日耶已又一赤盤大倍於先所見側立其上若兩長繩左右汲撣食頃乃定羽人告日昇矣盖先所見如蓮花者乃海中日影非日也日且高舂赤霞與影皆没而下微見一綫白滉瀁明滅羽人曰海也又頃之日左黑氣隱隱一抹如連山長城可大示予此眞六鰲所載矣羽人曰雲也可大一噱走望海石上取酒浮白醉而熟寐從者咸慄且呼予睨而心壯之回立登仙臺西望丈人越觀二峯近在目睫因顧可大徃予與子充登岳倚越觀望君今吾陟丈人峯可瞰太行呼子充也會疲不能徃策杖而下氣益舒展顧見道旁石益奇絶水木益勝每行數里則求嘉𣗳流泉或峯坳片石拊膺而坐舉觴屬可大曰此非伯牙避雨岩乎夫高山流水於子何迯聲矣由而下憇於岩岩亭折而入經臺者在道左里許石壇斜倚山曲方廣數畒鎸心經一卷字大如斗作古篆文壇北有璧瀑布從山上來懸璧而下流於經壇瀰漫過之從水上視篆書一一可讀璧上鐫數大字以水爲幕徃予再遊蓋未嘗至以僻不當道爲人衆所蔽故過經臺而下出一天門左折而得岱岳觀漢武帝所種栢處也又東里許得王母池池大盈畒懸流注之倍經臺之瀑已而兩至登車出山涉泉而行天暝時炬車中聞水聲在足下者數里而至逆旅明日大雨主人請遊三陽觀告遽而行至百丈峯下望山上瀑布數道如從天下盖在山之西南非舊所見矣山人曰予覽古圖經脉地勢所由高下蓋北紀諸山負地絡之陰並太行王屋東踰常山至醫巫問而止南紀諸山負地絡之陽連桐栢熊耳入於甌越江淮河濟由是東下如建領矣岱宗立海上西向而揖群山汶洸沂泗出其支麓旋之如帶以入於海盖若負扆云徃河流燕齊間由岱之北挾濟入海今涉徐方顧反出岱岳南挾淮入海斯地道所變遷也予登山巔北望九河故迹蒼茫與天際矣六月二十四日記吕坤山東叅政洛陽人觀日解日觀峰在泰嵿之東百武相傳鷄鳴時日初賓於嵎夷升於扶桑黄光玓瓅紫氣氤氲滄溟暎千里之波丹霞鋪半天之錦鎔金初出幾何遽神奇若彼哉因語田水部竹笑焉竹山曰余蓋游蘭亭矣所謂曲水者足令人羞前有假蘭亭脩渠引水稍爲右軍雪耻不則千古一贋諛耳嗟夫名下多虚萬事盡然志郡邑者皆八景者皆神奇皆詫也天地不爲駭異聖人無所駭異而創見者駭異之總之燕石耳余恐後之登臨者爲傳聞所詫也以蹈余悔作觀日觧廻廻車巖在文人峯而數十步游黄花洞發足處也洞路艱危余題此以告來者黄花洞在日觀峰後十五里土人云元君修眞故地也其洞高可拂冠廣不能容一一几石隙滴水㫙如雨簷可供十人之炊洞前廣數丈上有神宇雨楹茅屋幾蓋三二老尼居之傍洞諸崖新松環翠幾千株稍稱奇此外無奇矣自丈人峯東北下陂陵五六里猶可車至亂石溝獨足盤則懸崖嘊大石峻嶒足合主陽動色隆慶間有墜車傷數人者車中人僅以救免且此地無宿無食烟火纔通下脯徃便不能返曾有暮人偶值雨雪騶從皆縮頸蹲谷間半無完衣有凍餒死者兩君余不在治寳鏡新磨斯天下奇觀也余覽傳記而夢寐思之無由見萬曆丁亥叨守東藩且爲岱嶽司香使喜不自任既至三登三宿焉比曉輒雲霧葱蓊起甚恨之此中人云觀曰有三遇正月無雨海暈不升一遇暮秋氣爽新霽無塵二遇仲冬雪後曉絶雲烟三遇兹三遇者嵗無數日焉小人樵人也每晴明則蚤作今老矣實習見云余喜曰何狀曰公見落日乎曰見曰公既視之矣又何狀焉余舍然曰傳欺我哉已而曰樵人何知樵人肉眼耳樵人何知欲信宿以待而嵐氣又蒸蒸作障矣乃還是嵗九月也越十一月余復以役車至岱下再登焉時大雲新晴山風刺骨輿人至五鼓皆僵噤不司起强起之相將至峯下初海底發紅光漸漸起意必有異狀日不瞬凝視之少焉日出若鏡盖大於午日而不射目赤如落日而不帶霞則樵人所不及狀云是行也余感寒數日幾不起乃知好事者謬爲神奇以詫人後人知不如所聞而耻見詫復謬爲夸張以詫後人也夫旭日人人見之矣去欲道山中人自能道之昔王麟淡公歷覽岱宗岩谷都徧獨此洞足不及焉歸而爲恨爲我寄聲麟洲老無足恨也吴同春按察司副使固始人續逰泰山記余自癸未冬逰岱今七年矣諸名勝載前記中不具論記昔所未遊與遊而未及詳者已丑六月廿日泰安既竣事欲補續前遊有故人李子丹者泰安人也相别亦十餘年矣曩約遊岱及余至岱而子丹宦于趙至是相見愴然悲流光易逝而慶重逢之不偶也以日午出登封門十餘里至普照寺又里餘過胡文定公投書澗澗出凌漢峯又五里至三陽庵庵崌巖半徑頗險仄境亦甚幽勝禪洞下有泉不竭亦不甚巨又其上爲玄帝廟玉皇閣廟傍一庵諸黄冠修煉于此二黄冠頗不俗亦不甚觧無何于丹至共啜豆葉粥子丹與黄冠窮每對非所所問余咲曰渠誠未窮其際耶抑大道不輕授耶因論吾儒亦自有脩養第人弗覺耳孔子謂仁者壽曾子謂德潤身心廣體胖孟子謂其生色也粹然見于面盎于背此眞脩養也棄吾本有而向人乞餘咳舍人所共知其見却半夜閉門傳道陽明先生所謂抛却自家無盡藏沿門持鉢效貧兒者也與子丹共一咲以日晡由庵東比十餘里趨高老橋上下山巔無慮數四路皆傍岩此遊人所罕至傲徠山壁之西南時向時背黄冠指點天紳泉仙人影所在甚辨西北一山簇如蓮瓣近若咫尺而遠不可至則九女峯也由高老橋至石經峪舉子丹跌望觀泉已而擕手窮泉之源北行里許石滑不任足而泉自亂石中泠泠出巨細相間時作笙簧音林木深茂鳥鵲喧呼令人會心多余昔年所未覩子丹又叙說曩同事刺刺不休而余僅記憶其半嘅嘆者久之已夜色侵衣遂由石經峪趨頂至御帳坪燃炬觀題壁盖余與諸公寄題絶巘飛流大書也月明水聲共助佳勝二鼓至新石盤創自藩叅吕叔簡徃春月禱祠者衆舊盤不能容徃徃擠墮崖谷中叔簡闢火池以西諸峪準舊石盤爲新石盤而徃來稱便輿人謂舊盤路稍平而余固欲由新盤徃至館舍三鼓矣與子丹就寢五鼓起觀日與余昔年所見無異不具述其諸所經臨有如昨日何異一夢回飯館舍復讀秦篆碑與劉跋所記稍不券合苦三面嵌壁不能盡辨令數力士出諸壁乃知僅存劉所云云之半劉謂正面七行今止存右畔三行而其三面欲就巖安置各加鑿剡俱非當時之舊矣滌洗搨摹宇形隱隱莫辨第得石之眞面目與無字碑瑩澤無異外視粗頑而其理若此天下事類此者多矣已令數力士復嵌于壁恐數千年物又損壞自今也子丹足倦余遍觀五華岩之勝坐岩心下瞰諸洞壑如在几席日午由孔子崖右約八里至亂石溝又里餘至獨足盤見野鶴千餘回翔山巔是所謂鶴山也又數里黄華洞即玉女修眞䖏余昔年所跂望而未至者洞在岳頂東北踞鶴山之半路險仄視三陽數倍而其幽勝亦數倍三陽泉湧虬吻視三陽爲倍而其大亦倍三陽獨居此者止老尼數人祠宇香燈不及三陽三分一以故人跡亦罕至余非取道遷此亦未必至此也與子丹跌坐究子丹十餘年所得子丹蓋充然若有得者具爲余述大指率依于禪謂屢與諸名公談無不契合余喟然謂子丹曰此非片時所能悉舉世依禪而吾獨非禪吾何亦依禪而近忽非禪依禪者俄頃奏功而吾以無功易禪即子丹能信余言耶子丹第思二帝三王以至孔孟其時未有禪也不禪不足以入道帝王孔孟皆道外人耶吾昔慕禪如饑渴飲食乃近忽非禪豈愈久而反不入耶人能實爲禪而未嘗實學孔孟故學孔孟無功而謂不足以入道誠以爲禪之心爲孔孟其入道顧不近且易耶子謂禪能空子曰空空如也吾儒何嘗專實但空而能實子謂禪能定大學曰定而後能靜吾儒何嘗專動但靜而能動彼佛氏之所云空定皆後之聦明恠異者勦吾儒以文飾之而謂佛捷徑頓悟如此而佛藏數萬卷固十九此類也佛果西方聖人哉即陽明先生謂由讀佛書而後悟亦偶感觸而因悟全體如見擔夫爭道觀公孫大娘舞劔而悟筆法非筆法且擔夫與公孫大娘而不觀其爭道舞劔必不能悟筆法也此其說甚長子丹固不以余言爲非而亦未嘗快然以余言爲是子丹視余癯又復教余養生術固不與前黄冠之說同而亦未嘗不與余前所云脩養之說異遂與子丹别而余由洞左折十五里經小牛心石大牛心石至雙鳳嶺嶺在兩山間直上五里而兩山回翔若鳳問山人無名余大書雙鳳嶺于崖嶺東一山高嶺數百仞泰山左介丘右石閭此即所謂介丘者也坐山半望周明堂及山以東諸峯巒亦如在几席北下十五里回環山麓者無慮數十路皆傍岩則艾峪也至是路稍平穿林絶壑又十五里宿佛峪寺即所謂谷山寺也寺在深山中路不險仄而境則幽勝有大壑雨過則豗隤作聲晴則諸泉亦泠泠出石罅間二緇衣鳴鍾出迎余以爲麗刹也至則廢殿二間傍屋數間皆覆以茅半爲風捲去覓僧榻無有以二几聯而就寢蓋其僧之貧遠過三陽黄冠而近亦踰黄華洞諸尼矣又明日五里出峪則泰安達省城東路矣由南北高莊度玉皇嶺埠東口抵省自頂而下由泰山北路亦遊人所罕至云陳文燭大理寺卿沔陽人遊泰山記萬曆戊寅余以山東左叅政督漕事舟過濟寧約濮州李伯承同遊而伯承病不果來舍舟而陸九月朔日至泰安州岳廟在城中穹碑古鼎蒼松翠栢非人間物庭多怪石皆宋元人題字禮拜畢出登封門至岳麓登一天門飛雲閣絫石爲臺下通梁道磊磊鱗鱗有泉作淙淙聲仰望岳勢雲氣瀰漫諸山培塿獨徂徠當前耳過斗母殿至高老橋有漢壽亭侯祠前則水簾洞也水自數千仞注於絶壑如盤龍走蛇倏然而没倏然而出玉虹垂地銀漢落天令人衣帶俱濕又數十步則石經峪也石可坐數百人金剛經八分書字大如斗泉分爲池渟瑩可鑑毛髮少司馬萬公恭扁爲高山流水而記之眞三絶云過巖巖亭至馬棚崖有墨三字風雨不滅世傳吕洞賓書玉皇廟在瑞仙岩余稍憩焉至迴馬嶺不可輿矣嶺凡三四轉至黄峴嶺益峻難行魚貫而前行者頂足連絡所歷崎嶇忽平衍三里許名快活三登二天門又數里至御帳坪秦人蔽風雨者也有宋眞宗駐蹕遺址兩崖疊嶂草木滋蔓有五松亭秦始皇封大夫是也今存其二非秦時物後人植之耳罡風四來松韻泠泠作老龍吟勢欲飛去呼酒賞之路稍北有一古松盤結偃蓋過大夫松有題爲處士者魯仲連似之賦詩吊焉過朝陽洞有二行宫大小龍峪石峽衆水飛泉若龍噴乾坤樓在峪旁少司寇洪公朝選題且云言天下之安者猶泰山而四維之維者繫也人心獨無繫乎禮義廉耻安身之四維也取諸泰山其說省心焉由峪行數里至十八盤羊腸曲徑仰視峽口天光凝碧如紺珠眞神房洞天百靈之府也盤盡力疲登三天門望白雲洞縹緲彌各若不崇朝雨天下者門内平壤爲市廬者數十家泰山天門舊無室宇造自張練師耳宿仰止亭次日謁碧霞祠元君石像舊在玉女池而宋易以玉李諤瑶池記黄帝遣玉女羽衣黄冠脩而仙者也或云東嶽配東嶽女誤矣四方捐金珠馬羖者嵗無虚日有玉女池李斯篆秦始皇功德文十餘宇可辨耳再里許爲東廟廟制不及祠有磨崖碑乃泰山銘唐太宗八分書遒勁可愛其右蘇頲東封頌顔魯公題名書法類晋俱爲人鑱毁又轉而北青帝宫制與廟等有秦始皇無宇碑或言有石函藏金簡玉書古今莫測其石色黄白光瑩異常非兹山所有登太平絶頂古封禪壇高皇帝御製碑在焉黄河如帶淄渑濟泗諸水若還繞焉太行華不注空同諸山皆几案物西登丈人峯有壁立萬仞之態下峽仙宫謁孔子像至小天下處上磨雲漢下俯溟渤惟孔子足當之耳曾謂泰山不如林放乎泰山之于丘垤類也聖人出乎其類是尊泰山者莫如孔孟郡吏置酒羽士酌余大醉生平大觀仍宿仰止亭日入蒙汜夜半月明越觀秦觀吴觀宛如圖畫至四鼓羽士請觀日出登日觀峯大風忽起寒甚羽士解衣衣焉上下蒼茫渾如白玉圓靈方輿莫可辨也忽朱光三蕩東海而陽靈漸吐萬景維新七十二峯蒼翠畢露宇宙之大至是哉登望海樓至舍身岩四顧而羽士時牽余裾由平頂崖歸太清之宫讀萬公表嶺碑嘆曰壯哉文乎擅四岳之尊者泰山也擅泰山之尊者巔石也從而屋廬之踐履之焉得尊表着厥頂山靈吐氣大明世界矣封禪之主七十二有遺恨焉循故道下山至州將旦思遊孔林夫洙泗與山脉相連近聖人之居若此其甚也上律大時下襲水土熟非泰山之靈哉觀孔子而泰山等天地矣大明萬曆三十五年歲次丁未上元吉日正一嗣教凝誠志道闡玄弘教大眞人掌天下道教事張國祥奉㫖校梓
