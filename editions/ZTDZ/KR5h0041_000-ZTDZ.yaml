body:
  text: 岱史序八一環區中而山者萬不啻也岳爲最環區中而岳者五不啻也岱爲最故曰岱宗盖自黄虞氏而下靡異號云以故自昔受命而興者靡不有事於岱然而秦漢之事君子諱之惟我眀一切屏絶封禪矯誣之說寘弗道而諸所行望祀之禮珪幣登祝之數名爵之稱又皆一洗近代訛謬而還古初是自古有事於岱者七十二君不啻也我明爲最乃岱於前世率不過吐奇孕異致靈恠以闡世符惟我明建樞北極而兹山屹立國門之東汶濟之水會焉下國筐篚舳艫相銜際天地而來者以萬數而兹山諸泉實委輸之儼若岳伯元僚總率九牧之賦以歸天府是岱之祚國佑民即億萬年不啻也亦我明爲最夫岱既已最五岳而雄區中而我明所以有事於岱與其所以有功我明者又爲百代之最如此則其他瑰奇特絶之觀與夫登臨嘯咏之蹟見於仙經地志殘碑斷碣之所記載者在他名山徃徃籍之爲重而要皆蔑焉無當於岱惟是岱之所以最他名山與我明所以最百代者盖在彼而不在此此載筆者之所宜詳也予徃奉璽書按鹾政於濟上間以職事一登兹山四顧徘徊求古皇王靈聖之遺趾而世代綿邈莫可尋詰則慨焉有感於前誌之浸廢乃屬同轉運使查君輯而新之查君則裁取舊編斷以己意擬例三史取材百家凡爲考若表若紀若志得若干卷其於所稱瓌奇特絶之觀登臨嘯咏之蹟見於仙經地志殘碑廢碣之所記載者固已掇拾其槩靡所漏捐而自黄虞以下所以有事兹山與夫我明之典禮名數所以陋秦漢而還古初者特加輯録而例别之以自咐於大書特書之義於是遂更其名曰岱史厥義韙矣兹史甫就刻而皇上方以軫灾祈年之故特下德音分遣大臣祠禱五岳以徼福元元展禮告虔惟岱爲首宜有禎祥符應以答上㫖俾後世徵奇考異之士見謂聖神之代百靈受職惟我皇上最焉則豈惟兹史之光將是山實籍重焉敬爲書其首簡以竢若其他義例查君自有述予可畧也萬曆丁亥𡻕元旦之吉嶺南東官譚耀書岱史公移山東都轉運鹽使司濱樂分司同知查志隆爲補續誌書事萬曆十四年六月十八日蒙欽差廵按直隸等處監察御史譚憲牌前事内開稱泰山一誌專記天下名賢登覽題咏乃徃過來續日盛月新今查自甲寅以後俱未收入又殺胄已久摹印者多魯魚亥豕不堪寓目本院心竊慨之爲此牌仰本官候新抄發到日一併纂輯恪秉三長用垂永典等因續蒙本院憲票前事内開稱本官即將發去前録四册校删停妥纂輯完備務求刊刻精楷用垂永久合用工匠等項銀兩該司另行申動等職蒙此遵依外爲照泰山維五嶽之長屹天柱而奠地維圖籍永萬世之傳翊王章而垂文獻故岱宗首望於帝典魯詹推重於葩經兖鎮表見於職方東嶽著名於爾雅諸皆典墳籍籍罔不誦術巖巖凡以昭寰宇之巨靈豈惟侈遊觀之勝覽矧於昭代密邇皇都潤流百道之濟汶輓輸漕運統領三齊之岡阜屏障畿封維兹花功孰侔大造然不有專録何以摠攬神奇而不賴當途孰爲咨諏圖籍惟本院觀風東夏覽勝介丘於焉㨿籍而按圖特爾命官而屬筆盖舊志取裁於前院已經三紀有餘而殘編竚待於後來殆非一日之故顧維庸陋如職曷效付托於兹雖蚤歲箕裘稍知横卷迨半生丘壑豈望問奇偶弋百氏以娱閒敢擅三長如明諭幸屬清時吏隱徒然愒日宦遊靦而素餐念升斗皆君貺藉兹青簡倘涓埃可自將是用竭目殫神既傳觀於子史頻仍陟巔涉阻又遍歷其崇深對景揮毫風餐霧沐㨿梧屈首宵燭晨窗時逢萬曆熙辰歲在丙戌泰運始事於仲夏訖功乎孟冬猥效册鉊粗成卷帙稱名則曰岱史義例則本前聞爲考者三爲表者二爲紀者四爲志者五卷凡一十有八字凡念萬有奇敢云副在名山妄希不朽之盛事或者比諸覆甕可償散局之微勞庶幽不負山靈而明不負付托曾籍斯語告成嶽祠第編摩三四月之間廼上下千百年之事寒暑固未嘗間隔風塵猶未免驅馳坐是作輟靡常且於精神有限雖効勤悃寧免踈虞其間魯魚亥豕之贋訛自矢終其讎校猶竢雕龍吐鳳之鴻匠蚤當爲之折衷爲此具呈本院裁照施行萬曆十四年十一月初一日岱史凡例一岱史云者岱宗之稱經見於虞典實肇自黄帝故從其古名曰岱兹所撰録稍襲史家義例故曰史盖前哲曾有以路史名其記籍者一泰山舊圖甚略余躬自涉歷指點形勝命工圖之廣衍四倍於舊圖併舊圖並存焉蓋舊圖括其概今圖分布其形勝也其餘諸圖新創者居多一爲考者三曰圖考曰星野考曰形勝考夫考者校也謂參校於子史百家也諸皆舊志所略兹仿通考義例創著焉一爲表者二曰山水表曰疆域表夫表者標也謂標而明之也山水之勝境延袤疆域之沿革屢變不爲之標揭其曷以顯示故仿史家年表義例創著焉一爲紀者四曰狩典紀曰望典紀曰遺蹟紀曰靈宇紀夫紀者記也史家有帝紀盖所謂大書特書也兹所紀皆神聖之精靈帝王之制作而國朝御制御祝尤炳炳焉故别於凡志云一爲志者五曰宫室志曰物産志曰香稅志曰灾祥志曰登覽志夫志者識也識臆其煩賾勿俾遺忘也兹所志皆人文物理之散殊雖取材於舊志而時移事改故正其訛補其未備者居多若香稅則舊志不及特草創於今兹一每卷冠以小序蓋撮其大㫖發明著作之意也而見聞所及於當時利病偶有一得稍贅數語正不自知其足採不一余本固陋寡聞且奔走泥塗中無暇日稍暇即從縉紳家假古今名編搜討焉顧名編不多得也山水形勝古初遺蹟雖躬自歷涉然寧能遍觀至於國朝諸名公及文人騷士題咏諸篇什或仍舊志或採碑匾或採諸家集然於見聞所不及者寧免遺失非敢有所删削也廣收博採尚有竢焉西浙海昌查志隆鳴治甫識於歷下吏隱齋岱史總目質字號第一册卷之一圖考卷之二星野考卷之三表勝考附里至卷之四山水表卷之五疆域表諸字號第二册卷之六狩典紀附封禪卷之七望典紀仲歷代諸臣僚文鬼字號第三册卷之八遺蹟紀卷之九靈宇紀神佛寺觀神字號第四册卷之十靈宇紀聖賢廟祠卷之十一宫室志卷之十二物産志卷之十三香稅志卷之十四災祥志而字號第五册卷之十五登覽志歷代詩章卷之十六登覽志國初至嘉靖甲寅以前詩章無字號第六册卷之十七登覽志國朝嘉靖甲寅以後詩章疑字號第七册卷之十八登覽志歷代賦記雜著右岱史爲義凡十有四别而爲卷凡十有八中間豐省不齊緝而爲册凡七取中庸質諸鬼神而無疑句以命册焉夫質諸鬼神而無疑知天也岱宗山靈蓋鬼神之大者是役也澡思搦管對越儼然登謁搜奇駿奔匪懈詎非鬼神與質乎顧凡陋胷襟安知天道又安能以無疑余於兹有深愧矣然孟子論盡心知性而歸之於知天則知天之學要在盡心中得之余誦法徃古從事筆硯以供明神之役敢不盡厥心以昭假而求底於無疑之境哉兹所爲命名豈漫然無所取義云查志隆謹識岱史第一冊質字號目録卷之一圖考星野圖泰山舊圖泰山新圖東嶽廟圖碧霞宫圖五嶽眞形圖周明堂圖孔殿圖卷之二星野考史記天文書正義前漢天文書前漢地理志魏太史晋天文志唐天文志宋天文志宋中興志天原發微通志汪子卿論卷之三形勝考附里至舜典禹貢魯頌周禮職方爾雅公羊傳漢官儀後漢書道藏經郭璞書山海經法苑珠林曾鞏二堂記蘇東坡序魏莊渠書岱宗記通志茅君傳愽聞録五嶽記福地記列仙傳尸子愽物志道經堪輿家勝覽里至記卷之四山水表山峰石洞峪嶺嶂崖巖臺門寨園泉池河溪澗灣井勒石橋坊卷之五疆域表摠部郡州縣
