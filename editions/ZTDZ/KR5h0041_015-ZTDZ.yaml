body:
  text: 岱史第十五卷登覽志縣二叙曰曷志乎登覽也志古今人登覽者之文若歌若詩若序記是也嘗聞丘壼子曰務外遊不如務内觀故列子自以爲不知游而眉山蘇子曰人之所遇役於事者常多遊於物外者常少由斯以談遊何容易偉哉泰山之遊乎躋日觀月觀之高峰可以俯仰字宙探龍文虎阜之奇石可以磨礪壯懷臨天紳聖水之飛泉可以澡溉精爽尋吕公婁敬之幽洞可以呼吸烟霞豈謂外遊非内觀之助耶要以弧矢四方之志高人達士之懷古今一也其間遊而能言者暢布於篇章即岩壑秀偉萬狀若爚入丹青然而且寄興高遠飄飄然有不局於山水間者彼豈徒以娱耳目爲觧騁詞翰爲富乎玩物適情固内觀者所不廢也宣聖丘陵作歌千載絶唱是用冠諸編簡永耀山靈漢魏而下以迄於今則皆循世次録焉詩歌周孔子丘陵歌登彼丘陵峛崺其阪仁道在邇求之若遠遂迷不復自嬰屯蹇喟然面顧題彼泰山鬱碓其高梁甫回連枳棘克路陟之無縁將伐無柯患滋蔓延惟以永嘆涕霣潺湲曳杖消揺於門歌曰泰山其頽乎梁木其壞乎哲人其萎乎見禮記檀弓子貢聞之曰泰山其頽則吾將安仰梁木其壞哲人其萎則吾將安放夫子殆將病也蓋寢疾七日而没右曳杖歌本非爲登覽作也然觀此則知吾夫子蓋以泰山自處故併録之漢張衡四愁詩之一我所思兮在泰山欲徃從之梁父艱側身東望涕霑翰美人贈我金錯刀何以報之英瓊瑶路遠莫致倚逍遥何爲懷憂心煩勞魏曹植飛龍篇晨遊泰山雲霧窈窕忽逄二童顏色鮮好乘彼白鹿手翳芝草我知眞人長跪問道西登玉堂金樓複道授我仙藥神皇所造教我服食還精補腦壽同金石永世難老驅車篇驅車揮駑馬東到奉高城神哉彼泰山五岳專其名隆高貫雲蜺嵯峨出太清周流二六候間置一二亭上有湧醴泉玉石揚華英東北望吴野西眺觀日精魂神所繫屬逝者感斯征王者以歸天效厥元功成歷代無不遵禮記有品程採策或長短唯德享利貞封者七十帝軒皇元獨靈飱霞潄沆瀣毛羽被身形發舉蹈虚廓徑庭升窈冥同壽東父年曠代永長生仙人篇仙人攬六著對慱泰山隅湘娥拊琴瑟秦女吹笙竽玉樽盈桂酒河伯獻神魚四海一何局九州安所如韓終與王喬要我於天衢萬里不足步輕舉凌太虚飛騰踰景雲高風吹我軀迴駕觀紫微與帝合靈符閶闔正嵳峩雙闕萬丈餘玉𣗳扶道生白虎夾門樞驅風游四海東過王母廬俯觀五嶽間人生如寄居潜光養羽翼進趨且徐徐不見軒轅氏乘龍出鼎湖徘徊九天上與爾長相須晉陸機泰山吟泰山一何高迢迢造天庭峻極周以遠層雲鬱冥冥梁父亦有館蒿里亦有亭幽岑延萬鬼神方集百靈長吟泰山側慷慨激楚聲王凝之妻謝氏泰山吟峨峨東岳高秀極冲青天巖中間虚宇菽寞幽以玄非工復非匠雲構發自然器象爾何物遂令我屢遷逝將宕斯宇可以盡天年宋謝靈運泰山吟泰宗秀維岳崔崒刺雲天岞崿既嶮巘觸石輒遷綿登封瘞崇壇降禪藏肅然石閭何晻藹明堂秘靈篇唐李白泰山吟四月上泰山石平御道開六龍過萬壑澗谷隨縈迴馬蹟遶碧峯于今滿青苔飛流灑絶巘水急松聲哀北眺崿嶂奇傾崖向東摧洞門閉石扇地底興雲雷登高望蓬瀛想象金銀臺天門一長嘯萬里清風來玉女四五人飄颻下九垓含笑引素手遺我流霞杯稽首再拜之自愧非仙才曠然小宇宙棄世何悠哉清曉騎白鹿直上天門山山際逄羽人方瞳好容顔捫蘿欲就語却掩青雲關遺我鳥跡書飄然落巖間其字乃上古讀之了不閑感此三嘆息從師方未還平明登日觀舉首開雲關精神四飛揚如出天地間黄河從西來窈窕入遠山憑崖望八極目盡長空閑偶然值青童緑髪雙雲鬟嘆我晩學仙蹉跎凋朱顔躊躇忽不見浩蕩難追攀清齋三千日裂素寫道經吟誦有所得衆神衛我形雲行信長風颯若羽翼生攀崖上日觀伏檻窺東溟海色動遠山天雞已先鳴銀臺出倒景白浪翻長鯨安得不死藥高飛向蓬瀛曰觀東北傾兩崖夾雙石海水落眼前天光搖空碧千峯爭攅聚萬壑絶凌歷緬彼鶴上仙去無雲中蹟長松入雲漢遠望不盈尺山花異人間五月雪中白終當遇安期於此鍊玉液朝飲王母池暝投天門闕獨抱緑綺琴夜行青山月山明月露白夜靜松風歇仙人遊碧峰處處笙歌發菽聽娱清暉王眞連翠微想象鸞鳳舞飄颻龍門衣捫天摘匏瓜恍惚不憶歸舉手弄清淺誤攀織女機明晨坐相失但見五雲飛送范山入歸泰山魯客抱白鶴别余徃泰山初行若片雲杳在青崖間高高至天門日觀近可攀雲山望不及此去何時還右詩刻石本州會眞宫内其碑四方其字古篆甚古雅可玩杜甫望岳岱宗夫何如齊魯青未了造化鍾神秀陰陽割昏曉盪胷生層雲决眥入歸鳥會當凌絶頂一覽衆山小劉禹錫送東岳張鍊師東岳眞人張鍊師高情雅淡世間稀堪爲烈女書青簡久事元君住紫微金縷機中抛錦字玉清壇上着霓衣雲衢不用吹簫伴秪擬乘鸞獨自歸李義府隽州遥叙封禪天齊標巨鎭日觀啓崇祠岧嶤臨渤澥隱嶙控河沂建岳誠爲長升功諒在兹帝猷符廣運玄言暢文思飛聲總地絡載化撫乾維瑞策開珍鳳禎圖薦寳龜東后方四覲西都導六師天駕移星苑揚早馭風司沸鼓喧平陸疑蹕靜通逵汶陽馳月羽蒙陰警電輜巖花飄曙輦峰葉蕩春旗石閭環藻衛金壇映黼帷三始貽遐貺萬歲受重釐非質陶恩奬趨迹奉軒墀觸網淪幽裔乘徼限明時周南昔已嘆卭西今復悲蕭楚才奉和展禮岱宗拂漢星旗轉分霄日羽明將追會阜蹟更勒岱宗銘林戈咽濟岸獸鼓震河庭葉箭凌寒矯烏兮望曉驚已降汾水作仍深迎渭情薛克構奉和展禮岱宗龍圖冠胥六鳳駕指云亭緋烟泛濟浦緑字啓河汀畫裳晨應月文戟曙分星四田巡揖禮三驅道契經行欣奉萬歲竊抃偶千齡盧照隣登封大餔歌日觀仙雲隨鳳輦天門碧雪照龍衣繁絃綺席方終夜妙舞清歌歡未歸吕洞賓書王母池昔日曾遊此如今九十春紅塵多少客誰是識予人再書王母池昔年留字識曾來事滿華夷遍九垓無賴蛟虬知我字故留踪跡不沉埋右詩刻石本州會眞宫内相傳吕洞賓手筆也玩之近是宋范致冲吕公洞朝遊北海暮瀛洲仙珮何年到此遊安得相從問丹訣春風同醉岳陽樓竹林寺竹林深處有招提深掩禪關過客稀簷蔔花開春欲暮泠泠鍾磬白雲低日觀峯岱岳東南第一觀青天高聳碧㠝岏若教飛上峰頭立應見陽烏浴未乾查道登岱凌空疊嶂絶凢埃青帝高居絳節開捧出海天紅日近迓將蓬島碧霞來石閭閃爍迎陽洞王簡光華封禪臺一自祥符禋祀後太平頂上最崔巍道仕宋爲龍圖學士有孝行見孝順事實梅聖俞登泰山日觀峯晨登日觀峰海水黄金溶浴出車輪光隨天行無蹤正是刺我目攅集如劍鋒照曜萬物興磨滅萬物凶草木既無命必聞石間松當時一避雨安得大夫封人而苟不遇抱簡誦六龍王欽若登泰山四顧無雲道路開黄麾迎從六龍來三神合祭光千古萬旅傳呼動九垓幽鳥似通崑閬信眞松深隱棟梁材已知身世非常事曾到天門十二廻元王奕和元遺山呈泰山天倪布山張眞人江右書生枉白頭杖藜始得此山遊手摩紅日登三觀袖拂黄埃看九州泰山扆齊機魯闢天關左右微垣列兩班大展明堂俱翕受黄河東畔少遊山茂陵封禪壇祥符天子舊明堂秦漢豐碑宿草荒人世已非壇尚在摩挲老淚濕斜陽漢栢膚剥心枯嵗月深孫枝已觧作龍吟烈風吹起孤高韻猶作峯頭梁甫音孫明復石守道祠堂師生高占二山名千載誰云道義輕岳府栢林風雨夜琅然猶帶讀書聲杜仁傑天門鉛泰山天門無室宇尚矣布山張鍊師爲之經構累歲乃成可謂破天荒者也齊人杜仁傑于是乎銘之元氣裂兩儀具五岳峙眞形露惟岱宗儼箕踞仰彌高屹天柱浩千劫空來去誰爲鑿起天慮匪斤斧乃祝詛一竅開達底處十八盤盤千步薺初吐抱圍𣗳日車昃𢡖曦馭六龍頽莽迴玄踖此徃嘉無數無懷下兵型措七十君接鑾輅聖道熄彝偷斁揖讓歇篡奪屢忽焉闔梗無路象緯森敕訶護朝百靈由兹户金璀璨朱間布九虎蹲萬夫怖我欲叩閽者怒闢何時坦如故封冕旒獲控愬豁蒙蔽泄塵霧刮政疵剔民蠧上得情下安作額血殫帝聰悟崖不磨蒼壁竪刻我銘期孔固垂萬世正王度元遺山登岳泰山天壤間屹如鬱蕭臺厥初造化手劈此何雄哉天門一何高天險若可階積蘇與累塊分明見九垓扶搖九萬里未可誣齊諧秦皇㙴威靈茂陵亦雄才翠華行不歸石壇滿蒼苔古今一俯仰感極令人衰奇探忘登頓意愜自遲回夜宿玉女祠崩奔湧雲雷鷄鳴登日觀四望無氛霾六龍出扶桑翻動青霞堆平生華嵩遊兹山未忘懷十年望齊魯孤雲拂層崖青壁落落雲間開眼前有句道不得但覺胷次高崔嵬徂徠山頭喚李白吾欲從此觀蓬萊段輔題李白泰山觀日出圖岱宗鬱鬱天下雄謫仙落落人中龍兹山兹人乃相從氣奪眞宰愁豐隆玉堂一任雲霧封長嘯飛渡秦皇松夜呼日出滄海東再爲斯世開鴻濛鈞天帝君深九重醉舞踏碎青芙蓉天孫玉女爲歛容却視五岳秋毫同長鯨一去不復逄乾坤萬里號秋虫當年咳唾留絶峰至今樹石生香風我欲追之杳無踪不意邂逅會此中屋梁落月依然空張養浩登岳風雲一舉到天關快意平生有此觀萬古齊州烟九點五更滄海日三竿向來井處方知隘今後巢居亦覺寬笑拍洪崖詠新句滿空笙鶴下高寒徐世隆紀夢我夢天倪子同登日觀峰骨疆清似鶴步律老猶龍方外無官府堂中有岱宗仙閶眞福地杖屨會相從送天倪子還泰山九十行年髪未華道人風骨飽烟霞洞天福地三千里神府仙閭第一家牛膝藥靈斟美醖兔毫盞凈啜芳芽隱居自愛陶弘景莫作山中宰相誇元好問送天倪子歸布山太白詩筆布山頭布韈青鞋欠一遊擬欲高人叅藥鏡却嫌凢骨比丹丘雲間茅屋雞犬靜物外烟霞風露秋後日天門重登覽蛻仙巖下幸遲留天倪即張志純布山即布金山在泰山西南杜仁傑銘天門序亦稱布山張鍊師或爲天倪棲眞舊地故云王惲咏漢栢蒼栢無城擁漢陵閟宫遺𣗳鬱峥嶸崔嵬不植明堂礎造化潜通岳頂靈萬壑烟霏封傑幹半空風雨撼秋聲白頭會見東封日秀映鸞旂一色青張志題桃花峪流水來天洞人間一脉通桃源知不遠浮出落花紅泰山喜雨岱宗天下秀霖雨遍人間高卧今何在東山似此山二詩俱刻大峪溪石李簡登岳三峯突兀與天齊天門未到勞攀躋層層石磴出林杪縈廻百折青雲梯盤石蹔憩舒清眺澗壑風來號萬竅水聲俄在𣗳稍頭疑有於菟天外嘯向曉纔登日觀峰手披雲霧開鴻濛火輪欲上海波赤金霞翻動蒼龍宫黄河一線幾千里吴越山川眞地底爲數齊州九點青更將伏檻窺東溟李白不遇安期生安得羽翼飛蓬瀛朝覲壇朝覲當年築此壇旌旗影裏簇仙班只今惟有青山在日暮孤雲自徃還酆都峪石洞荒涼𣗳影孤州人相語是酆都古碑猶說韓擒虎爲問于今尚有無王旭遊竹林寺石徑俯雲壑竹林開幽境寺古僧徒稀山深嵐氣泠待遊未終興紅日忽倒影曳杖披瞑烟長歌下前嶺西溪我愛西溪好披雲屢徃來一州煙景合三面畫屛開薄俗無商隱清時有逸才近巖多隙地松竹更湏栽賈魯登泰山岱宗何崔嵬群山無與比使者久塵囂望之不勝喜無縁凌絶頂詣詞聊致讄夫何一殿存千間暴遺圮人言遭劫火金源亂兵裏感此廢昔年傷今未能理飛奏入彤庭經營良在邇奈何齊魯饑百姓飡糠粃神兮願效靈穰穰多樂祀行當復故宫金碧蕩瞻視
