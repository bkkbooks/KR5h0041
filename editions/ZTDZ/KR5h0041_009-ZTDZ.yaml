front:
  text: 岱史第九卷靈宇紀叙曰靈宇者何神明之所宅也紀首岱廟者何望秩之定制也有司奉制命而嵗祀焉禮也岱廟上中下凡三而惟下廟最鉅麗在州城内正北盖歷代勅建望祀之所朱堞金扉龍楹螭殿罘罳象魏儼然帝居漢栢唐槐虬蟠雲覆御碑古碣林立森森以斯知其從來遠矣玉帝觀青帝觀后土殿則以居天神地祇也巔麓俱有焉謂天地鍾靈於兹神必依之也碧霞靈應宫則以居天仙玉女碧霞元君也袤滿巓麓而巓以勅建獨閎偉謂其神靈感召安民裕國也孔子人中之泰山魯兩先生一方之師表則其祠於此也固宜其他佛老之宫群靈之府倚巖縁谷比比而是大都肇搆於隋唐宋元間今其存者不及十半然亦傾頽甚矣惟岳巔諸宫觀當世嚴奉不廢乃絶無翼室以居黄冠黄冠固甚貧率散處麓下覓食則神明香火之謂何即居守安所籍也旋葺旋頽職此之由哉余謂岳巔諸宫觀宜各因其隙地有司以香稅餘錢搆爲翼室以居黄冠之有戒行者仍籍名於官責以焚脩掃除則宫觀不致旋頽可歲省修葺之費恤民事神庶幾兩得云東嶽廟在州城西北隅風俗通曰岱宗廟在
