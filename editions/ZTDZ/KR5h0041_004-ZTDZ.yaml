front:
  text: 岱史第四卷山水表叙曰曷表乎山水也表山水之附麗於岱嶽者也夫岱嶽山也而兼以水言者何山下出泉謂夫水之源也故言山必言水也今其山之得名曰峰曰巖曰洞曰嶺曰崖曰臺曰門曰峪曰寨曰園而莫非山也水之得名曰泉曰池曰井曰溪曰河曰灣而莫非水也其他曰橋曰坊曰題勒凡以表勝於山水也摠之則皆岱嶽之勝也夫天下佳山水古今人類能言之仁智所樂豈虚語哉維兹山水非可以例言也上應天齊宗長群嶽日月之所避隱雲雨之所官府帝王之所肇祀億兆之所奔走品彙萬有之所蕃滋即一拳之石鍾靈秀而毓化機一掬之泉潤濟汶而衍洙泗其爲功化豈不弘多弗啻雲巒風壑絶壁重標峻閣千尋峭門萬仞飛湍瀉溜漾碧流虹五色交輝四時俱備令人目不周玩情不給賞帷斯之爲勝而已爾余嘗爲之評曰岱嶽山水特以雄偉勝匪以奇巧勝故稱絶勝云
