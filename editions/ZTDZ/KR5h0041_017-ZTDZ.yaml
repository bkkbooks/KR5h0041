二律半空削出青芙蓉直上煙霄幾萬重漢時尚傳天子栢秦封已改大夫松才非草禪慙司馬世際昇平笑祖龍本爲祝釐曾汗漫丹裏常繞碧霞峯振衣千仞絶塵氛野色蒼茫倚暮曛日觀有峰來海市古碑無字逼星文頓空屐底三千界誰識編中七二君兩袖翩翩渾欲舉不知身世出浮雲龔勉無錫人浙江叅攻偕湯比部覺軒同登泰山因賦登岱歌以紀勝我適登太山三月春欲暮萬里來長風當空捲雲霧須臾霧盡見山色蒼翠叅天天與天逼層層石磴躡雲升萬壑千崖轉奇特御道縈迴六龍翥峭壁飛泉挂瀑布遥看一塢桃花紅却疑又入桃源路大夫松何落落無字碑何巍巍秦皇漢帝今安在唯有此松此碑無傾頽㠝岏怪石滿山立磨厓字久蒼苔浥靈蹤秘跡不可窮深巖時有蛟龍蟄振衣再陟最高峯大地山河一望中眼空不啻小天下獨超太古窺洪濛東向蓬瀛但咫尺西顧崑崙近可踖赤城王屋眉睫間烟霞繚繞登山屐勝遊至此何快哉排空大叫天門開雲端玉女兩兩下直上金銀臺顧我自媿塵凡質稽首群仙謝非及唯願投簪學向平遍遊名山棲少室登岱雜詠石經峪翠屏圍石壑誰把金經書嵗久字多滅經㫖只如如迴馬嶺御道六龍過壁絶千馬迴登封世已遠山逕滿蒼苔大夫松長松倚絶巘蒼翠欲摩空豈受秦皇命自有白雲封御帳峭壁逈叅天四顧若列帳曾留帝子棲翠華可想望天門遠陟青雲梯一振凌風極長嘯入天門玉女遥相接玉女池山池水碧澄可照夫容面玉女時徃來彩雲飛片片白雲洞石洞棲白雲玉檢封漢武漢武久寂寥白雲自千古無字碑雄圖已消歇山頂遺空碑金書不可見日夜天風吹日觀峯夜宿日觀峯起看扶枼日海底騰明珠蛟龍驚出窟孔子崖尼父昔登臨玄覽超無上我來得瞻依頓覺心神曠張懋忠肥鄉人登岱二首天門雙控鬱葱葱竹杖西來禮大空削玉幾時留漢策探碑千載識秦功晴光近指扶桑日紫氣遥連碣石風七十二家今寂寞水簾不盡野花紅雙龍百折漱清湍夾道蒼蒼第幾盤明月平臨三觀合白雲不動五松寒長裾寳色香扶起幽谷玄芝鹿踏殘方外道人流水性爲探名岳著書看鄒德溥翰林院編脩江西安福人同光顧吾遊泰山道中感念舊遊賦此當年結夏南山寺與君意氣凌天地蒲團坐破千峯雲雲光片片落人世今日逢君清源頭携手重爲泰岱遊泰巔末陟心已壯飄然如在青霄上君行山立不可移吞吐風雲百岱奇乾坤假我以康樂高朋勝槩兩遺之何時從君三山島其躡仙蹤拾瑶草丈人峯獨立丈人峯直覺天下小仰視有高冥俯矚無孤鳥日觀峰我凌千仞崗縱目乾坤外長風吹海色泠然襲衣帶玉女山青天垂絶壁下有幽人居趺跏坐白雲澄然萬籟虚白雲洞此洞足幽棲卧笻聊一舍竚看吐白雲霡霂雨天下石經峪誰將貝葉經勒此盤石上梵字有無間亦足悟法藏桃花峪峭壁凌穹蒼冽泉貫其趾不知天地間清絶更誰似無字碑絶巘植空碑古人如有意由來最上乘原不立文字大夫松爾本𢬘勁節秦官何及之乘風發長嘯如羨啇巖芝泰山道中有作中原古道草萋萋萬里游軺汶水西喜有青山供野興且呼眀月共巖棲空江星斗懸蒼壁野戍風雲暗緑谿七十二君封禪在可能策杖問金泥俞琳教授江西信豐人登岱歷徧危岑謁帝孫碧霞殿近紫微垣天行日月雙相照地列嵩華獨此尊瑶草琪花成色相霓旌電蓋擁精魂試從金闕凌風立九點神州盡可捫混元閣爲覔三陽觀停車更一朝松陰稜白日石徑倚青霄宸翰暉山谷仙函鎻泬寥談玄眞有契况屬故人招喻均新建人松江知府暮春一日同李長卿侍御登泰山四首宇宙名山願不違還從仙客試春衣天廻大海雲千疊花滿中原錦一圍秦觀崔嵬人已遠吴門縹緲事還非千岩鐘聲尊前合不遺雙笻下翠微齊魯千峯望裏開濁河清濟日縈廻居然形勝雄諸嶽久矣英靈動九垓翠壁舊諳虞帝狩白雲曾扈漢皇來聖朝謙讓東封事莫問相如作頌才昧爽徘徊日觀東漸看曉色入溟濛祥雲不導羲和馭濁霧翻迷海若宫巨壑魚龍眠自穩諸山金碧坐成空遥憐萬里扶桑影倘避霜臺御史騘步轉山腰日欲晡還從官閣醉醍醐簷前氣候分寒燠郭裡人煙定有無鳥道千盤垂脫險鳩笻雙郤未須扶山翁笑指亭亭幹曾是秦時五大夫陳萬言御史南海人題日觀萬户星辰未曙天瑞光先照觀峰前應知此去扶桑近願借仙槎到日邊小天門值雨武帝登封舊有臺靈湫時見白龍廻天風倒捲簾泉水猶有遊人冒雨來霽望雲外山河拱岱宗鄉關何處翠重重憑高極目堪惆悵認錯羅浮浴日峰無字碑鞭石曾聞自海東晶瑩今徹碧霞宫摩娑汝末經題刻猶勝磨崖耻頌功岱宗登拜古來二月登巡地異代登封事有無玉檢秘藏芳草合翠華臨幸慶雲孤天邊舟楫尋仙侣馬首喬松號大夫今日守臣惟秩祀青山尊俎百神趨夢憶名山已數年偶隨猿鶴共聯翩攀懸石磴疑無路轉出雲林别有天滄海𤇆波圖畫裏齊州形勝酒盃前尋眞未悟長生訣欲向峰頭禮玉仙吕坤山東叅政洛陽人毒草歌有序萬曆戊子春山東飢蓋二年旱後也菜根樹皮剥掘殆盡又食及野草幸無毒不問苦辛生熟面黑者如銕黄者如土殍者宇野不復收余行部日見道間青草三二種花且實矣蔚然獨存問之對曰此猫兒眼芫花鬼臼也有大毒使入喉能即死幸甚徃有食之者吐瀉懊憹終日夜裂肝腸竟不死其難堪視死甚焉何敢食余收淚而代之歌桞頭盡榆皮少豈是學神農個個嘗百草但教飢餓緩一刻那論苦辛喫不得嗟嗟毒草天胡生此既不延我生又不速我死速死豈不難長飢何以堪靳莊行長清六月纔禾黍大家小家愁無雨草根桃盡木如冬又見探雛啖野鼠沙中稚子哭欲絶阿八卧路不能語三年長餓一息在那復餘情念兒女破屋一叟搗榆皮我問搗之欲何爲土性多沉糠性浮榆末和之可爲糜極知强活能幾時暫於膓胃勉撑持妻子填溝老我存死者長樂生者飢慟哭無聲但有淚瘦骨令人摧心脾道傍一廟有神坐黄金爲身受香火白南金永年人登泰山峽口長風放曉晴捫蘿屹立壯心驚囂塵平隔天門逈葱鬱還將日觀生鴈影高秋來朔漠松花一夜到蓬瀛凌虚忽憶千年事漢策秦封總浪名徐守仁經歷祁門人登岱巍巍東岳接蒼穹誰闢紅門磴道通腰筍漫經黄峴嶺攀蘿直上碧霞宫堯天舜日瞻依近魯阜齊州指顧誰千仞磨崖都覽徧還登絶頂頌神功再登兩度探奇謁岱宗山增靈秀擁芙蓉穿雲曾出天門路望海還凌日觀峰碑上苔痕侵漢篆岩前松蓋偃秦封三千世界微茫外直北明光是九重姚自復吴縣人登岱岧嶢泰嶽喜攀躋十八盤開石作梯草禪尚傳司馬賦苔封已汶祖龍題振衣直上天樞近倚劍雄看斗柄低翹首吴門何處是千雲匹練望中迷周道南諸生吴郡人登岱宇宙名山屬岱宗至今猶自說秦封低雲欲度千峰鳥噴雪爭回萬壑龍日觀可能通帝座天門應許躡僊踪故鄉極目知誰是匹練那堪帶下舂姚應士鄞縣人登岱奇觀天下狂客興唫豪環帶群流細擎天一柱高彈丸爭是日秋葉競爲舠山麓青天兩楓林白畫濤孤城卷石聳魏闕片雲掏無字秦碑幻封禪漢史嗷水簷飛瀑布龍峪躍神鼇峴嶺黄梅熟懸崖翠黛挑碧霞深隱處玉女煉丹膏五華泉浴面八彩鳳啣旄粧鏡當空照梳雲四野幍芙蓉開緑髩星斗燦宫袍環珮鳴千澗笙簧奏萬嶆僊橋三碣石御仗半蘭夫松凝雪色聖道配天褒崖文神鬼護盤路鳥猿號石印金剛字波摇日觀㠙山河百二境法界萬千曹登臨一長嘯名利符鴻毛胡希舜副使原武人登岱岳乾坤無際此登臨獨立清秋思不禁海水東來三島近天門北望五雲深看山玉女烟中度對雨蒼龍澗底吟七十二君何䖏覔空聞册簡瘞黄金詹仰庇侍郎安溪人登泰山二首出城已愛數高峰上嶺雙眸翠萬重澗道亂鳴崖下瀑山僧遥撞客來鍾廻巖天蓋傾東海恠壁風濤韻古松勝絶只欣酬夙約神仙何䖏更相逢漢檢秦封空復聞銅梁金瓦祀元君坐觀萬象終無極下瞰千峰捴不分酒外殘更滄海日封中終夜石樓雲拂衣未遂烟霧癖聊爾登山出世氛陳文燭大理寺卿沔陽人泰山四首阿閣神房見羽翎僊山吾久佩貞形吴門匹練天門白海上飛濤掌上青開闢自來分日月煙雲吹䖏落辰星張衡東望縁何事豈謂兹山好勒銘日觀孤峰逈絶群御香亭敞氣氤氲松聲似帶秦時雨壇影頻飛漢檢雲玄石洞中尋玉女碧霞宫内訪元君昨年曾過臨卬里尚憶相如草禪文霏霏涼雨送山鍾樹杪俄驚掛白龍帝闕依微看北極聖朝禋祀少東封千秋玉液終當遇一望層雲已蕩胷李杜高篇今自在那能杖屐得相逢指顧名山夕照前中原平楚正蒼然黄河曲抱三义澗滄海寒生六月天地辨齊州煙九點臺瞻魯國道千年安期亦有神樓散可得從吾肘後懸
