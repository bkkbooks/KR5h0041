body:
  text: 襟度碧空忽逢青帝駕長虹彩烟半捲虬灣霧霽色全開龍峪風今古壯懷夕照裏乾坤生意忝苗中岱宗自是饒皇祐時雨時暘摠化功高拱大學士新鄭人登岱岱宗神嶽勢嶸峥東鎮齊封百二城雲捲洞門持欲潤日華暘谷曉偏明虞廷首望仍今古尼父崇登著姓名我欲御風凌絶頂手提星斗運璣衡高儀大學士錢塘人登岱諸嶽崚𡾓一岱宗天門迢遶芙蓉御坪有路仍迴馬石表無文悵祖龍星斗平懸玉帝觀乾坤不老丈人峰夜闌紅日升滄海咫尺蓬瀛第幾重吴嶽尚書汶上人登泰山嶔崟疊嶂逼蒼穹深谷廻巖烟霧通掛壁寒泉飛澗白拂雲秋樹入霜紅秦松欹石龍鱗古漢碣沉苔鳥篆空絶頂振衣思太始偶看朝日見鴻濛雲磴新懸碧磵廻松枝低拂紫巖開人穿鳥道烟巒逈路轉羊腸風壑哀地接太清瞻斗極眼隨旭日望蓬萊曠遊一晤浮生夢好謝紏紛卧石苔遊青帝觀洞門梵宇秋雲細青帝離宫煙𣗳齊虚谷人聲飄翠壁寒空鴈影落丹梯窮探仙跡荒壇隱深入禪林野逕还清賞不違幽興遠欲尋石室伴僧栖劉自强尚書扶溝人登泰山茫茫蒼海半山寰天壁躋攀步步艱頓覺風雲生足下却疑身世出人間鬢顔看鏡驚將老廊廟懸情未許閒暫息塵蹤隨謝屐蓬瀛洞裏探仙關朱衡尚書豫章人登岱懸磴盤梯天路長高空雲霧濕衣裳金銀宫闕知隣近鳥自嚶嚶花自香玉虚宫殿元孤秀夜半探奇獨自行玄鶴遥聞乘月度白雲近見與沙平馬森尚書福建人登岱五嶽由來獨岱宗層巒雜𣗳翠交濃盤廻石磴天門道縹緲烟霞日觀峰巨鎮已摽存舜典斷碑何事數秦封登臨不盡高山意尼父當年有故蹤宿岱頂道房碧霞宫伴小幽居雲外山低若太虚玉女池中泉最潔丈人峰上雪偏䟽坐看浮靄渾成幻睡覺清眞更寂如夜半四空無色界月明正好入階除尹臺尚書永清人東平道中望岳巨嶽盤東土高穹礙列星鴻濛標地紀峻極抗天庭輯瑞虞廵肇刊山夏載經靈仙遺蛻迹巖户莫長扃神功稽古牒七十二君王曠矣兹山禪荒哉徃代章烟迷秦畤遠雲出漢封長借問當年物言餘松栢蒼大野圍春氣群峰杳靄芙蓉開曉日秀色若可餐夜月流金殿朝花泫壁壇雲𩥵誰共駕矯首一悲歎結髮懷幽尚名山思徧尋久傳梁甫曲還憶泰山吟縈啓丘中好安期海上心九州多狹徑此地可投簪長風吹羽腋吾欲上天門躧履丈人石晞衣玉女盆乾坤睨闔關日月翫朝昏歸訪巢居子深情未可論岱宗千里色魯甸接膠齊海日扶桑近天風若木低東皇衣任把北斗杓堪提舉手招仙侣碧霞聽曉雞神嶽巖巖立上方仙宫赫赫照東皇秦松漢栢盤天地玉簡金函紀帝王一柱擎空龍躑躅三峯倒海鳳飛揚舉頭髣嶾雲霄工裊窕春雲捧建章楊巍尚書海豐人赴南都登東嶽駐馬登東嶽憑高辨四溟始知人世小不斷此山青摟閣秋孤出川原晝杳冥將尋孫復隱忽忘有嚴程梁父名仍在登封事不磨逢人尋古蹟覽勝欲狂歌匹練吴門近豐碑漢代多還能舒老眼萬里見滄波張佳㣧尚書銅梁人登岱張衡曾賦四愁詩東望相從及此時翠壁千盤隨枤轉丹梯一線自天垂瑶函偶拾神人字絳節高居玉女祠囊裏按圖分五嶽眞形微被地靈窺青空寒露滴芙蓉拄頰天門倚岱宗漢草相傳司馬筆秦官猶寄大夫松參差三觀疲雙目嶻嶪千巖籍短笻方内名山探欲遍晚年始遇丈人峰天雞聽罷曙將分劔倚峯頭接十文髣嶾白知山下水升騰紅放海東雲烟霄身擁三千丈封禪書侍七十君怪底衣裾常五色由來嶽氣已氤氲日月䨥從岱頂懸每依帝座挽青烟秦碑突兀青天上仙島微茫大海前寓目好看吴苑馬頫身𨚗辨汶田山中縱失襄城駕猶勝風塵在市廛陳經邦尚書蒲田人偶憩白龍池百丈寒潭浸碧峰玉龍於此閟靈蹤即今齊魯青無幾何日嘘雲慰萬農登岱寰中嶽鎮此尤尊今古巖巖魯望存半領晴陰分氣色雙峰日月互朝昏瑶池自昔來王母金關何年下帝孫聞道探齡曾有筴願將萬禩授黄軒縹緲天門冠萬峰攀躋彌覺翠微重山懸碧落無孤鳥壑抱寒濤有五松春月久虚虞代狩晝雲猶起漢時封神房阿閣深何處欲向安期一問踪攬勝凌高嶽勢窮乾坤俯仰一鴻濛齊州點點晴外魯阜微微落照中千里黄流縈不盡三山銀闕湧還空登臨未解宣尼意自許沂雩舞詠同杖策高登叩帝關振衣長嘯隘人寰眼摇泱渀三千界身在崑崙第一山桑海幾人經變换蓬壺諸聖自飛還朱顔白髮湏臾事回首浮名好是閒偕張焦二郡倅遊石經峪未盡探幽興相携復此行勒經誰氏手秉燭故人情夕嶂林霏合春泉石潄鳴高山與流水恍忽聽遺聲陸光祖尚書平湖人請告東歸春日登岱拂袖清朝賦遠遊岱宗物色動吴鈎春風花鳥朝陽洞曉日烟霞王母樓御帳當年經帝輦明堂蹟勝想王猷探奇吊古情何限匹練鄉關興獨悠諸大綬狀元山陰人登泰碧霞宫上最高岑秦漢封臺草莽深落日荒荒留返照飛雲片片過輕陰因嗟萬世無窮計疑是秋風未悔心獨去平臺渾廓落一聲清磬出雲林熙熙春意萬方同憶我來瞻青帝宫野色帶烟時變化山光無雨亦洪濛東南白練迷天外西北紅雲入望中却恠五松留晩翠秪應翻照石屏空王弘誨侍郎海南人岱宗吟我尋青帝問眞源至人邀我登天門天門高高在何許乃在咸池之陽岱宗之阯石蹬懸紆十八盤雲根磅礴九百里厥初渾沌誰爲鑿二儀中分列五嶽帝遣太皞奠此方巖巖巨鎮雄寥廓洞天福地倚崔嵬層霄萬叠芙蓉開黄河如帶渤海一杯半夜見曉日中領興雲雷齊州九點蒼茫若可辨吴閶匹練指穆空而驚猜噫吁嚱泰山之高其不可極也如此使人登之飄飄乎若御泠風而超塵埃意昔登封七十二氏厥有虞周其名最著秦漢以還此義微金泥玉檢紛兹瘞只今作者知何地𣗳亦不能爲之留碑亦不能爲之記惟有巖前倏忽變幻之白雲領略興衰千古意悠悠徃事難具陳振衣聊此朝群眞遥見玉女池前香馥郁仙人洞裏氣氤氲霓旌絳節交繽紛云是玉青大帝碧霞元君使人對此摇精魂齋宫祝釐祠官秩禮嬴女吹蕭馮夷擊鼓靈芝來兮錫予祉望而不見兮逍遥容與傍有青鳥使授予黄庭經覽之殊未了倏忽還空冥躊蹰勝覽意何已掌塵踪未停軌何當晞髮長兹遊回頭看謝朗然子登岱石磴丹梯入紫宫寰中五嶽最稱雄登封七十傳前古浩刼三千接閬空松老尚含秦代雨桃深擬有晋人風尋幽直到蓬萊頂勝覽乾坤興未窮嶽頂高居上帝尊東南王氣俯中原白雲繚繞千峰合翠石崚嶒萬壑奔宵湧金烏耒海市暮穿瑶鶴過雲門談天未道鄒生誕九萬扶摇信可論人間信自有丹丘汗漫聊從此地遊玉檢金函空寂寞琪花瑶草自春秋射牛不用儒生議望馬堪從聖蹟求一自大觀歸老眼尋常指點遍齊州詠丈人峰高標獨立向天門氣象巖巖仰止存五嶽曾聞岱宗長諸峰應是丈人孫詠日觀峰五夜峯前曙色浮瞳瞳先出海東頭誰將赤手扶羲馭早向人間照九州詠玉皇頂縹緲丹梯入九重玉皇於此秘靈蹤尋眞直上朝元殿身在蓬萊第一峰詠吕公洞青蛇拂袖氣横秋玄洞留題可自由莫道紅塵人少識松邊隱約見華州詠大夫松二世山河已改移五枝猶冒受封時昂藏應愧虚名污貽咲商巖四紫芝詠桃花峪流水晴懸碧澗霓桃花春似武陵溪東方自擬隨王母縱少漁郎路不迷張位侍郎豫章人捨身崖歌有序余登捨身崖夜夢神人謂愚民捨身可憫命余止之已告有司爲禁諭矣復作詩一首詞取近俗易曉將以救千萬年無辜生靈也詩曰人生實難胡樂死子欲報親親念子養老送終若無托大是不孝滅天理或有無聊祈後身更望蓮花佛會人富貴多憂樂是苦見身清凈便登眞萬仞身輕一鳥落骨肉爲泥魂渺漠女愧成名清風崖男非喪魄天禄閣東嶽蒼蒼德好生誰哉作俑誣神明乘雲托世轉相狂千秋萬祀坑愚民我今作歌勸來者神人夢授語非假泰山鴻毛宜自思珍重此身莫輕捨抵嶽遇雨杳藹寒雲暗碧岑松蘿岩壑翠增深山靈欲試登臨興朝雨聊堅去住心登嶽萬仞丹梯隱薜蘿層霄仰止鬱嵯峨長松鶴唳烟雲古上洞龍藏風雨多金馬陸沉無不可彩鸞消息竟如何嵐光變幻殊今昔徙倚流駒逝急梭過大龍峪浮雲萬里結秋陰飛瀑千尋度遠林每怪登臨風雨驟芙蓉匣裏作龍吟登岱宗有述道人風抱烟霞骨萬累消除只愛山赤紱長拘眞浪迹丹丘一到便開顔秦封漢禪古碑在秋草春袍仙境閑五嶽平生從此始斸苓甘老白雲間宿岱頂曉晴天風一夜凈烟霏星斗簷楹燦紫薇千仞振衣空六合群峰羅列兢朝輝登日觀峰烟霧茫茫海色冥扶桑一線破葱青重淵瑞射禺夷宅八極春先太乙庭瓊島浮蒼遥莫辨金輪輾碧迅難停不因高處曾開眼甘與紅塵夢未醒過暴經石亂石岩前蹲虎豹鳴泉澗底隱龍蛇世間多少清幽境常被紅塵對面遮何源侍郎江西人五言古風高出千盤嶺危攀萬丈梯睠瞻無極上彷彿與天齊祗見蒼茫闊平臨法象低半山雙鳥翼是處幾松枝嶻嶪芙蓉削㠝岏乕豹馳水簾龍卧穩瑶圃鶴歸遲宫闕參差逈星辰遠近乘白雲隨地起紫氣夕陽迷複道天門險層崖铁石歌未秋涼薦爽不夜月流輝身世遊無際山川應有知高堅師魯道璧立仰鄒儀虞祀先從岱秦封漫有碑登臨多感慨吾自振吾衣登日觀峯觀海凌寒恣登眺迎曙坐岧嶢霞彩絢以爛陽精紅欲燒𢗲桑輪乍轉天際海初潮不定金波沸還看鏡影愮萬方將起溟此處已先照未許羲和馭徒憐夸父勞周天行度疾當午大明朝况屬陽方長忻逢泰始交微臣何以祝海日效蒭蕘于愼行侍郎東阿人登岱終古名山奠大東每從雲漢望穹崇千峰明滅天高下萬壑晴陰氣鬱葱星土盤回元化轉仙閭繚繞百神通眞遊五岳還應遍首躡煙蘿上碧空玉闕朱樓萬仞端六龍輦道倚㠝岏懸崖翠磴雲中轉疊嶂紅泉𣗳杪看海色朧瞳三觀曉秋聲蕭瑟五松寒天門只尺君應見比似人間路更難忽出塵寰賦壯遊試從九點辨神州浮雲直上千峯色落日長懸萬里秋紫塞東臨滄海斷黄河北滚大荒流秦封漢禪成丘土留與人間不盡愁倚杖高臨萬玉峯氤氲陸海散芙蓉寒聲半落天中雨瞑色低催澗底鍾金檢誰探秦帝策白雲猶起漢時封君看十二侯王地能出神宫第幾重絶頂秋高上帝宫茫茫一氣俯寰中地盤河濟三州盡天入秦吴萬里空玉闕光連星斗上丹峰影落海門東亦知眞宰多相籍許倚烟霄兩劔雄萬仞瑶壇泠夕曛斗邊三十六天分仙人洞府懸雙闕玉女神房切玉雲遊客自成梁父嘆詞臣不草茂陵文東皇舊握群生紀海國山河翊聖君三峰東望亦雄哉海色遥看萬里開三島春波涵日月五城仙氣吐樓臺酒邊影吸金銀動杖底雲飛紫翠來烟水茫茫徐福去至今不見報書廻上宫夜色泠漫漫月轉層霄十二欄大地河山銀作海中天樓閣玉爲壇虚無靈境簫聲斷縹緲秋光練影寒仙掌芙蓉看欲近轉從北斗識長安日觀峯歌岱嶽峯頭一片石天見杳杳遥空碧我來夜掃石上雲未眀看見十日出海東幾千里茫茫不辨雲與水天雞啁喔海上啼東方霞氣半邊紫忽然瀲灧玻璃翻一泓捧出赤玉盤長繩斜挽不得上半時方到扶桑巔扶桑枝葉成五色海水明滅一線白日東雲氣如連山目中欲識鮫人國平明日高海水乾滿天翕赩紅氣團三山金闕流安在六鰲背骨秋霜寒憶昔秦帝東封年欲浮海水遊靈仙驅石作橋不可涉金支翠羽空西旋幾時得見海中出日三千丈脫屣妻子如浮烟相前未生信豪士側㡌大叫石上眠我亦欲取巨石填東海揮弋且止羲和鞭六龍不停日如矢仰天嗚嗚酒熱耳曝經石朝下天門關夕憩曝經石此石自何年斜倚萬仞壁疊嶂灑飛流匹練十餘尺水底玉篆分了然成鳥踪其文乃