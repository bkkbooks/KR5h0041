裊裊吐霧碧天花不捲水珠簾甘泉迸出白玉液乍聞萬壑松籟鳴疑是經聲喧唶唶曾頌李白句飄飄下九垓載聞宋眞主東來紫觀開寳磬聲落天空外玉簫吹集鳳凰臺卿雲絢爛挾輿下朱旛五采駕上來巍巍岱宗奠東土赫赫元君何神哉維山有神增靈異寰區千古仰崔嵬我也平生懷仰止今日東山著屐齒十八危盤石參差萬丈雲梯空中視乘風上天門振衣躡星紀仙樂雲中迎身如霄漢裡金蓮頂上紫氣騰稽首風前薦香芷素手授我硃砂杯湏臾餌以白石髓揖予更上日觀峰天鷄初唱朱曦起西望崑崙雪花明玉池直接天河水夜夢石函玉虚篇傍有羽衣親點指從此覔却紫芝依碧霞人世浮名一掃如風靡王廷卿主事荆門人登泰山幾年夢想岱宗遊今喜登臨最上頭雲凈日從霞外出峰高人在碧空浮仙巖列嶂青無了簾水飛崖翠欲流四望豈誠天下小祗縁古阜有尼丘寄憩來巍巘嘹嘹過鴈風十年丘壑趣一笑俗縁空洞口留雲宿溪流與月通石床眠自穩魂夢覺秋虫陶允宜行人會稽人泰山絶頂泰岱峰高捧玉皇秦碑漢碣兩蒼蒼空中鷄犬通眞境海底魚龍送太陽雲氣低封千嶂色雨花平散一天香登臨至此無堪老五嶽三山事未强天門百轉石崎嶇絶頂先登氣乍舒日月腰懸雙寳鏡星霞掌布一盤珠東西指顧分秦越咫尺光華入帝都何必金泥開玉檢仙人冲舉未全虚碧霞元君諸天何地聚群靈泰嶽山高即上清聞說死生齊夢幻恠來賞罰太分明空中擁護金光相夜半傳呼絳節聲自是神人同愛國嵗輸百萬佐昇平明有監司暗有神人天禍福兩相因若爲終古乾坤宰翻屬當時婦女身巖比普陀栖大士殿同南嶽拱夫人朝朝多少冠裳者仰止高山挹下塵張程主事安福人明堂天王出狩時玉帛萬邦隨柴望遵虞制恩威恊禹規齊君能罷毁季旅竟奚爲千載存遺址青陽在指麾姜鏡行人會稽人碧霞宫紀勝誰開梵宇碧雲岑雲去雲來山半陰石溜暗穿瓊玉砌天花時散蕊珠林隨縁好釋區中念選勝眞同物外尋最是燕臺看咫尺霞光遥映帝城金水簾洞賦懷探奇入暮倦言歸改席怡泉坐翠微白水遥從千嶠轉青天化作五龍飛高懸苔壁常飄練倒捲巖風或濺衣何用别尋蓬島去源頭活處即吾機吴同春郎中固始人過桃花峪桃𣗳千重帶水涯靈巖百折傍山斜秋高瑶圃日爲實雨過天門浪作花方朔頻湏貽漢主漁郎何處覓仙家我來不及春風晩杖屨翩翩度彩霞溪未冬登岱岳東星樓閣自天開絳節高懸白玉臺兩向仙人峯外過雲從玉女峽邊來孤標捧日三千丈閣道凌空十八回靈奥已看人世隔赤城何處訪蓬萊蓬玄絶頂瞰洪濛五岳名推岱岳雄玉嶺鶴飛青帝觀天門人叩紫微宫星連闔闢三元合海抱乾坤四望空何事鷄鳴從叠嶂扶桑枝上日初紅八荒迢逓望中收片右低看晝夜浮漢畤金章秋色泠秦松御帳雨聲愁星纏半繞雲巖出海水平懸日觀流仙骨莫憐丹竈遠乘風直欲度滄洲天仙閭靈府近如何絶壁捫蘿試一過不信海濱拖白練忽驚杖底墮黄河雲飛玉井香風細花泠瑶壇露氣多誰向青華傳秘訣古今天地捻悲歌遊暴經峪覓脫尋幽在徑通肩輿面面受天風深岩貝葉經霜白絶壁曇花映日紅百道泉聲飛𣗳杪千尋翠色落雲中楥琹欲鼓高山謂不見鍾期興轉窮朱湘郎中金華人登泰山攀雲躡磴扣天閽絶頂摩空星可捫俯視千山參法從卑看八極隘乾坤龍紋虎阜封苔蘚漢栢秦松長子孫今古登臨誰是主斷碑荒碣自黄昏張體乾郎中眞定人泰山巔紀遊地天交處此山分墓寫高明愧不文玉檢金泥成感慨嵐光嶂氣自絪緼攀崖便欲觀紅日躡磴行看入白雲迂我邀仙探聖跡豈期千仞會同群李填副使解州人登泰山小視塵寰共步虚一亭高敞岱宗初遥擎紫極扶桑處近擁丹霞太液餘雨歇還生神府潤天低常傍歲星居登臨盡借山靈力興滿乾坤任卷舒一泰山萬丈插層空騘馬馮虚欲御風日觀依稀朝絳節雲林彷彿接瓊宫湏臾上帝甘霖沛次第西臺玉趾中徃事空垂封禪史新遊應自古今雄彭夢祖郎中淮南人登泰山星幢寳纛鎻烟空縹緲飛梯萬轉通天闊練光爲白馬峰高嵐氣作蒼龍銀河欲迸仙人掌丹竈猶藏玉女宫毋聖代不求封禪草相如詞賦咲徒工不空濛紺殿俯長天萬里中原亦緲然日出東山翻入濟夜涼北斗欲沉燕松陰猶落秦時雨玉筴長封漢帝年好借西風爲羽翰徧妝五嶽杖頭懸河巨靈千古勢嵯峨萬點神燈愰不蘿曠野秋陰連瓠子虚岩爽氣落黄河三更日抱天門起百疊泉飛下界多七十二君無覓處依稀旌蓋霧中過一岱嶽盤亘大海東珠光怪底摇天紅雲烟常護碧霞頂龍虎欲眠青帝宫繞足星斗太歷歷盪衣香氣何濛濛有無仙人隔弱水况乃西池查靄中李學道知府浙東人謁玄官上壺天景最嘉崖生芝草石生花雲開玉殿瞻青帝香繞珠宫擁碧霞眼底風塵俱罔象寰中日月自仙家我來欲把玄機叩靜對蒼穹思轉遐李任守令任御史以氣著名當其守青州南拜命之日夢泰山之神遣官迎之授以職銜其後竟死青州異哉馮大受舉人松江人登岱二首水帝青陽闕仙人白玉壇徘徊空八極睥睨跳雙丸澹靄迷秦望層嵐生晝寒同游多謝眺秀色總堪餐直上中峰頂方知泰岱尊崗巒關地軸星斗挂天門孤嶂秦皇碣深池玉女盆仙人雲外度白鶴自翩翩泰山絶巔逢鍾明府曙色朦朧帝女壇雄風吹客布袍寒五雲忽覩雙鳧下千里同將疋馬看白石青芝隨地采高山流水向誰彈封中紫氣常來徃賈男先登足大觀曝經臺路轉峰廻别有天平鋪石鏡落霞前芙蓉插翠層崖峙薛荔飛寒瀑布懸拂座雲生科斗字吹簫風度鳳皇僊恍然吾欲遺塵世日醉桃花不記年劉宗岱副使歷城人登泰山石磴天門闢太空躋攀夜到碧霞宫崖碑洞府標靈異雨脉雲根肇化工六月泉飛嵐氣泠三更日浴少