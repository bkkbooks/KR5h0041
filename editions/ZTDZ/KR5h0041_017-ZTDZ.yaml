front:
  text: 岱史第十七卷登覽志縣叁皇明嘉靖甲寅以後迄今諸名公及文人題咏仍舊志例以世次序李春芳大學士揚州興化人夏日登岱喜雨霽披豁煩
  hash: sha256:5333f01f0c2d73bef9bf1b37448e700def72ce412b8ed6d437b623c2df664887
