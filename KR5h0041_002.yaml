front:
  text: 岱史第二卷星野考叙曰曷考乎星野也考泰山之分野而繫之於分星也謂其上應天象也夫陰陽之精其本在地而上發於天在天二十八舍在地十二州各有所主即一丘一阜懸象列宿矧夫嵩高維嶽峻極於天而泰山尤群嶽之宗其昭回法象豈不巨麗自保章氏失職久遠郡國廢置代遷千百年來談星野者或以泰山主心房氐或主婁胃或主虛危其言纚纚洋洋靡所適從然載籍雖博猶考信於往古古天文角亢之分野主兖而禹貢徐兖之域泰山固隸兖也主角何疑焉㫖哉僧一行其言之也曰天下山河之象存乎兩戒觀兩河之象與雲漢之終始則分野可知而通志云山東當山河之會得升降之中泰山介乎其間此千載通論也兹備籍諸史以俟閎覽博物之君子折衷焉史記天文書曰角亢氐兖州房心豫州虛危
  hash: sha256:6c06a438ded955ce7696d1508beb41087275f75549400a220a632c5dcaa8d2a7
