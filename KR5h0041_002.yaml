body:
  text: 青州燕齊之疆候在辰星占於虛危宋鄭之疆候在歲星占於房心正義曰東方角亢氐房心尾箕角亢鄭之分野兖州氐房心宋之分野豫州箕尾燕之分野幽州北方斗牛女虛危室壁斗女吳越之分野揚州女虛齊之分野青州危室壁衛之分野並州前漢天文書曰角亢氐沆州房心豫州尾箕幽州虛危青州丙丁江淮海岱一曰甲齊申齊酉魯前漢地理志曰齊地虛危之分野也東有災川東萊琅邪高密膠東南有泰山城陽北有千乘清河以南勃海之高城重合陽信西有濟南平原皆齊分也魏太史令陳卓曰泰山角六度晋天文志曰泰山入角十二度唐天文志曰降婁玄枵其神主於岱宗嵗星位焉女虛危在豫齊分野女虛危玄枵也循岱嶽衆山之陰其地得陬訾之下流其象著為天津絶雲漢之陽凡司人之星與群臣之録皆主虛危奎婁在戍魯分野奎婁降婁也循岱嶽衆山之陽在陬訾下流婁胃之墟宋天文志曰東方蒼龍七宿角亢氐房心尾箕其神為青帝司春司木司泰山宋中興天文志王奕曰泰山入角十二度馬端臨象緯州郡躔次並同天原發微曰天下山分為四條上應二十八宿負海貨殖所阜之國自北河下流南距岱山為三齊自南河下流北距岱山為鄒魯此負海之國也通志曰山東自南正達於西正得雲漢升氣自北正達於東正得雲漢降氣則山東其當山河之會而得升降之中乎汪子卿曰按山東通志引晋書言循岱嶽衆山之陰主虛危循岱嶽衆山之陽主婁胃引唐書言濟陰齊魯主心房氐蓋我朝清類分野據二書之說以定星野之次而通志因之夫以心房氐言岱猶為近之乃若虛危北宿也婁胃西宿也而可以東方言耶又按古天文圖書降婁魯分也玄野則吳越揚州之次也嵗星十二嵗周天非有定位而唐志云云圖復云云要亦所謂其神主岱而非躔次之謂邪夫王者齊政本於璿璣不可不知而亦不易知也故今志以王奕馬端臨為正而餘則傳疑以俟夫明於占步者
  hash: sha256:01082e7af1c71255e7ccd7be98bc45fda984cd278b4913bf7b03f1b99c37487b
